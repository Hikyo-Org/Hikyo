components:
  securitySchemes:
    hikyoSession:
      type: http
      scheme: bearer
      bearerFormat: hik_1_cli_...
      description: |
        A CLI session artifact minted by an identity-protocol endpoint. The
        server trusts nothing inside the value: kind, principal, expiry and
        credential epoch are read from the row the verifier resolves to.

  parameters:
    OrgID:
      name: org
      in: path
      required: true
      description: Organisation identifier.
      schema:
        $ref: "#/components/schemas/ID"
    ProjectID:
      name: project
      in: path
      required: true
      description: Project identifier.
      schema:
        $ref: "#/components/schemas/ID"
    EnvironmentID:
      name: environment
      in: path
      required: true
      description: Environment identifier.
      schema:
        $ref: "#/components/schemas/ID"
    AdapterID:
      name: adapter
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    AdapterTargetID:
      name: target
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    DynamicProviderID:
      name: provider
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    LeaseID:
      name: lease
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    FolderID:
      name: folder
      in: path
      required: true
      description: Folder identifier.
      schema:
        $ref: "#/components/schemas/ID"
    ServiceAccountID:
      name: serviceAccount
      in: path
      required: true
      description: Service-account identifier.
      schema:
        $ref: "#/components/schemas/ID"
    CredentialID:
      name: credential
      in: path
      required: true
      description: Machine-credential identifier.
      schema:
        $ref: "#/components/schemas/ID"
    GrantPrincipal:
      name: principal
      in: query
      required: true
      description: The principal whose grant is being revoked.
      schema:
        $ref: "#/components/schemas/ID"
    GrantCapability:
      name: capability
      in: query
      required: true
      description: The capability atom being revoked.
      schema:
        $ref: "#/components/schemas/Capability"
    KeyID:
      name: key
      in: path
      required: true
      description: Key identifier - the immutable id, never the mutable name.
      schema:
        $ref: "#/components/schemas/ID"
    DefinitionsPlanID:
      name: plan
      in: path
      required: true
      description: Immutable definitions-plan identifier.
      schema:
        $ref: "#/components/schemas/ID"
    ValueKeyName:
      name: key
      in: path
      required: true
      description: |
        The key's NAME, not its id. Values are addressed the way an operator
        holds them - `values set DATABASE_URL` - and the id is server
        vocabulary that appears only in responses and audit records.
      schema:
        $ref: "#/components/schemas/KeyName"
    KeyGroupID:
      name: group
      in: path
      required: true
      description: Key group identifier.
      schema:
        $ref: "#/components/schemas/ID"
    ProviderSlug:
      name: provider
      in: path
      required: true
      description: Identity-provider slug.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    ProviderSlugPath:
      name: slug
      in: path
      required: true
      description: Identity-provider slug.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    IdentityID:
      name: id
      in: path
      required: true
      description: External identity identifier.
      schema:
        $ref: "#/components/schemas/ID"
    WebauthnCredentialID:
      name: id
      in: path
      required: true
      description: Enrolled passkey credential identifier.
      schema:
        $ref: "#/components/schemas/ID"
    ResetTargetPrincipal:
      name: principal
      in: path
      required: true
      description: The target principal whose credential is being reset.
      schema:
        $ref: "#/components/schemas/ID"
    FederationIssuerID:
      name: issuer
      in: path
      required: true
      description: |
        Federation issuer identifier. It is the server-minted id, not the issuer
        URL: a URL in a path segment would have to be escaped, and an escaping
        rule on a byte-exact identity is a canonicalization step waiting to
        happen.
      schema:
        $ref: "#/components/schemas/ID"
    DeliveryCursor:
      name: cursor
      in: query
      required: false
      description: |
        The opaque cursor a previous fetch returned. Absent means a full
        authorized delivery. A cursor is never parsed by the caller and never
        constructed by one: the server recomputes it for the state it is about to
        serve and compares.
      schema:
        type: string
        maxLength: 128
    DeliveryProjection:
      name: projection
      in: query
      required: false
      description: |
        A SERVER-SIDE AUTHORIZED TERM, never a client-side filter (k8s ADR §
        Refresh). `config-only` omits `secret` keys from the delivery entirely
        — not presence-only, gone — and from the manifest the change token is
        computed over, and the mode is bound into the conditional-fetch cursor
        so a projection change invalidates it. `full` (the default) delivers
        every key the caller is authorized to see.
      schema:
        type: string
        enum: [full, config-only]
        default: full
    DefinitionsAcknowledgements:
      name: acknowledge
      in: query
      required: false
      style: form
      explode: false
      description: |
        Secret-scanning override token(s) from a prior `definitions plan` refusal
        (#74 SS3). One content-bound token per finding, re-scanned against the
        bundle's leaves; a stale, version-skewed, or surplus token is rejected by
        name. The plan request body is the canonical bundle bytes, so the tokens
        ride the query rather than the body — the same exposure surface as the CLI
        `--acknowledge` flag that carries them. Comma-separated. There is no
        blanket ignore-all input.
      schema:
        type: array
        maxItems: 100
        items: {type: string}

    DeliveryAcknowledgedKeys:
      name: acknowledged_keys
      in: query
      required: false
      style: form
      explode: false
      description: |
        The loader-control keys the consumer explicitly acknowledges, so the
        server's fetch audit record carries which acknowledgement was in force
        for this delivery (k8s ADR § Loader-control). The server RECORDS it and
        otherwise ignores it — it filters nothing and refuses nothing; the
        loader-control refusal is enforced by the operator against its mapping,
        which the server cannot see. Comma-separated, each item under the key
        grammar, at most 64.
      schema:
        type: array
        maxItems: 64
        items:
          $ref: "#/components/schemas/KeyName"
    ScimBindingID:
      name: binding
      in: path
      required: true
      description: SCIM binding identifier.
      schema:
        $ref: "#/components/schemas/ID"
    ScimCount:
      name: count
      in: query
      required: false
      description: |
        Desired page size. It is a REQUEST: a value above this provider's bound
        is answered with the bound rather than refused.

        Typed `string` and unconstrained for the same reason as `startIndex`.
      schema:
        type: string
    ScimFilter:
      name: filter
      in: query
      required: false
      description: |
        An RFC 7644 filter, closed to `attribute eq "value"` over the four
        probes Okta and Entra actually issue. Anything else is `invalidFilter`.

        Deliberately unconstrained HERE. Contract validation runs BEFORE the
        provisioning credential is authenticated, so any constraint declared on
        a SCIM wire parameter answers an unauthenticated caller with a Hikyo 400
        instead of the uniform 401 — telling them something about their request
        before they have proved they may ask. Every bound and every grammar
        refusal for this parameter lives in the protocol layer, after
        authentication, where it is rendered as an RFC 7644 error.
      schema:
        type: string
    ScimResourceID:
      name: id
      in: path
      required: true
      description: |
        A server-minted resource identifier. The identity provider can only
        reference ids this server minted.
      schema:
        $ref: "#/components/schemas/ID"
    ScimSortBy:
      name: sortBy
      in: query
      required: false
      description: |
        Present only so its presence can be REFUSED by name with 501. Sorting
        is advertised absent in ServiceProviderConfig and is not
        half-implemented. Unconstrained: see `filter`.
      schema:
        type: string
    ScimSortOrder:
      name: sortOrder
      in: query
      required: false
      description: |
        Present only so its presence can be REFUSED by name with 501, exactly
        like `sortBy`. Refusing one and ignoring the other would be the
        half-implementation the ADR forbids. Unconstrained: see `filter`.
      schema:
        type: string
    ScimStartIndex:
      name: startIndex
      in: query
      required: false
      description: |
        1-based index of the first result; a value below 1 is read as 1, per
        RFC 7644 §3.4.2.4.

        Typed `string`, not `integer`, and carrying no `minimum`: see the note
        on `filter`. `minimum: 1` made `startIndex=0` a pre-authentication 400,
        which is both an unauthenticated refusal and a contradiction of the
        RFC's own "read as 1". Parsing and clamping happen in the protocol
        layer after authentication.
      schema:
        type: string

    RemoteName:
      name: remote
      in: path
      required: true
      description: |
        The entry's display name. A NAME, never a URL or host: an endpoint whose
        target is named by the request is a proxy whatever it is called, and the
        server looks the entry up so the stored, immutable URL is what is
        reached.
      schema:
        $ref: "#/components/schemas/EntityName"
    ConnectionID:
      name: connection
      in: path
      required: true
      description: Connection credential identifier.
      schema:
        $ref: "#/components/schemas/ID"
    SessionID:
      name: session
      in: path
      required: true
      description: Session identifier, always one of the caller's own.
      schema:
        $ref: "#/components/schemas/ID"
    InstanceUpdateJobID:
      name: job
      in: path
      required: true
      description: Durable updater-helper job identifier.
      schema:
        $ref: "#/components/schemas/ID"

    AuditFrom:
      name: from
      in: query
      required: false
      description: Inclusive lower time bound (recorded-at). Absent means the epoch.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      required: false
      description: Inclusive upper time bound (recorded-at). Absent means unbounded.
      schema:
        type: string
        format: date-time
    AuditAfterSeq:
      name: after_seq
      in: query
      required: false
      description: |
        Resume cursor: return events whose seq is strictly greater. Pass the
        previous page's `next_after_seq` to page forward.
      schema:
        type: integer
        format: int64
        minimum: 0
    AuditToSeq:
      name: to_seq
      in: query
      required: false
      description: |
        The session ceiling. Absent on the first page (the server pins it to the
        trail's current head and returns it as `upper_seq`); pass that value back
        on every later page so paging terminates and never chases the
        `audit.query` events the reads themselves append.
      schema:
        type: integer
        format: int64
        minimum: 0
    AuditLimit:
      name: limit
      in: query
      required: false
      description: |
        Maximum rows SCANNED for this page (clamped to 1000). Matched rows may
        be fewer when a filter is set.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    AuditActor:
      name: actor
      in: query
      required: false
      description: Match only events whose acting principal has this id.
      schema:
        type: string
        maxLength: 64
    AuditOperation:
      name: operation
      in: query
      required: false
      description: |
        Match only events of this type (the operation), e.g. `value.set`. An
        unknown type is not an error; it simply matches nothing.
      schema:
        type: string
        maxLength: 128
    AuditOutcome:
      name: outcome
      in: query
      required: false
      description: Match only events with this outcome.
      schema:
        type: string
        enum: [intent, success, denied, failure, unknown, disconnected]
    AuditObjectType:
      name: object_type
      in: query
      required: false
      description: Match only events acting on this object type.
      schema:
        type: string
        maxLength: 64
    AuditObjectID:
      name: object_id
      in: query
      required: false
      description: Match only events acting on this object id.
      schema:
        type: string
        maxLength: 64
    AuditCorrelationID:
      name: correlation_id
      in: query
      required: false
      description: |
        Match only events sharing this correlation id — the link between an
        act's INTENT and OUTCOME events.
      schema:
        type: string
        maxLength: 64

  responses:
    BadRequest:
      description: |
        The request does not satisfy this document. Decided before any tenant
        resolution, so `detail` leaks nothing about tenancy — it is the only
        error response permitted to carry one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: |
        No usable authentication artifact was presented. Uniform: absent,
        malformed, unknown, expired, revoked and epoch-superseded artifacts
        are indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        Either the principal does not hold the operation's formula at instance
        scope — instance-class operations have no tenant object whose
        nonexistence could be mimicked, so the probe contract there is grant
        refusal, not tenancy — or the principal DOES hold it and the acting
        session's assurance is inadequate for an MFA-mandatory operation.

        The second case is why two tenant-scoped operations (`renameOrg`,
        `deleteOrg`) declare this status: their formula atom `instance-config`
        is MFA-mandatory, and the refusal fires only AFTER the grant check
        succeeded. A caller who reaches it can already reach the object, so
        naming the step-up discloses nothing the uniform 404 was protecting —
        and hiding it would tell a capability holder the object is missing.
        Grant refusal on a tenant-scoped operation is always the 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        The addressed object does not exist **or** the principal may not reach
        it — indistinguishable by design, byte-identical in status and body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        The caller is authorized, but the current state refuses: a name already
        in use among live siblings, a parent that still has children (deletes
        never cascade), or a structural bound reached (`limit_exceeded`, whose
        message names the bound). Decided after authorization, so it discloses
        nothing a caller could not already read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: |
        The instance-wide admission budget or a per-source limit is
        exhausted. Uniform on every path, with no unbounded work performed.
      headers:
        Retry-After:
          required: true
          description: Whole seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: The owner is temporarily unable to serve this operation while configuration converges.
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: An unexpected server fault. The cause is logged, never returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    AccountProfile:
      type: object
      required: [username, display_name, email, managed, username_editable]
      properties:
        username:
          type: string
        display_name:
          type: string
        email:
          type: string
        managed:
          type: boolean
          description: SCIM controls the username and display name.
        username_editable:
          type: boolean
          description: A local password or confirmed authenticator can prove a username change.
    UpdateAccountProfileRequest:
      type: object
      additionalProperties: false
      required: [username, display_name, email]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        display_name:
          type: string
          maxLength: 256
        email:
          type: string
          maxLength: 254
          description: Contact address, or empty to clear. Never used for authentication.
        proof:
          type: string
    ID:
      type: string
      description: A prefixed UUIDv7, e.g. `org_0198…`.
      minLength: 3
      maxLength: 64
      pattern: "^[a-z]{2,8}_[0-9a-fA-F-]{36}$"

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC, microsecond precision.

    AdapterDestinationKind:
      type: string
      enum: [repository, organization, environment]

    AdapterVisibility:
      type: string
      enum: [all, private, selected]

    AdapterProvider:
      type: string
      description: >-
        Open provider discriminator. Clients preserve unknown response values;
        creation requires a provider supported by the receiving server.
      x-extensible-enum: [forgejo, github-actions]

    AdapterTargetInput:
      type: object
      additionalProperties: false
      required: [environment_id, destination_kind, destination_owner, destination_name, destination_environment, visibility, selected_repository_ids, name_prefix, key_ids]
      properties:
        allow_environment_create:
          type: boolean
          default: false
          description: Explicit consent to create missing GitHub environments using Administration:write.
        environment_id: {$ref: "#/components/schemas/ID"}
        destination_kind: {$ref: "#/components/schemas/AdapterDestinationKind"}
        destination_owner: {type: string, minLength: 1, maxLength: 255}
        destination_name:
          type: string
          maxLength: 255
          description: Repository name; empty for organization destinations.
        destination_environment:
          type: string
          maxLength: 255
          description: GitHub environment name; empty for repository and organization destinations.
        visibility:
          type: string
          enum: ["", all, private, selected]
          description: GitHub organization recipient visibility; empty for other destinations.
        selected_repository_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: {type: integer, format: int64, minimum: 1}
        name_prefix: {type: string, maxLength: 64, pattern: "^(?:[A-Z_][A-Z0-9_]*)?$"}
        key_ids:
          type: array
          minItems: 0
          maxItems: 512
          uniqueItems: true
          items: {$ref: "#/components/schemas/ID"}
          description: >-
            Explicit member key ids. May be empty only when `key_selection`
            resolves to at least one key; the union must be non-empty.
        key_selection: {$ref: "#/components/schemas/AdapterKeySelection"}

    AdapterKeySelection:
      type: object
      additionalProperties: false
      description: |
        Configuration-time selection conveniences (#157). They are resolved
        against the project catalogue when the target is saved, the resolved
        key ids are stored as the explicit subset, and the patterns are NOT
        kept: a key created later that would have matched is never added.
        `names` are exact key names; `include` and `exclude` are bounded glob
        patterns (`*`, `?`, `[...]`) over key names; `classification` keeps
        only keys of that classification. `exclude` applies to what the
        patterns and classification selected, never to explicit ids or names.
      properties:
        names:
          type: array
          maxItems: 512
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
        include:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64}
        exclude:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64}
        classification: {type: string, enum: ["", secret, config]}

    CreateAdapterRequest:
      type: object
      additionalProperties: false
      required: [provider, origin, credential, target]
      properties:
        provider: {$ref: "#/components/schemas/AdapterProvider"}
        origin: {type: string, format: uri, maxLength: 2048}
        credential:
          type: string
          minLength: 1
          maxLength: 4096
          description: Write-only provider credential. Never returned.
        target: {$ref: "#/components/schemas/AdapterTargetInput"}

    UpdateAdapterOriginRequest:
      type: object
      additionalProperties: false
      required: [origin, credential]
      properties:
        origin: {type: string, format: uri, maxLength: 2048}
        credential: {type: string, minLength: 1, maxLength: 4096, description: Write-only credential for the pending origin.}
        keep_remote: {type: boolean, default: false}

    SetAdapterCredentialRequest:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential: {type: string, minLength: 1, maxLength: 4096}

    UpdateAdapterTargetRequest:
      type: object
      additionalProperties: false
      required: [environment_id, destination_kind, destination_owner, destination_name, destination_environment, visibility, selected_repository_ids, name_prefix, key_ids, expected_generation]
      properties:
        environment_id: {$ref: "#/components/schemas/ID"}
        destination_kind: {$ref: "#/components/schemas/AdapterDestinationKind"}
        destination_owner: {type: string, minLength: 1, maxLength: 255}
        destination_name: {type: string, maxLength: 255}
        destination_environment: {type: string, maxLength: 255}
        visibility: {type: string, enum: ["", all, private, selected]}
        selected_repository_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: {type: integer, format: int64, minimum: 1}
        name_prefix: {type: string, maxLength: 64, pattern: "^(?:[A-Z_][A-Z0-9_]*)?$"}
        key_ids:
          type: array
          minItems: 0
          maxItems: 512
          uniqueItems: true
          items: {$ref: "#/components/schemas/ID"}
        key_selection: {$ref: "#/components/schemas/AdapterKeySelection"}
        expected_generation: {type: integer, format: int64, minimum: 1}
        keep_remote: {type: boolean, default: false}

    ResumeAdapterMoveRequest:
      oneOf:
        - $ref: "#/components/schemas/ResumeAdapterOriginMoveRequest"
        - $ref: "#/components/schemas/ResumeAdapterTargetMoveRequest"

    ResumeAdapterOriginMoveRequest:
      type: object
      additionalProperties: false
      required: [origin, credential]
      properties:
        origin: {type: string, format: uri, maxLength: 2048}
        credential: {type: string, minLength: 1, maxLength: 4096, description: Write-only replacement for the pending origin credential.}

    ResumeAdapterTargetMoveRequest:
      type: object
      additionalProperties: false
      required: [target_id, environment_id, destination_kind, destination_owner, destination_name, destination_environment, visibility, selected_repository_ids, name_prefix, key_ids]
      properties:
        target_id: {$ref: "#/components/schemas/ID"}
        environment_id: {$ref: "#/components/schemas/ID"}
        destination_kind: {$ref: "#/components/schemas/AdapterDestinationKind"}
        destination_owner: {type: string, minLength: 1, maxLength: 255}
        destination_name: {type: string, maxLength: 255}
        destination_environment: {type: string, maxLength: 255}
        visibility: {type: string, enum: ["", all, private, selected]}
        selected_repository_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: {type: integer, format: int64, minimum: 1}
        name_prefix: {type: string, maxLength: 64, pattern: "^(?:[A-Z_][A-Z0-9_]*)?$"}
        key_ids:
          type: array
          minItems: 1
          maxItems: 512
          uniqueItems: true
          items: {$ref: "#/components/schemas/ID"}

    AdapterTarget:
      type: object
      additionalProperties: false
      required: [id, adapter_id, environment_id, destination_kind, destination_owner, destination_name, destination_environment, destination_id, repository_id, visibility, selected_repository_ids, name_prefix, generation, state, sync_status, converged_revision, last_attempted_revision, last_attempted_at, last_error_class, retry_at, paused_at, drift_attention, failure_names, warnings, keys, conflicts]
      properties:
        findings:
          type: array
          items: {$ref: "#/components/schemas/AdapterFinding"}
        id: {$ref: "#/components/schemas/ID"}
        adapter_id: {$ref: "#/components/schemas/ID"}
        environment_id: {$ref: "#/components/schemas/ID"}
        destination_kind: {$ref: "#/components/schemas/AdapterDestinationKind"}
        destination_owner: {type: string}
        destination_name: {type: string}
        destination_environment: {type: string}
        destination_id: {type: integer, format: int64, minimum: 1}
        repository_id: {type: integer, format: int64, minimum: 0}
        visibility: {type: string, enum: ["", all, private, selected]}
        selected_repository_ids:
          type: array
          items: {type: integer, format: int64, minimum: 1}
        name_prefix: {type: string}
        generation: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [active, moving, tombstoned]}
        sync_status:
          type: string
          enum: [never, pending, converging, converged, degraded, failed, paused]
          description: |
            Operator health (#157), derived at read time. `pending` is a
            queued, not yet claimed converge; `converging` a running one;
            `degraded` a failed attempt on a target that converged before, so
            the destination still holds `converged_revision`; `paused` wins
            over every other state while `paused_at` is set.
        converged_revision:
          type: [integer, "null"]
          format: int64
          description: The last revision a converge completed.
        last_attempted_revision:
          type: [integer, "null"]
          format: int64
          description: The revision the most recent attempt loaded, successful or not.
        last_attempted_at: {type: [string, "null"], format: date-time}
        last_error_class:
          type: string
          enum: ["", auth, network, conflict, provider_limit, provider_ambiguous, refused]
          description: Bounded cause of the last failed attempt; empty after a success. Never a provider response body.
        retry_at:
          type: [string, "null"]
          format: date-time
          description: When the queued retry becomes due, if the active job is waiting on one.
        paused_at: {type: [string, "null"], format: date-time}
        drift_attention:
          type: boolean
          description: The destination disagrees with the ownership ledger in a way only an operator can settle (unowned name in the way, destination identity moved, orphaned names). Cleared by the next successful converge.
        failure_names: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
        keys:
          type: array
          description: The resolved explicit key subset by name. Membership is by immutable id; names are echoed for the operator.
          items: {$ref: "#/components/schemas/AdapterTargetKey"}
        conflicts:
          type: array
          description: Pending exact conflict artifacts eligible for adoption on this target.
          items: {$ref: "#/components/schemas/AdapterConflictArtifact"}

    AdapterTargetKey:
      type: object
      additionalProperties: false
      required: [key_id, name, classification]
      properties:
        key_id: {$ref: "#/components/schemas/ID"}
        name: {type: string}
        classification: {type: string, enum: [secret, config]}

    AdapterResume:
      type: object
      additionalProperties: false
      required: [job_id, generation, revision]
      properties:
        job_id: {$ref: "#/components/schemas/ID"}
        generation: {type: integer, format: int64, minimum: 1}
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The published revision the queued converge catches up to; 0 when the environment has never published.

    AdapterTargetList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AdapterTarget"}}

    Adapter:
      type: object
      additionalProperties: false
      required: [id, provider, origin, credential_present, authority_principal_id, state, created_at, targets]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        provider: {$ref: "#/components/schemas/AdapterProvider"}
        origin: {type: string, format: uri}
        credential_present: {type: boolean}
        credential_set_at: {type: [string, "null"], format: date-time}
        credential_expires_at: {type: [string, "null"], format: date-time}
        authority_principal_id: {$ref: "#/components/schemas/ID"}
        state: {type: string, enum: [active, moving, tombstoned]}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        targets: {type: array, items: {$ref: "#/components/schemas/AdapterTarget"}}

    AdapterList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Adapter"}}

    DynamicProviderKind:
      type: string
      enum: [postgres]
    DynamicProviderState:
      type: string
      enum: [active, tombstoned]
    DynamicLeaseState:
      type: string
      description: |
        minting/renewing/revoking are in-flight; active is a usable credential;
        revoked/expired/failed are terminal; unknown is an ambiguous provider
        outcome awaiting reconcile and is NEVER reported as success.
      enum: [minting, active, renewing, revoking, revoked, expired, unknown, failed]

    CreateDynamicProviderRequest:
      type: object
      additionalProperties: false
      required: [kind, origin, grant_role, credential]
      properties:
        kind: {$ref: "#/components/schemas/DynamicProviderKind"}
        origin:
          type: string
          minLength: 1
          maxLength: 2048
          description: PostgreSQL origin as host:port/dbname.
        tls_mode:
          type: string
          enum: [verify-full]
          default: verify-full
          description: Only verify-full is accepted; a weaker mode is refused.
        grant_role:
          type: string
          minLength: 1
          maxLength: 63
          description: Parent role every minted lease role inherits (IN ROLE).
        credential:
          type: string
          minLength: 1
          maxLength: 4096
          description: Write-only admin credential. Never returned.

    SetDynamicProviderCredentialRequest:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential: {type: string, minLength: 1, maxLength: 4096}

    DynamicProvider:
      type: object
      additionalProperties: false
      required: [id, kind, origin, tls_mode, grant_role, credential_present, authority_principal_id, state, created_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        kind: {$ref: "#/components/schemas/DynamicProviderKind"}
        origin: {type: string}
        tls_mode: {type: string, enum: [verify-full]}
        grant_role: {type: string}
        credential_present: {type: boolean}
        credential_set_at: {type: [string, "null"], format: date-time}
        authority_principal_id: {$ref: "#/components/schemas/ID"}
        state: {$ref: "#/components/schemas/DynamicProviderState"}
        created_at: {$ref: "#/components/schemas/Timestamp"}

    DynamicProviderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/DynamicProvider"}}

    DynamicProviderDeletion:
      type: object
      additionalProperties: false
      required: [provider_id, revoked_lease_ids]
      properties:
        provider_id: {$ref: "#/components/schemas/ID"}
        revoked_lease_ids:
          type: array
          items: {$ref: "#/components/schemas/ID"}
          description: Leases queued for revocation as part of the delete.

    DynamicLease:
      type: object
      additionalProperties: false
      required: [id, provider_id, environment_id, principal_id, principal_class, provider_handle, state, max_ttl_seconds, last_transition_at, created_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        provider_id: {$ref: "#/components/schemas/ID"}
        environment_id: {$ref: "#/components/schemas/ID"}
        principal_id: {$ref: "#/components/schemas/ID"}
        principal_class: {type: string}
        provider_handle: {type: string, description: The provider-side role name. Public metadata; not a secret.}
        state: {$ref: "#/components/schemas/DynamicLeaseState"}
        issued_at: {type: [string, "null"], format: date-time}
        expires_at: {type: [string, "null"], format: date-time}
        max_ttl_seconds: {type: integer, format: int64, minimum: 1}
        last_transition_at: {$ref: "#/components/schemas/Timestamp"}
        created_at: {$ref: "#/components/schemas/Timestamp"}

    DynamicLeaseList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/DynamicLease"}}

    MintLeaseRequest:
      type: object
      additionalProperties: false
      required: [provider_id, max_ttl_seconds]
      properties:
        provider_id: {$ref: "#/components/schemas/ID"}
        max_ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          description: Requested maximum lifetime; the provider clamps to its own ceiling.

    RenewLeaseRequest:
      type: object
      additionalProperties: false
      properties:
        max_ttl_seconds:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: Optional new ceiling; renewal never extends past the lease's max TTL.

    MintLeaseResult:
      type: object
      additionalProperties: false
      required: [lease, username, password]
      properties:
        lease: {$ref: "#/components/schemas/DynamicLease"}
        username:
          type: string
          description: The minted role name; also the lease's provider_handle.
        password:
          type: string
          description: |
            The credential secret, returned EXACTLY ONCE to exactly one caller.
            No other route in this contract returns it.
        expires_at: {type: [string, "null"], format: date-time}

    AdapterConflictEntry:
      type: object
      additionalProperties: false
      required: [surface, effective_name]
      properties:
        surface: {type: string, enum: [secret, variable]}
        effective_name: {type: string}

    AdapterConflictArtifact:
      type: object
      additionalProperties: false
      required: [id, destination_id, repository_id, target_generation, entries, created_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        destination_id: {type: integer, format: int64, minimum: 1}
        repository_id: {type: integer, format: int64, minimum: 0}
        target_generation: {type: integer, format: int64, minimum: 1}
        entries: {type: array, items: {$ref: "#/components/schemas/AdapterConflictEntry"}}
        created_at: {$ref: "#/components/schemas/Timestamp"}

    AdapterMappingEntry:
      type: object
      additionalProperties: false
      required: [key_id, canonical_name, surface, effective_name]
      properties:
        key_id: {$ref: "#/components/schemas/ID"}
        canonical_name: {type: string}
        surface: {type: string, enum: [secret, variable]}
        effective_name: {type: string}

    AdapterTargetDetail:
      type: object
      additionalProperties: false
      required: [target, conflicts, mapping]
      properties:
        target: {$ref: "#/components/schemas/AdapterTarget"}
        conflicts: {type: array, items: {$ref: "#/components/schemas/AdapterConflictArtifact"}}
        mapping: {type: array, items: {$ref: "#/components/schemas/AdapterMappingEntry"}}

    AdapterChange:
      type: object
      additionalProperties: false
      required: [surface, effective_name, disposition]
      properties:
        surface: {type: string, enum: [secret, variable]}
        effective_name: {type: string}
        disposition: {type: string, enum: [create, update, delete, conflict, refused, unknown-until-sync]}
        reason: {type: string}

    AdapterPlan:
      type: object
      additionalProperties: false
      required: [artifact_id, changes, warnings]
      properties:
        artifact_id: {$ref: "#/components/schemas/ID"}
        changes: {type: array, items: {$ref: "#/components/schemas/AdapterChange"}}
        warnings: {type: array, items: {type: string}}

    AdapterAdoptionRequest:
      type: object
      additionalProperties: false
      required: [artifact_id, target_generation, destination_id, repository_id, entries]
      properties:
        artifact_id: {$ref: "#/components/schemas/ID"}
        target_generation: {type: integer, format: int64, minimum: 1}
        destination_id: {type: integer, format: int64, minimum: 1}
        repository_id: {type: integer, format: int64, minimum: 0}
        entries:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/AdapterConflictEntry"}

    AdapterJob:
      type: object
      additionalProperties: false
      required: [job_id, generation]
      properties:
        job_id: {$ref: "#/components/schemas/ID"}
        generation: {type: integer, format: int64, minimum: 1}

    AdapterConnection:
      type: object
      additionalProperties: false
      required: [version, destination_id, repository_id]
      properties:
        version: {type: string}
        destination_id: {type: integer, format: int64, minimum: 1}
        repository_id: {type: integer, format: int64, minimum: 0}
        credential_expires_at: {type: [string, "null"], format: date-time}

    AdapterTeardown:
      type: object
      additionalProperties: false
      required: [orphaned, jobs]
      properties:
        orphaned: {type: array, items: {type: string}}
        jobs: {type: array, items: {$ref: "#/components/schemas/AdapterJob"}}

    AdapterMoveJob:
      type: object
      additionalProperties: false
      required: [id, target_id, kind, state]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        target_id: {$ref: "#/components/schemas/ID"}
        kind: {type: string, enum: [scrub, activate, converge]}
        state: {type: string, enum: [queued, running, retry, succeeded, failed, superseded]}

    AdapterMoveTarget:
      type: object
      additionalProperties: false
      required: [target_id, environment_id, destination_kind, destination_owner, destination_name, destination_environment, destination_id, repository_id, visibility, selected_repository_ids, name_prefix, orphaned_names, jobs]
      properties:
        target_id: {$ref: "#/components/schemas/ID"}
        environment_id: {$ref: "#/components/schemas/ID"}
        destination_kind: {$ref: "#/components/schemas/AdapterDestinationKind"}
        destination_owner: {type: string}
        destination_name: {type: string}
        destination_environment: {type: string}
        destination_id: {type: integer, format: int64, minimum: 0}
        repository_id: {type: integer, format: int64, minimum: 0}
        visibility: {type: string, enum: ["", all, private, selected]}
        selected_repository_ids:
          type: array
          items: {type: integer, format: int64, minimum: 1}
        name_prefix: {type: string}
        orphaned_names: {type: array, items: {type: string}}
        jobs: {type: array, items: {$ref: "#/components/schemas/AdapterMoveJob"}}

    AdapterMove:
      type: object
      additionalProperties: false
      description: Durable route transition status. Credentials are never represented.
      required: [id, adapter_id, kind, state, keep_remote, pending_origin, targets, created_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        adapter_id: {$ref: "#/components/schemas/ID"}
        kind: {type: string, enum: [target, origin]}
        state: {type: string, enum: [scrubbing, activating, attention_required, completed, canceled]}
        keep_remote: {type: boolean}
        pending_origin: {type: string, format: uri}
        targets: {type: array, minItems: 1, items: {$ref: "#/components/schemas/AdapterMoveTarget"}}
        created_at: {$ref: "#/components/schemas/Timestamp"}

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: |
                Fixed per code. Never derived from the request, so two
                refusals of the same class are byte-identical.
            detail:
              type: [string, "null"]
              description: |
                Present only on `bad_request`, where it names the offending
                request member. `null` and absent are equivalent; every other
                error code omits the member entirely.
            findings:
              type: array
              description: |
                Secret-scanning refusal detail (#74, Surface 2). Present only on
                a `bad_request` that a declaration ingress refused because an
                author-controlled field carried a credential-shaped string. Each
                entry names the immutable declaration-field locator, the rule id,
                and a short-lived content-bound acknowledgement token the
                resubmission presents to override. Never the matched text.
              items:
                $ref: "#/components/schemas/ScanFinding"

    ScanFinding:
      type: object
      description: |
        One redacted secret-scanning result (#74, secret-scanning ADR §4). It
        carries a rule id, the surface/ingress it fired on, an immutable locator
        (key identity for Surface 1, schema-location class for Surface 2), and —
        where an acknowledgement is possible — an opaque token. It NEVER carries
        the matched text, an offset, a length, or an excerpt.
      required: [rule_id, surface, locator]
      additionalProperties: false
      properties:
        rule_id:
          type: string
          description: The matched rule's id (e.g. `aws-access-token`).
        surface:
          type: string
          description: |
            Which ingress produced the finding. Surface-1 warns carry the value
            write surface; Surface-2 blocks carry the declaration ingress (`edit`
            for direct edits, `plan`/`apply` for the definitions Git flow); `check`
            is the read-only `definitions check` dry-run.
          enum: [value_write, declassification, import_value, edit, plan, apply, check]
        locator:
          type: string
          description: |
            The immutable locator. Surface 1: the key identity. Surface 2: the
            schema-location class of the offending field (e.g.
            `key.declaration.pattern`), never an instance-derived path.
        acknowledgement:
          type: string
          description: |
            An opaque, short-lived, content-bound token (Surface-1 keep-as-config
            dismissal or Surface-2 override). Present only where an
            acknowledgement is possible. Resubmit the write presenting it in
            `acknowledgements`. It embeds no plaintext.

    ErrorCode:
      type: string
      description: Closed response-code set. Clients branch on this, not on prose.
      enum:
        - bad_request
        - unauthenticated
        - forbidden
        - not_found
        - conflict
        - limit_exceeded
        - too_many_requests
        - service_unavailable
        - internal

    Meta:
      type: object
      description: |
        An exact closed allowlist. `additionalProperties: false` is the
        allowlist's teeth: a field added here is a visible spec change, not a
        quiet leak of instance configuration to unauthenticated callers.
      additionalProperties: false
      required: [server_version, api_revision, protocol_capabilities]
      properties:
        instance_identity:
          type: string
          minLength: 1
          description: Stable server-generated instance identity, independent of URL aliases.
        server_version:
          type: string
          description: The build's version string; `dev` for unreleased builds.
        api_revision:
          type: integer
          minimum: 1
          description: |
            This server's API revision. A client refuses an operation whose
            `x-hikyo-min-revision` exceeds it, naming the server version — a
            loud refusal, never a silent misbehave.
        protocol_capabilities:
          type: array
          description: |
            Which authentication protocol flows this instance serves. `login`
            needs this before any session exists.
          items:
            $ref: "#/components/schemas/ProtocolCapability"

    ProtocolCapability:
      type: string
      description: |
        OPEN enum: an instance may advertise a flow this client has never
        heard of, and every generated consumer must preserve and tolerate the
        unknown value rather than reject the response.
      x-extensible-enum:
        - local-password
        - loopback-handoff
        - device-code
        - oidc
        - saml
        - webauthn

    EstablishCredentialRequest:
      description: |
        Accepts a credential-establishment authority issued by bootstrap,
        invitation, credential-reset, break-glass, or recovery. The issuer is
        server-owned metadata, not a request discriminator.
      type: object
      additionalProperties: false
      required: [authority, password]
      properties:
        authority:
          type: string
          description: |
            The single-use credential-establishment authority, exactly as
            delivered. Never logged, never audited, never echoed.
          minLength: 16
          maxLength: 256
        password:
          type: string
          description: |
            The initial credential. Minimum length 12, no composition rules,
            no forced rotation (NIST SP 800-63B shape); checked against a
            bundled common-password list at set time only, never at login.
          minLength: 12
          maxLength: 1024

    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 1
          maxLength: 1024
        artifact:
          type: string
          enum: [cli, browser]
          default: cli
          description: |
            Which session artifact to mint. Omitted or `cli` mints a CLI
            session whose token is returned in the body. `browser` mints a
            browser session delivered ONLY on the `__Host-hikyo` cookie, with
            its synchronizer token on the `__Host-hikyo-csrf` cookie; the body
            then carries no token at all. The two artifacts have distinct
            lifetimes, distinct CSRF contracts and distinct revocation
            surfaces, so the caller states which one it is asking for rather
            than the server guessing from a header.

    LoginResult:
      type: object
      required: [session, principal]
      properties:
        session_token:
          type: string
          description: |
            The bearer value, returned exactly once. A replayable credential:
            cookie attributes constrain browsers, not an attacker holding the
            value, which is why lifetimes are short and revocation is a
            delete. OMITTED for a browser-artifact session: that token is
            delivered ONLY on the `__Host-hikyo` HttpOnly cookie so injected
            same-origin script cannot read it. A CLI-artifact session, which has
            no cookie channel, still carries it here.
        session:
          $ref: "#/components/schemas/Session"
        principal:
          $ref: "#/components/schemas/Principal"

    WhoAmI:
      type: object
      required: [session, principal, capabilities]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        principal:
          $ref: "#/components/schemas/Principal"
        capabilities:
          $ref: "#/components/schemas/PrincipalCapabilities"

    PrincipalCapabilities:
      type: object
      description: >-
        UI-gating hints for the calling principal: what instance surfaces this
        session may even attempt, so the SPA does not fire an operator-only
        request it will only be refused. These are disclosure-safe reflections
        of the caller's own grants — never authorization itself, which is still
        evaluated per request at the server chokepoint.
      required: [instance_operator]
      properties:
        instance_operator:
          type: boolean
          description: >-
            True when the caller holds instance-config authority — the grant the
            retention-health and update-status reads require. The instance
            administration chrome and those background polls gate on it.

    UpdateStatus:
      type: object
      x-hikyo-zod-strict: true
      additionalProperties: false
      required: [channel, current_version, available, prerelease, apply_supported]
      properties:
        channel:
          type: string
          enum: [stable, nightly, off]
        current_version:
          type: string
        latest_version:
          type: string
        release_url:
          type: string
          format: uri
        available:
          type: boolean
        prerelease:
          type: boolean
        published_at:
          type: string
          format: date-time
        apply_supported:
          type: boolean
          description: Always false while legacy remote apply is retired for migration safety.
        apply_backend:
          $ref: "#/components/schemas/InstanceUpdateBackend"
        apply_error:
          type: string
          description: Operator-safe reason remote apply is unsupported; manual upgrades remain available.

    InstanceUpdateBackend:
      type: string
      enum: [flux, compose, systemd]

    InstanceUpdateRequest:
      type: object
      x-hikyo-zod-strict: true
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
          maxLength: 64

    InstanceUpdateJob:
      type: object
      x-hikyo-zod-strict: true
      additionalProperties: false
      required: [id, backend, version, state, phase, requested_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        backend:
          $ref: "#/components/schemas/InstanceUpdateBackend"
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
          maxLength: 64
        state:
          type: string
          enum: [queued, running, succeeded, failed, rolled-back, rollback-failed]
        phase:
          type: string
          enum: [queued, plan, backup, verify, apply, health, rollback, complete, admission]
        failure_code:
          type: string
          maxLength: 64
        requested_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          $ref: "#/components/schemas/Timestamp"
        finished_at:
          $ref: "#/components/schemas/Timestamp"

    TotpEnrolStartRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          description: |
            The account-security proof: the pre-existing password. Verified
            before a pending seed is staged; never logged, never echoed.
          minLength: 1
          maxLength: 1024

    TotpEnrolStartResult:
      type: object
      additionalProperties: false
      required: [otpauth_uri]
      properties:
        otpauth_uri:
          type: string
          description: |
            The `otpauth://totp/...` provisioning URI, returned exactly once.
            The seed is never re-retrievable.

    TotpCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: A TOTP code from the enrolled authenticator.
          minLength: 6
          maxLength: 10

    TotpReauthRequest:
      description: A disclosure reauthentication by TOTP in exactly one canonical intent shape.
      oneOf:
        - $ref: "#/components/schemas/TotpEnvironmentReauthRequest"
        - $ref: "#/components/schemas/TotpAdapterReauthRequest"
        - $ref: "#/components/schemas/TotpSelfConfigReauthRequest"

    TotpSelfConfigReauthRequest:
      type: object
      x-hikyo-zod-strict: true
      additionalProperties: false
      required: [purpose, self_config, code]
      properties:
        purpose: {type: string, const: self-config}
        self_config: {$ref: "#/components/schemas/SelfConfigReauthIntent"}
        code: {type: string, minLength: 6, maxLength: 10}
    SelfConfigReauthIntent:
      type: object
      additionalProperties: false
      required: [action, owner_instance_id, revision, schema_version, expected_generation, preview_token, to, confirm_restored_credentials]
      properties:
        action: {type: string, enum: [adopt, apply, mail-test]}
        owner_instance_id: {type: string, minLength: 1, maxLength: 128}
        revision: {type: integer, format: int64, minimum: 0}
        schema_version: {type: integer, minimum: 1}
        expected_generation: {type: integer, format: int64, minimum: 0}
        preview_token: {type: string, maxLength: 1024}
        to: {type: string, maxLength: 320}
        confirm_restored_credentials: {type: boolean, description: Explicit confirmation of reviewed credentials and reconciled access grants after restore; false for other decisions.}

    TotpEnvironmentReauthRequest:
      type: object
      x-hikyo-zod-strict: true
      additionalProperties: false
      required: [environment_id, code]
      description: |
        A disclosure reauthentication by TOTP. `environment_id` is what the
        window is opened OVER — the reveal guard is per environment, so a
        window on staging authorizes nothing in production.
      properties:
        environment_id:
          $ref: "#/components/schemas/ID"

        code:
          type: string
          description: A TOTP code from the enrolled authenticator.
          minLength: 6
          maxLength: 10

    TotpAdapterReauthRequest:
      type: object
      x-hikyo-zod-strict: true
      additionalProperties: false
      required: [purpose, operation, environment_ids, code]
      description: A TOTP proof bound to one adapter operation over an exact environment set.
      properties:
        purpose:
          allOf:
            - $ref: "#/components/schemas/ReauthPurpose"
            - const: adapter
        operation:
          type: string
          enum: [adapter.configure, adapter.credential-set, adapter.adopt, adapter.sync]
        environment_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/ID"}
        code:
          type: string
          description: A TOTP code from the enrolled authenticator.
          minLength: 6
          maxLength: 10

    CLIReauthStartRequest:
      type: object
      additionalProperties: false
      required: [purpose, operation, environment_ids, pkce_challenge, redirect_uri]
      description: |
        `adapter` carries an adapter-routing decision over an environment set.
        Every non-adapter purpose carries an exact environment and key set. The
        browser runs the same purpose-bound ceremony the UI runs, so `key_ids`
        names exactly the unit the decision covers.
      properties:
        self_config: {$ref: "#/components/schemas/SelfConfigReauthIntent"}
        purpose: {type: string, enum: [adapter, reveal, copy, publish, approve, reject, bypass, self-config]}
        operation: {type: string, enum: [adapter.configure, adapter.credential-set, adapter.adopt, adapter.sync, value.reveal, value.copy-source, value.copy-destination, approval.vote, approval.bypass, self-config.adopt, self-config.apply, self-config.test]}
        environment_ids: {type: array, uniqueItems: true, items: {$ref: "#/components/schemas/ID"}}
        key_ids:
          type: array
          uniqueItems: true
          maxItems: 500
          items: {$ref: "#/components/schemas/ID"}
          description: The enumerated unit of a non-adapter purpose; absent or empty for `adapter`.
        pkce_challenge: {type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$"}
        redirect_uri:
          type: string
          format: uri
          maxLength: 256
          description: Exact ephemeral loopback callback, http://127.0.0.1:PORT/callback or the bracketed ::1 equivalent.

    CLIReauthStart:
      type: object
      additionalProperties: false
      required: [state, expires_at]
      properties:
        state: {type: string, minLength: 1}
        expires_at: {$ref: "#/components/schemas/Timestamp"}

    CLIReauthApproveRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {type: string, minLength: 1}

    CLIReauthApproved:
      type: object
      additionalProperties: false
      required: [code, state, redirect_uri]
      properties:
        code: {type: string, minLength: 1, description: Single-use front-channel authorization code; never a session bearer.}
        state: {type: string, minLength: 1, description: Exact opaque state supplied by the initiating CLI.}
        redirect_uri: {type: string, format: uri, description: Exact server-bound loopback callback URI.}

    CLIReauthEnvironmentPolicy:
      type: object
      additionalProperties: false
      required: [environment_id, effective_window_seconds, requires_webauthn]
      properties:
        environment_id: {$ref: "#/components/schemas/ID"}
        effective_window_seconds: {type: integer, minimum: 0}
        requires_webauthn: {type: boolean}

    CLIReauthTransaction:
      type: object
      additionalProperties: false
      required: [state, purpose, operation, environments, key_ids, redirect_uri, expires_at]
      properties:
        self_config: {$ref: "#/components/schemas/SelfConfigReauthIntent"}
        state: {type: string, minLength: 1}
        purpose: {type: string, enum: [adapter, reveal, copy, publish, approve, reject, bypass, self-config]}
        operation: {type: string, enum: [adapter.configure, adapter.credential-set, adapter.adopt, adapter.sync, value.reveal, value.copy-source, value.copy-destination, approval.vote, approval.bypass, self-config.adopt, self-config.apply, self-config.test]}
        environments: {type: array, items: {$ref: "#/components/schemas/CLIReauthEnvironmentPolicy"}}
        key_ids:
          type: array
          items: {$ref: "#/components/schemas/ID"}
          description: The enumerated unit the ceremony binds; empty for `adapter`.
        redirect_uri: {type: string, format: uri}
        expires_at: {$ref: "#/components/schemas/Timestamp"}

    CLIReauthRedeemRequest:
      type: object
      additionalProperties: false
      required: [code, pkce_verifier]
      properties:
        code: {type: string, minLength: 1}
        pkce_verifier: {type: string, minLength: 43, maxLength: 128, pattern: "^[A-Za-z0-9._~-]+$"}

    CLIReauthRedeemed:
      type: object
      additionalProperties: false
      required: [session_id, session_token, windows]
      properties:
        session_id: {$ref: "#/components/schemas/ID"}
        session_token: {type: string, minLength: 1, description: Rotated CLI bearer. Client stores it silently and never prints or logs it.}
        windows: {type: array, items: {$ref: "#/components/schemas/ReauthResult"}}

    TotpProofRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          description: The account-security proof for removing the factor.
          minLength: 1
          maxLength: 1024

    RecoveryProofRequest:
      type: object
      additionalProperties: false
      required: [proof]
      properties:
        proof:
          type: string
          description: |
            The account-security proof: the confirmed TOTP code where one
            stands, else the password.
          minLength: 1
          maxLength: 1024

    RecoveryCodesResult:
      type: object
      required: [recovery_codes, login]
      properties:
        recovery_codes:
          type: array
          description: The plaintext single-use codes, displayed once and never again.
          items:
            type: string
        login:
          $ref: "#/components/schemas/LoginResult"

    RecoveryBeginRequest:
      type: object
      additionalProperties: false
      required: [username, code]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        code:
          type: string
          minLength: 1
          maxLength: 256

    RecoveryBeginResult:
      type: object
      additionalProperties: false
      required: [authority, expires_at]
      properties:
        authority:
          type: string
          description: |
            The single-use credential-establishment authority, returned once.
            It creates no session: establish a password with it, then log in.
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    InviteMemberRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          description: The invitee's local login handle; globally unique.
        display_name:
          type: string
          maxLength: 256
          description: Defaults to the username.
        template:
          allOf:
            - $ref: "#/components/schemas/RoleTemplate"
          description: |
            Optional initial grants, expanded at the invitation's scope in the
            same transaction. Absent means the account can sign in and see
            nothing until someone grants it something.

    InvitationResult:
      type: object
      additionalProperties: false
      required: [principal_id, account_id, authority, expires_at]
      properties:
        principal_id:
          $ref: "#/components/schemas/ID"
        account_id:
          $ref: "#/components/schemas/ID"
        authority:
          type: string
          description: |
            The single-use credential-establishment authority for the new
            account, returned once. It creates no session and may only ever
            establish a password; hand it to the invitee out of band.
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    CredentialResetResult:
      type: object
      additionalProperties: false
      required: [authority, expires_at]
      properties:
        authority:
          type: string
          description: |
            The single-use credential-establishment authority for the target,
            returned once. It creates no session and may only ever establish a
            password; hand it to the target out of band.
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    Session:
      type: object
      required: [id, artifact, created_at, idle_expires_at, absolute_expires_at, assurance]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        artifact:
          $ref: "#/components/schemas/SessionArtifact"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        idle_expires_at:
          $ref: "#/components/schemas/Timestamp"
        absolute_expires_at:
          $ref: "#/components/schemas/Timestamp"
        assurance:
          $ref: "#/components/schemas/Assurance"

    SessionArtifact:
      type: string
      description: |
        OPEN enum: human sessions are per-client-class artifacts and new
        classes are additive. A browser cookie's attributes protect nothing on
        a non-browser client, and conflating the two hides which artifact was
        actually used.
      x-extensible-enum:
        - cli
        - browser

    Assurance:
      type: object
      description: |
        How **this session** authenticated — not what the account owns.
        Authorization of an MFA-mandatory capability consults this record at
        the same chokepoint as `authorize()`, in the same transaction,
        uncached.
      required: [method, factors, authenticated_at]
      properties:
        method:
          $ref: "#/components/schemas/AuthMethod"
        provider:
          type: string
          description: The configured provider slug, present only for OIDC sessions.
        factors:
          type: array
          description: The factor classes actually presented in this session.
          items:
            $ref: "#/components/schemas/FactorClass"
        authenticated_at:
          $ref: "#/components/schemas/Timestamp"
        ceremony_id:
          type: [string, "null"]
          description: |
            The factor ceremony this session's assurance came from, where one
            occurred. `null` for a single-factor password login.

    AuthMethod:
      type: string
      description: |
        OPEN enum — `oidc:<issuer>` and `saml:<entityID>` values are
        instance-specific by construction.
      x-extensible-enum:
        - local-password
        - local-passkey

    FactorClass:
      type: string
      description: OPEN enum — new factor classes are additive.
      x-extensible-enum:
        - password
        - totp
        - webauthn
        - recovery-code

    Principal:
      type: object
      required: [id, kind]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        kind:
          $ref: "#/components/schemas/PrincipalKind"
        display_name:
          type: [string, "null"]
          description: For display only. Never a linking key, at any point, for any provider.

    PrincipalKind:
      type: string
      description: Closed set — the human/machine distinction is structural in audit attribution.
      enum: [human, machine]

    CreateOrgRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        active:
          type: boolean
          default: true
        metadata:
          type: [object, "null"]
          description: |
            Free-form operator metadata. `null` and absent both mean "no
            metadata"; the round-trip of absent/null/value is fixture-pinned
            through both the Go and the TypeScript consumer.
        acknowledgements:
          $ref: "#/components/schemas/Acknowledgements"

    Org:
      type: object
      required: [id, name, active, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        active:
          type: boolean
        metadata:
          type: [object, "null"]
        created_at:
          $ref: "#/components/schemas/Timestamp"

    OrgList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Org"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.

    MyOrg:
      type: object
      additionalProperties: false
      required: [id, name]
      description: |
        An organisation as a navigation destination: what the caller needs to
        show it and route to it, and nothing else. Deliberately narrower than
        `Org` — `metadata` and `active` are operator-set state that belongs to
        `getOrg`, which authorizes; a member listing does not.
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string

    MyOrgList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyOrg"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.

    EntityName:
      type: string
      description: |
        A display name for an organisation, project or environment. Identity is
        the immutable id, so this is a label and a rename never breaks a
        reference. The 128-byte bound is the one the organisation contract has
        carried since the first slice, adopted for every entity so there is one
        number rather than four; no ADR fixes a per-entity name length. The
        grammar itself (non-empty, no control characters, no surrounding
        whitespace) is enforced in the domain rather than restated as a pattern
        here — two grammars would be two things to keep in sync.

        **The bound is 128 UTF-8 BYTES, and the server is authoritative.**
        `maxLength` below counts Unicode code points, which is the only length
        JSON Schema can express, so a name of 100 emoji satisfies this schema
        and is still refused by the server with `bad_request`. Clients that want
        to pre-validate must measure the UTF-8 encoding, not the string length.
      minLength: 1
      maxLength: 128

    RenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/EntityName"
        acknowledgements:
          $ref: "#/components/schemas/Acknowledgements"

    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/EntityName"
        acknowledgements:
          $ref: "#/components/schemas/Acknowledgements"

    Project:
      type: object
      required: [id, org_id, name, created_at]
      properties:
        can_manage_policy:
          type: boolean
          description: Whether the caller can manage policy for this project.
        can_delete:
          type: boolean
          description: Whether the caller can delete this project.
        id:
          $ref: "#/components/schemas/ID"
        org_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"

    ProjectList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.

    CreateEnvironmentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/EntityName"
        acknowledgements:
          $ref: "#/components/schemas/Acknowledgements"

    CloneEnvironmentRequest:
      type: object
      additionalProperties: false
      required: [name, source_environment_id]
      properties:
        name:
          $ref: "#/components/schemas/EntityName"
        source_environment_id:
          $ref: "#/components/schemas/ID"
        acknowledgements:
          $ref: "#/components/schemas/Acknowledgements"

    ClonedEnvironment:
      type: object
      required: [environment, copied, uncopied_secrets]
      properties:
        environment:
          $ref: "#/components/schemas/Environment"
        copied:
          type: array
          description: The key names whose values the clone carried over.
          items:
            $ref: "#/components/schemas/KeyName"
        uncopied_secrets:
          type: array
          description: |
            The `secret` key names the source-material gate blocked. They land
            `absent` in the new environment - never silently, which is why
            they are enumerated here.
          items:
            $ref: "#/components/schemas/KeyName"
        findings:
          type: array
          description: |
            Secret-scanning warnings the cloned config values produced (#74,
            Surface 1), warn-not-block.
          items:
            $ref: "#/components/schemas/ScanFinding"

    PendingChange:
      type: object
      description: |
        One draft in the caller's own working state. `version_id` is the
        IMMUTABLE id a selective publish names; editing the same cell mints a
        new one and collects this row rather than mutating it.

        It never carries the staged value. A draft holds real material and that
        material is reveal-gated exactly as a published one is.
      required: [version_id, key_id, name, classification, operation, staged_from_revision, created_at]
      additionalProperties: false
      properties:
        version_id:
          $ref: "#/components/schemas/ID"
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        operation:
          type: string
          description: What publishing this draft does to the cell.
          enum: [set, unset]
        staged_from_revision:
          type: integer
          format: int64
          description: |
            The environment's published revision when the edit was staged.
            Provenance a client shows; the freshness check is per entry.
        created_at:
          type: string
          format: date-time
        findings:
          type: array
          description: |
            Secret-scanning warnings this save produced (#74, Surface 1). The
            save SUCCEEDED regardless; each finding carries a keep-as-config
            acknowledgement token. Absent or empty on a clean save.
          items:
            $ref: "#/components/schemas/ScanFinding"
    PendingDraft:
      type: object
      description: |
        One caller-owned pending draft. Secret and unset drafts never carry
        material on this surface; `value` is present if and only if `revealed`
        is true.
      required: [version_id, key_id, name, classification, operation, staged_from_revision, created_at, revealed]
      additionalProperties: false
      properties:
        advisory:
          type: object
          additionalProperties: false
          required: [owner_id, valid]
          properties:
            owner_id: {$ref: "#/components/schemas/ID"}
            valid: {type: boolean}
        version_id:
          $ref: "#/components/schemas/ID"
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        operation:
          type: string
          enum: [set, unset]
        staged_from_revision:
          type: integer
          format: int64
        created_at:
          $ref: "#/components/schemas/Timestamp"
        revealed:
          type: boolean
        value:
          type: string
    PendingDraftList:
      type: object
      required: [items, count]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PendingDraft"
        count:
          type: integer
          minimum: 0
    RollbackRequest:
      type: object
      additionalProperties: false
      properties:
        key:
          $ref: "#/components/schemas/KeyName"
    RollbackResult:
      type: object
      additionalProperties: false
      required: [revision, changes, preview]
      properties:
        revision:
          type: integer
          format: int64
        changes:
          type: array
          items: {$ref: "#/components/schemas/PendingChange"}
        preview:
          $ref: "#/components/schemas/ImpactPreview"
    ImpactPreview:
      type: object
      additionalProperties: false
      required: [token, environments]
      properties:
        token:
          type: string
          description: Opaque exact-input token required when publishing restore-authored drafts.
        environments:
          type: array
          items: {$ref: "#/components/schemas/ImpactEnvironment"}
    ImpactEnvironment:
      type: object
      additionalProperties: false
      required: [environment_id, base_revision, schema_revision, protected, changes]
      properties:
        environment_id: {$ref: "#/components/schemas/ID"}
        base_revision: {type: integer, format: int64, minimum: 0}
        schema_revision: {type: integer, format: int64, minimum: 0}
        protected:
          type: boolean
          description: Protection state bound into the preview token.
        changes:
          type: array
          items: {$ref: "#/components/schemas/ImpactChange"}
    ImpactChange:
      type: object
      additionalProperties: false
      required: [version_id, key_id, name, classification, operation, status]
      properties:
        version_id: {$ref: "#/components/schemas/ID"}
        key_id: {$ref: "#/components/schemas/ID"}
        name: {$ref: "#/components/schemas/KeyName"}
        classification: {$ref: "#/components/schemas/KeyClassification"}
        operation: {type: string, enum: [set, unset]}
        status: {type: string, enum: [added, edited, removed, not-edited]}
        before:
          type: string
          description: Config plaintext when the caller also holds read; absent for secrets or unreadable config.
        after:
          type: string
          description: Config plaintext when the caller also holds read; absent for secrets, clears, or unreadable config.
    RevisionPinRequest:
      type: object
      additionalProperties: false
      required: [workload_principal_id, revision]
      properties:
        workload_principal_id: {$ref: "#/components/schemas/ID"}
        revision: {type: integer, format: int64, minimum: 1}
        expires_at: {$ref: "#/components/schemas/Timestamp"}
        override_schema: {type: boolean, default: false}
    RevisionPin:
      type: object
      additionalProperties: false
      required: [id, workload_principal_id, revision, authority_principal_id, expires_at, created_at, authorized_at, history_authorized, schema_override, expired, release_retention_consequence]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        workload_principal_id: {$ref: "#/components/schemas/ID"}
        revision: {type: integer, format: int64}
        authority_principal_id: {$ref: "#/components/schemas/ID"}
        expires_at: {$ref: "#/components/schemas/Timestamp"}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        authorized_at: {$ref: "#/components/schemas/Timestamp"}
        history_authorized: {type: boolean}
        schema_override: {type: boolean}
        expired: {type: boolean}
        release_retention_consequence:
          allOf:
            - $ref: "#/components/schemas/RetentionConsequence"
          description: |
            Server-derived preview of releasing this pin. It controls the
            existing collection-risk confirmation, but may become stale; the
            release response is authoritative transaction-time truth.
    RevisionPinResult:
      type: object
      additionalProperties: false
      required: [action, pin]
      properties:
        action: {type: string, enum: [created, reassigned, renewed]}
        pin: {$ref: "#/components/schemas/RevisionPin"}
    RetentionConsequence:
      type: string
      enum: [retained, collection_eligible, already_collected]
      description: |
        Transaction-time payload state after a pin release. retained means the
        effective policy or another live pin still keeps the payload;
        collection_eligible means a sweep may collect it immediately;
        already_collected means GC committed collection before this result.
    RevisionPinReleaseResult:
      type: object
      additionalProperties: false
      required: [revision, retention_consequence]
      properties:
        revision: {type: integer, format: int64, minimum: 1}
        retention_consequence: {$ref: "#/components/schemas/RetentionConsequence"}
    RevisionPinList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/RevisionPin"}
        count: {type: integer, minimum: 0}
    PublishRequest:
      type: object
      additionalProperties: false
      properties:
        version_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: |
            The pending-change version ids to commit. Naming an id the caller
            does not own, or one that has been superseded or already published,
            is refused loud rather than resolved to whatever the owner typed
            since. Required for an ordinary publish; omitted when merging or
            bypassing an approval request (whose reviewed selection is used
            instead).
          items:
            $ref: "#/components/schemas/ID"
        preview_token:
          type: string
          minLength: 1
          description: Required when any selected or closure-added draft came from rollback.
        confirmed_protected_environments:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/ID"}
          description: Exact protected-environment set reviewed by a machine principal; humans must use the bound ceremony.
        approval_request_id:
          $ref: "#/components/schemas/ID"
          description: |
            Secret-change approvals (#151). Merge or bypass this approval
            request instead of publishing a caller-named selection: the
            request's reviewed version ids are used, and the request must be
            approved (quorum from currently-eligible approvers) unless `bypass`
            is set. Only the requester may merge their own reviewed change.
        bypass:
          $ref: "#/components/schemas/ApprovalBypass"
        purpose:
          type: string
          maxLength: 1024
          description: |
            Free-text reason recorded on the request when a covered publish
            stages one. Ignored where no policy covers the environment.
    ApprovalBypass:
      type: object
      required: [reason]
      additionalProperties: false
      description: |
        Emergency bypass of a covered environment's approval quorum (#151). A
        named bypasser force-merges an existing request with a mandatory reason,
        under a current reauthentication ceremony; emits a dedicated high-signal
        audit event and never mutates the policy.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 512
          description: Why the quorum was bypassed. Recorded in the audit trail.
    ApprovalApprover:
      type: object
      required: [kind, subject_id]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [principal, scim_group]
        subject_id:
          $ref: "#/components/schemas/ID"
          description: A principal id, or a SCIM group id when kind is scim_group.
        binding_id:
          $ref: "#/components/schemas/ID"
          description: The SCIM binding a group approver's members are resolved through.
    ApprovalPolicyInput:
      type: object
      required: [min_approvals, request_ttl_seconds, enabled]
      additionalProperties: false
      properties:
        environment_id:
          type: string
          maxLength: 64
          description: The environment this policy covers; empty means every environment in the project.
        min_approvals:
          type: integer
          format: int32
          minimum: 1
        allow_self_approval:
          type: boolean
        request_ttl_seconds:
          type: integer
          format: int32
          minimum: 1
        enabled:
          type: boolean
        approvers:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/ApprovalApprover"}
        bypassers:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {$ref: "#/components/schemas/ID"}
    ApprovalPolicy:
      type: object
      required: [id, environment_id, min_approvals, allow_self_approval, request_ttl_seconds, enabled, version, approvers, bypassers, created_at, updated_at]
      additionalProperties: false
      properties:
        principal_names:
          type: object
          additionalProperties:
            type: string
          description: Current names for principal approvers and bypassers already disclosed by this policy; not a user directory.
        id: {$ref: "#/components/schemas/ID"}
        environment_id:
          type: string
          maxLength: 64
        min_approvals: {type: integer, format: int32}
        allow_self_approval: {type: boolean}
        request_ttl_seconds: {type: integer, format: int32}
        enabled: {type: boolean}
        version: {type: integer, format: int64}
        approvers:
          type: array
          items: {$ref: "#/components/schemas/ApprovalApprover"}
        bypassers:
          type: array
          items: {$ref: "#/components/schemas/ID"}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        updated_at: {$ref: "#/components/schemas/Timestamp"}
    ApprovalPolicyList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ApprovalPolicy"}
    ApprovalVote:
      type: object
      required: [principal_id, decision, created_at]
      additionalProperties: false
      properties:
        principal_name:
          type: string
          description: Current display name of the referenced principal, when available.
        principal_id: {$ref: "#/components/schemas/ID"}
        decision:
          type: string
          enum: [approve, reject]
        created_at: {$ref: "#/components/schemas/Timestamp"}
    ApprovalRequest:
      type: object
      required: [id, environment_id, policy_id, policy_version, requester, change_count, base_revision, purpose, state, invalidated_cause, min_approvals, approvals, key_ids, votes, created_at, expires_at]
      additionalProperties: false
      properties:
        requester_name:
          type: string
          description: Current display name of the referenced principal, when available.
        id: {$ref: "#/components/schemas/ID"}
        environment_id: {$ref: "#/components/schemas/ID"}
        policy_id: {$ref: "#/components/schemas/ID"}
        policy_version: {type: integer, format: int64}
        requester: {$ref: "#/components/schemas/ID"}
        change_count: {type: integer, format: int32}
        base_revision: {type: integer, format: int64}
        purpose: {type: string}
        state:
          type: string
          enum: [open, approved, merged, rejected, expired, invalidated, bypassed]
        invalidated_cause:
          type: string
          enum: ["", policy_changed, draft_edited, env_advanced, approver_removed]
        min_approvals: {type: integer, format: int32}
        approvals: {type: integer, format: int32}
        key_ids:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/ID"}
          description: The exact key set bound to vote, merge, and bypass ceremonies.
        votes:
          type: array
          items: {$ref: "#/components/schemas/ApprovalVote"}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        expires_at: {$ref: "#/components/schemas/Timestamp"}
        resolved_at: {$ref: "#/components/schemas/Timestamp"}
    ApprovalRequestList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ApprovalRequest"}
    ApprovalRequestSummary:
      type: object
      required: [id, environment_id, policy_id, state, expires_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/ID"}
        environment_id: {$ref: "#/components/schemas/ID"}
        policy_id: {$ref: "#/components/schemas/ID"}
        state:
          type: string
          enum: [open, approved, merged, rejected, expired, invalidated, bypassed]
        expires_at: {$ref: "#/components/schemas/Timestamp"}
    ApprovalVoteRequest:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, reject]
    PublishResult:
      type: object
      required: [published, closed_in, environments]
      additionalProperties: false
      properties:
        published:
          type: array
          description: Every version id that committed, closure included.
          items:
            $ref: "#/components/schemas/ID"
        closed_in:
          type: array
          description: |
            The version ids key-group closure pulled in beyond what the caller
            named, so the caller can tell what it asked for from what the
            coupling required.
          items:
            $ref: "#/components/schemas/ID"
        environments:
          type: array
          items:
            $ref: "#/components/schemas/PublishedEnvironment"
    PublishedEnvironment:
      type: object
      required: [environment_id, revision, schema_revision, change_token, changed_keys]
      additionalProperties: false
      properties:
        environment_id:
          $ref: "#/components/schemas/ID"
        revision:
          type: integer
          format: int64
        schema_revision:
          type: integer
          format: int64
          description: The pinned schema revision this snapshot was validated at.
        change_token:
          type: string
          description: |
            The keyed, versioned change token for this snapshot. Non-secret by
            construction: it is an HMAC under a per-scope key, so it is
            unforgeable and un-invertible, which is why it may travel in pod
            annotations and logs.
        changed_keys:
          type: array
          items:
            $ref: "#/components/schemas/ChangedKey"
    ChangedKey:
      type: object
      description: |
        One lineage row. It carries a key id, the key's name at that revision
        and the transition - and nothing derived from a value.
      required: [key_id, name, change]
      additionalProperties: false
      properties:
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        change:
          type: string
          enum: [added, edited, removed]
    RevisionDiffRequest:
      type: object
      additionalProperties: false
      required: [left_revision, right_revision]
      properties:
        left_revision: {type: integer, format: int64, minimum: 1}
        right_revision: {type: integer, format: int64, minimum: 1}
    RevealRevisionDiffRequest:
      type: object
      additionalProperties: false
      required: [left_revision, right_revision, key_id]
      properties:
        left_revision: {type: integer, format: int64, minimum: 1}
        right_revision: {type: integer, format: int64, minimum: 1}
        key_id: {$ref: "#/components/schemas/ID"}
    RevisionDiff:
      type: object
      additionalProperties: false
      required: [left_revision, right_revision, items]
      properties:
        left_revision: {type: integer, format: int64}
        right_revision: {type: integer, format: int64}
        items:
          type: array
          items: {$ref: "#/components/schemas/RevisionDiffRow"}
    RevisionDiffRow:
      type: object
      additionalProperties: false
      required: [key_id, name, classification, status, revealed]
      properties:
        key_id: {$ref: "#/components/schemas/ID"}
        name: {type: string}
        classification: {$ref: "#/components/schemas/KeyClassification"}
        status: {type: string, enum: [added, removed, edited, not_edited, changed, unchanged]}
        revealed: {type: boolean}
        before: {type: string}
        after: {type: string}

    RevisionList:
      type: object
      required: [items, count]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Revision"
        count:
          type: integer
    Revision:
      type: object
      required: [revision, schema_revision, published_by, published_at, changed_keys, payload_present]
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
        schema_revision:
          type: integer
          format: int64
        published_by:
          $ref: "#/components/schemas/ID"
        published_by_name:
          type: string
          description: Current display name of the publisher, absent if the principal no longer exists.
        published_at:
          type: string
          format: date-time
        changed_keys:
          type: array
          items:
            $ref: "#/components/schemas/ChangedKey"
        payload_present:
          type: boolean
          description: |
            Whether this revision's payload still exists. Lineage is retained
            forever; a payload collected by retention policy leaves the entry
            in the history with this bit false, and diff, restore, pin and
            reveal on it are refused loud rather than reconstructed.
        collected_policy:
          type: string
          description: |
            The retention policy stamped at collection, verbatim, and present
            only when `payload_present` is false. It is what the named refusal
            reports forever, so it is carried as an opaque string.
    RevisionDetail:
      type: object
      required: [revision, schema_revision, published_by, published_at, changed_keys, change_token, keys]
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
        schema_revision:
          type: integer
          format: int64
        published_by:
          $ref: "#/components/schemas/ID"
        published_by_name:
          type: string
          description: Current display name of the publisher, absent if the principal no longer exists.
        published_at:
          type: string
          format: date-time
        changed_keys:
          type: array
          items:
            $ref: "#/components/schemas/ChangedKey"
        change_token:
          type: string
        keys:
          type: array
          description: |
            The delivered key set of THIS revision, under the schema revision
            it pinned. Names and classifications only; values live behind the
            export verb and its formula.
          items:
            $ref: "#/components/schemas/SnapshotKey"
    SnapshotKey:
      type: object
      required: [key_id, name, classification]
      additionalProperties: false
      properties:
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
    EnvironmentSignals:
      type: object
      required: [environment_id, revision, cells]
      additionalProperties: false
      properties:
        environment_id:
          $ref: "#/components/schemas/ID"
        revision:
          type: integer
          format: int64
          description: The environment's current published revision, 0 when never materialized.
        cells:
          type: array
          items:
            $ref: "#/components/schemas/CellSignal"
    CellSignal:
      type: object
      required: [key_id, name, classification, pending_by_others]
      additionalProperties: false
      properties:
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        pending_version_id:
          $ref: "#/components/schemas/ID"
        pending_operation:
          type: string
          enum: [set, unset]
        pending_by_others:
          type: boolean
          description: |
            At least one OTHER principal holds a draft here. Write-presence and
            nothing more: no id, no owner, no operation.
        changed_in_revision:
          type: integer
          format: int64
          description: Set to the environment's LATEST revision when this cell changed in
            it, absent otherwise. This is the revision ADR's "recently
            changed" signal, which names only the last published revision --
            it is not a per-cell last-change history; older changes live in
            the revision list.
    ExportValuesRequest:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: The revision to export; omitted means the latest.
        reveal:
          type: boolean
          description: |
            Ask for `secret` plaintext. Without it a `secret` key reports
            write-presence and no value; `config` values are returned either
            way, because classification IS the sensitivity boundary.
    ExportedValues:
      type: object
      required: [revision, items, count]
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
          description: The revision actually served.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExportedValue"
        count:
          type: integer
    ExportedValue:
      type: object
      required: [name, classification, revealed]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        revealed:
          type: boolean
        value:
          type: string
          description: Present only when `revealed` is true.
    RotateDEKRequest:
      type: object
      required: [scope]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [project, instance]
          description: |
            `project` rotates one project's DEK (org and project required);
            `instance` rotates the instance DEK for rows belonging to no project.
        org:
          type: string
          description: Organisation id. Required when scope is `project`, absent otherwise.
        project:
          type: string
          description: Project id. Required when scope is `project`, absent otherwise.
    DEKRotation:
      type: object
      required: [scope, key_version]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [project, instance]
        org:
          type: string
        project:
          type: string
        key_version:
          type: integer
          format: int64
          description: The new active DEK version. Old versions remain readable until reencrypt.
    RotateRootKeyRequest:
      type: object
      required: [phase]
      additionalProperties: false
      properties:
        phase:
          type: string
          enum: [prepare, verify, finalize]
          description: |
            `prepare` seals the master under the new root; `verify` confirms the
            operator installed it at the primary source; `finalize` retires the
            old wrapper. Run in that order.
    RootKeyRotation:
      type: object
      required: [phase, root_key_epoch]
      additionalProperties: false
      properties:
        phase:
          type: string
          enum: [prepare, verify, finalize]
        root_key_epoch:
          type: integer
          format: int64
          description: The epoch this phase concerns — the new epoch for prepare/verify, the surviving epoch after finalize.
    ReencryptResult:
      type: object
      required: [scope, rows_moved]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [project, instance]
        org:
          type: string
        project:
          type: string
        rows_moved:
          type: integer
          format: int64
          description: How many ciphertext rows this run moved onto the active DEK version.
    MasterKeyRotation:
      type: object
      required: [key_version]
      additionalProperties: false
      properties:
        key_version:
          type: integer
          format: int64
          description: The new master key version. Every tier-3 key is now wrapped under it.
    TokenKeyRotation:
      type: object
      required: [token_key_version]
      additionalProperties: false
      properties:
        token_key_version:
          type: integer
          format: int64
          description: |
            The new root token key version. Operator bookkeeping only - the
            change token's public contract carries the SCHEME version, never
            the key version, because a consumer that could tell key versions
            apart could tell a rotation from a content change.
    ScanningKeyRotation:
      type: object
      required: [scanning_key_version, dismissals_dropped]
      additionalProperties: false
      properties:
        scanning_key_version:
          type: integer
          format: int64
          description: |
            The new scanning-fingerprint key version. Operator bookkeeping only;
            a fingerprint is never exported, displayed or compared.
        dismissals_dropped:
          type: integer
          format: int64
          description: |
            How many dismissal rows the rotation invalidated. Every stored
            fingerprint became unrecomputable under the new key, so all
            dismissals were dropped and their warns will re-fire.
    ValueCell:
      type: object
      description: |
        One `(key, environment)` cell.

        PRESENCE IS THE SINGLE BOOLEAN `set`. That is the whole presence
        model: there is no mode, no enum with a third member, and nothing
        named `masked` anywhere in this contract - the flat-model ADR deleted
        that state with the inheritance it existed to explain. A cell that is
        not `set` carries no value from any source.
      required: [key_id, name, classification, set, revealed]
      properties:
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        set:
          type: boolean
          description: |
            `true` is the `set` state, `false` is `absent`. Those are the only
            two states there are.
        revealed:
          type: boolean
          description: |
            Whether `value` carries plaintext. It exists so a caller can tell
            an empty value the operator actually set from a `secret` they are
            not authorized to read - two cases that would otherwise both look
            like an absent `value` member.
        value:
          type: string
          description: |
            Present only where the reader was authorized to see it: `config`
            under `read`, `secret` under `read` AND `reveal`.
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        updated_by:
          type: string
          description: The principal whose act produced this occurrence.

    ValueList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ValueCell"
        count:
          type: integer
          minimum: 0
        findings:
          type: array
          description: |
            Secret-scanning warnings the declared config values produced (#74,
            Surface 1), warn-not-block. Absent or empty when nothing matched.
          items:
            $ref: "#/components/schemas/ScanFinding"

    Acknowledgements:
      type: array
      description: |
        Secret-scanning acknowledgement tokens (#74). On a value write, a
        keep-as-config token dismisses a Surface-1 warning for exactly that
        value. On a declaration write, one override token per finding is
        re-scanned against the current content; a stale, version-skewed, or
        surplus token is rejected by name. There is no blanket ignore-all input.
      items:
        type: string

    SetValueRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          maxLength: 65536
          description: |
            The plaintext. It is validated against the key's declaration
            before it commits, and stored sealed under the project data key
            with associated data binding it to this row alone.
        acknowledgements:
          $ref: "#/components/schemas/Acknowledgements"

    DeclareValuesRequest:
      type: object
      additionalProperties: false
      required: [key, environment_ids, value]
      properties:
        key:
          $ref: "#/components/schemas/KeyName"
        environment_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ID"
        value:
          type: string
          maxLength: 65536

    CopyValuesRequest:
      type: object
      additionalProperties: false
      required: [source_environment_id, keys, destination_environment_ids]
      properties:
        source_environment_id:
          $ref: "#/components/schemas/ID"
        keys:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: |
            The keys to copy, by name. Explicit: an empty list quietly meaning
            "everything" is how a mistyped bulk apply becomes an incident, so
            it is refused instead. Naming a key twice is refused: it is one
            logical cell requested twice.
          items:
            $ref: "#/components/schemas/KeyName"
        destination_environment_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ID"
        confirm_protected:
          type: boolean
          default: false
          description: |
            The protected-environment confirmation. A protected destination
            refuses the copy without it, naming the environment.

    CopyValuesResult:
      type: object
      required: [copied]
      properties:
        copied:
          type: array
          items:
            type: object
            required: [key, destination_environment_id]
            properties:
              key:
                $ref: "#/components/schemas/KeyName"
              destination_environment_id:
                $ref: "#/components/schemas/ID"
        findings:
          type: array
          description: |
            Secret-scanning warnings the copied config values produced (#74,
            Surface 1), warn-not-block. Absent or empty when nothing matched.
          items:
            $ref: "#/components/schemas/ScanFinding"

    ValueOccurrencesRequest:
      type: object
      additionalProperties: false
      required: [candidates]
      properties:
        candidates:
          type: array
          maxItems: 5000
          uniqueItems: true
          description: |
            The candidate declarations this run intends to propose. Names the
            project already declares are answered from the catalogue; names it
            does not are answered as `declared: false` with a token binding the
            undeclared-and-absent state to the intended classification and type.
          items:
            $ref: "#/components/schemas/ValueOccurrenceCandidate"

    ValueOccurrenceCandidate:
      type: object
      additionalProperties: false
      required: [name, intended_classification, intended_type]
      properties:
        name:
          $ref: "#/components/schemas/KeyName"
        intended_classification:
          $ref: "#/components/schemas/KeyClassification"
        intended_type:
          type: string
          enum: [string, integer, boolean, enum, url, json]

    ValueOccurrence:
      type: object
      required: [name, declared, set, token]
      properties:
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        declared:
          type: boolean
          description: |
            Whether the project declares this key at all. False for a candidate
            the run proposes that does not exist yet.
        classification:
          $ref: "#/components/schemas/KeyClassification"
        declared_type:
          type: string
          description: |
            The key catalogue's canonical textual type expression: a primitive,
            or `any_of(branch|branch)`. An importer uses the full expression to
            check its effective primitive against every permitted branch.
        set:
          type: boolean
          description: |
            The whole presence model: `set` or `absent`. There is no third
            state.
        token:
          type: string
          description: |
            The server-minted OPAQUE occurrence token for this
            (key, environment). Copy it into the run manifest; never parse it.
            It is keyed and scoped, so it is meaningful only within the
            environment that produced it, and a fabricated one is exactly as
            informative as a stale one.

    ValueOccurrenceList:
      type: object
      required: [items, definitions_revision, environment_id]
      properties:
        environment_id:
          $ref: "#/components/schemas/ID"
        definitions_revision:
          type: integer
          format: int64
          description: |
            The project's key-catalogue revision as phase 1 observed it. The
            run manifest pins it, and phase 2 refuses a run whose declarations
            moved.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ValueOccurrence"

    ImportValuesRequest:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 5000
          description: |
            The values file's entries. A key named twice is refused: it is one
            logical cell requested twice.
          items:
            type: object
            additionalProperties: false
            required: [key, value]
            properties:
              key:
                $ref: "#/components/schemas/KeyName"
              value:
                type: string
                maxLength: 65536
        overwrite:
          type: array
          uniqueItems: true
          description: |
            The enumerated `set`-bucket consent. Skip-by-default otherwise.
            Naming a key this import does not carry is refused: a typo in a
            consent list is the one place a silent no-op is dangerous.
          items:
            $ref: "#/components/schemas/KeyName"
        precondition:
          $ref: "#/components/schemas/ImportPrecondition"

    ImportPrecondition:
      type: object
      additionalProperties: false
      required: [definitions_revision, environment_ids, occurrences]
      description: |
        The run manifest's expected-state half - the one declared additive
        input `values import` gained. Verified inside the import's own
        authorized transaction, after `read@project AND read@environment` is
        re-evaluated for every environment named here.
      properties:
        definitions_revision:
          type: integer
          format: int64
        environment_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ID"
        occurrences:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, environment_id, token]
            properties:
              key:
                $ref: "#/components/schemas/KeyName"
              environment_id:
                $ref: "#/components/schemas/ID"
              token:
                type: string

    ImportValuesResult:
      type: object
      required: [imported, skipped]
      properties:
        imported:
          type: array
          items:
            $ref: "#/components/schemas/KeyName"
        skipped:
          type: array
          description: |
            Keys already `set` in the target environment that no enumerated
            overwrite named. Listed by name, never silently dropped.
          items:
            $ref: "#/components/schemas/KeyName"
        findings:
          type: array
          description: |
            Secret-scanning warnings the imported config values produced (#74,
            Surface 1, surface `import_value`), warn-not-block.
          items:
            $ref: "#/components/schemas/ScanFinding"

    ValueDiff:
      type: object
      required: [items, left_environment_id, right_environment_id]
      properties:
        left_environment_id:
          $ref: "#/components/schemas/ID"
        right_environment_id:
          $ref: "#/components/schemas/ID"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ValueDiffRow"

    RevealDiffRequest:
      type: object
      additionalProperties: false
      required: [left, right]
      properties:
        left:
          $ref: "#/components/schemas/ID"
        right:
          $ref: "#/components/schemas/ID"

    ValueDiffRow:
      type: object
      required: [key_id, name, classification, left, right]
      properties:
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        left:
          $ref: "#/components/schemas/ValueCell"
        right:
          $ref: "#/components/schemas/ValueCell"
        equal:
          type: boolean
          description: |
            ABSENT where the comparison could not be made without disclosing
            something the caller may not see - both sides `set` with at least
            one unreadable. Whether two secrets match is itself material, so it
            is not answered as `false` either.

    DefinitionsBundle:
      type: object
      additionalProperties: false
      required: [format_version, environments, key_groups, keys]
      x-go-type: json.RawMessage
      properties:
        format_version: {type: integer, const: 1}
        base_revision: {type: integer, format: int64, minimum: 0}
        environments:
          type: array
          maxItems: 10000
          items: {$ref: "#/components/schemas/DefinitionsBundleEntity"}
        key_groups:
          type: array
          maxItems: 10000
          items: {$ref: "#/components/schemas/DefinitionsBundleEntity"}
        keys:
          type: array
          maxItems: 10000
          items: {$ref: "#/components/schemas/DefinitionsBundleKey"}

    DefinitionsBundleEntity:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        name: {type: string, minLength: 1, maxLength: 128}

    DefinitionsBundlePresence:
      type: object
      additionalProperties: false
      required: [mode, environments]
      properties:
        mode: {type: string, enum: [all, none, explicit]}
        environments:
          type: array
          maxItems: 50
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}

    DefinitionsBundleKey:
      type: object
      additionalProperties: false
      required: [name, folder_path, classification, description, deprecated, deprecation_note, group, declaration, required_in, forbidden_in]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        name: {$ref: "#/components/schemas/KeyName"}
        folder_path: {$ref: "#/components/schemas/KeyFolderPath"}
        classification: {$ref: "#/components/schemas/KeyClassification"}
        description: {type: string, maxLength: 4096}
        deprecated: {type: boolean}
        deprecation_note: {type: string, maxLength: 4096}
        group: {type: string, maxLength: 128}
        declaration: {$ref: "#/components/schemas/KeyDeclaration"}
        required_in: {$ref: "#/components/schemas/DefinitionsBundlePresence"}
        forbidden_in: {$ref: "#/components/schemas/DefinitionsBundlePresence"}

    DefinitionsRename:
      type: object
      additionalProperties: false
      required: [id, from, to]
      properties:
        id: {type: string}
        from: {type: string}
        to: {type: string}

    DefinitionsKindDiff:
      type: object
      additionalProperties: false
      required: [creates, updates, renames, deletes]
      properties:
        creates: {type: array, items: {type: string}}
        updates: {type: array, items: {type: string}}
        renames: {type: array, items: {$ref: "#/components/schemas/DefinitionsRename"}}
        deletes: {type: array, items: {type: string}}

    DefinitionsDiff:
      type: object
      additionalProperties: false
      required: [environments, key_groups, keys, reveal_required]
      properties:
        environments: {$ref: "#/components/schemas/DefinitionsKindDiff"}
        key_groups: {$ref: "#/components/schemas/DefinitionsKindDiff"}
        keys: {$ref: "#/components/schemas/DefinitionsKindDiff"}
        reveal_required: {type: array, items: {type: string}}

    DefinitionsCheckResult:
      type: object
      additionalProperties: false
      required: [state, current_revision, differences]
      properties:
        state: {type: string, enum: [equal, file_ahead, db_ahead, diverged]}
        base_revision: {type: integer, format: int64, minimum: 0}
        current_revision: {type: integer, format: int64, minimum: 0}
        differences: {$ref: "#/components/schemas/DefinitionsDiff"}
        findings:
          type: array
          description: |
            Non-blocking secret-scanning results (#74 SS3): the credential-shaped
            author-controlled leaves of the submitted bundle. Check is a read-only
            dry-run, so these carry no acknowledgement token and persist nothing —
            they warn an operator that a `plan` would be refused. Omitted when the
            bundle is clean.
          items: {$ref: "#/components/schemas/ScanFinding"}

    DefinitionsKeyDeletion:
      type: object
      additionalProperties: false
      required: [name, live_in]
      properties:
        name: {type: string}
        live_in: {type: array, items: {type: string}}

    DefinitionsEnvironmentDeletion:
      type: object
      additionalProperties: false
      required: [name, occurrences]
      properties:
        name: {type: string}
        occurrences: {type: integer, format: int64, minimum: 0}

    DefinitionsPlanDiff:
      type: object
      additionalProperties: false
      required: [environments, key_groups, keys, key_deletions, env_deletions, reveal_required]
      properties:
        environments: {$ref: "#/components/schemas/DefinitionsKindDiff"}
        key_groups: {$ref: "#/components/schemas/DefinitionsKindDiff"}
        keys: {$ref: "#/components/schemas/DefinitionsKindDiff"}
        key_deletions: {type: array, items: {$ref: "#/components/schemas/DefinitionsKeyDeletion"}}
        env_deletions: {type: array, items: {$ref: "#/components/schemas/DefinitionsEnvironmentDeletion"}}
        reveal_required: {type: array, items: {type: string}}

    DefinitionsPlan:
      type: object
      additionalProperties: false
      required: [id, digest, current_revision, additive, expires_at, protected_environments, diff, deletions_present, reveal_required]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        digest: {type: string, minLength: 64, maxLength: 64, pattern: "^[0-9a-f]{64}$"}
        base_revision: {type: integer, format: int64, minimum: 0}
        current_revision: {type: integer, format: int64, minimum: 0}
        additive: {type: boolean}
        expires_at: {$ref: "#/components/schemas/Timestamp"}
        protected_environments: {type: array, items: {type: string}}
        diff: {$ref: "#/components/schemas/DefinitionsPlanDiff"}
        deletions_present: {type: boolean}
        reveal_required: {type: array, items: {type: string}}

    DefinitionsPlanResponse:
      type: object
      additionalProperties: false
      required: [plan]
      properties:
        plan: {$ref: "#/components/schemas/DefinitionsPlan"}

    ApplyDefinitionsPlanRequest:
      type: object
      additionalProperties: false
      required: [allow_delete]
      properties:
        allow_delete: {type: boolean}
        digest: {type: string, maxLength: 64}
        commit: {type: string, maxLength: 256}
        ref: {type: string, maxLength: 256}
        actor: {type: string, maxLength: 256}
        acknowledgements: {$ref: "#/components/schemas/Acknowledgements"}

    ApplyDefinitionsPlanResult:
      type: object
      additionalProperties: false
      required: [revision, published, plan_id]
      properties:
        revision: {type: integer, format: int64, minimum: 0}
        published: {type: array, items: {type: string}}
        plan_id: {$ref: "#/components/schemas/ID"}

    DefinitionsLastApply:
      type: object
      additionalProperties: false
      required: [plan_id, applied_at, applied_by, revision]
      properties:
        plan_id: {$ref: "#/components/schemas/ID"}
        applied_at: {$ref: "#/components/schemas/Timestamp"}
        applied_by: {type: string}
        commit: {type: string, maxLength: 256}
        ref: {type: string, maxLength: 256}
        actor: {type: string, maxLength: 256}
        revision: {type: integer, format: int64, minimum: 0}

    DefinitionsSettings:
      type: object
      additionalProperties: false
      required: [definitions_source]
      properties:
        definitions_source: {type: string, enum: [db, git]}
        last_apply: {$ref: "#/components/schemas/DefinitionsLastApply"}

    SetDefinitionsSettingsRequest:
      type: object
      additionalProperties: false
      required: [definitions_source]
      properties:
        definitions_source: {type: string, enum: [db, git]}

    Environment:
      type: object
      description: |
        An environment carries NO `base` pointer and no defaults layer, here or
        anywhere: the flat-model ADR deleted both, and every value is explicit
        per environment.
      required: [id, org_id, project_id, name, display_order, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        org_id:
          $ref: "#/components/schemas/ID"
        project_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        display_order:
          type: integer
          minimum: 0
          description: |
            The environment's position in the project's display order. A real
            mutable property, rewritten as a whole set by
            `PUT .../environments/order`; ties break on name.
        created_at:
          $ref: "#/components/schemas/Timestamp"

    EnvironmentList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.

    EnvironmentOrderRequest:
      type: object
      additionalProperties: false
      required: [environment_ids]
      properties:
        environment_ids:
          type: array
          description: |
            Every environment in the project, exactly once, in the order they
            should display. The whole set — not a subset — so no transaction can
            leave two environments sharing a position.
          # A project with no environments has the empty list as its exact
          # whole set, so `[]` is a legal no-op rather than a schema error —
          # the service accepts it and the schema must agree, or the two layers
          # disagree about what "the whole set" means.
          minItems: 0
          # The upper bound IS the environment-count cap: a project cannot hold
          # more environments than this, so it cannot legitimately order more.
          maxItems: 50
          items:
            $ref: "#/components/schemas/ID"

    FolderPath:
      type: string
      description: |
        A slash-separated namespace: no leading or trailing separator, no empty
        segment, no `.` or `..` segment, at most 32 segments. Organizational
        only — no grant is scoped to a folder and no value attaches to one.

        **Two bounds the schema cannot express, both server-authoritative and
        both measured in UTF-8 BYTES:** the whole path is at most 256 bytes
        (`maxLength` below counts code points), and EACH SEGMENT is at most 128
        bytes — the same bound entity names carry. A 129-character ASCII segment
        satisfies this schema and is refused with `bad_request`.
      minLength: 1
      maxLength: 256

    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          $ref: "#/components/schemas/FolderPath"
        acknowledgements:
          $ref: "#/components/schemas/Acknowledgements"

    RenameFolderRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          $ref: "#/components/schemas/FolderPath"
        acknowledgements:
          $ref: "#/components/schemas/Acknowledgements"

    Folder:
      type: object
      required: [id, org_id, project_id, path, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        org_id:
          $ref: "#/components/schemas/ID"
        project_id:
          $ref: "#/components/schemas/ID"
        path:
          $ref: "#/components/schemas/FolderPath"
        created_at:
          $ref: "#/components/schemas/Timestamp"

    FolderList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.

    ServiceAccountKind:
      type: string
      description: |
        The closed set a service account may be created with. Declared at
        creation and IMMUTABLE afterwards.
      enum: [workload, automation]

    CredentialKind:
      type: string
      description: |
        How a credential authenticates its service account. The discriminator
        exists before a second kind does, so adding one is a new row type
        rather than a schema change.
      enum: [hikyo-token, oidc-federation]

    CredentialLifetime:
      type: string
      description: |
        `indefinite` is a VALUE, not a large number: it is unreachable by
        raising the instance ceiling, and is admitted only under a separate,
        default-off instance opt-in.
      enum: [finite, indefinite]

    CreateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          $ref: "#/components/schemas/ServiceAccountKind"

    ServiceAccount:
      type: object
      additionalProperties: false
      required: [id, principal_id, name, kind, created_at, created_by, live_credentials]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        principal_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          maxLength: 64
        kind:
          $ref: "#/components/schemas/ServiceAccountKind"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        created_by:
          $ref: "#/components/schemas/ID"
        live_credentials:
          type: integer
          minimum: 0
          description: How many of its credentials currently authenticate.

    ServiceAccountList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAccount"
        count:
          type: integer
          minimum: 0

    MachineCredential:
      type: object
      additionalProperties: false
      required: [id, kind, lifetime, created_at, created_by, expiring_soon]
      description: |
        Metadata only. There is deliberately no value property: a credential
        value is displayed exactly once, at mint, and is never retrievable
        afterwards.

        A row of kind `oidc-federation` carries no `prefix_hint` — a binding has
        no minted value to hint at — and carries the binding members instead.
      properties:
        id:
          $ref: "#/components/schemas/ID"
        kind:
          $ref: "#/components/schemas/CredentialKind"
        prefix_hint:
          type: string
          maxLength: 32
          description: |
            The non-secret leading slice of the minted value - the grammar
            prefix plus a few body characters, enough to tell two live
            credentials apart and far short of anything a search can narrow.
            Absent for an `oidc-federation` row.
        issuer:
          type: string
          maxLength: 512
          description: "`oidc-federation` only: the byte-exact issuer this binding trusts."
        subject:
          type: string
          maxLength: 512
          description: "`oidc-federation` only: the byte-exact `sub` it names."
        audience:
          type: string
          maxLength: 512
          description: "`oidc-federation` only: the audience it accepts, never the issuer's default."
        required_claims:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/FederatedClaimPin"
          description: "`oidc-federation` only: every pinned claim, all of which validation requires."
        reactivated_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: |
            `oidc-federation` only, and null unless this binding has been through
            a restore. When set, the binding permanently refuses any token whose
            `iat` is not strictly after this instant plus the maximum accepted
            positive clock skew.
        lifetime:
          $ref: "#/components/schemas/CredentialLifetime"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        created_by:
          $ref: "#/components/schemas/ID"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/Timestamp"
        expiring_soon:
          type: boolean
          description: |
            The in-product expiry warning, computed rather than stored - a
            stored flag would be stale the moment the clock moved past it.

    MachineCredentialList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MachineCredential"
        count:
          type: integer
          minimum: 0

    MintCredentialRequest:
      type: object
      additionalProperties: false
      description: |
        The zero request asks for the finite default, which is the rule that
        the easy path is bounded and a long-lived credential is a typed choice
        someone made.
      properties:
        indefinite:
          type: boolean
          description: |
            Selects the distinct typed lifetime. A separate property rather
            than a sentinel duration, because `indefinite` must be
            unreachable by raising any ceiling. Naming it together with
            `lifetime_seconds` is refused rather than resolved by precedence:
            a silent precedence rule on a credential is exactly the quiet
            ambiguity fail-loud exists to prevent.
        lifetime_seconds:
          type: integer
          minimum: 1
          description: Requested finite lifetime; absent means the instance default.

    MintCredentialResult:
      type: object
      additionalProperties: false
      required: [value, credential, clamped, expires_at]
      properties:
        value:
          type: string
          description: |
            The credential value, returned EXACTLY ONCE to exactly one caller.
            No other route in this contract returns it.
        credential:
          $ref: "#/components/schemas/MachineCredential"
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Effective expiry; null means explicitly indefinite.
        clamped:
          type: boolean
          description: |
            True when the instance ceiling shortened what was asked for, so
            the caller can say so rather than let the operator discover it
            when the credential dies early.

    IssuerType:
      type: string
      description: |
        The federation issuer's platform. It is DECLARED rather than inferred
        from the issuer URL, because the per-platform binding rules differ — a
        Forgejo or GitHub Actions binding MUST pin `event_name`, a Kubernetes one
        has no such claim — and inferring the type from a URL would let renaming
        a deployment change the security rules that apply to it.
      enum: [kubernetes, forgejo, github-actions]
      x-enum-varnames: [IssuerTypeKubernetes, IssuerTypeForgejo, IssuerTypeGithubActions]

    JWKSMode:
      type: string
      description: |
        Where the issuer's signing keys come from. `discovery` is the default:
        keys are fetched and cached with a bounded staleness window. `static` is
        the configured alternative for air-gapped installations and for
        deployments whose issuer discovery endpoint this instance cannot reach —
        deliberately not the default, because a static-only installation breaks
        silently on the day someone rotates the issuer's keys.
      enum: [discovery, static]

    FederationIssuer:
      type: object
      additionalProperties: false
      required:
        [id, issuer, issuer_type, jwks_mode, refused_audiences, created_at, created_by, live_bindings]
      description: |
        One instance-scoped issuer configuration. There is deliberately no
        `static_jwks` property on the READ shape: the document is configuration
        an operator supplied and can re-supply, nothing needs it back, and a read
        surface that returned it would carry a key document for no reason.
      properties:
        id:
          $ref: "#/components/schemas/ID"
        issuer:
          type: string
          maxLength: 512
          description: |
            The byte-exact `iss`. Nothing folds case, resolves the URL or strips
            a trailing slash: OpenID Connect defines `iss` as case-sensitive, so
            any normalization could merge two distinct external issuers into one
            configuration.
        issuer_type:
          $ref: "#/components/schemas/IssuerType"
        jwks_mode:
          $ref: "#/components/schemas/JWKSMode"
        refused_audiences:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            maxLength: 512
          description: |
            The issuer's DEFAULT audiences, which no binding may name and which
            no token may carry. At least one is required: a Kubernetes API-server
            audience is whatever that cluster was configured with and is not
            derivable, so an empty list would silently accept the audience that
            must be refused.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        created_by:
          $ref: "#/components/schemas/ID"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        updated_by:
          $ref: "#/components/schemas/ID"
        live_bindings:
          type: integer
          minimum: 0
          description: |
            How many bindings name this issuer, LIVE OR HISTORICAL, so an operator
            sees the blast radius before attempting a delete — which is refused
            while any remain. Revoked bindings count: erasing the issuer a past
            binding trusted erases what it trusted, and the foreign key would
            refuse the delete anyway with a driver message instead of a reason.

    FederationIssuerList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FederationIssuer"
        count:
          type: integer
          minimum: 0

    CreateFederationIssuerRequest:
      type: object
      additionalProperties: false
      required: [issuer, issuer_type, jwks_mode, refused_audiences]
      properties:
        issuer:
          type: string
          minLength: 9
          maxLength: 512
          description: |
            The byte-exact `iss`, `https://` only. Discovery and JWKS are fetched
            from this URL, so an `http` issuer would rest the instance's whole
            federation trust on whoever holds the network path.
        issuer_type:
          $ref: "#/components/schemas/IssuerType"
        jwks_mode:
          $ref: "#/components/schemas/JWKSMode"
        static_jwks:
          type: string
          maxLength: 1048576
          description: |
            The JWKS document, required under `static` mode and refused under
            `discovery`. The pairing is total: a document stored but unused is a
            key set nobody rotates.
        refused_audiences:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            maxLength: 512

    UpdateFederationIssuerRequest:
      type: object
      additionalProperties: false
      required: [jwks_mode, refused_audiences]
      description: |
        The MUTABLE half only. `issuer` and `issuer_type` are absent on purpose:
        changing either would silently re-point every binding underneath at a
        different external authority, which is a replacement, not an edit.
      properties:
        jwks_mode:
          $ref: "#/components/schemas/JWKSMode"
        static_jwks:
          type: string
          maxLength: 1048576
        refused_audiences:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            maxLength: 512

    FederatedClaimPin:
      type: object
      additionalProperties: false
      required: [claim]
      description: |
        One pinned claim, as a DISCRIMINATED scalar rather than a free-form JSON
        value. Exactly one of `string_value`, `number_value` or `bool_value` is
        set, and that is what makes "a string is never folded to a number" true
        at the wire boundary rather than only inside the validator:
        `repository_id: 123` and `repository_id: "123"` are two different
        requests that cannot be mistaken for one another, and a 64-bit repository
        id survives without passing through a float.

        A pin naming none or several values is refused rather than resolved by
        precedence.
      properties:
        claim:
          type: string
          minLength: 1
          maxLength: 128
        string_value:
          type: string
          maxLength: 512
        number_value:
          type: integer
          format: int64
        bool_value:
          type: boolean

    CreateBindingRequest:
      type: object
      additionalProperties: false
      required: [issuer, subject, audience, required_claims]
      description: |
        A binding names exactly one service account, matched byte-for-byte on
        `(issuer, subject)`. There are no wildcards, no namespace patterns, no
        path prefixes, no case folding and no automatic provisioning: a pattern rule
        such as "any ServiceAccount in namespace prod" would hand a Hikyo
        principal to anyone holding `create serviceaccount` in that namespace, a
        far wider group than cluster-admin.
      properties:
        issuer:
          type: string
          maxLength: 512
          description: The byte-exact `iss` of a configured issuer.
        subject:
          type: string
          minLength: 1
          maxLength: 512
        audience:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            Mandatory, and may not be the issuer's default. A Kubernetes token
            minted for the default API-server audience would otherwise
            authenticate here, and a Forgejo Actions audience defaults to
            `<instance>/<owner>`, shared across every repository that owner has.
        required_claims:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/FederatedClaimPin"
          description: |
            Every pinned claim, all of which validation requires. A Forgejo or
            GitHub Actions binding MUST pin `event_name`: `pull_request_target`
            carries the ordinary ref-form subject — the default branch's subject,
            the one a production binding names — so the protection comes from the
            pinned event, never from the subject's shape.
        indefinite:
          type: boolean
        lifetime_seconds:
          type: integer
          minimum: 1
        replaces:
          allOf:
            - $ref: "#/components/schemas/ID"
          description: |
            The binding this one supersedes. Bindings are IMMUTABLE, so every
            change is a replacement mint carrying the full formula: the
            predecessor is revoked and the successor inserted in one transaction.

    FederatedBinding:
      type: object
      additionalProperties: false
      required: [credential, issuer_id, clamped]
      properties:
        credential:
          $ref: "#/components/schemas/MachineCredential"
        issuer_id:
          $ref: "#/components/schemas/ID"
        clamped:
          type: boolean
          description: True when the instance ceiling shortened the requested lifetime.
        replaced_id:
          allOf:
            - $ref: "#/components/schemas/ID"
          description: The predecessor this mint revoked, absent for a first issue.

    DeliveredKey:
      type: object
      additionalProperties: false
      required: [key_id, name, classification, presence]
      description: |
        One key as the machine surface delivers it. `value` is present IFF the
        plaintext was actually delivered to this caller; its absence means
        presence-only — the key exists and the snapshot delivers it, but this
        caller was not authorized to receive the plaintext (a `secret` key
        without `reveal`), so no plaintext crossed. Whether a value crosses is
        decided server-side per key: `config` under `read`, `secret` under
        `read ∧ reveal` (or `read ∧ reveal-history` for a pinned non-current
        revision).
      properties:
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          maxLength: 256
        classification:
          $ref: "#/components/schemas/KeyClassification"
        value:
          type: string
          maxLength: 65536
          description: |
            The delivered plaintext. Present ONLY when the caller was
            authorized to receive it (see the schema description); absent for a
            presence-only key. The maxLength matches the value-write bound.
        presence:
          type: string
          enum: [required, forbidden, optional, set]
          description: |
            What the fetch reports about this key in the addressed
            environment. `set` is a key the committed snapshot actually
            delivers (#51 -- values landed, and the change token moves with
            them); the other three are the declared presence rules for keys
            the snapshot does not carry.

    DeliveryResponse:
      type: object
      additionalProperties: false
      required: [current, cursor, change_token, schema_revision, keys, pin_expired, issued_at, snapshot_expires_at, credential_id]
      description: |
        Either the authorized projection, or the statement that the presented
        cursor is current — in which case `keys` is empty and NOTHING was
        disclosed. Only a fetch that actually delivers values is a disclosure.
      properties:
        credential_id:
          allOf:
            - $ref: "#/components/schemas/ID"
          description: |
            The authenticated caller's credential identifier, returned on both
            dispositions so clients can bind snapshots and offline records to
            the server-asserted identity rather than infer it locally.
        current:
          type: boolean
          description: |
            True when the presented cursor named the state the server was about
            to serve.
        cursor:
          type: string
          maxLength: 128
          description: |
            The opaque cursor for the state this answer describes, returned on
            BOTH dispositions so a caller told "current" can keep polling without
            re-fetching to learn its own cursor.

            It is bound to the change token, the caller's authorized delivery
            projection, the principal's authorization revision, the pin
            generation, and the projection mode — never to content alone. Any
            authorization or projection movement therefore invalidates it and
            produces a full authorized delivery rather than a "current" answer.
        change_token:
          type: string
          maxLength: 128
          description: |
            The keyed delivery-manifest token, `v1:`-prefixed. It is
            change-detection material ONLY — the conditional-fetch cursor's
            input — and is never itself a workload-visible value (k8s ADR §
            Declared amendment): what reaches a pod annotation is the
            consumer's client-side per-target keyed stamp, not this token.
            Keyed rather than a content digest, so it is unforgeable and
            un-invertible without the server key and may flow into logs and
            change-detection caches as ordinary non-secret metadata.
        credential_expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: |
            The presenting credential's expiry when it is finite — a bearer
            credential's `expires_at`, a federated binding's expiry. ABSENT for
            an indefinite credential. The operator surfaces it as the ADR's
            ahead-of-time expiry condition and event.
        schema_revision:
          type: integer
          minimum: 0
          description: The project's monotonic key-catalogue revision.
        pinned_revision:
          type: integer
          format: int64
          minimum: 1
          description: Present when a durable workload pin selected the snapshot.
        pin_expired:
          type: boolean
          description: Loud status; expiry never silently changes delivery.
        keys:
          type: array
          items:
            $ref: "#/components/schemas/DeliveredKey"
          description: Empty when `current` is true.
        issued_at:
          $ref: "#/components/schemas/Timestamp"
        snapshot_expires_at:
          $ref: "#/components/schemas/Timestamp"

    OfflineDeliveryRecord:
      type: object
      additionalProperties: false
      required: [record_id, key_id, key_name, classification, occurred_at, credential_id, generation, served_from]
      properties:
        record_id:
