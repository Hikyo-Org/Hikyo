  /api/v1/orgs/{org}/projects/{project}/events:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: watchProjectEvents
      tags: [revisions]
      summary: The advisory live-update stream (SSE).
      description: |
        Server-sent events, metadata only. An event says that something
        changed - an environment advanced (`revision.published`), a principal
        staged a draft (`pending.staged`), a published cell moved
        (`cell.changed`) - and never what it changed to. It carries no value
        in any form and NO CHANGE TOKEN.

        `cell.changed` claims exactly what the publish knew: that cell
        advanced. A subscriber holding a draft on the named cell derives "my
        draft is stale" from its own draft plus this event; the server never
        asserts staleness it did not check.

        Every event is authorized against the environment it names, at emit
        time, so a grant revoked mid-session takes effect on the NEXT event
        rather than at the next reconnect. Events referencing objects the
        recipient may not see are dropped, and an event reduced to nothing is
        not sent.

        ADVISORY ONLY: correctness never depends on delivery. `Last-Event-ID`
        replays nothing; a reconnecting client refetches current state from the
        signals endpoint, which is the documented polling fallback. A client
        that cannot keep up is disconnected rather than buffered. Connection
        admission is bounded per principal, per organization, and instance-wide;
        a refusal is 429. Accepted streams begin with a jittered `retry:` hint.
      x-hikyo-class: tenant
      x-hikyo-operation: advisory.watch
      x-hikyo-formula: [read@project]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/orgs/{org}/audit:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: queryOrgAudit
      tags: [audit]
      summary: One bounded page of the organization's audit trail.
      description: |
        Reads one bounded page of the append-only trail in stable
        commit-sequence order, oldest first. Filtering by principal,
        operation, outcome and resource identifiers is applied to the page
        after it is read, so a page SCANS `limit` rows and RETURNS the subset
        that matched: `next_after_seq` is the seq of the last row scanned (the
        resume cursor), and `exhausted` is true only when the scan reached the
        end of the trail. A sparse filter therefore returns few or zero items
        with `exhausted` false — that means keep paging, not "no such events".

        Reading the trail is itself audited, unconditionally: each page commits
        one `audit.query` event recording the normalized filter and the count
        returned, durably, in the same transaction as the read. No value
        material is ever in the trail, so none can be in this response.
      x-hikyo-class: tenant
      x-hikyo-operation: audit.query-org
      x-hikyo-formula: [audit-read@org]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditAfterSeq"
        - $ref: "#/components/parameters/AuditToSeq"
        - $ref: "#/components/parameters/AuditLimit"
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditOperation"
        - $ref: "#/components/parameters/AuditOutcome"
        - $ref: "#/components/parameters/AuditObjectType"
        - $ref: "#/components/parameters/AuditObjectID"
        - $ref: "#/components/parameters/AuditCorrelationID"
      responses:
        "200":
          description: One page of trail events.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/Internal"}

  /api/v1/orgs/{org}/audit/export:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: exportOrgAudit
      tags: [audit]
      summary: Stream the organization's audit trail as JSONL.
      description: |
        Streams the filtered slice of the trail as newline-delimited JSON, one
        schema-versioned event per line, in gap-free commit-sequence order up
        to a server-fixed snapshot taken before the first byte. The stream is
        bounded on both ends: the server reads the trail one bounded page at a
        time under a freshly minted proof, and the client writes bytes to disk
        as they arrive rather than accumulating the history in memory.

        The export is itself an audited act: an `audit.export_started` INTENT
        event is durable before the first byte and an `audit.export_completed`
        OUTCOME event terminates the stream on success, page failure or client
        disconnect. Authorization lost mid-stream stops it at the next page
        boundary — a truncated download whose cause is durable in the trail. No
        value material is ever in the trail, so none can be in the stream.
      x-hikyo-class: tenant
      x-hikyo-operation: audit.export-org
      x-hikyo-formula: [audit-read@org]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditOperation"
        - $ref: "#/components/parameters/AuditOutcome"
        - $ref: "#/components/parameters/AuditObjectType"
        - $ref: "#/components/parameters/AuditObjectID"
        - $ref: "#/components/parameters/AuditCorrelationID"
      responses:
        "200":
          description: The trail as a JSONL byte stream.
          content:
            application/x-ndjson:
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/Internal"}

  /api/v1/orgs/{org}/projects/{project}/audit:
