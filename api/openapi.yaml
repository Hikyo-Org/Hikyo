      properties:
        revision: {type: integer, format: int64, minimum: 1}
        expected_generation: {type: integer, format: int64, minimum: 0}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
        schema_version: {type: integer, minimum: 1}
        confirm_restored_credentials: {type: boolean, description: Required true only when clearing the restore fence after reviewing credentials and reconciling access grants.}
    InstanceConfigMailTestRequest:
      type: object
      additionalProperties: false
      required: [revision, expected_generation, schema_version, to]
      properties:
        revision: {type: integer, format: int64, minimum: 1}
        expected_generation: {type: integer, format: int64, minimum: 0}
        schema_version: {type: integer, minimum: 1}
        to: {type: string, format: email}
    InstanceConfigMailTestResult:
      type: object
      additionalProperties: false
      required: [revision, sent]
