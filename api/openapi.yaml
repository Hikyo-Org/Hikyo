        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/rotate-master-key:
    post:
      operationId: rotateMasterKey
      tags: [instance]
      summary: Generate a new master key and re-wrap every tier-3 key under it.
      description: |
        Generates a new master key, re-wraps every tier-3 key (all project DEKs,
        the instance DEK, the root token key) under it, and retires the old
        master after a fenced zero-reference check. Bounded by the number of
        projects, so seconds.

        Step 2 of the post-compromise recovery order: an attacker who held
        process memory holds the master, so every DEK must be re-wrapped under a
        master they never saw. Refused while the root is dual-wrapped — finalize
        the root rotation first.
      x-hikyo-class: instance
      x-hikyo-operation: crypto.rotate-master-key
      x-hikyo-formula: [rotate-master-key@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: The rotation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterKeyRotation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/rotate-root-key:
    post:
      operationId: rotateRootKey
      tags: [instance]
      summary: Run one phase of the crash-safe root-key rotation.
      description: |
        Replaces the operator-held root through a three-phase protocol over a
        dual-wrapped master. NO key material crosses the wire: `prepare` reads
        the NEW root from the server-side source (HIKYO_NEW_ROOT_KEY_FILE) and
        seals a second master wrapper; the operator then installs the new root
        at the PRIMARY source; `verify` re-reads the primary source and confirms
        it now unwraps the new wrapper; `finalize` retires the old wrapper.

        A crash at any point leaves the instance bootable under either root, and
        every start warns until finalize. This is the rotation operators need
        after an env-file leak — it re-wraps the master only, touching no data.
      x-hikyo-class: instance
      x-hikyo-operation: crypto.rotate-root-key
      x-hikyo-formula: [rotate-root-key@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateRootKeyRequest"
      responses:
        "200":
          description: The phase result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootKeyRotation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

