      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"
      - $ref: "#/components/parameters/LeaseID"
    post:
      operationId: renewLease
      tags: [dynamic]
      summary: Extend a lease's validity, bounded by its maximum TTL.
      x-hikyo-class: tenant
      x-hikyo-operation: lease.renew
      x-hikyo-formula: [read@environment]
