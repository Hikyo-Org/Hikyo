          description: The server-minted SCIM group id the row names.
          schema:
            $ref: "#/components/schemas/ID"
        - name: project
          in: query
          required: false
          description: The row's project scope, absent for an org-scoped row.
          schema:
            $ref: "#/components/schemas/ID"
        - name: environment
          in: query
          required: false
          description: The row's environment scope.
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: The deleted row and the origin count it released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimMappingResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

