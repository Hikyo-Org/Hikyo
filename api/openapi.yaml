      summary: Fetch the authorized projection, conditionally.
      description: |
        The machine fetch surface. Presenting a current cursor answers
        `current: true` with NO content and no key names — only a fetch that
        actually delivers values is a disclosure — and either disposition emits
        exactly one immutable access record, plus one immutable disclosure
        record per delivered value.

        Authorization is evaluated on the conditional path EXACTLY as on the
        delivering path, so a caller who has lost `read` receives the uniform
        nonexistent response rather than "current".

        What a key delivers is decided server-side, per key, in-transaction: a
        `config` key carries its plaintext under `read`; a `secret` key carries
        its plaintext under `read ∧ reveal` (or `read ∧ reveal-history` for a
        pinned non-current revision), and otherwise arrives presence-only with
        no value. This is the surface the Compose and Kubernetes integrations
        consume to converge their delivery targets.

        Both a `hik_` bearer credential and an externally issued OIDC ID token
        authenticate here, with identical authority: a machine principal's
        authority is the union of the grants on its service account and nothing
        else, so there is no per-credential scope for either kind to widen.
        Human sessions are refused at artifact admission with the uniform
        nonexistent response.
      x-hikyo-class: tenant
      x-hikyo-operation: delivery.fetch
      x-hikyo-formula: [read@environment]
      x-hikyo-artifacts: [machine-credential]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: The authorized projection, or the statement that the cursor is current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/orgs/{org}/projects/{project}/environments/{environment}/delivery/offline-records:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"
    post:
      operationId: reconcileOfflineRecords
      tags: [delivery]
      summary: Reconcile client-durable offline disclosure records.
      description: |
        Accepts records fsynced by a client before offline plaintext release.
        Idempotency is scoped to the presenting principal and record id. A live
        credential may reconcile records served by a credential since revoked.
      x-hikyo-class: tenant
      x-hikyo-operation: delivery.reconcile-offline
      x-hikyo-formula: [read@environment]
      x-hikyo-artifacts: [machine-credential]
      x-hikyo-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileOfflineRecordsRequest"
      responses:
        "200":
          description: The idempotent batch outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileOfflineRecordsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  # ---------------------------------------------------------------------------
  # SCIM administration (#73, scim-provisioning ADR §8; spellings §1).
  #
  # Domain surface with full UI<->CLI parity: binding CRUD, mapping-table
  # administration, credential lifecycle, and the provisioned directory views.
  # Every operation is `manage-members` held at ORG SCOPE EXACTLY — a mapping
  # row causes grants its author need not hold, and unheld-capability granting
  # is an org/instance power, so a project-scope member manager must not reach
  # it through SCIM. The atom is MFA-mandatory, so every route declares 403.
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{org}/scim-bindings:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listScimBindings
      tags: [scim]
      summary: List this organisation's SCIM bindings.
      description: |
        Each binding with its attention states — the org admin's answer to
        "what does SCIM think is wrong?". Provider availability and staleness
        are reconciled on read, in both directions, so the view is current
        rather than as of the last write.
      x-hikyo-class: tenant
      x-hikyo-operation: scim-binding.list
      x-hikyo-formula: [manage-members@org]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: The organisation's bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimBindingList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createScimBinding
      tags: [scim]
      summary: Create the organisation's SCIM binding for one identity provider.
      description: |
        At most one binding per (organisation, provider): the concurrent-create
        race resolves to one row and the loser is refused with `conflict`. The
        subject source and the NameID profile are immutable after creation, and
        the provider reference is read-only — creating a binding grants no
        authority over the provider it names. Creating the binding also creates
        its provisioning connection and that connection's structural
        `scim-provision` grant, atomically.
      x-hikyo-class: tenant
      x-hikyo-operation: scim-binding.create
      x-hikyo-formula: [manage-members@org]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScimBindingRequest"
      responses:
        "200":
          description: The created binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimBinding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/orgs/{org}/scim-bindings/{binding}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ScimBindingID"
    get:
      operationId: getScimBinding
      tags: [scim]
      summary: Read one SCIM binding and its attention states.
      description: |
        Deliberately keeps working while the referenced provider is disabled or
        removed: the whole wire surface fails closed in that state, and "state
        is preserved for repair" is not preserved by a surface that refuses to
        show the state.
      x-hikyo-class: tenant
      x-hikyo-operation: scim-binding.get
      x-hikyo-formula: [manage-members@org]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: The binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimBinding"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteScimBinding
      tags: [scim]
      summary: Delete a SCIM binding, running its atomic teardown.
      description: |
        One transaction, in order: every credential is revoked so no new wire
        transaction can begin; every `scim` origin the binding holds is
        released (lockout conversion included, and any resulting retention
        origins survive the binding); the provisioning connection and its
        structural grant are retired; the directory, mapping table and binding
        row go. Identity links and accounts SURVIVE — they are account
        property, exactly as they would be had the user been invited.
      x-hikyo-class: tenant
      x-hikyo-operation: scim-binding.delete
      x-hikyo-formula: [manage-members@org]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "204":
          description: The binding and everything it owned are gone.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/orgs/{org}/scim-bindings/{binding}/mappings:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ScimBindingID"
    get:
      operationId: listScimMappings
      tags: [scim]
      summary: List the binding's group-to-template mapping table.
      description: |
        Each row with the capabilities it expands into, so a reader does not
        have to know the template table by heart, and with its `inert` flag —
        a row whose group was deleted at the identity provider grants nothing
        until a human edits or deletes it.
      x-hikyo-class: tenant
      x-hikyo-operation: scim-mapping.list
      x-hikyo-formula: [manage-members@org]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: The mapping table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimMappingList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createScimMapping
      tags: [scim]
      summary: Add a mapping row, granting the group's current members immediately.
      description: |
        The blast-radius moment. The locked rule demands the org-scope warning
        "at grant time", when a human is present — under SCIM no human attends
        the sync, so the consequence language is returned HERE, in the same
        transaction that creates the origins for every member the group already
        has. There is no "waits for the next push" gap, and the `warnings`
        array is part of the response rather than an optional decoration.
      x-hikyo-class: tenant
      x-hikyo-operation: scim-mapping.create
      x-hikyo-formula: [manage-members@org]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScimMappingRequest"
      responses:
        "200":
          description: The row, its consequence language, and what it granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimMappingResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      operationId: updateScimMapping
      tags: [scim]
      summary: Retarget an addressed mapping row's template.
      description: |
        The row is addressed by (group, scope) and keeps its id, which is what
        makes narrowing precise: origins key on the row, so a delete-and-
        recreate would release every origin it holds and immediately recreate
        most of them — momentarily revoking capabilities that never stopped
        being granted. Widening creates the newly covered origins now;
        narrowing releases the no-longer-covered part in this same transaction,
        with no round-trip to the identity provider.
      x-hikyo-class: tenant
      x-hikyo-operation: scim-mapping.update
      x-hikyo-formula: [manage-members@org]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScimMappingRequest"
      responses:
        "200":
          description: The row, its consequence language, and what it changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimMappingResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteScimMapping
      tags: [scim]
      summary: Delete an addressed mapping row and release every origin it holds.
      description: |
        Reconciles in this transaction, with no round-trip to the identity
        provider: the org administrator is never stuck behind an IdP they do
        not control. The row is addressed by query parameters because the
        triple is an address, and query parameters are the shape every
        intermediary handles the same way.
      x-hikyo-class: tenant
      x-hikyo-operation: scim-mapping.delete
      x-hikyo-formula: [manage-members@org]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      parameters:
