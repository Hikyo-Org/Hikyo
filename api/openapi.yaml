        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/orgs/{org}/projects/{project}/environments/{environment}/values/import:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"
    post:
      operationId: importValues
      tags: [values]
      summary: Import phase 2 - a strict, human-only batch value write.
      description: |
        Consumes one environment's values file. Strict closed schema: an
        undeclared key rejects the run BY NAME rather than being created, and
        the whole run is one transaction.

        Collisions bucket on the target environment's state. A key already
        `set` is SKIPPED BY DEFAULT and listed by name; `overwrite` is an
        enumerated opt-in list, never a blanket flag. Skip-by-default is what
        makes a re-run naturally idempotent.

        `precondition` is the one declared additive input, consumed from an
        import run manifest. When present, the server re-evaluates phase 1's
        read formula - `read@project AND read@environment` for every environment
        the manifest names - inside this same transaction and ON TOP of this
        verb's own formula, and only then compares the definitions revision and
        each written key's occurrence token. A caller lacking either read atom receives the plain
        authorization failure and no precondition result: the precondition is
        not an oracle. Any movement rejects those keys by name and writes
        nothing.

        Human-only, per the locked human-only verb list.
      x-hikyo-class: tenant
      x-hikyo-operation: value.import
      x-hikyo-formula: [read@project, edit@environment, publish@environment]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportValuesRequest"
      responses:
