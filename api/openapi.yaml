  /api/v1/orgs/{org}/projects/{project}/environments/{environment}/publish:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"
    post:
      operationId: publishPendingChanges
      tags: [revisions]
      summary: Publish a selection of your own pending changes.
      description: |
        SELECTIVE. The body names version ids, and only those - plus whatever
        key-group closure pulls in - are committed. Every other pending change,
        the caller's own unselected ones and every other principal's, is
        invisible to the computation, so the materialized snapshot always
        corresponds to a state the publisher previewed.

        A publish carries ONLY the caller's own pending changes. There is no
        cross-user hand-off of staged work: a key group whose members carry a
        pending change owned by another principal is refused, loud, naming the
        group and the key, never silently split.

        The whole operation is one serializable transaction holding the
        per-project lock. A version whose published cell has moved since it was
        staged is refused loud rather than rebased, and a `required_in` key
        left absent vetoes the publish naming key and environment.

        Publishing a version whose environment differs from the addressed one
        is permitted and each such environment is authorized for `publish`
        separately, immediately before commit.

        Every protected environment reached requires its bound publish
        confirmation. Machine callers name the exact protected set they
        reviewed; human callers consume the bound ceremony. A selection containing restore-authored drafts also
        requires the preview token returned by rollback; schema, published
        state, authorization, selection, or key-group closure drift invalidates
        that token and requires a fresh rollback preview.
      x-hikyo-class: tenant
      x-hikyo-operation: value.publish
      x-hikyo-formula: [publish@environment]
      x-hikyo-dynamic-formula: [publish@each-affected-environment, protected-confirmation@exact-reviewed-protected-set]
      x-hikyo-artifacts: [human-session, machine-credential]
      x-hikyo-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "200":
          description: What committed, and which environments advanced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResult"
        "202":
          description: |
            Secret-change approvals (#151): the environment is covered by an
            approval policy and no completed approval was presented, so a
            request was staged for review instead of a revision published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequestSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

