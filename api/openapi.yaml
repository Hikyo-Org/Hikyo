      - $ref: "#/components/parameters/ProjectID"
    post:
      operationId: reencryptProject
      tags: [instance]
      summary: Walk a project's ciphertext onto the active DEK version.
      description: |
        Moves every ciphertext in the project (values, drafts, snapshot payloads,
