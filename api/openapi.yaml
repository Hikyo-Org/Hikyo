  /api/v1/orgs/{org}/projects/{project}/environments/{environment}/values/occurrences:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"
    post:
      operationId: listValueOccurrences
      tags: [values]
      summary: Import phase 1 - declared keys, presence, and occurrence tokens.
      description: |
        The ONLY server contact an `import` phase 1 makes. It returns, for one
        environment: the project's definitions revision, and per key its
        classification, its declared type, whether it is `set` or `absent`, and
        a SERVER-MINTED OPAQUE OCCURRENCE TOKEN naming the exact resolved state
        observed.

        It is a POST because it carries a body, not because it acts:
        `candidates` names the keys and exact declarations the run intends to
        propose. Every one of them
        gets a token, INCLUDING names the project does not declare yet - those
        are exactly the keys an import is about to create, and a manifest row
        without a server-minted token is the one row an edited manifest could
        forge freely. An undeclared candidate answers `declared: false`, `set:
        false` and a token naming that state.

        The token is what binds phase 1 to phase 2. A bucket label cannot do
        the job: `set` to `set` with a changed value preserves the bucket, so a
        bucket-checked "reviewed overwrite" would still clobber the newer
        value. The token is computed over the value row id, which is minted per
        write and never reused, so an edit advances it and the match fails.

        It is opaque by construction: there is nothing inside it to parse, and
        a caller cannot construct one for a state they have not been served. An
        unrecognized token is exactly as informative as a stale one.

        It never requires `reveal`, never compares values and never writes.
        Human-only: `import` joins the human-only verb list.
      x-hikyo-class: tenant
      x-hikyo-operation: import.presence
      x-hikyo-formula: [read@project]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      requestBody:
        required: true
        content:
