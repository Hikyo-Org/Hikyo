  /api/v1/instance/rotate-token-key:
    post:
      operationId: rotateTokenKey
      tags: [instance]
      summary: Rotate the root change-token key.
      description: |
        Mints a new root token key, retires the old one, and derives every
        subsequent change token under it.

        WHAT IT DOES NOT TOUCH: no snapshot's content, no revision number, and
        no pinned input revision moves. It cannot - a change token is never
        stored, it is derived at read from the live key over the snapshot's
        delivery manifest, so there is no cache to invalidate and nothing to
        resume after a crash.

        Every outstanding delivery cursor mismatches once and every consumer
        performs one full fetch. This is NOT a restart wave.

        It rides `rotate-dek`: the capability set is closed and names four
        rotation atoms for five rotation verbs, and the root token key is a
        tier-3 key alongside the DEKs.
      x-hikyo-class: instance
      x-hikyo-operation: crypto.rotate-token-key
      x-hikyo-formula: [rotate-dek@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: The rotation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenKeyRotation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/rotate-dek:
    post:
      operationId: rotateDEK
      tags: [instance]
      summary: Append a new DEK version for one project or the instance scope.
      description: |
        Appends a new data-encryption-key version. New writes seal under it
        immediately; ciphertext under the previous version stays readable until
        `reencrypt` walks it onto the new one (Vault keyring semantics). Free on
        its own, and incomplete without a following reencrypt.

        Its own capability, `rotate-dek`, never bundled - the post-compromise
        recovery order runs each rotation under a distinct authority.
      x-hikyo-class: instance
      x-hikyo-operation: crypto.rotate-dek
      x-hikyo-formula: [rotate-dek@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateDEKRequest"
      responses:
        "200":
          description: The rotation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DEKRotation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/reencrypt:
    post:
      operationId: reencryptInstance
      tags: [instance]
      summary: Walk the instance credential ciphertext onto the active DEK version.
      description: |
        Moves every instance-DEK credential ciphertext (password verifiers, TOTP
        seeds, recovery codes, OIDC/SAML secrets, remote credentials) onto the
        active instance DEK version and retires the superseded versions — the
        completion of an instance `rotate-dek`. Chunked and resumable; re-run to
        continue after an interruption.
      x-hikyo-class: instance
      x-hikyo-operation: crypto.reencrypt-instance
      x-hikyo-formula: [reencrypt@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "200":
