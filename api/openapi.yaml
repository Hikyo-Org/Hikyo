        revision: {type: integer, format: int64, minimum: 1}
        sent: {type: boolean}

    CredentialPolicy:
      type: object
      additionalProperties: false
      required: [max_finite_lifetime_seconds, allow_indefinite, max_live_credentials]
      properties:
        max_finite_lifetime_seconds:
          type: integer
          minimum: 1
        allow_indefinite:
          type: boolean
        max_live_credentials:
          type: integer
          minimum: 1
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        updated_by:
          $ref: "#/components/schemas/ID"

    SetCredentialPolicyRequest:
      type: object
      additionalProperties: false
      required: [max_finite_lifetime_seconds, allow_indefinite, max_live_credentials]
      properties:
        max_finite_lifetime_seconds:
          type: integer
          minimum: 1
        allow_indefinite:
          type: boolean
        max_live_credentials:
          type: integer
          minimum: 1
        confirm:
          type: boolean
          description: |
            Acknowledges the enumerated affected credentials. A tightening
            refuses with 409 until this is true, so a settings change never
            silently kills a live credential.

    AffectedCredential:
      type: object
      additionalProperties: false
      required: [id, service_account_id, reason]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        service_account_id:
          $ref: "#/components/schemas/ID"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        reason:
          type: string
          enum: [clamped, indefinite-withdrawn]

    CredentialPolicyResult:
      type: object
      additionalProperties: false
      required: [applied, policy, affected, clamped_count]
      properties:
        applied:
          type: boolean
          description: |
            False when the request was a PREVIEW: a tightening whose affected
            credentials the caller has not acknowledged with `confirm`.
            Nothing was written, and `affected` is the enumeration the caller
            must see before asking again. A settings change never silently
            kills a live credential.
        policy:
          $ref: "#/components/schemas/CredentialPolicy"
        affected:
          type: array
          items:
            $ref: "#/components/schemas/AffectedCredential"
        clamped_count:
          type: integer
          minimum: 0

    Capability:
      type: string
      description: |
        One atom from the permission ADR's CLOSED capability set. The server
        refuses anything outside it rather than storing a row nothing can ever
        evaluate, so this is a bounded string rather than an enum only to keep
        the contract additive as later tickets register their atoms.
      minLength: 1
      maxLength: 64
      pattern: "^[a-z][a-z-]{0,63}$"

    RoleTemplate:
      type: string
      description: The closed v1 role template set.
      enum: [viewer, editor, publisher, revealer, historian, maintainer, admin, operator]

    CreateGrantRequest:
      type: object
      additionalProperties: false
      required: [principal, capability]
      properties:
        principal:
          $ref: "#/components/schemas/ID"
        capability:
          $ref: "#/components/schemas/Capability"

    ApplyTemplateRequest:
      type: object
      additionalProperties: false
      required: [principal, template]
      properties:
        principal:
          $ref: "#/components/schemas/ID"
        template:
          $ref: "#/components/schemas/RoleTemplate"

    GrantOrigin:
      type: object
      additionalProperties: false
      required: [kind, subject]
      description: |
        One origin holding a grant row alive. A row exists while at least one
        origin holds it and is revoked, with the session-generation advance,
        when its last origin is released. Origins are never consulted by
        authorization: authority is the bare (principal, capability, scope)
        triple.
      properties:
        kind:
          type: string
          x-extensible-enum: [manual, break-glass, scim, structural, lockout-retention]
        subject:
          type: string
          description: |
            The origin's holder identity, discriminated by kind: the granting
            principal for `manual`, the fixed local-host marker for
            `break-glass`, the binding id for `scim`/`structural`.
          maxLength: 128

    Grant:
      type: object
      additionalProperties: false
      required: [id, principal_id, capability, scope, origins, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        principal_id:
          $ref: "#/components/schemas/ID"
        principal_name:
          type: string
          description: Current display name or username of this authorized member; not an identifier.
        capability:
          $ref: "#/components/schemas/Capability"
        scope:
          $ref: "#/components/schemas/GrantScope"
        origins:
          type: array
          description: The origin chips for this capability line.
          items:
            $ref: "#/components/schemas/GrantOrigin"
        created_at:
          $ref: "#/components/schemas/Timestamp"

    GrantScope:
      type: object
      additionalProperties: false
      description: |
        The scope the grant was made at. All three absent is instance scope.
        Grants inherit downward, so a grant at a scope applies to everything
        beneath it.
      properties:
        org_id:
          $ref: "#/components/schemas/ID"
        project_id:
          $ref: "#/components/schemas/ID"
        environment_id:
          $ref: "#/components/schemas/ID"

    GrantList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Grant"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.

    GrantResult:
      type: object
      additionalProperties: false
      required: [grant_id, capability, outcome]
      properties:
        grant_id:
          $ref: "#/components/schemas/ID"
        capability:
          $ref: "#/components/schemas/Capability"
        outcome:
          type: string
          enum: [created, origin_added, unchanged]
          x-go-type: api.GrantOutcome
          x-go-type-import:
            path: github.com/Hikyo-Org/hikyo/api
            name: api
          description: >
            The only possible mutation results: a new grant row, a new origin
            on an existing row, or an idempotent repeat that changed nothing.

    GrantResultList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GrantResult"
        count:
          type: integer
          minimum: 0

    EnvironmentSettings:
      type: object
      additionalProperties: false
      required: [protected]
      properties:
        protected:
          type: boolean
        reauth_window_seconds:
          type: [integer, "null"]
          minimum: 0
          description: |
            The environment's own reauthentication window. Null or absent means
            it inherits the instance default - which is NOT the same statement
            as 0, and 0 is a legal value meaning every disclosure
            reauthenticates.

    MachineRevealSettings:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            True while workload and automation principals in this project
            may hold `reveal` and receive secret plaintext on fetch.

    RetentionPolicy:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [keep-if-either, unlimited]
        max_age_seconds:
          type: [integer, "null"]
          minimum: 1
          description: Required for keep-if-either; absent for unlimited.
        last_revisions:
          type: [integer, "null"]
          minimum: 1
          description: Required for keep-if-either; absent for unlimited.

    OpsDiagnosticFinding:
      type: object
      additionalProperties: false
      required: [code, severity, message]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [ok, warn, error, unknown]
        message:
          type: string

    RetentionHealth:
      type: object
      additionalProperties: false
      required: [last_prune_success, stale, stale_after_seconds, peak_project_bytes, storage_warn, backup, adapter_targets_failed, adapter_targets_paused, adapter_targets_attention, adapter_jobs_queued]
      properties:
        diagnostics:
          type: array
          description: Instance operational findings. Unknown means the signal is not authoritatively measured, never healthy by default. No private custody or tenant identities.
          items:
            $ref: "#/components/schemas/OpsDiagnosticFinding"
        last_prune_success:
          type: [string, "null"]
          format: date-time
        stale:
          type: boolean
        stale_after_seconds:
          type: integer
          const: 86400
        peak_project_bytes:
          type: integer
          description: >-
            Largest per-project stored payload across the instance, in bytes
            (ciphertext of value cells plus published snapshot entries). The
            per-project storage high-water surface.
        storage_warn:
          type: boolean
          description: >-
            True once peak_project_bytes reaches the 1 GiB warn threshold, well
            before the 4 GiB publish refusal.
        backup:
          $ref: "#/components/schemas/BackupHealth"
        adapter_targets_failed:
          type: integer
          minimum: 0
          description: Active deployment-adapter targets whose last attempt failed and that are not paused (#157).
        adapter_targets_paused:
          type: integer
          minimum: 0
          description: Active deployment-adapter targets an operator has paused.
        adapter_targets_attention:
          type: integer
          minimum: 0
          description: Active deployment-adapter targets whose destination drifted from the ownership ledger and need an operator.
        adapter_jobs_queued:
          type: integer
          minimum: 0
          description: Deployment-adapter outbox jobs waiting to be claimed, instance-wide.

    BackupHealth:
      type: object
      additionalProperties: false
      description: >-
        Disaster-recovery health: the latest successful export, its age against
        the configured recovery point objective, the latest failure, and the
        latest restore drill. Names archives and versions only; never a
        recipient, an identity or a key.
      required:
        [scheduled, last_success_at, artifact_age_seconds, rpo_seconds, rpo_exceeded,
         last_failure_at, last_failure_reason, last_prune_at, last_drill_at, last_drill_ok, drill_stale]
      properties:
        scheduled:
          type: boolean
          description: True when an export policy (recipients + destination) is configured and the in-process schedule runs.
        last_success_at:
          type: [string, "null"]
          format: date-time
        artifact_age_seconds:
          type: integer
          description: Age of the newest successful export; 0 when there has never been one.
        rpo_seconds:
          type: integer
          description: The configured recovery point objective; 0 when nothing is scheduled.
        rpo_exceeded:
          type: boolean
          description: True when exports are scheduled and no successful export is younger than the RPO.
        last_failure_at:
          type: [string, "null"]
          format: date-time
        last_failure_reason:
          type: string
          description: Bounded operator-facing text of the latest export failure; empty when none.
        last_prune_at:
          type: [string, "null"]
          format: date-time
        last_drill_at:
          type: [string, "null"]
          format: date-time
        last_drill_ok:
          type: boolean
        drill_stale:
          type: boolean
          description: True when no successful restore drill is younger than 90 days.

    ProjectRetentionPolicy:
      type: object
      additionalProperties: false
      required: [inherited, mode]
      properties:
        inherited:
          type: boolean
          description: True clears the project override and follows the org live.
        mode:
          type: string
          enum: [keep-if-either, unlimited]
          description: Unlimited can appear only when inherited from an unlimited org.
        max_age_seconds:
          type: [integer, "null"]
          minimum: 1
        last_revisions:
          type: [integer, "null"]
          minimum: 1

    SetProjectRetentionRequest:
      type: object
      additionalProperties: false
      required: [inherited]
      properties:
        inherited:
          type: boolean
          description: True clears the override; false requires both bounds.
        max_age_seconds:
          type: [integer, "null"]
          minimum: 1
        last_revisions:
          type: [integer, "null"]
          minimum: 1

    KeyName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Z_][A-Z0-9_]*$"
      description: |
        The canonical key grammar: uppercase ASCII, digits and underscore, no
        leading digit. It is the environment-variable-safe grammar every
        delivery surface assumes - an execve environment block, a Kubernetes
        Secret data key, an adapter effective name - so it is a delivery
        constraint, not a style preference. `maxLength` counts code points
        here and bytes in the service; the grammar is ASCII, so they agree.

    KeyClassification:
      type: string
      enum: [secret, config]
      description: |
        Classification IS the sensitivity boundary. A matrix row is uniformly
        secret or config; it changes only through the reclassification
        ceremony. Closed, deliberately: a third value would be a third
        disclosure regime.

    KeyFolderPath:
      type: string
      maxLength: 256
      description: |
        The key's namespace within the project. Organizational only: a plain
        slash-separated path, empty for the catalogue root. It is a PATH, not a
        folder reference - no folder row need exist for it.

    KeyRule:
      type: object
      additionalProperties: false
      required: [type]
      description: |
        One primitive type declaration with its constraints. Each constraint
        belongs to exactly one type, and a constraint declared on the wrong
        type is REFUSED rather than ignored: a silently ignored `pattern` on an
        integer key is the "appears to enforce something and does not" failure
        the schema model rejects everywhere. This document carries shape; the
        service is the authority on every rule below.
      properties:
        type:
          type: string
          enum: [string, integer, boolean, enum, url, json]
        min_length:
          type: integer
          minimum: 0
          description: "`string` only."
        max_length:
          type: integer
          minimum: 0
          description: "`string` only."
        pattern:
          type: string
          maxLength: 512
          description: |
            `string` only. RE2, and ANCHORED TO THE WHOLE VALUE - implicitly
            `\A(?:...)\z`, never a substring search. Backreferences and
            lookaround do not exist in RE2 and are refused at declaration.
        allow_empty:
          type: boolean
          description: "`string` only; defaults to false."
        min:
          type: integer
          format: int64
          description: "`integer` only."
        max:
          type: integer
          format: int64
          description: "`integer` only."
        members:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 512
          description: |
            `enum` only. Members must be non-empty and distinct after the
            write-time trim.
        schemes:
          type: array
          maxItems: 32
          items:
            type: string
          description: "`url` only: the allowed scheme list."
        json_schema:
          type: string
          maxLength: 16384
          description: |
            `json` only: a JSON Schema 2020-12 document, carried as a STRING so
            the bytes the profile checks are the bytes the client sent. A
            re-encoded object would lose duplicate-key detection (Go's decoder
            is last-wins) and number precision, and duplicate object keys are a
            rejection here, not last-wins. The accepted subset is a pinned,
            profiled, budgeted allowlist enforced by the service.

    KeyDeclaration:
      type: object
      additionalProperties: false
      description: |
        Exactly one of `rule` or `any_of`. `any_of` is a bounded union whose
        value is valid if it satisfies AT LEAST ONE alternative - deliberately
        not `oneOf`, whose JSON Schema meaning is exactly-one, because two
        meanings for one word inside one product is a trap. Alternatives may
        not nest.
      properties:
        rule:
          $ref: "#/components/schemas/KeyRule"
        any_of:
          type: array
          minItems: 2
          maxItems: 8
          items:
            $ref: "#/components/schemas/KeyRule"

    KeyPresence:
      type: object
      additionalProperties: false
      required: [mode]
      description: |
        A mode plus an explicit set, never a bare id list: `all` is SYMBOLIC
        and covers environments created later, so expanding it into the ids
        existing at declaration time would silently exempt a new environment
        from a rule the operator wrote as "always". `none` is the default.
      properties:
        mode:
          type: string
          enum: [all, none, explicit]
        environment_ids:
          type: array
          items:
            $ref: "#/components/schemas/ID"
          description: "`explicit` only; empty or absent for `all` and `none`."

    KeyPresenceRules:
      type: object
      additionalProperties: false
      required: [required_in, forbidden_in]
      description: |
        Presence is the ONLY thing that varies per environment; every other
        constraint is project-wide. `required` is a predicate about presence
        only - it means "resolves to set" and says nothing about content.
      properties:
        required_in:
          $ref: "#/components/schemas/KeyPresence"
        forbidden_in:
          $ref: "#/components/schemas/KeyPresence"

    Key:
      type: object
      required:
        [id, org_id, project_id, name, folder_path, classification, description,
         deprecated, deprecation_note, declaration, presence, group_id, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        org_id:
          $ref: "#/components/schemas/ID"
        project_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        folder_path:
          $ref: "#/components/schemas/KeyFolderPath"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        description:
          type: string
          maxLength: 4096
        deprecated:
          type: boolean
        deprecation_note:
          type: string
          maxLength: 4096
        declaration:
          $ref: "#/components/schemas/KeyDeclaration"
        presence:
          $ref: "#/components/schemas/KeyPresenceRules"
        group_id:
          type: string
          description: The key's group, or empty when it belongs to none.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        findings:
          type: array
          description: |
            Secret-scanning warnings (#74, Surface 1). Populated only by the
            reclassification ceremony when declassifying (`secret` → `config`) a
            key whose existing values carry a credential-shaped string — the
            reclassify SUCCEEDS and each finding names its rule and key locator.
            Absent on every other key response.
          items:
            $ref: "#/components/schemas/ScanFinding"

    KeyList:
      type: object
      required: [items, count, schema_revision]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Key"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.
        schema_revision:
          type: integer
          format: int64
          minimum: 0
          description: |
            The project's monotonic key-catalogue revision, which IS its schema
            revision. It advances on every semantic declaration change and on
            nothing else.

    CreateKeyRequest:
      type: object
      additionalProperties: false
      required: [name, classification, declaration]
      properties:
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        folder_path:
          $ref: "#/components/schemas/KeyFolderPath"
        description:
          type: string
          maxLength: 4096
        deprecated:
          type: boolean
        deprecation_note:
          type: string
          maxLength: 4096
        declaration:
          $ref: "#/components/schemas/KeyDeclaration"
        presence:
          $ref: "#/components/schemas/KeyPresenceRules"
        group_id:
          type: string
        acknowledgements:
          $ref: "#/components/schemas/Acknowledgements"

    UpdateKeyMetadataRequest:
      type: object
      additionalProperties: false
      properties:
        folder_path:
          $ref: "#/components/schemas/KeyFolderPath"
        description:
          type: string
          maxLength: 4096
        deprecated:
          type: boolean
        deprecation_note:
          type: string
          maxLength: 4096
        classification:
          $ref: "#/components/schemas/KeyClassification"
        acknowledgements:
          $ref: "#/components/schemas/Acknowledgements"

    RenameKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/KeyName"
        acknowledgements:
          $ref: "#/components/schemas/Acknowledgements"

    UpdateKeyDeclarationRequest:
      type: object
      additionalProperties: false
      required: [declaration, presence]
      properties:
        declaration:
          $ref: "#/components/schemas/KeyDeclaration"
        presence:
          $ref: "#/components/schemas/KeyPresenceRules"
        acknowledgements:
          $ref: "#/components/schemas/Acknowledgements"

    ReclassifyKeyRequest:
      type: object
      additionalProperties: false
      required: [classification]
      properties:
        classification:
          $ref: "#/components/schemas/KeyClassification"

    SetKeyGroupRequest:
      type: object
      additionalProperties: false
      required: [group_id]
      properties:
        group_id:
          type: string
          description: The group to join, or empty to leave every group.

    KeyGroup:
      type: object
      required: [id, org_id, project_id, name, members, inert, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        org_id:
          $ref: "#/components/schemas/ID"
        project_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          maxLength: 128
        members:
          type: array
          items:
            $ref: "#/components/schemas/KeyName"
          description: The member key names, sorted.
        inert:
          type: boolean
          description: |
            A group with fewer than two members couples nothing. It is flagged
            rather than deleted behind the operator's back - they are usually
            mid-way through building it.
        created_at:
          $ref: "#/components/schemas/Timestamp"

    KeyGroupList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KeyGroup"
        count:
          type: integer
          minimum: 0

    CreateKeyGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        acknowledgements:
          $ref: "#/components/schemas/Acknowledgements"

    RenameKeyGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        acknowledgements:
          $ref: "#/components/schemas/Acknowledgements"

    AuthMethods:
      type: object
      additionalProperties: false
      required: [providers, local_login_enabled]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AuthMethodProvider"
        local_login_enabled:
          type: boolean

    AuthMethodProvider:
      type: object
      additionalProperties: false
      required: [slug, display_name, kind]
      properties:
        slug:
          type: string
        display_name:
          type: string
        kind:
          $ref: "#/components/schemas/IdentityProviderKind"

    OidcStartRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          type: string
          x-extensible-enum: [login, link, reauth]
        environment_id:
          type: string
          maxLength: 64
          description: Required for reauth; the window scope.
        proof:
          type: string
          maxLength: 1024
          description: Required for link; the pre-existing password.
        browser:
          type: boolean
          default: false
          description: Redirect the callback to the SPA done page instead of returning JSON.

    OidcStartResult:
      type: object
      additionalProperties: false
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          description: The IdP authorization URL to redirect the browser to.

    SamlStartRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          type: string
          x-extensible-enum: [login, link, reauth]
        environment_id:
          type: string
          maxLength: 64
          description: Required for reauth; the reveal-window scope.
        proof:
          type: string
          maxLength: 1024
          description: Required for link; the pre-existing account-security proof.

    SamlStartResult:
      type: object
      additionalProperties: false
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          format: uri
          description: The IdP HTTP-Redirect URL carrying the AuthnRequest.

    SamlACSRequest:
      type: object
      additionalProperties: false
      required: [SAMLResponse, RelayState]
      properties:
        SAMLResponse:
          type: string
          minLength: 1
          maxLength: 524288
          description: Base64-encoded SAML Response; decoded XML is capped at 256 KiB.
        RelayState:
          type: string
          minLength: 16
          maxLength: 512
          description: Server-minted opaque transaction handle, never a continuation URL.

    IdentityLinkRequest:
      type: object
      additionalProperties: false
      required: [provider, proof]
      properties:
        provider:
          type: string
          maxLength: 64
        proof:
          type: string
          maxLength: 1024
        browser:
          type: boolean
          default: false
          description: Redirect the callback to the SPA done page instead of returning JSON.

    IdentityUnlinkRequest:
      type: object
      additionalProperties: false
      required: [proof]
      properties:
        proof:
          type: string
          maxLength: 1024

    ExternalIdentity:
      type: object
      additionalProperties: false
      required: [id, kind, issuer, subject, provider_id, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        kind:
          $ref: "#/components/schemas/IdentityProviderKind"
        issuer:
          type: string
        subject:
          type: string
        provider_id:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"

    IdentityList:
      type: object
      additionalProperties: false
      required: [identities]
      properties:
        identities:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdentity"

    OidcProviderInput:
      type: object
      additionalProperties: false
      required: [display_name, issuer, client_id, client_secret, scopes, enabled]
      properties:
        display_name:
          type: string
          maxLength: 256
        issuer:
          type: string
          maxLength: 2048
          description: Byte-exact, immutable after create (A3).
        client_id:
          type: string
          maxLength: 1024
        client_secret:
          type: string
          maxLength: 4096
          description: Envelope-encrypted at rest; never returned.
        scopes:
          type: string
          maxLength: 1024
        assurance_policy:
          type: [string, "null"]
          maxLength: 4096
          description: JSON `{acr_values[], amr_sets[][]}`; absent means single-factor.
        enabled:
          type: boolean

    OidcProvider:
      type: object
      additionalProperties: false
      required: [slug, display_name, issuer, client_id, scopes, redirect_uri, enabled]
      properties:
        slug:
          type: string
        display_name:
          type: string
        issuer:
          type: string
        client_id:
          type: string
        scopes:
          type: string
        redirect_uri:
          type: string
        assurance_policy:
          type: [string, "null"]
        enabled:
          type: boolean

    OidcProviderList:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OidcProvider"

    IdentityProviderKind:
      type: string
      description: OPEN protocol discriminator in the byte-exact external-identity key.
      x-extensible-enum: [oidc, saml]

    SamlMetadataSource:
      type: string
      description: Closed source set; URL means one-shot admin-initiated fetch, never a poller.
      enum: [file, url]

    SamlProviderInput:
      type: object
      additionalProperties: false
      description: |
        SAML authentication configuration. Exactly one of `metadata_document`
        and `metadata_url` must match `metadata_source`; the service enforces
        that conditional before fetching or parsing. No provisioning member exists:
        SAML never provisions accounts.
      required:
        - display_name
        - entity_id
        - metadata_source
        - allow_email_nameid
        - force_sign_requests
        - enabled
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 256
        entity_id:
          type: string
          minLength: 1
          maxLength: 2048
          description: |
            Configured byte-exact IdP entityID used to select exactly one
            EntityDescriptor from metadata; immutable after create.
        metadata_source:
          $ref: "#/components/schemas/SamlMetadataSource"
        metadata_document:
          type: [string, "null"]
          maxLength: 262144
          description: Raw IdP metadata XML for a file-backed configuration.
        metadata_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: One-shot WebPKI URL; redirects off-origin are refused.
        confirmed_fingerprints:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: Fingerprints explicitly confirmed in the current ceremony.
        confirmed_endpoints:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            format: uri
            maxLength: 2048
          description: New endpoint URLs explicitly confirmed in the current ceremony.
        assurance_policy:
          type: [array, "null"]
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
          description: Accepted AuthnContextClassRef values; null means single-factor.
        allow_email_nameid:
          type: boolean
          description: Explicit opt-in to opaque emailAddress NameID values; never email linking.
        force_sign_requests:
          type: boolean
          description: Force signed AuthnRequests even when metadata does not demand them.
        enabled:
          type: boolean

    SamlMetadataRefreshRequest:
      type: object
      additionalProperties: false
      properties:
        metadata_document:
          type: [string, "null"]
          maxLength: 262144
          description: Replacement XML for a file-backed provider; absent for URL-backed providers.
        confirmed_fingerprints:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        confirmed_endpoints:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            format: uri
            maxLength: 2048

    SamlProviderPatch:
      type: object
      additionalProperties: false
      description: Omitted members preserve their stored values.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 256
        assurance_policy:
          type: [array, "null"]
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
        allow_email_nameid:
          type: boolean
        force_sign_requests:
          type: boolean
        enabled:
          type: boolean

    SamlProvider:
      type: object
      additionalProperties: false
      required:
        - slug
        - display_name
        - kind
        - entity_id
        - acs_url
        - sso_redirect_url
        - signing_certificate_fingerprints
        - allow_email_nameid
        - force_sign_requests
        - metadata_source
        - metadata_signed
        - warnings
        - enabled
        - row_version
        - created_at
        - updated_at
      properties:
        slug:
          type: string
        display_name:
          type: string
        kind:
          type: string
          enum: [saml]
        entity_id:
          type: string
          description: Byte-exact IdP entityID; immutable after create.
        acs_url:
          type: string
          format: uri
        sso_redirect_url:
          type: string
          format: uri
        signing_certificate_fingerprints:
          type: array
          items:
            type: string
        assurance_policy:
          type: [array, "null"]
          items:
            type: string
        allow_email_nameid:
          type: boolean
        force_sign_requests:
          type: boolean
        metadata_source:
          $ref: "#/components/schemas/SamlMetadataSource"
        metadata_url:
          type: [string, "null"]
          format: uri
        metadata_signed:
          type: boolean
        metadata_signing_fingerprint:
          type: [string, "null"]
        metadata_valid_until:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/SamlProviderWarning"
        enabled:
          type: boolean
        row_version:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    SamlProviderWarning:
      type: object
      additionalProperties: false
      required: [code, severity, message, effective_at]
      properties:
        code:
          type: string
          description: >-
            Open diagnostic code. Clients display the server message and use
            severity even when the code is not yet known to them.
          x-extensible-enum:
            - metadata_expires_soon
            - metadata_expired
            - signing_certificate_not_yet_valid
            - signing_certificate_expired
        severity:
          type: string
          enum: [warning, error]
        message:
          type: string
          maxLength: 512
        effective_at:
          $ref: "#/components/schemas/Timestamp"
        fingerprint:
          type: string
          description: Present only for certificate warnings.

    SamlProviderList:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/SamlProvider"

    SamlSpKey:
      type: object
      additionalProperties: false
      required: [fingerprint, state, created_at]
      properties:
        fingerprint:
          type: string
          description: URL-safe unpadded base64 SHA-256 fingerprint of SubjectPublicKeyInfo, prefixed by `sha256:`.
        state:
          type: string
          enum: [active, retiring]
        created_at:
          $ref: "#/components/schemas/Timestamp"

    SamlSpKeyList:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/SamlSpKey"

    SamlMetadataDiff:
      type: object
      additionalProperties: false
      required:
        - endpoints_added
        - endpoints_removed
        - certs_added_fps
        - certs_removed_fps
      properties:
        endpoints_added:
          type: array
          items: { type: string }
        endpoints_removed:
          type: array
          items: { type: string }
        certs_added_fps:
          type: array
          items: { type: string }
        certs_removed_fps:
          type: array
          items: { type: string }
        valid_until:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    SamlProviderMutationResult:
      type: object
      additionalProperties: false
      description: |
        `applied=false` is the first leg of the metadata ceremony: no trust
        state changed, `diff` is displayed, and every value in
        `required_fingerprints` and `required_endpoints` must be explicitly
        supplied on a rerun.
      required: [applied, diff, required_fingerprints, required_endpoints]
      properties:
        applied:
          type: boolean
        provider:
          oneOf:
            - $ref: "#/components/schemas/SamlProvider"
            - type: "null"
        diff:
          $ref: "#/components/schemas/SamlMetadataDiff"
        required_fingerprints:
          type: array
          uniqueItems: true
          items:
            type: string
        required_endpoints:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uri

    WebauthnOptions:
      type: object
      additionalProperties: true
      description: |
        Opaque WebAuthn ceremony options (creation or request), generated by
        the relying party and handed to the browser `navigator.credentials`
        API verbatim. The server treats the blob as raw bytes; the base64url
        fields the authenticator signs over are preserved by round-tripping.

    WebauthnResponse:
      type: object
      additionalProperties: true
      description: |
        Opaque WebAuthn authenticator response (attestation or assertion) as
        produced by the browser, passed to the relying party as raw bytes.

    WebauthnEnrolStartRequest:
      type: object
      additionalProperties: false
      description: |
        The account-security proof, where the account has one to give. Both
        members are optional so a passwordless, factorless account can open a
        ceremony; the service enforces which proof it requires.
      properties:
        password:
          type: string
          maxLength: 1024
          description: The pre-existing password proof.
        code:
          type: string
          maxLength: 16
          description: A confirmed TOTP code proof.

    WebauthnReauthStartRequest:
      type: object
      additionalProperties: false
      required: [operation, environment_id, key_ids]
      properties:
        self_config:
          $ref: "#/components/schemas/SelfConfigReauthIntent"
        operation:
          $ref: "#/components/schemas/ReauthPurpose"
        environment_id:
          type: string
          maxLength: 64
        key_ids:
          type: array
          description: The credential ids the reauthentication is bound to.
          items:
            type: string
            maxLength: 256
        adapter_operation:
          type: string
          enum: [adapter.configure, adapter.credential-set, adapter.adopt, adapter.sync]
        environment_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/ID"}

    ReauthPurpose:
      type: string
      description: |
        The decision a disclosure ceremony authorizes. It is part of the SIGNED
        binding, not a label: without it an assertion given to `reveal` would be
        spendable on `publish` over the same environment and keys — the same
        unit, a different decision, and the human agreed to only one of them.
      enum:
        - reveal
        - copy
        - publish
        - mint
        - adapter
        - self-config
        - approve
        - reject
        - bypass

    WebauthnCredentialProofRequest:
      type: object
      additionalProperties: false
      description: |
        The account-security proof for removing a credential — the pre-existing
        password or a TOTP code, never the credential being removed (B7). Both
        optional; the service selects and enforces the required proof.
      properties:
        password:
          type: string
          maxLength: 1024
        code:
          type: string
          maxLength: 16

    ReauthResult:
      type: object
      additionalProperties: false
      required: [session_id, environment_id, single_decision, window_expires]
      properties:
        session_token:
          type: string
          minLength: 1
          description: Rotated bearer returned only to Authorization-header callers; cookie-authenticated browser callers receive the rotated HttpOnly cookie and this field is omitted.
        session_id:
          $ref: "#/components/schemas/ID"
        environment_id:
          type: string
        environment_ids:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/ID"}
        single_decision:
          type: boolean
          description: True where the effective window is zero — the window authorizes exactly one decision.
        window_expires:
          $ref: "#/components/schemas/Timestamp"

    RevealWindow:
      type: object
      additionalProperties: false
      required:
        [
          effective_window_seconds,
          protected,
          totp_offered,
          live,
          single_decision,
          can_reveal,
        ]
      description: |
        The reveal guard's state for one environment and the acting session.
        Nothing here is material: it is project settings plus the caller's own
        window.
      properties:
        effective_window_seconds:
          type: integer
          minimum: 0
          description: |
            The environment's resolved reauthentication window. `0` means
            every disclosure takes its own ceremony — the state a protected
            environment is capped at.
        protected:
          type: boolean
          description: |
            The protected-environment flag. Reported beside the window rather
            than folded into it, because "this environment is protected" and
            "the window is set to 0" are different sentences to a human even
            when they produce the same gate.
        totp_offered:
          type: boolean
          description: |
            Whether a TOTP code may open a window here. False exactly where
            the effective window is `0`: TOTP cannot bind a challenge to the
            enumerated unit, so a passkey ceremony is the only path there.
        live:
          type: boolean
          description: Whether a window is open for this session right now.
        single_decision:
          type: boolean
          description: |
            True when the live window authorizes exactly the keys its ceremony
            enumerated and is spent by one decision — never presented as a
            standing window with a countdown.
        can_reveal:
          type: boolean
          description: |
            Whether this principal satisfies `read(E) AND reveal(E)` here. It is
            an AFFORDANCE, never a decision — the chokepoint judges every
            disclosure regardless — and it is what makes the write-only editing
            path first-class: `edit` without `reveal` is a supported state, so
            the editor offers a blind-replacement field with honest microcopy
            rather than guessing from whether a cell happens to be on screen.
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    ApprovalCeremonyBinding:
      type: object
      additionalProperties: false
      required: [key_ids, window]
      properties:
        key_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ID"
          description: The immutable key unit pinned by the approval request.
        window:
          $ref: "#/components/schemas/RevealWindow"

    PasskeyList:
      type: object
      additionalProperties: false
      required: [passkeys]
      properties:
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"

    TotpStatus:
      type: object
      additionalProperties: false
      required: [confirmed, pending]
      properties:
        confirmed:
          type: boolean
          description: True when a confirmed authenticator factor stands on the account.
        pending:
          type: boolean
          description: True when an enrolment is staged but its first confirming code is not yet in.

    Passkey:
      type: object
      additionalProperties: false
      required: [id, label, discoverable, disabled, created_at, last_used_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        label:
          type: string
        discoverable:
          type: boolean
        disabled:
          type: boolean
          description: True for a credential disabled after a signature-count clone was detected.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/Timestamp"
    CreateScimBindingRequest:
      type: object
      additionalProperties: false
      required: [provider_kind, provider_slug, subject_source]
      properties:
        provider_kind:
          type: string
          enum: [oidc, saml]
        provider_slug:
          type: string
          maxLength: 256
        subject_source:
          type: string
          maxLength: 256
          description: |
            `externalId` or a declared enterprise/custom extension path.
            `userName` is refused by name: RFC 7643 defines it
            `caseExact: false` and server-unique, which contradicts byte-exact
            identity material.
        nameid_format:
          type: string
          maxLength: 256
          description: |
            SAML bindings only. A scalar SCIM attribute cannot carry the locked
            SAML subject, so the binding declares the NameID PROFILE and the
            subject-source attribute supplies the NameID value alone.
        nameid_qualifier:
          type: string
          maxLength: 256
        nameid_qualifier_present:
          type: boolean
          description: |
            Presence is carried separately from value because an absent
            qualifier and an empty one are different inputs to the injective
            encoder, and collapsing them would make two SAML subjects collide.
        nameid_sp_qualifier:
          type: string
          maxLength: 256
        nameid_sp_qualifier_present:
          type: boolean
    MintScimCredentialRequest:
      type: object
      additionalProperties: false
      properties:
        proof:
          type: string
          maxLength: 512
          description: |
            The reauthentication proof: a TOTP code, or the account password
            where no factor is enrolled. Minting a provisioning credential is
            `manage-members(org)` AND reauthentication, so a stolen elevated
            session cannot issue a durable bearer on its own.
        indefinite:
          type: boolean
          description: |
            Requires the instance opt-in, which is default-off. Without it an
            indefinite credential is refused by name.
    ScimAttention:
      type: object
      description: |
        One raised attention state on a binding. Each names its cause AND a
        server-authored remediation: a state that only says something is wrong
        makes the binding view a puzzle.
      additionalProperties: false
      required: [state, subject_ref, cause, entered_at, remediation]
      properties:
        state:
          type: string
          description: |
            provider_unavailable | lockout_retention | manual_grants_remain |
            inert_mapping | stale | post_restore
          enum:
            - provider_unavailable
            - lockout_retention
            - manual_grants_remain
            - inert_mapping
            - stale
            - post_restore
          x-enum-varnames:
            - ScimAttentionStateProviderUnavailable
            - ScimAttentionStateLockoutRetention
            - ScimAttentionStateManualGrantsRemain
            - ScimAttentionStateInertMapping
            - ScimAttentionStateStale
            - ScimAttentionStatePostRestore
        subject_ref:
          type: string
          description: Which object the state is about; empty for a binding-wide state.
        cause:
          type: string
          description: The triggering operation, empty where the state has no single trigger.
        entered_at:
          $ref: "#/components/schemas/Timestamp"
        remediation:
          type: string
          description: Server-authored — what to do about it.
    ScimBinding:
      type: object
      additionalProperties: false
      required:
        - id
        - org_id
        - provider_kind
        - provider_slug
        - provider_issuer
        - subject_source
        - connection_principal_id
        - created_at
        - attention
      properties:
        id:
          $ref: "#/components/schemas/ID"
        org_id:
          $ref: "#/components/schemas/ID"
        provider_kind:
          type: string
          enum: [oidc, saml]
        provider_slug:
          type: string
        provider_issuer:
          type: string
          description: |
            Frozen at creation. A provider whose issuer moved under a binding
            is a rebinding hazard, not a rename to follow silently.
        subject_source:
          type: string
          description: |
            The SCIM attribute path carrying identity material, immutable after
            creation. `userName` is refused by name.
        nameid_format:
          type: string
          description: The SAML NameID profile's Format URI; empty for an OIDC binding.
        nameid_qualifier:
          type: string
          description: The SAML NameID profile's fixed NameQualifier.
        nameid_qualifier_present:
          type: boolean
          description: |
            Whether the assertion carries a NameQualifier at all. Presence is
            reported separately from value because an absent qualifier and an
            empty one are different inputs to the injective subject encoder.
        nameid_sp_qualifier:
          type: string
          description: The SAML NameID profile's fixed SPNameQualifier.
        nameid_sp_qualifier_present:
          type: boolean
        connection_principal_id:
          $ref: "#/components/schemas/ID"
        last_contact_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        attention:
          type: array
          items:
            $ref: "#/components/schemas/ScimAttention"
    ScimBindingList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScimBinding"
        count:
          type: integer
    ScimBlastWarning:
      type: object
      additionalProperties: false
      required: [code, severity, message]
      description: |
        Server-authored consequence language. It is authored on the server, not
        in a client, because the locked rule is about what the human is TOLD,
        and a client rendering its own wording is a second, unreviewed policy.
      properties:
        code:
          type: string
          enum: [org_scope, reveal_expanding, production_environment, populated_group]
        severity:
          type: string
          enum: [warning, critical]
        message:
          type: string
    ScimCredential:
      type: object
      additionalProperties: false
      required: [id, binding_id, created_at, live]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        binding_id:
          $ref: "#/components/schemas/ID"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/Timestamp"
        live:
          type: boolean
    ScimCredentialList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScimCredential"
        count:
          type: integer
    ScimDirectoryGroup:
      type: object
      additionalProperties: false
      required: [id, display_name, member_count, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        display_name:
          type: string
        external_id:
          type: string
        member_count:
          type: integer
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    ScimDirectoryGroupList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScimDirectoryGroup"
        count:
          type: integer
    ScimDirectoryUser:
      type: object
      additionalProperties: false
      required: [id, user_name, account_id, active, groups, created_at, updated_at, attention]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        user_name:
          type: string
        external_id:
          type: string
        account_id:
          $ref: "#/components/schemas/ID"
        active:
          type: boolean
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ID"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        attention:
          type: array
          items:
            $ref: "#/components/schemas/ScimAttention"
    ScimDirectoryUserList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScimDirectoryUser"
        count:
          type: integer
    ScimMapping:
      type: object
      additionalProperties: false
      required: [id, binding_id, group_id, template, inert, created_at, capabilities]
      properties:
        capability_origins:
          type: array
          items: {$ref: "#/components/schemas/ScimCapabilityOrigin"}
        id:
          $ref: "#/components/schemas/ID"
        binding_id:
          $ref: "#/components/schemas/ID"
        group_id:
          $ref: "#/components/schemas/ID"
        template:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        inert:
          type: boolean
          description: |
            The group this row names no longer exists at the identity provider.
            An inert row grants nothing and is never removed automatically.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        capabilities:
          type: array
          description: |
            What the row expands into. Expansion at sync time is expansion at
            grant time, so this is exactly the set a human applying the same
            template at the same scope would create.
          items:
            type: string
    ScimMappingList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScimMapping"
        count:
          type: integer
    ScimMappingRequest:
      type: object
      additionalProperties: false
      required: [group_id, template]
      properties:
        group_id:
          $ref: "#/components/schemas/ID"
        template:
          type: string
          maxLength: 64
        project_id:
          type: string
          maxLength: 64
          description: |
            Absent means org scope, which is the WIDEST a binding can reach.
            Nothing preselects a scope for you, least of all a production
            environment.
        environment_id:
          type: string
          maxLength: 64
    ScimMappingResult:
      type: object
      additionalProperties: false
      required: [mapping, warnings, members_affected, grants_created, origins_released]
      properties:
        mapping:
          $ref: "#/components/schemas/ScimMapping"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ScimBlastWarning"
        members_affected:
          type: integer
        grants_created:
          type: integer
        origins_released:
          type: integer
    ScimMintResult:
      type: object
      additionalProperties: false
      required: [credential, token, rotated]
      properties:
        credential:
          $ref: "#/components/schemas/ScimCredential"
        token:
          type: string
          description: |
            Display-once. It is in this response and nowhere else, ever: only
            the SHA-256 verifier was stored.
        rotated:
          type: boolean
          description: |
            This mint joined an already-live credential. That IS overlap
            rotation — mint-new, update the identity provider, revoke-old, with
            identical authority throughout.
    ScimResource:
      type: object
      additionalProperties: true
      description: |
        A SCIM 2.0 resource or message, as RFC 7643/7644 shapes it. It is
        deliberately open: identity providers send and expect attributes this
        provider stores as round-tripped display metadata, and pinning the
        shape here would make a conformant IdP's request a contract violation.
        What IS closed lives in the server: the subject source, the filter
        grammar, the PATCH matrix and the error mapping, each with its own
        named refusal.

    DirectoryListing:
      type: object
      additionalProperties: false
      required: [identity, version, orgs, org_count, project_count]
      description: |
        What a connection credential authorizes, exhaustively. There is no field
        here that could carry a value, a key, an environment, a membership, a
        setting or an audit row, and adding one would widen every credential in
        circulation without any grant changing.
      properties:
        identity:
          type: string
          maxLength: 128
          description: |
            This instance's opaque, server-generated identity, minted with the
            schema and preserved by backup/restore — a restored instance IS the
            instance. Returned ONLY here, never pre-authentication.
        version:
          type: string
          maxLength: 64
          description: |
            Display only. It never feeds a compatibility decision: a snapshot
            can race a downgrade or a restore, so the shell reads the pre-auth
            meta endpoint live for that.
        orgs:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/DirectoryOrg"
        org_count:
          type: integer
          minimum: 0
        project_count:
          type: integer
          minimum: 0

    DirectoryOrg:
      type: object
      additionalProperties: false
      required: [name, projects]
      properties:
        name:
          type: string
          maxLength: 200
        projects:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 200

    Remote:
      type: object
      additionalProperties: false
      required:
        [id, name, url, spki_pin, created_at, created_by, state, last_attempt_at, stale]
      description: |
        One connection entry and its last-known state. There is deliberately no
        credential field: the stored credential is write-only after storage and
        is not retrievable through any surface.
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/EntityName"
        url:
          type: string
          maxLength: 512
          description: The canonical https origin. Immutable for the life of the entry.
        spki_pin:
          type: string
          maxLength: 64
          description: |
            base64(sha256(SubjectPublicKeyInfo)), confirmed by a human at add
            time and verified on every connection before any bytes are written.
            Immutable for the life of the entry.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        created_by:
          type: string
          maxLength: 64
        state:
          type: string
          enum:
            [ok, unreachable, credential-rejected, pin-mismatch, redirect-refused,
             identity-conflict, self-connected]
          description: |
            The most recent fetch's outcome. A closed enum because the
            operator's fix differs per outcome, and collapsing them into one
            "error" is what makes a directory card useless.
        last_attempt_at:
          $ref: "#/components/schemas/Timestamp"
        observed_at:
          $ref: "#/components/schemas/Timestamp"
        stale:
          type: boolean
          description: |
            The listing below is a SNAPSHOT, not current. Computed from the
            outcome rather than the age: a fetch that just failed makes even a
            one-second-old snapshot stale.
        stale_for_seconds:
          type: integer
          minimum: 0
          description: The snapshot's age, the number the card prints beside "unreachable".
        identity:
          type: string
          maxLength: 128
        version:
          type: string
          maxLength: 64
        org_count:
          type: integer
          minimum: 0
        project_count:
          type: integer
          minimum: 0
        orgs:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/DirectoryOrg"

    RemoteList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Remote"
        count:
          type: integer
          minimum: 0

    AddRemoteRequest:
      type: object
      additionalProperties: false
      required: [name, url, spki_pin, credential]
      properties:
        name:
          $ref: "#/components/schemas/EntityName"
        url:
          type: string
          maxLength: 512
          description: |
            A canonical `https://` origin — no userinfo, no path, no query, no
            fragment, no plaintext HTTP. A value carrying one is REFUSED, never
            silently normalised.
        spki_pin:
          type: string
          maxLength: 64
          description: The fingerprint the human confirmed interactively.
        credential:
          type: string
          maxLength: 256
          description: |
            The connection credential minted on the serving side. Verified by
            one authenticated fetch before the entry is committed, then sealed
            under the instance keyring and never returned again.

    RenameRemoteRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/EntityName"

    InstanceConnection:
      type: object
      additionalProperties: false
      required:
        [id, principal, label, kind, prefix_hint, lifetime, created_at, created_by, live]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        principal:
          type: string
          maxLength: 64
        label:
          type: string
          maxLength: 200
          description: |
            Names the intended peer for the audit trail. Descriptive, NOT
            enforced: this instance cannot verify who holds the token.
        kind:
          $ref: "#/components/schemas/CredentialKind"
        prefix_hint:
          type: string
          maxLength: 32
          description: |
            The leading, non-secret slice of the minted value, so two
            connections are distinguishable in a list without either being
            retrievable.
        lifetime:
          $ref: "#/components/schemas/CredentialLifetime"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        created_by:
          type: string
          maxLength: 64
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/Timestamp"
        live:
          type: boolean
          description: Whether it authenticates right now, under the current credential epoch.

    InstanceConnectionList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InstanceConnection"
        count:
          type: integer
          minimum: 0

    MintInstanceConnectionRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        lifetime_seconds:
          type: integer
          minimum: 1
          description: |
            Clamped to the instance ceiling, and the response says so. Omit for
            the default; naming both this and `indefinite` is a refusal, never a
            precedence rule.
        indefinite:
          type: boolean
          description: Requires the instance to allow indefinite credentials.

    MintedInstanceConnection:
      type: object
      additionalProperties: false
      required: [value, connection, clamped]
      properties:
        value:
          type: string
          maxLength: 256
          description: |
            THE ONLY DISCLOSURE. Not retrievable afterwards through any surface.
        connection:
          $ref: "#/components/schemas/InstanceConnection"
        clamped:
          type: boolean
          description: The instance ceiling shortened the requested lifetime.

    WorkspaceOrigin:
      type: object
      additionalProperties: false
      required: [origin, created_at, created_by]
      properties:
        origin:
          type: string
          maxLength: 512
          description: An EXACT origin — scheme://host[:port]. No wildcards, no subdomains.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        created_by:
          type: string
          maxLength: 64

    WorkspaceOriginList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceOrigin"
        count:
          type: integer
          minimum: 0

    WorkspaceOriginRequest:
      type: object
      additionalProperties: false
      required: [origin]
      properties:
        origin:
          type: string
          maxLength: 512

    WorkspaceOriginRemoved:
      type: object
      additionalProperties: false
      required: [origin, sessions_revoked]
      properties:
        origin:
          type: string
          maxLength: 512
        sessions_revoked:
          type: integer
          minimum: 0
          description: |
            Workspace sessions killed by the SAME transaction. This is what
            makes de-allowlisting a kill switch rather than a headers change.

    StartWorkspaceHandoffRequest:
      type: object
      additionalProperties: false
      required: [origin, redirect_uri, pkce_challenge, purpose]
      properties:
        origin:
          type: string
          maxLength: 512
          description: The requesting UI origin. Must be allowlisted, or the transaction refuses.
        redirect_uri:
          type: string
          maxLength: 512
          description: |
            The exact pre-registered callback. Its authority IS the allowlist
            entry: a callback that does not live at the consented origin is not
            the consented code.
        pkce_challenge:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: S256 challenge (RFC 7636). Plain is not accepted.
        purpose:
          type: string
          enum: [establishment, step-up]
        session:
          $ref: "#/components/schemas/ID"
        operation:
          type: string
          maxLength: 128
          description: |
            Step-up only, with `session`: the EXACT operation being elevated, so
            an elevated consent cannot be replayed against a different one.
        environment:
          $ref: "#/components/schemas/ID"
        key_set:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 200
          description: |
            Step-up only, where the operation is key-scoped: the enumerated key
            set the consent covers.

    WorkspaceHandoffStarted:
      type: object
      additionalProperties: false
      required: [handoff, state, expires_at]
      properties:
        handoff:
          $ref: "#/components/schemas/ID"
        state:
          type: string
          maxLength: 256
          description: Crosses the front channel. The artifact never does.
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    ApproveWorkspaceHandoffRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          maxLength: 256

    WorkspaceHandoffApproved:
      type: object
      additionalProperties: false
      required: [code, redirect_uri]
      properties:
        code:
          type: string
          maxLength: 256
          description: Single-use, atomically consumed at redemption.
        redirect_uri:
          type: string
          maxLength: 512

    RedeemWorkspaceHandoffRequest:
      type: object
      additionalProperties: false
      required: [code, pkce_verifier, origin]
      properties:
        code:
          type: string
          maxLength: 256
        pkce_verifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]{43,128}$"
        origin:
          type: string
          maxLength: 512

    WorkspaceSession:
      type: object
      additionalProperties: false
      required: [value, session, origin, handoff, idle_expires_at, absolute_expires_at]
      properties:
        value:
          type: string
          maxLength: 256
          description: |
            Keep it in JS MEMORY ONLY — never a cookie, never localStorage or
            sessionStorage. In-memory storage narrows the at-rest window; it is
            not non-stealability, and this contract does not sell it as such.
        session:
          $ref: "#/components/schemas/ID"
        origin:
          type: string
          maxLength: 512
        handoff:
          $ref: "#/components/schemas/ID"
        idle_expires_at:
          $ref: "#/components/schemas/Timestamp"
        absolute_expires_at:
          $ref: "#/components/schemas/Timestamp"
        elevated:
          type: boolean
          description: |
            True when this redemption ELEVATED the session the step-up
            transaction was bound to instead of establishing a new one. `session`
            is then that same session's id and `value` is its ROTATED bearer —
            not a second session. The rotation is deliberate: a bearer stolen
            before an elevation must not become an elevated bearer after it.
        environment:
          $ref: "#/components/schemas/ID"
        window_expires_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: |
            When the reauthentication window this elevation opened lapses.
            Present only on an elevation.

    WorkspaceHandoffTransaction:
      oneOf:
        - $ref: "#/components/schemas/WorkspaceHandoffEstablishment"
        - $ref: "#/components/schemas/WorkspaceHandoffStepUp"

    WorkspaceHandoffEstablishment:
      type: object
      additionalProperties: false
      required: [state, requesting_origin, purpose, key_ids, expires_at]
      properties:
        requesting_origin:
          type: string
          format: uri
          minLength: 1
          description: Exact canonical requesting origin from the stored transaction, never from approval-page URL fields.
        state:
          type: string
          minLength: 1
        purpose:
          type: string
          enum: [establishment]
        key_ids:
          type: array
          items: {$ref: "#/components/schemas/ID"}
          description: Empty for an establishment.
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    WorkspaceHandoffStepUp:
      type: object
      additionalProperties: false
      required: [state, requesting_origin, purpose, operation, environment, key_ids, expires_at]
      properties:
        requesting_origin:
          type: string
          format: uri
          minLength: 1
          description: Exact canonical requesting origin from the stored transaction, never from approval-page URL fields.
        state:
          type: string
          minLength: 1
        purpose:
          type: string
          enum: [step-up]
        operation:
          type: string
          enum: [reveal, copy, publish, approve, reject, bypass]
          description: The exact decision the reauthentication authorizes.
        environment:
          $ref: "#/components/schemas/ID"
          description: The environment the elevation covers.
        key_ids:
          type: array
          items: {$ref: "#/components/schemas/ID"}
          description: The enumerated unit the elevation binds.
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    ActiveSession:
      type: object
      additionalProperties: false
      required:
        [id, artifact, auth_method, created_at, last_seen_at, idle_expires_at,
         absolute_expires_at]
      description: One of the caller's own sessions. Metadata only; no verifier is ever returned.
      properties:
        id:
          $ref: "#/components/schemas/ID"
        artifact:
          type: string
          enum: [cli, browser, workspace]
          description: |
            A workspace session appears as its own artifact type — the ADR's
            requirement, and the reason it is a session row at all.
        auth_method:
          type: string
          maxLength: 64
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_seen_at:
          $ref: "#/components/schemas/Timestamp"
        idle_expires_at:
          $ref: "#/components/schemas/Timestamp"
        absolute_expires_at:
          $ref: "#/components/schemas/Timestamp"
        source_ip:
          type: string
          maxLength: 64
        user_agent:
          type: string
          maxLength: 512
        requesting_origin:
          type: string
          maxLength: 512
          description: |
            Workspace sessions only: which foreign shell holds a session on this
            account. Removing that origin from the allowlist kills it atomically.
        handoff:
          type: string
          maxLength: 64

    SessionList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActiveSession"
        count:
          type: integer
          minimum: 0

    AuditEvent:
      type: object
      description: |
        One stored trail event, exactly as the JSONL export emits it. No value
        material is ever written to the trail, so none appears here. Consumers
        MUST tolerate members they do not recognise: the closed registry adds
        event types and payload fields over time, and a client that fails on an
        additive field would break on every forward-compatible server.
      required:
        [seq, id, type, schema_version, occurred_at, occurred_asserted, recorded_at, actor_class, scope_class, outcome, origin, payload]
      properties:
        seq:
          type: integer
          format: int64
          description: Immutable public allocation order and event position.
        id:
          type: string
        type:
          type: string
          description: The event type from the closed audit registry.
        schema_version:
          type: integer
        occurred_at:
          type: string
          format: date-time
        occurred_asserted:
          type: boolean
          description: Whether occurred_at was asserted by a client rather than the server clock.
        recorded_at:
          type: string
          format: date-time
        actor_id:
          type: string
        actor_name:
          type: string
          description: Current display name of this event actor, when still available. This is a presentation label, not historical evidence.
        actor_class:
          type: string
        actor_credential_id:
          type: string
        authority_id:
          type: string
        scope_class:
          type: string
        org_id:
          type: string
        project_id:
          type: string
        env_id:
          type: string
        object_type:
          type: string
        object_id:
          type: string
        outcome:
          type: string
        correlation_id:
          type: string
        source_ip:
          type: string
        user_agent:
          type: string
        origin:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: |
            The event's schema-versioned payload, verbatim. Its members vary by
            event type and grow additively; render unknown members rather than
            failing on them.

    AuditPage:
      type: object
      additionalProperties: false
      required: [items, count, next_after_seq, upper_seq, exhausted]
      properties:
        items:
          type: array
          description: The events on this page that matched the filter, in seq order.
          items:
            $ref: "#/components/schemas/AuditEvent"
        count:
          type: integer
          minimum: 0
          description: Number of matched events returned (may be fewer than the rows scanned).
        next_after_seq:
          type: integer
          format: int64
          description: |
            The seq of the last row SCANNED. Pass it as `after_seq` to resume;
            it advances over scanned rows, not just matched ones, so a filtered
            page never re-reads or skips.
        upper_seq:
          type: integer
          format: int64
          description: |
            The session ceiling the server pinned for this paging run (the
            trail's head when the first page was read). Pass it back as `to_seq`
            on every later page; it never changes across the run.
        exhausted:
          type: boolean
          description: |
            True when this page reached the end of the trail (fewer rows scanned
            than the limit). While false, more pages remain even if `items` is
            empty for a sparse filter.


    AdapterFinding:
      type: object
      additionalProperties: false
      required: [surface, effective_name, finding]
      properties:
        surface: {type: string, enum: [secret, variable]}
        effective_name: {type: string}
        finding: {type: string, enum: [possible_capture, owned_missing, crash_window]}
    ScimCapabilityOrigin:
      type: object
      additionalProperties: false
      required: [capability, kind, binding_id, mapping_id, group_id]
      properties:
        capability: {type: string}
        kind: {type: string, enum: [scim]}
        binding_id: {$ref: "#/components/schemas/ID"}
        mapping_id: {$ref: "#/components/schemas/ID"}
        group_id: {$ref: "#/components/schemas/ID"}

security:
  - hikyoSession: []
