  /api/v1/orgs/{org}/projects/{project}/adapter-targets/{target}/pause:
    parameters: [{$ref: "#/components/parameters/OrgID"}, {$ref: "#/components/parameters/ProjectID"}, {$ref: "#/components/parameters/AdapterTargetID"}]
    post:
      operationId: pauseAdapterTarget
      tags: [adapters]
      summary: Stop every push for the target without releasing owned destination state.
      description: |
        Pause supersedes the target's active job and fences any worker still
        inside it; the ownership ledger is retained, so resume needs no
        re-adoption. Publishes skip a paused target and a manual sync is
        refused with 409. Pause narrows what Hikyo does at the destination, so
        it carries `manage-adapters` alone and no reauthentication ceremony.
        Idempotent.
      x-hikyo-class: tenant
      x-hikyo-operation: adapter.configure
      x-hikyo-formula: [manage-adapters@project]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "200": {description: The paused target., content: {application/json: {schema: {$ref: "#/components/schemas/AdapterTarget"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}

  /api/v1/orgs/{org}/projects/{project}/adapter-targets/{target}/resume:
    parameters: [{$ref: "#/components/parameters/OrgID"}, {$ref: "#/components/parameters/ProjectID"}, {$ref: "#/components/parameters/AdapterTargetID"}]
    post:
      operationId: resumeAdapterTarget
      tags: [adapters]
      summary: Resume a paused target and queue one catch-up converge.
      description: |
        Resume pushes again, so it carries the manual-sync formula and the
        adapter reauthentication ceremony over the adapter's environment set.
        The response names the published revision the queued converge will
        reach. A target that is not paused is refused with 409.
      x-hikyo-class: tenant
      x-hikyo-operation: adapter.sync
      x-hikyo-formula: [manage-adapters@project]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "202": {description: Queued catch-up converge., content: {application/json: {schema: {$ref: "#/components/schemas/AdapterResume"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}

