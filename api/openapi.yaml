    InstanceConfigJob:
      type: object
      additionalProperties: false
      required: [id, state, revision, generation, created_at]
      properties:
        id: {type: string}
        state: {type: string, enum: [preparing, pending, partial, completed, failed]}
        revision: {type: integer, format: int64, minimum: 1}
        generation: {type: integer, format: int64, minimum: 0}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        error: {type: string}
    InstanceConfigStatus:
      type: object
      additionalProperties: false
      required: [owner_instance_id, managed, binding, generation, desired_revision, latest_revision, state, nodes, job]
      properties:
        owner_instance_id: {type: string}
        managed: {type: boolean}
        binding:
          oneOf:
            - $ref: "#/components/schemas/InstanceConfigBinding"
            - type: "null"
        generation: {type: integer, format: int64, minimum: 0}
        desired_revision: {type: [integer, "null"], format: int64, minimum: 1}
        latest_revision: {type: [integer, "null"], format: int64, minimum: 1}
        state: {type: string, enum: [unmanaged, active, pending, partial, recovery_required]}
        nodes:
          type: array
