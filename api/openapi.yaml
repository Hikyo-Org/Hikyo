          description: The entry with its last-known state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remote"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      operationId: renameRemote
      tags: [instance]
      summary: Change an entry's display name.
      description: |
        The display name is the ONE mutable field. There is no URL or pin edit
        here or anywhere; see `addRemote` for why.

        API and UI only, deliberately: the API/CLI ADR's closed verb list for
        this family is `remote add|list|show|remove`, and parity holds because
        this is public surface.
      x-hikyo-class: instance
      x-hikyo-operation: remote.rename
      x-hikyo-formula: [instance-config@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRemoteRequest"
      responses:
        "200":
          description: The entry as renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: removeRemote
      tags: [instance]
      summary: Destroy an entry, its stored credential and its snapshot.
      description: |
        THIS IS NOT REVOCATION. The serving side's credential remains valid
        until it is revoked THERE, and every surface says so: destroying the
        local copy is not revocation and this API does not pretend otherwise.
      x-hikyo-class: instance
      x-hikyo-operation: remote.remove
      x-hikyo-formula: [instance-config@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "204":
          description: Removed. The serving-side credential is still live.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/connections:
    get:
      operationId: listInstanceConnections
      tags: [instance]
      summary: The connection credentials this instance has minted.
      description: |
        Metadata only, never the value: a credential is display-once at mint
        and write-only after, and no statement anywhere reads a verifier back
        out for display.
      x-hikyo-class: instance
      x-hikyo-operation: remote-credential.list
      x-hikyo-formula: [instance-config@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: Every connection, live and revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceConnectionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: mintInstanceConnection
      tags: [instance]
      summary: Mint a connection principal and its one credential.
      description: |
        Principal and credential are ONE UNIT with a stable immutable id, and
        there is one credential per principal EVER — rotation is a new mint plus
        a revoke of the predecessor, never a second credential on this one.

        The value is returned EXACTLY ONCE, here. It is not retrievable
        afterwards through any surface.

        The label names the intended peer for the audit trail. It is
        descriptive and NOT enforced: this instance cannot verify who holds the
        token, and does not pretend to.
      x-hikyo-class: instance
      x-hikyo-operation: remote-credential.create
      x-hikyo-formula: [instance-config@instance]
      x-hikyo-artifacts: [human-session]
