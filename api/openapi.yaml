  # ---------------------------------------------------------------------------
  # Multi-instance (#71, multi-instance ADR). Two tiers, both additive.
  #
  # There is deliberately NO endpoint here that relays a request to another
  # instance. The directory tier reads foreign METADATA server-to-server under a
  # pinned connection; the workspace tier is the BROWSER talking to the remote
  # directly. A server-side proxy is the design the ADR rejected, and
  # api/noproxy_test.go is what keeps it rejected.
  # ---------------------------------------------------------------------------

  /api/v1/instance/directory:
    get:
      operationId: serveDirectory
      tags: [instance]
      summary: This instance's directory listing, as served to a connected instance.
      description: |
        The ONE endpoint an instance-connection credential may reach. Artifact
        eligibility caps the credential to this operation alone, so a future
        operation adopting the `instance-directory` formula does not widen any
        existing token.

        What it returns, exhaustively: this instance's opaque identity, its
        version, and the NAMES and counts of organisations and projects. No
        values, no keys, no environments, no membership, no settings, no audit —
        the response schema has no field that could carry one.

        The identity is returned ONLY here, never pre-authentication. That is
        what makes self-connection detectable at the fetch rather than guessable
        from outside.

        Human holders of `instance-directory` reach it too: it is the same
        listing, and hiding it from the humans the atom exists for would be
        arbitrary.
      x-hikyo-class: instance
      x-hikyo-operation: remote.directory-serve
      x-hikyo-formula: [instance-directory@instance]
      x-hikyo-artifacts: [human-session, instance-credential]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: The served listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListing"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/remotes:
    get:
      operationId: listRemotes
      tags: [instance]
      summary: The directory of connected instances.
      description: |
        Fetched ON VIEW. There is no background poller: a fetch happens because
        a holder of `instance-directory` is looking, and at no other moment.

        An unreachable entry serves its last-known snapshot MARKED STALE with
        its age, never silently as current. A credential rejection is its own
        loud state, distinct from unreachability, because the operator's fix
        differs.

        When the instance-wide or per-viewer trigger budget is exhausted no
        round runs and every entry is served from its snapshot, marked stale —
        the bounds limit fetch triggers, not views.
      x-hikyo-class: instance
      x-hikyo-operation: remote.list
      x-hikyo-formula: [instance-directory@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: Every configured entry with its last-known state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: addRemote
      tags: [instance]
      summary: Add a connection entry, verified by one authenticated fetch.
      description: |
        URL AND PIN ARE IMMUTABLE once stored, so there is no edit verb
        anywhere: re-pointing a stored credential at a different host is the
        credential-redirect attack, and re-pointing is remove + add, which
        re-runs the full ceremony including the human fingerprint confirmation.

        The caller must already have displayed the SPKI fingerprint and taken
        the human's confirmation — that is interactive and belongs to the client.
        This endpoint performs the authenticated directory fetch, which returns
        the remote's instance identity: self-connection (409) and
        duplicate-identity (409) fire there, BEFORE the entry is committed. A
        fetch that does not succeed commits nothing (422).

        The credential is write-only after storage: sealed under the instance
        keyring, never re-displayable through any surface, and leaving the
        process only inside TLS to the pinned remote.
      x-hikyo-class: instance
      x-hikyo-operation: remote.add
      x-hikyo-formula: [instance-config@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRemoteRequest"
      responses:
        "201":
          description: The entry, with the listing its verifying fetch returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/remotes/{remote}:
    parameters:
      - $ref: "#/components/parameters/RemoteName"
    get:
      operationId: showRemote
      tags: [instance]
      summary: One connection entry, full detail, fetched on view.
      x-hikyo-class: instance
      x-hikyo-operation: remote.show
      x-hikyo-formula: [instance-directory@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
