        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}
    patch:
      operationId: updateAdapterTarget
      tags: [adapters]
      summary: Replace target routing fields and the complete key subset.
      x-hikyo-class: tenant
      x-hikyo-operation: adapter.configure
      x-hikyo-formula: [manage-adapters@project]
      x-hikyo-artifacts: [human-session]
