        "200":
          description: The minted or rotated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "303":
          description: Browser transaction completed; continue on the SPA done page.
          headers:
            Location:
              required: true
              schema: { type: string }
