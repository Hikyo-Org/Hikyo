# oapi-codegen v2.8.0 — the 3.1-support release, the named working pin
# (system-architecture ADR amendment banner). It moves only by recorded
# amendment, never silently; the pin lives in go.mod's tool directive and is
# asserted by the api package's toolchain test.
#
# strict-server: handlers take and return typed values, so an unmarshalled
# request cannot reach a handler as `any` and a response cannot be written
# without passing through the generated type. That is the parse-don't-cast
# rule expressed in the transport layer.
# Output is repo-root-relative: the documented regeneration command runs from
# the repo root (`go tool oapi-codegen --config api/oapi-codegen.yaml
# api/openapi.yaml`), so the output path below must be given relative to the
# repo root, not to this file. After an openapi.yaml change run
# `go run ./api/omitzero` first to refresh the overlay named below.
package: apigen
output: api/apigen/apigen.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
  embedded-spec: false
output-options:
  # Nullable members are `type: [T, "null"]` under the bound 3.1 profile;
  # pointers keep absent and null distinguishable in Go instead of collapsing
  # both onto a zero value.
  prefer-skip-optional-pointer: false
  # Extensions the CI cross-checks read straight off the loaded document
  # rather than out of generated Go, so no compatibility shims are needed.
  skip-prune: true
  # encoding/json/v2 `omitempty` drops non-nil pointers to "", [] and {}, which
  # breaks CLI clear flags; the overlay (generated by `go run ./api/omitzero`,
  # resolved from the repo root) makes optional properties `omitzero` instead,
  # which omits nil or a pointed-to value whose IsZero() is true (only
  # time.Time here).
  overlay:
    path: api/omitzero-overlay.yaml
