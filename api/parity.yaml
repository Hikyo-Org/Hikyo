  listScimMappings:            {webui: scim}
  createScimMapping:           {webui: scim}
  updateScimMapping:           {webui: scim}
  deleteScimMapping:           {webui: scim}
  listScimCredentials:         {webui: scim}
  mintScimCredential:          {webui: scim}
