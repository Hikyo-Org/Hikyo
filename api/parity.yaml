  showAdapterTarget:           {webui: adapters}
  updateAdapterTarget:         {webui: adapters}
  removeAdapterTarget:         {webui: adapters}
  planAdapterTarget:           {webui: adapters}
  syncAdapterTarget:           {webui: adapters}
  pauseAdapterTarget:          {webui: adapters}
  resumeAdapterTarget:         {webui: adapters}
  testAdapterTarget:           {webui: adapters}
