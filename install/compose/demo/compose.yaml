services:
  app:
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    env_file:
      - path: /tmp/hikyo-demo-runtime/${HIKYO_GEN_APP:?run 'hikyo compose render' first}/app.env
        format: raw
    labels:
      hikyo.stamp: "${HIKYO_GEN_APP:?run 'hikyo compose render' first}"
    command: ["sh", "-c", "for k in $$(env | cut -d= -f1 | sort); do printf '%s=' \"$$k\"; eval \"printf '%s' \\\"\\$$$$k\\\"\" | base64 -w0; echo; done"]
