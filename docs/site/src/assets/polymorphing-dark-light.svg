<?xml version="1.0" encoding="UTF-8"?>
<!-- To toggle between moon and sun toggle on/off the 'dark' class -->
<!-- Author: Marc Went -->
<!-- Inspiration: developedbyed -->
<!-- Original Source:
https://github.com/developedbyed/react-gradient-glow/blob/main/components/nav.tsx -->
<svg
  xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  class="icon"
  width="50"
  height="50"
  viewBox="0 0 100 100"
  fill="none"
>
  <style>
    .icon { overflow: visible; }

    @keyframes wiggle {
      0%, 100% { rotate:   0deg; }
      20%      { rotate: -12deg; }
      40%      { rotate:  10deg; }
      60%      { rotate:  -6deg; }
      80%      { rotate:   4deg; }
    }

    .icon:hover {
      animation: wiggle 0.5s ease-in-out;
    }

    /* ── Main shape (sun ↔ moon) ─────────────────────── */

    .icon .main-shape {
      d: path("M70 49.5C70 60.8218 60.8218 70 49.5 70C38.1782 70 29 60.8218 29 49.5C29 38.1782 38.1782 29 49.5 29C60 29 69.5 38 70 49.5Z");
      fill: var(--color-yellow-600, #ca8a04);
      stroke: var(--color-yellow-600, #ca8a04);
      fill-opacity: 0.35;
      stroke-width: 4;
      stroke-linecap: round;
      transform-origin: 50px 50px;
      transition:
        d 0.6s ease,
        fill 0.6s ease,
        stroke 0.6s ease,
        rotate 0.8s ease,
        scale 0.8s ease;
    }

    .icon.dark .main-shape {
      d: path("M70 49.5C70 60.8218 60.8218 70 49.5 70C38.1782 70 29 60.8218 29 49.5C29 38.1782 38.1782 29 49.5 29C39 45 49.5 59.5 70 49.5Z");
      fill: var(--color-blue-400, #60a5fa);
      stroke: var(--color-blue-400, #60a5fa);
      rotate: -360deg;
      scale: 2;
    }

    /* ── Sun rays ────────────────────────────────────── */

    .icon .rays {
      fill: none;
      stroke: var(--color-yellow-600, #ca8a04);
      stroke-width: 4;
      stroke-linecap: round;
    }

    .icon .rays path {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      opacity: 0;
    }

    @keyframes ray-in {
      to { stroke-dashoffset: 0; opacity: 1; }
    }

    .icon:not(.dark) .rays path          { animation: ray-in 0.3s ease-out forwards; }
    .icon:not(.dark) .rays path:nth-child(1) { animation-delay: 0.00s; }
    .icon:not(.dark) .rays path:nth-child(2) { animation-delay: 0.05s; }
    .icon:not(.dark) .rays path:nth-child(3) { animation-delay: 0.10s; }
    .icon:not(.dark) .rays path:nth-child(4) { animation-delay: 0.15s; }
    .icon:not(.dark) .rays path:nth-child(5) { animation-delay: 0.20s; }
    .icon:not(.dark) .rays path:nth-child(6) { animation-delay: 0.25s; }
    .icon:not(.dark) .rays path:nth-child(7) { animation-delay: 0.30s; }
    .icon:not(.dark) .rays path:nth-child(8) { animation-delay: 0.35s; }

    /* ── Moon shine ──────────────────────────────────── */

    .icon .moon-shine {
      d: path("M70 49.5C70 60.8218 60.8218 70 49.5 70C38.1782 70 29 60.8218 29 49.5C29 38.1782 38.1782 29 49.5 29C39 45 49.5 59.5 70 49.5Z");
      fill: none;
      stroke: var(--color-blue-100, #dbeafe);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 20 1000;
      scale: 2;
      transform-origin: 50px 50px;
      opacity: 0;
    }

    @keyframes moon-shine {
      0%   { opacity: 0; stroke-dashoffset:    0; filter: blur(0px); }
      20%  { opacity: 1;                          filter: blur(2px); }
      100% { opacity: 0; stroke-dashoffset: -100; filter: blur(0px); }
    }

    .icon.dark .moon-shine {
      animation: moon-shine 0.75s linear forwards;
    }
  </style>

  <path class="moon-shine" />
  <g class="rays">
    <path d="M50 2V11" pathLength="1" />
    <path d="M85 15L78 22" pathLength="1" />
    <path d="M98 50H89" pathLength="1" />
    <path d="M85 85L78 78" pathLength="1" />
    <path d="M50 98V89" pathLength="1" />
    <path d="M23 78L16 84" pathLength="1" />
    <path d="M11 50H2" pathLength="1" />
    <path d="M23 23L16 16" pathLength="1" />
  </g>
  <path class="main-shape" />
</svg>
