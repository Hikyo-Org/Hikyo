<title>PROTOTYPE: Hikyo member access granularity, iteration 2</title>
<!--
  THROWAWAY PROTOTYPE: member access granularity, iteration 2.

  Iteration 1 verdict (Marc): none of a/b/c made access clearer; add
  negative permissions ("grant on the project, except ...").

  Question: does reading access as RULES (level . where . except) make it
  clearer than capability chips, and does one include/except tree replace
  the scope select, the key picker and the negative permission at once?

  STATUS: explores an AMENDMENT to the locked permission ADR
  (docs/adr/permission-model.md), which has no deny rules and defers
  key/folder grants. Nothing here is locked.

  Semantics shown:
    - A rule = person + level (or none) + reveal / history flags + included
      paths + excepted paths. Paths: org, project, env, folder, key.
    - Levels (View / Edit / Publish / Admin) are a DISPLAY reading of the
      stored capability atoms; a set that matches no level shows its atoms.
      Reveal and reveal-history are never inside a level.
    - EXCEPT IS RULE-LOCAL, NOT A DENY: it narrows only its own rule. Another
      rule reaching the same place still reaches it (Bob: publish payments
      except prod, plus view prod: Bob can view prod). The resolver says so.
    - Paths are live: an except on db/ also covers keys added to db/ later
      (fail-closed); an include on db/ also covers them.
    - Folder / key paths limit edit, publish, reveal, history. read stays
      environment-wide: key names and config values remain visible.
-->

<body>
<div id="app">
  <nav id="side" aria-label="Prototype navigation"></nav>
  <main id="main"></main>

<div id="bar" role="region" aria-label="Prototype switcher"></div>

<script>
/* ---------- fixture ---------- */
const PEOPLE = {
  marc:{name:'Marc Went',id:'usr_01marc',note:'owner'},
  alice:{name:'Alice Novak',id:'usr_01alice',note:'DBA'},
  bob:{name:'Bob Tran',id:'usr_01bob',note:'app developer'},
  chen:{name:'Chen Li',id:'usr_01chen',note:'contractor, Stripe integration'},
  dana:{name:'Dana Ruiz',id:'usr_01dana',note:'SRE'},
  ci:{name:'ci-deploy',id:'mch_01cideploy',note:'automation credential'},
};
const PROJECTS = {
  payments:{envs:[{id:'dev'},{id:'staging'},{id:'prod',prot:true}]},
  web:{envs:[{id:'dev'},{id:'prod',prot:true}]},
};
const KEYS = {
  payments:[
    {k:'DB_HOST',f:'db',s:false},{k:'DB_USER',f:'db',s:false},{k:'DB_PASSWORD',f:'db',s:true},
    {k:'STRIPE_PUBLISHABLE_KEY',f:'stripe',s:false},{k:'STRIPE_SECRET_KEY',f:'stripe',s:true},{k:'STRIPE_WEBHOOK_SECRET',f:'stripe',s:true},
    {k:'LOG_LEVEL',f:'app',s:false},{k:'SESSION_SECRET',f:'app',s:true},
  ],
  web:[{k:'API_URL',f:'app',s:false},{k:'SENTRY_DSN',f:'app',s:true},{k:'COOKIE_SECRET',f:'app',s:true}],
};
/* Levels are a display reading of the stored atoms, not a new stored role.
   Reveal and reveal-history are never part of a level: they stay flags. */
const LEVELS = {
  view:{label:'View',atoms:['read'],hint:'key names, schemas, config values'},
  edit:{label:'Edit',atoms:['read','edit'],hint:'View, plus drafts that someone else publishes'},
  publish:{label:'Publish',atoms:['read','edit','publish','pin'],hint:'Edit, plus publishing and pins'},
  admin:{label:'Admin',atoms:['read','edit','publish','pin','definitions-edit','manage-identities','manage-adapters','project-settings','manage-members'],hint:'Publish, plus definitions, machine access, settings and members'},
};
/* A rule: one person, one level (or none) plus flags, a set of included
   paths and a set of excepted paths. Paths are '*' (whole org), 'project',
   'project/env', 'project/env/folder', 'project/env/folder/KEY'.
   An exception narrows ONLY its own rule. It is not a deny: another rule
   that reaches the same place still reaches it. */
let seq = 1;
const R = (p,level,flags,inc,exc,atoms) => ({id:seq++,p,level,reveal:!!flags.reveal,history:!!flags.history,inc,exc:exc||[],atoms:atoms||null});
const RULES = [
  R('marc','admin',{reveal:1,history:1},['*']),
  R('alice','publish',{},['payments']),
  R('alice',null,{reveal:1},['payments/staging','payments/prod/db']),
  R('bob','publish',{reveal:1},['payments','web'],['payments/prod','web/prod']),
  R('bob','view',{},['payments/prod','web/prod']),
  R('chen','edit',{},['payments/staging/stripe']),
  R('dana','view',{},['*']),
  R('dana',null,{reveal:1,history:1},['payments/prod'],['payments/prod/db']),
  R('ci',null,{},['payments/staging'],[],['read','edit','publish']),
];

/* ---------- state ---------- */
const S = {
  page: new URLSearchParams(location.search).get('page') === 'whocan' ? 'whocan' : 'members',
  theme: localStorage.getItem('proto-theme') || 'dark',
  who: {cap:'reveal',project:'payments',env:'prod',key:'DB_PASSWORD'},
  flash: '',
};

/* ---------- model ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isProt = (pr,env) => PROJECTS[pr]?.envs.some(e => e.id === env && e.prot);
const allEnvs = () => Object.entries(PROJECTS).flatMap(([pr,d]) => d.envs.map(e => [pr,e.id]));
const segs = path => path === '*' ? [] : path.split('/');
/* Does path cover (project, env, folder, key)? A path covers everything under it. */
function covers(path,pr,env,folder,key){
  const s = segs(path), t = [pr,env,folder,key];
  return s.every((x,i) => t[i] === undefined ? false : x === t[i]);
}
const depth = path => segs(path).length; // 0 org, 1 project, 2 env, 3 folder, 4 key
const atomsOf = r => [...(r.atoms || (r.level ? LEVELS[r.level].atoms : [])), ...(r.reveal?['reveal']:[]), ...(r.history?['reveal-history']:[])];
/* read is project-wide by design: a folder or key path can neither narrow
   nor except it. A folder include still grants read on its environment. */
function ruleReaches(r,cap,pr,env,k){
  if(!atomsOf(r).includes(cap)) return {hit:false};
  const key = k ? KEYS[pr].find(x => x.k === k) : null;
  const f = key ? key.f : undefined;
  const fine = cap !== 'read';
  const incOk = r.inc.some(p => fine ? covers(p,pr,env,f,k) : (depth(p) <= 2 ? covers(p,pr,env,f,k) : covers(segs(p).slice(0,2).join('/'),pr,env,f,k)));
  if(!incOk) return {hit:false};
  const exc = r.exc.find(p => fine ? covers(p,pr,env,f,k) : depth(p) <= 2 && covers(p,pr,env,f,k));
  if(exc) return {hit:true,ok:false,exc};
  return {hit:true,ok:true};
}
function resolve(p,cap,pr,env,k){
  const rs = RULES.filter(r => r.p === p);
  const out = rs.map(r => ({r,...ruleReaches(r,cap,pr,env,k)})).filter(x => x.hit);
  const ok = out.find(x => x.ok);
  const blocked = out.find(x => !x.ok);
  if(ok) return {state:'yes',rule:ok.r,alsoExcepted:blocked};
  if(blocked) return {state:'excepted',rule:blocked.r,exc:blocked.exc};
  return {state:'no'};
}

/* ---------- display ---------- */
const pathLabel = p => {
  if(p === '*') return 'all of acme';
  const s = segs(p);
  return s.join('/') + (s.length === 3 ? '/' : '') + (s.length === 2 && isProt(s[0],s[1]) ? ' 🔒' : '');
};
const levelLabel = r => r.level ? LEVELS[r.level].label : r.atoms ? r.atoms.join(', ') : '';
function reachOf(r){
  const envs = allEnvs().filter(([pr,env]) => r.inc.some(p => depth(p) <= 2 ? covers(p,pr,env) : covers(segs(p).slice(0,2).join('/'),pr,env)) && !r.exc.some(p => depth(p) <= 2 && covers(p,pr,env)));
  const parts = [`${envs.length} of ${allEnvs().length} environments`];
  if(r.reveal){
    let n = 0; for(const [pr,env] of allEnvs()) for(const k of KEYS[pr]) if(k.s && ruleReaches(r,'reveal',pr,env,k.k).ok) n++;
    parts.push(`reveals ${n} secret values`);
  }
  const prodIn = envs.filter(([pr,env]) => isProt(pr,env)).length;
  parts.push(prodIn ? `${prodIn} protected` : 'no protected environment');
  if(r.inc.some(p => depth(p) <= 1)) parts.push('new environments included');
  return parts.join(' · ');
}
function ruleLine(r,withActions){
  const lvl = levelLabel(r);
  return `<li class="rule">
    <div class="rule__main">
      <div class="rule__line">
        ${lvl ? `<span class="lvl">${esc(lvl)}</span>` : ''}
        ${r.reveal ? `<span class="flag">🔓 reveals secrets</span>` : ''}
        ${r.history ? `<span class="flag flag--hist">↺ reveals history</span>` : ''}
        <span class="sep">in</span>
        <span class="where">${r.inc.map(pathLabel).join(', ')}</span>
        ${r.exc.length ? `<span class="sep">except</span><span class="except">✕ ${r.exc.map(pathLabel).join(', ')}</span>` : ''}
      </div>
      <span class="reach">${reachOf(r)}</span>
    </div>
    ${withActions ? `<button class="btn btn--quiet" data-edit="${r.id}" aria-label="Edit rule">Edit</button>` : ''}
  </li>`;
}

/* ---------- chrome ---------- */
function renderSide(){
  $('#side').innerHTML = `
    <div class="navgroup"><span class="eyebrow">Organisation · acme</span>
      <button class="nav" data-go="members" ${S.page==='members'?'aria-current="page"':''}>Members</button>
      <button class="nav" data-go="whocan" ${S.page==='whocan'?'aria-current="page"':''}>Who can...?</button>
      <button class="nav" aria-disabled="true">Settings</button>
    </div>`;
}
function renderBar(){
  $('#bar').innerHTML = `<div class="row">
      <a class="btn btn--quiet" href="../1/" style="min-height:32px">‹ iteration 1</a>
      <button data-theme-toggle aria-label="Toggle theme">${S.theme==='dark'?'☾':'☀'}</button>
    </div>
    <p class="hint">Iteration 2: access as rules (level · where · except). Tap Edit or Add access.</p>`;
}

/* ---------- pages ---------- */
function pageMembers(){
  return `
    <h1>Members · acme</h1>
    <p class="lede">Each line is one access rule: a level, where it applies, and what it leaves out. <strong>Except</strong> narrows only its own line; if another line reaches the same place, that line still counts. Secrets are always a separate flag, never part of a level.</p>
    <section class="panel" aria-labelledby="mem-h">
      <div class="panel__head"><h2 id="mem-h">Members</h2><p>${Object.keys(PEOPLE).length} members, ${RULES.length} rules</p><span class="spacer"></span><button class="btn">Invite</button></div>
      <ul class="people">${Object.keys(PEOPLE).map(p => `<li class="person">
        <div class="who"><b>${PEOPLE[p].name}${p==='marc'?' <span class="badge">you</span>':''}</b><span>${PEOPLE[p].id}</span><span style="font-family:var(--sans)">${PEOPLE[p].note}</span></div>
        <div style="display:flex;flex-direction:column;gap:var(--space-2)">
          <ul class="rules">${RULES.filter(r => r.p===p).map(r => ruleLine(r,true)).join('') || '<li class="muted">· no access</li>'}</ul>
          <button class="btn btn--quiet addrule" data-add="${p}">+ Add access</button>
        </div>
      </li>`).join('')}</ul>
    </section>`;
}

function pageWhoCan(){
  const w = S.who;
  const envs = PROJECTS[w.project].envs, keys = KEYS[w.project];
  if(!envs.some(e => e.id===w.env)) w.env = envs[0].id;
  if(!keys.some(k => k.k===w.key)) w.key = keys[0].k;
  const res = Object.keys(PEOPLE).map(p => ({p,...resolve(p,w.cap,w.project,w.env,w.key)}));
  const yes = res.filter(r => r.state==='yes'), exc = res.filter(r => r.state==='excepted'), no = res.filter(r => r.state==='no');
  const capName = {read:'view',edit:'edit',publish:'publish',reveal:'reveal','reveal-history':'reveal history of'}[w.cap];
  const line = (r,glyph,cls,why) => `<li><span class="${cls}" aria-hidden="true">${glyph}</span><span>${PEOPLE[r.p].name}</span><span class="why">${why}</span></li>`;
  const ruleText = r => `${[levelLabel(r), r.reveal ? 'reveals secrets' : '', r.history ? 'reveals history' : ''].filter(Boolean).join(' + ')} in ${r.inc.map(pathLabel).join(', ')}${r.exc.length?` except ${r.exc.map(pathLabel).join(', ')}`:''}`.trim();
  return `
    <h1>Who can...?</h1>
    <p class="lede">Pick a key, not just a scope. The answer names the rule that grants access and, for anyone left out by an <strong>except</strong>, which one.</p>
    <section class="panel" aria-labelledby="wc-h">
      <h2 id="wc-h" class="vh">Question</h2>
      <div class="resolver">
        <label class="field">Can<select data-who="cap">${[['read','view'],['edit','edit'],['publish','publish'],['reveal','reveal'],['reveal-history','reveal history of']].map(([v,l]) => `<option value="${v}" ${v===w.cap?'selected':''}>${l}</option>`).join('')}</select></label>
        <label class="field">Project<select data-who="project">${Object.keys(PROJECTS).map(p => `<option ${p===w.project?'selected':''}>${p}</option>`).join('')}</select></label>
        <label class="field">Environment<select data-who="env">${envs.map(e => `<option value="${e.id}" ${e.id===w.env?'selected':''}>${e.id}${e.prot?' 🔒':''}</option>`).join('')}</select></label>
        <label class="field">Key<select data-who="key">${[...new Set(keys.map(k => k.f))].map(f => `<optgroup label="${f}/">${keys.filter(k => k.f===f).map(k => `<option value="${k.k}" ${k.k===w.key?'selected':''}>${k.k}${k.s?' (secret)':''}</option>`).join('')}</optgroup>`).join('')}</select></label>
      </div>
      <div class="quick" aria-label="Example questions">
        <button data-q="reveal|payments|prod|DB_PASSWORD">reveal prod DB_PASSWORD</button>
        <button data-q="reveal|payments|prod|STRIPE_SECRET_KEY">reveal prod STRIPE_SECRET_KEY</button>
        <button data-q="read|payments|prod|LOG_LEVEL">view prod LOG_LEVEL</button>
        <button data-q="edit|payments|prod|LOG_LEVEL">edit prod LOG_LEVEL</button>
        <button data-q="edit|payments|staging|DB_HOST">edit staging DB_HOST</button>
      </div>
      <h3 style="margin-top:var(--space-5)">Can ${capName} <code>${w.key}</code> in ${w.project}/${w.env}: ${yes.length}</h3>
      <ul class="answer">${yes.map(r => line(r,'✓','g-direct',`via <code>${esc(ruleText(r.rule))}</code>${r.alsoExcepted ? `. Another rule excepts it (<code>${esc(pathLabel(r.alsoExcepted.exc))}</code>), but an except only narrows its own rule.` : ''}`)).join('') || '<li class="muted">· no one</li>'}</ul>
      ${exc.length ? `<h3 style="margin-top:var(--space-4)">Left out by an except: ${exc.length}</h3><ul class="answer">${exc.map(r => line(r,'✕','except',`<code>${esc(ruleText(r.rule))}</code> reaches here, but excepts <code>${esc(pathLabel(r.exc))}</code>`)).join('')}</ul>` : ''}
      <details style="margin-top:var(--space-4)"><summary class="dim" style="min-height:var(--control);display:flex;align-items:center;cursor:pointer">No rule reaches: ${no.length}</summary><ul class="answer">${no.map(r => line(r,'·','muted','no rule covers this')).join('')}</ul></details>
    </section>`;
}

/* ---------- rule editor ---------- */
function openDialog(html,bind){
  const d = $('#dlg'); d.innerHTML = html; if(!d.open) d.showModal(); bind && bind(d);
  d.querySelectorAll('[data-close]').forEach(b => b.onclick = () => d.close());
}
function editor(rule,p){
  const st = rule
    ? {id:rule.id,p:rule.p,level:rule.level,reveal:rule.reveal,history:rule.history,inc:[...rule.inc],exc:[...rule.exc],atoms:rule.atoms}
    : {id:null,p,level:'view',reveal:false,history:false,inc:[],exc:[],atoms:null};
  const open = new Set(['*','payments','web']);
  st.inc.concat(st.exc).forEach(x => { const s = segs(x); for(let i=1;i<s.length;i++) open.add(s.slice(0,i).join('/')); });
  /* node state: inc | exc | via (covered by an included ancestor) | off */
  const stateOf = path => {
    if(st.inc.includes(path)) return 'inc';
    if(st.exc.includes(path)) return 'exc';
    const s = segs(path);
    for(let i = s.length - 1; i >= 0; i--){
      const anc = i === 0 ? '*' : s.slice(0,i).join('/');
      if(st.exc.includes(anc)) return 'excvia';
      if(st.inc.includes(anc)) return 'via';
    }
    return 'off';
  };
  const cycle = path => {
    const s = stateOf(path);
    const drop = arr => arr.filter(x => x !== path && !(path === '*' ? true : x.startsWith(path + '/')));
    if(s === 'off'){ st.inc = drop(st.inc); st.exc = drop(st.exc); st.inc.push(path); }
    else if(s === 'inc'){ st.inc = st.inc.filter(x => x !== path); }
    else if(s === 'via'){ st.exc = drop(st.exc); st.exc.push(path); }
    else if(s === 'exc'){ st.exc = st.exc.filter(x => x !== path); }
  };
  const triLabel = {inc:'✓ include',exc:'✕ except',via:'✓ included',excvia:'✕ excepted',off:'· off'};
  const children = path => {
    if(path === '*') return Object.keys(PROJECTS).map(p => ({path:p,label:p}));
    const s = segs(path);
    if(s.length === 1) return PROJECTS[s[0]].envs.map(e => ({path:`${s[0]}/${e.id}`,label:e.id + (e.prot?' 🔒':'')}));
    if(s.length === 2) return [...new Set(KEYS[s[0]].map(k => k.f))].map(f => ({path:`${path}/${f}`,label:f + '/'}));
    if(s.length === 3) return KEYS[s[0]].filter(k => k.f === s[2]).map(k => ({path:`${path}/${k.k}`,label:k.k + (k.s?' 🔒':'')}));
    return [];
  };
  const nodeHtml = (n) => {
    const kids = children(n.path);
    const s = stateOf(n.path);
    const isOpen = open.has(n.path);
    const disabled = s === 'excvia';
    return `<li><div class="node">
      <button class="twist ${kids.length?'':'twist--none'}" type="button" data-twist="${n.path}" aria-expanded="${isOpen}" aria-label="${isOpen?'Collapse':'Expand'} ${esc(n.label)}">${isOpen?'▾':'▸'}</button>
      <button class="tri" type="button" data-tri="${n.path}" data-s="${s==='excvia'?'exc':s}" ${disabled?'disabled':''} aria-label="${esc(n.label)}: ${triLabel[s]}">${triLabel[s]}</button>
      <span class="nodelabel ${s==='off'||s==='excvia'?'dimmed':''}">${esc(n.label)}</span>
    </div>${kids.length && isOpen ? `<ul>${kids.map(nodeHtml).join('')}</ul>` : ''}</li>`;
  };
  const draw = () => {
    const tmp = {level:st.level,reveal:st.reveal,history:st.history,inc:st.inc,exc:st.exc,atoms:st.atoms};
    const hasAccess = st.level || st.reveal || st.history || st.atoms;
    const fineExc = st.exc.filter(x => depth(x) >= 3);
    const fineInc = st.inc.filter(x => depth(x) >= 3);
    const orgWide = st.inc.includes('*');
    openDialog(`<form class="dlg" method="dialog" style="gap:var(--space-4)">
      <h2 id="dlg-title">${st.id ? 'Edit access' : 'Add access'} · ${PEOPLE[st.p].name}</h2>
      <fieldset style="border:0;display:flex;flex-direction:column;gap:var(--space-2)"><legend class="eyebrow" style="margin-bottom:var(--space-2)">Level</legend>
        <div class="levels" role="group" aria-label="Level">
          <button type="button" data-level="" aria-pressed="${!st.level && !st.atoms}">None</button>
          ${Object.entries(LEVELS).map(([id,l]) => `<button type="button" data-level="${id}" aria-pressed="${st.level===id}">${l.label}</button>`).join('')}
        </div>
        <p class="lvlhint">${st.level ? LEVELS[st.level].hint : st.atoms ? `Custom set: ${st.atoms.join(', ')}. Picking a level replaces it.` : 'No level: only the secret flags below apply.'}</p>
        <label class="chk"><input type="checkbox" data-flag="reveal" ${st.reveal?'checked':''}> <span><strong>Reveal secrets</strong> <span class="muted">· current secret values, with reauthentication</span></span></label>
        <label class="chk"><input type="checkbox" data-flag="history" ${st.history?'checked':''}> <span><strong>Reveal history</strong> <span class="muted">· superseded secret values</span></span></label>
      </fieldset>
      <fieldset style="border:0;display:flex;flex-direction:column;gap:var(--space-2)"><legend class="eyebrow" style="margin-bottom:var(--space-2)">Where</legend>
        <p class="lvlhint">Tap to include. Inside an included place, tap to except. An except follows the folder: keys added to it later stay excepted.</p>
        <ul class="ttree">${nodeHtml({path:'*',label:'acme (whole organisation)'})}</ul>
      </fieldset>
      <div class="summary ${orgWide?'bad':st.exc.length?'':'warn'}">
        <p class="sentence">${hasAccess && st.inc.length ? `${PEOPLE[st.p].name.split(' ')[0]} can ${[levelLabel(tmp) ? `<b>${esc(levelLabel(tmp).toLowerCase())}</b>` : '', st.reveal ? '<b>reveal secrets</b>' : '', st.history ? '<b>reveal history</b>' : ''].filter(Boolean).join(' and ')} in <b>${st.inc.map(pathLabel).join(', ')}</b>${st.exc.length ? `, except <b>${st.exc.map(pathLabel).join(', ')}</b>` : ''}.` : 'Pick a level or flag, then where it applies.'}</p>
        ${hasAccess && st.inc.length ? `<p class="reach" style="font-size:var(--fs-sm)">${reachOf(tmp)}</p>` : ''}
        ${orgWide ? '<p style="font-size:var(--fs-sm)">Whole organisation: reaches every project, including production and projects created later.</p>' : ''}
        ${fineInc.length || fineExc.length ? '<p style="font-size:var(--fs-sm)">Folder and key choices limit edit, publish and reveal. Key names and config values stay visible across the environment.</p>' : ''}
      </div>
      <div class="dlg__foot">
        ${st.id ? '<button class="btn" type="button" data-del style="color:var(--danger);border-color:var(--danger);margin-right:auto">Remove rule</button>' : ''}
        <button class="btn" type="button" data-close>Cancel</button>
        <button class="btn btn--primary" type="button" data-save ${hasAccess && st.inc.length ? '' : 'disabled'}>Save</button>
      </div>
    </form>`, d => {
      d.querySelectorAll('[data-level]').forEach(b => b.onclick = () => { st.level = b.dataset.level || null; st.atoms = null; draw(); });
      d.querySelectorAll('[data-flag]').forEach(i => i.onchange = () => { st[i.dataset.flag] = i.checked; draw(); });
      d.querySelectorAll('[data-twist]').forEach(b => b.onclick = () => { const x = b.dataset.twist; open.has(x) ? open.delete(x) : open.add(x); draw(); });
      d.querySelectorAll('[data-tri]').forEach(b => b.onclick = () => { cycle(b.dataset.tri); draw(); d.querySelector(`[data-tri="${b.dataset.tri}"]`)?.focus(); });
      const del = d.querySelector('[data-del]');
      if(del) del.onclick = () => { RULES.splice(RULES.findIndex(r => r.id === st.id),1); d.close(); render(); };
      d.querySelector('[data-save]').onclick = () => {
        const next = {id:st.id || seq++,p:st.p,level:st.level,reveal:st.reveal,history:st.history,inc:st.inc,exc:st.exc,atoms:st.atoms};
        const i = RULES.findIndex(r => r.id === st.id);
        i >= 0 ? RULES.splice(i,1,next) : RULES.push(next);
        d.close(); render();
      };
    });
  };
  draw();
}

/* ---------- render + events ---------- */
function render(){
  document.documentElement.dataset.theme = S.theme;
  renderSide(); renderBar();
  $('#main').innerHTML = S.page === 'whocan' ? pageWhoCan() : pageMembers();
  const u = new URL(location); u.searchParams.set('page',S.page); history.replaceState(null,'',u);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if(!t || t.closest('#dlg')) return;
  if(t.hasAttribute('data-theme-toggle')){ S.theme = S.theme==='dark'?'light':'dark'; localStorage.setItem('proto-theme',S.theme); render(); return; }
  if(t.dataset.go){ if(t.getAttribute('aria-disabled')==='true') return; S.page = t.dataset.go; render(); window.scrollTo(0,0); return; }
  if(t.dataset.edit){ editor(RULES.find(r => r.id === +t.dataset.edit)); return; }
  if(t.dataset.add){ editor(null,t.dataset.add); return; }
  if(t.dataset.q){ const [cap,project,env,key] = t.dataset.q.split('|'); Object.assign(S.who,{cap,project,env,key}); render(); return; }
});
document.addEventListener('change', e => { const t = e.target; if(t.dataset.who){ S.who[t.dataset.who] = t.value; render(); } });
render();
</script>
</body>
</html>
