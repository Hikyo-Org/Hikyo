<title>PROTOTYPE: Hikyo member access granularity, iteration 3</title>
<!--
  THROWAWAY PROTOTYPE: member access granularity, iteration 3.

  Iteration 2 verdict (Sam): wants e.g. Admin on a single folder, for one
  or more environments, not the whole org or project. The it-2 tree needed
  a tap per environment for that and Admin was implicitly project-wide.

  Question: is "where" clearer as three independent axes, projects ›
  environments › keys, each "all, except…" or "only…", and can Admin be
  scoped to a folder by saying exactly which admin powers survive there?

  STATUS: explores an AMENDMENT to the locked permission ADR
  (docs/adr/permission-model.md: no deny rules, key/folder grants deferred).

  Semantics shown:
    - Rule = person + level + reveal / history flags + projects × envs × keys.
    - Environments are named once and apply in every chosen project that has
      one; "all" includes environments (and "all projects" projects) created
      later. Key axis "all" includes keys added later; an except on a folder
      follows the folder.
    - EXCEPT IS RULE-LOCAL, NOT A DENY.
    - Level powers depend on rule shape: read/edit/publish, definitions-edit
      and manage-members work on a folder; pin needs whole environments;
      manage-identities, manage-adapters, project-settings need a whole
      project. The editor lists which survive and why.
    - Folder-scoped manage-members delegates only inside the rule, at most at
      its level.
    - read stays environment-wide: key names and config values stay visible.
-->

/* Capability table: [atom, plain words, minimum level, narrowest allowed shape].
   shape: 'key' works on a folder/key; 'env' needs whole environments (all keys);
   'project' needs all keys AND all environments of the project. */
const CAPS = [
  ['read','see key names, schemas and config values','view','key'],
  ['edit','draft value changes','edit','key'],
  ['publish','publish drafts, roll back','publish','key'],
  ['pin','pin a revision for workloads','publish','env'],
  ['definitions-edit','add, rename, remove keys and rules','admin','key'],
  ['manage-members','give others access, up to this rule and never wider','admin','key'],
  ['manage-identities','service accounts and their credentials','admin','project'],
  ['manage-adapters','deployment adapters and sync','admin','project'],
  ['project-settings','protected flag, reauth window, retention','admin','project'],
];
/* A rule: person, level, secret flags, and three independent axes.
   projects: '*' (all, including future) or a list.
   envs / keys: {mode:'all', exc:[...]} or {mode:'only', list:[...]}.
   Environments are named once and apply in every chosen project that has one.
   Key items: 'db' (a folder) or 'db/DB_PASSWORD' (one key).
   An except narrows ONLY its own rule; it is not a deny. */
let seq = 1;
const ALL = () => ({mode:'all',exc:[]});
const ONLY = list => ({mode:'only',list});
const EXC = exc => ({mode:'all',exc});
const R = (p,level,flags,projects,envs,keys,atoms) => ({id:seq++,p,level,reveal:!!flags.reveal,history:!!flags.history,projects,envs,keys,atoms:atoms||null});
const RULES = [
  R('sam','admin',{reveal:1,history:1},'*',ALL(),ALL()),
  R('alice','publish',{},['payments'],ALL(),ALL()),
  R('alice','admin',{reveal:1},['payments'],ONLY(['staging','prod']),ONLY(['db'])),
  R('bob','publish',{reveal:1},['payments','web'],EXC(['prod']),ALL()),
  R('bob','view',{},['payments','web'],ONLY(['prod']),ALL()),
  R('chen','edit',{},['payments'],ONLY(['staging']),ONLY(['stripe'])),
  R('dana','view',{},'*',ALL(),ALL()),
  R('dana',null,{reveal:1,history:1},['payments'],ONLY(['prod']),EXC(['db'])),
  R('ci',null,{},['payments'],ONLY(['staging']),ALL(),['read','edit','publish']),
];

/* ---------- state ---------- */
const S = {
  page: new URLSearchParams(location.search).get('page') === 'whocan' ? 'whocan' : 'members',
  theme: localStorage.getItem('proto-theme') || 'dark',
  who: {cap:'definitions-edit',project:'payments',env:'prod',key:'DB_PASSWORD'},
};

/* ---------- model ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isProt = (pr,env) => PROJECTS[pr]?.envs.some(e => e.id === env && e.prot);
const projList = r => r.projects === '*' ? Object.keys(PROJECTS) : r.projects;
const envNames = projects => [...new Set(projects.flatMap(p => PROJECTS[p].envs.map(e => e.id)))];
const protName = name => Object.values(PROJECTS).some(d => d.envs.some(e => e.id === name && e.prot));
const folderNames = projects => [...new Set(projects.flatMap(p => KEYS[p].map(k => k.f)))];
const keyMatch = (item,k) => item === k.f || item === `${k.f}/${k.k}`;
const narrowKeys = r => !(r.keys.mode === 'all' && r.keys.exc.length === 0);
const envsNarrowed = r => !(r.envs.mode === 'all' && r.envs.exc.length === 0);

/* Which atoms does this rule carry, given its shape? */
function atomsOf(r){
  const out = [];
  if(r.atoms) out.push(...r.atoms);
  else if(r.level) for(const [atom,,min,shape] of CAPS){
    if(RANK[r.level] < RANK[min]) continue;
    if(shape === 'env' && narrowKeys(r)) continue;
    if(shape === 'project' && (narrowKeys(r) || envsNarrowed(r))) continue;
    out.push(atom);
  }
  if(r.reveal) out.push('reveal');
  if(r.history) out.push('reveal-history');
  return out;
}
/* Does rule r give cap on (pr, env, key)? read ignores key narrowing (the
   catalogue and config values are environment-wide); an env except removes
   everything. */
function ruleReaches(r,cap,pr,env,keyName){
  if(!atomsOf(r).includes(cap)) return {hit:false};
  if(!projList(r).includes(pr)) return {hit:false};
  if(r.envs.mode === 'only' && !r.envs.list.includes(env)) return {hit:false};
  if(r.envs.mode === 'all' && r.envs.exc.includes(env)) return {hit:true,ok:false,why:`except ${env}`};
  if(cap === 'read' || !keyName) return {hit:true,ok:true};
  const k = KEYS[pr].find(x => x.k === keyName);
  if(r.keys.mode === 'only' && !r.keys.list.some(i => keyMatch(i,k))) return {hit:false};
  if(r.keys.mode === 'all'){ const e = r.keys.exc.find(i => keyMatch(i,k)); if(e) return {hit:true,ok:false,why:`except ${e.includes('/') ? e : e + '/'}`}; }
  return {hit:true,ok:true};
}
function resolve(p,cap,pr,env,k){
  const hits = RULES.filter(r => r.p === p).map(r => ({r,...ruleReaches(r,cap,pr,env,k)})).filter(x => x.hit);
  const ok = hits.find(x => x.ok), no = hits.find(x => !x.ok);
  if(ok) return {state:'yes',rule:ok.r,also:no};
  if(no) return {state:'excepted',rule:no.r,why:no.why};
  return {state:'no'};
}

/* ---------- display ---------- */
const levelLabel = r => r.level ? LEVELS[r.level].label : r.atoms ? r.atoms.join(', ') : '';
const envText = (r,projects) => r.envs.mode === 'all'
  ? (r.envs.exc.length ? {main:'all environments',exc:r.envs.exc.map(e => e + (protName(e)?' 🔒':''))} : {main:'all environments',exc:[]})
  : {main:r.envs.list.map(e => e + (protName(e)?' 🔒':'')).join(', '),exc:[]};
const keyText = r => r.keys.mode === 'all'
  ? {main:'all keys',exc:r.keys.exc.map(i => i.includes('/') ? i : i + '/')}
  : {main:'only ' + r.keys.list.map(i => i.includes('/') ? i : i + '/').join(', '),exc:[]};
const projText = r => r.projects === '*' ? 'all projects' : r.projects.join(', ');
function reachOf(r){
  const pairs = projList(r).flatMap(pr => PROJECTS[pr].envs.filter(e => r.envs.mode === 'all' ? !r.envs.exc.includes(e.id) : r.envs.list.includes(e.id)).map(e => [pr,e.id]));
  const parts = [`${pairs.length} environment${pairs.length===1?'':'s'}`];
  const keys = new Set(); let secrets = 0;
  for(const [pr,env] of pairs) for(const k of KEYS[pr]){
    const r0 = {...r,atoms:['edit'],level:null,reveal:false,history:false};
    if(ruleReaches(r0,'edit',pr,env,k.k).ok) keys.add(pr+k.k);
    if(r.reveal && k.s && ruleReaches(r,'reveal',pr,env,k.k).ok) secrets++;
  }
  parts.push(`${keys.size} keys`);
  if(r.reveal) parts.push(`reveals ${secrets} secret values`);
  const prot = pairs.filter(([pr,e]) => isProt(pr,e)).length;
  parts.push(prot ? `${prot} protected` : 'no protected environment');
  if(r.projects === '*') parts.push('new projects included');
  else if(r.envs.mode === 'all') parts.push('new environments included');
  return parts.join(' · ');
}
function ruleLine(r){
  const e = envText(r), k = keyText(r);
  const lost = r.level === 'admin' && (narrowKeys(r) || envsNarrowed(r)) ? CAPS.filter(c => c[2]==='admin' && !atomsOf(r).includes(c[0])).length : 0;
  return `<li class="rule">
    <div class="rule__main">
      <div class="rule__line">
        ${levelLabel(r) ? `<span class="lvl">${esc(levelLabel(r))}</span>` : ''}
        ${r.reveal ? '<span class="flag">🔓 reveals secrets</span>' : ''}
        ${r.history ? '<span class="flag flag--hist">↺ reveals history</span>' : ''}
      </div>
      <div class="rule__line">
        <span class="where">${projText(r)}</span><span class="sep">›</span>
        <span class="where">${e.main}</span>${e.exc.length ? `<span class="except">✕ ${e.exc.join(', ')}</span>` : ''}<span class="sep">›</span>
        <span class="where">${k.main}</span>${k.exc.length ? `<span class="except">✕ ${k.exc.join(', ')}</span>` : ''}
      </div>
      <span class="reach">${reachOf(r)}${lost ? ` · admin within this scope: ${lost} project-wide powers do not apply` : ''}</span>
    </div>
    <button class="btn btn--quiet" data-edit="${r.id}" aria-label="Edit rule">Edit</button>
  </li>`;
}

function pageMembers(){
  return `
    <h1>Members · acme</h1>
    <p class="lede">Each card is one access rule: what (level and secret flags), then where, read left to right: <strong>projects › environments › keys</strong>. Each step is either "all, except" or "only". An except narrows only its own rule.</p>
    <section class="panel" aria-labelledby="mem-h">
      <div class="panel__head"><h2 id="mem-h">Members</h2><p>${Object.keys(PEOPLE).length} members, ${RULES.length} rules</p><span class="spacer"></span><button class="btn">Invite</button></div>
      <ul class="people">${Object.keys(PEOPLE).map(p => `<li class="person">
        <div class="who"><b>${PEOPLE[p].name}${p==='sam'?' <span class="badge">you</span>':''}</b><span>${PEOPLE[p].id}</span><span style="font-family:var(--sans)">${PEOPLE[p].note}</span></div>

          <button class="btn btn--quiet addrule" data-add="${p}">+ Add access</button>
        </div>
      </li>`).join('')}</ul>
    </section>`;
}

function pageWhoCan(){
  const w = S.who;
  const envs = PROJECTS[w.project].envs, keys = KEYS[w.project];
  if(!envs.some(e => e.id===w.env)) w.env = envs[0].id;
  if(!keys.some(k => k.k===w.key)) w.key = keys[0].k;
  const res = Object.keys(PEOPLE).map(p => ({p,...resolve(p,w.cap,w.project,w.env,w.key)}));
  const yes = res.filter(r => r.state==='yes'), exc = res.filter(r => r.state==='excepted'), no = res.filter(r => r.state==='no');
  const ruleText = r => { const e = envText(r), k = keyText(r); return `${[levelLabel(r), r.reveal?'reveals secrets':'', r.history?'reveals history':''].filter(Boolean).join(' + ')} · ${projText(r)} › ${e.main}${e.exc.length?' except '+e.exc.join(', '):''} › ${k.main}${k.exc.length?' except '+k.exc.join(', '):''}`; };
  const line = (r,glyph,cls,why) => `<li><span class="${cls}" aria-hidden="true">${glyph}</span><span>${PEOPLE[r.p].name}</span><span class="why">${why}</span></li>`;
  const capOpts = [['read','see'],['edit','edit'],['publish','publish'],['definitions-edit','change definitions of'],['manage-members','give others access to'],['reveal','reveal'],['reveal-history','reveal history of']];
  return `
    <h1>Who can...?</h1>
    <p class="lede">Ask about one key in one environment. The answer names the rule that grants it, or the except that leaves someone out.</p>
    <section class="panel" aria-labelledby="wc-h">
      <h2 id="wc-h" class="vh">Question</h2>
      <div class="resolver">
        <label class="field">Can<select data-who="cap">${capOpts.map(([v,l]) => `<option value="${v}" ${v===w.cap?'selected':''}>${l}</option>`).join('')}</select></label>
        <label class="field">Project<select data-who="project">${Object.keys(PROJECTS).map(p => `<option ${p===w.project?'selected':''}>${p}</option>`).join('')}</select></label>
        <label class="field">Environment<select data-who="env">${envs.map(e => `<option value="${e.id}" ${e.id===w.env?'selected':''}>${e.id}${e.prot?' 🔒':''}</option>`).join('')}</select></label>
        <label class="field">Key<select data-who="key">${[...new Set(keys.map(k => k.f))].map(f => `<optgroup label="${f}/">${keys.filter(k => k.f===f).map(k => `<option value="${k.k}" ${k.k===w.key?'selected':''}>${k.k}${k.s?' (secret)':''}</option>`).join('')}</optgroup>`).join('')}</select></label>
      </div>
      <div class="quick" aria-label="Example questions">
        <button data-q="definitions-edit|payments|prod|DB_PASSWORD">change definitions of prod DB_PASSWORD</button>
        <button data-q="manage-members|payments|staging|DB_USER">give access to staging DB_USER</button>
        <button data-q="reveal|payments|prod|DB_PASSWORD">reveal prod DB_PASSWORD</button>
        <button data-q="read|payments|prod|LOG_LEVEL">see prod LOG_LEVEL</button>
        <button data-q="publish|payments|dev|DB_HOST">publish dev DB_HOST</button>
      </div>
      <h3 style="margin-top:var(--space-5)">Yes: ${yes.length}</h3>
      <ul class="answer">${yes.map(r => line(r,'✓','g-direct',`via <code>${esc(ruleText(r.rule))}</code>${r.also ? `. Another rule has <code>${esc(r.also.why)}</code>, but an except only narrows its own rule.` : ''}`)).join('') || '<li class="muted">· no one</li>'}</ul>
      ${exc.length ? `<h3 style="margin-top:var(--space-4)">Left out by an except: ${exc.length}</h3><ul class="answer">${exc.map(r => line(r,'✕','except',`<code>${esc(ruleText(r.rule))}</code> reaches here, but has <code>${esc(r.why)}</code>`)).join('')}</ul>` : ''}
      <details style="margin-top:var(--space-4)"><summary class="dim" style="min-height:var(--control);display:flex;align-items:center;cursor:pointer">No rule reaches: ${no.length}</summary><ul class="answer">${no.map(r => line(r,'·','muted','no rule covers this')).join('')}</ul></details>
    </section>`;
}

/* ---------- editor ---------- */
function openDialog(html,bind){
  const d = $('#dlg'); d.innerHTML = html; if(!d.open) d.showModal(); bind && bind(d);
  d.querySelectorAll('[data-close]').forEach(b => b.onclick = () => d.close());
}
function editor(rule,p){
  const clone = x => JSON.parse(JSON.stringify(x));
  const st = rule ? clone(rule) : {id:null,p,level:'view',reveal:false,history:false,projects:[],envs:ALL(),keys:ALL(),atoms:null};
  /* one chip control per axis: in "all" mode a tap toggles except, in "only" mode it toggles include */
  const chipState = (axis,item) => axis.mode === 'all' ? (axis.exc.includes(item) ? 'exc' : 'via') : (axis.list.includes(item) ? 'inc' : 'off');
  const toggle = (axis,item) => {
    const arr = axis.mode === 'all' ? axis.exc : axis.list;
    const i = arr.indexOf(item); i >= 0 ? arr.splice(i,1) : arr.push(item);
  };
  const setMode = (key,mode) => { st[key] = mode === 'all' ? ALL() : ONLY([]); };
  const draw = () => {
    const projects = st.projects === '*' ? Object.keys(PROJECTS) : st.projects;
    const envs = envNames(projects), folders = folderNames(projects);
    const hasWhat = st.level || st.reveal || st.history || st.atoms;
    const hasWhere = projects.length && (st.envs.mode === 'all' || st.envs.list.length) && (st.keys.mode === 'all' || st.keys.list.length);
    const valid = hasWhat && hasWhere;
    const atoms = atomsOf(st);
    const e = envText(st), k = keyText(st);
    const capsHere = st.level ? CAPS.filter(c => RANK[st.level] >= RANK[c[2]]) : [];
    const shapeWhy = shape => shape === 'env' ? 'needs all keys of an environment' : 'needs a whole project: all environments and all keys';
    const axisHtml = (key,title,items,label) => {
      const ax = st[key];
      return `<div class="axis"><div class="axis__head"><h3>${title}</h3>
        <div class="seg" role="group" aria-label="${title} mode"><button type="button" data-mode="${key}|all" aria-pressed="${ax.mode==='all'}">All, except…</button><button type="button" data-mode="${key}|only" aria-pressed="${ax.mode==='only'}">Only…</button></div></div>
        <p class="lvlhint">${ax.mode==='all' ? `Everything${key==='envs'?', including environments added later':', including keys added later'}. Tap to except.` : 'Tap to include.'}</p>
        <div class="chips">${items.map(([id,lab]) => { const s = chipState(ax,id); return `<button type="button" class="chip" data-chip="${key}|${id}" data-s="${s}" aria-pressed="${s==='inc'||s==='via'}" aria-label="${esc(lab)}: ${s==='exc'?'excepted':s==='off'?'not included':'included'}">${s==='exc'?'✕':s==='off'?'+':'✓'} ${esc(lab)}</button>`; }).join('')}</div>
        ${key==='keys' ? `<details class="keys-more" ${st.keys[st.keys.mode==='all'?'exc':'list'].some(i => i.includes('/'))?'open':''}><summary>Single keys…</summary><div class="chips">${projects.flatMap(pr => KEYS[pr].map(x => [`${x.f}/${x.k}`,`${x.f}/${x.k}${x.s?' 🔒':''}`])).filter((v,i,a) => a.findIndex(y => y[0]===v[0])===i).map(([id,lab]) => { const s = chipState(ax,id); return `<button type="button" class="chip" data-chip="keys|${id}" data-s="${s}" aria-label="${esc(lab)}">${s==='exc'?'✕':s==='off'?'+':'✓'} ${esc(lab)}</button>`; }).join('')}</div></details>` : ''}
      </div>`;
    };
    openDialog(`<form class="dlg" method="dialog">
      <h2 id="dlg-title">${st.id ? 'Edit access' : 'Add access'} · ${PEOPLE[st.p].name}</h2>
      <fieldset style="border:0;display:flex;flex-direction:column;gap:var(--space-2)"><legend class="eyebrow" style="margin-bottom:var(--space-2)">What</legend>
        <div class="levels" role="group" aria-label="Level">
          <button type="button" data-level="" aria-pressed="${!st.level && !st.atoms}">None</button>
          ${Object.entries(LEVELS).map(([id,l]) => `<button type="button" data-level="${id}" aria-pressed="${st.level===id}">${l.label}</button>`).join('')}
        </div>
        <label class="chk"><input type="checkbox" data-flag="reveal" ${st.reveal?'checked':''}> <span><strong>Reveal secrets</strong> <span class="muted">· current secret values, with reauthentication</span></span></label>
        <label class="chk"><input type="checkbox" data-flag="history" ${st.history?'checked':''}> <span><strong>Reveal history</strong> <span class="muted">· superseded secret values</span></span></label>
      </fieldset>
      <fieldset style="border:0;display:flex;flex-direction:column;gap:var(--space-2)"><legend class="eyebrow" style="margin-bottom:var(--space-2)">Where</legend>
        <div class="axis"><div class="axis__head"><h3>Projects</h3></div>
          <div class="chips">
            <button type="button" class="chip" data-proj="*" data-s="${st.projects==='*'?'inc':'off'}" aria-pressed="${st.projects==='*'}">${st.projects==='*'?'✓':'+'} all projects</button>
            ${Object.keys(PROJECTS).map(pr => { const s = st.projects==='*' ? 'via' : st.projects.includes(pr) ? 'inc' : 'off'; return `<button type="button" class="chip" data-proj="${pr}" data-s="${s}" ${st.projects==='*'?'disabled':''} aria-pressed="${s!=='off'}">${s==='off'?'+':'✓'} ${pr}</button>`; }).join('')}
          </div>
          ${st.projects==='*' ? '<p class="lvlhint">Includes projects created later.</p>' : ''}
        </div>
        ${projects.length ? axisHtml('envs','Environments',envs.map(x => [x, x + (protName(x)?' 🔒':'')]),'env') + axisHtml('keys','Keys',folders.map(f => [f, f + '/']),'key') : '<p class="lvlhint">Pick a project to choose environments and keys.</p>'}
      </fieldset>
      ${st.level ? `<div class="summary ${st.level==='admin'&&(narrowKeys(st)||envsNarrowed(st))?'warn':''}"><p style="font-weight:700;margin-bottom:var(--space-2)">${LEVELS[st.level].label} here means</p>
        <ul class="caplist">${capsHere.map(([atom,words,,shape]) => atoms.includes(atom) ? `<li><span class="g-direct">✓</span><span>${words}</span></li>` : `<li class="no"><span>✕</span><span>${words}: ${shapeWhy(shape)}</span></li>`).join('')}</ul>
        ${st.level==='admin' && atoms.includes('manage-members') && (narrowKeys(st)||envsNarrowed(st)) ? '<p class="reach" style="margin-top:var(--space-2);font-size:var(--fs-sm)">Delegation stays inside this rule: they can give others access to these keys in these environments, at most at this level.</p>' : ''}
      </div>` : ''}
      <div class="summary ${st.projects==='*'?'bad':''}">
        <p class="sentence">${valid ? `${PEOPLE[st.p].name.split(' ')[0]} can ${[levelLabel(st) ? `<b>${esc(levelLabel(st).toLowerCase())}</b>` : '', st.reveal?'<b>reveal secrets</b>':'', st.history?'<b>reveal history</b>':''].filter(Boolean).join(' and ')} in <b>${projText(st)}</b> › <b>${e.main}</b>${e.exc.length?` except <b>${e.exc.join(', ')}</b>`:''} › <b>${k.main}</b>${k.exc.length?` except <b>${k.exc.join(', ')}</b>`:''}.` : 'Pick what, then where.'}</p>
        ${valid ? `<p class="reach" style="font-size:var(--fs-sm)">${reachOf(st)}</p>` : ''}
        ${narrowKeys(st) && valid ? '<p style="font-size:var(--fs-sm)">Key limits apply to edit, publish, definitions, members and reveal. Key names and config values stay visible across the environment.</p>' : ''}
      </div>
      <div class="dlg__foot">
        ${st.id ? '<button class="btn" type="button" data-del style="color:var(--danger);border-color:var(--danger);margin-right:auto">Remove rule</button>' : ''}
        <button class="btn" type="button" data-close>Cancel</button>
        <button class="btn btn--primary" type="button" data-save ${valid?'':'disabled'}>Save</button>
      </div>
    </form>`, d => {
      const redraw = sel => { const top = d.scrollTop; draw(); d.scrollTop = top; if(sel) d.querySelector(sel)?.focus(); };
      d.querySelectorAll('[data-level]').forEach(b => b.onclick = () => { st.level = b.dataset.level || null; st.atoms = null; redraw(`[data-level="${b.dataset.level}"]`); });
      d.querySelectorAll('[data-flag]').forEach(i => i.onchange = () => { st[i.dataset.flag] = i.checked; redraw(`[data-flag="${i.dataset.flag}"]`); });
      d.querySelectorAll('[data-proj]').forEach(b => b.onclick = () => {
        const x = b.dataset.proj;
        if(x === '*') st.projects = st.projects === '*' ? [] : '*';
        else { const i = st.projects.indexOf(x); i >= 0 ? st.projects.splice(i,1) : st.projects.push(x); }
        redraw(`[data-proj="${x}"]`);
      });
      d.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { const [key,mode] = b.dataset.mode.split('|'); if(st[key].mode !== mode) setMode(key,mode); redraw(`[data-mode="${b.dataset.mode}"]`); });
      d.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => { const [key,...rest] = b.dataset.chip.split('|'); toggle(st[key],rest.join('|')); redraw(`[data-chip="${b.dataset.chip}"]`); });
      const del = d.querySelector('[data-del]');
      if(del) del.onclick = () => { RULES.splice(RULES.findIndex(r => r.id === st.id),1); d.close(); render(); };
      d.querySelector('[data-save]').onclick = () => {
        const next = {...clone(st),id:st.id || seq++};
        const i = RULES.findIndex(r => r.id === st.id);
        i >= 0 ? RULES.splice(i,1,next) : RULES.push(next);
        d.close(); render();
      };
    });
  };
  draw();
}

/* ---------- render + events ---------- */
function render(){
  document.documentElement.dataset.theme = S.theme;
  renderSide(); renderBar();
  $('#main').innerHTML = S.page === 'whocan' ? pageWhoCan() : pageMembers();
  const u = new URL(location); u.searchParams.set('page',S.page); history.replaceState(null,'',u);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if(!t || t.closest('#dlg')) return;
  if(t.hasAttribute('data-theme-toggle')){ S.theme = S.theme==='dark'?'light':'dark'; localStorage.setItem('proto-theme',S.theme); render(); return; }
  if(t.dataset.go){ if(t.getAttribute('aria-disabled')==='true') return; S.page = t.dataset.go; render(); window.scrollTo(0,0); return; }
  if(t.dataset.edit){ editor(RULES.find(r => r.id === +t.dataset.edit)); return; }
  if(t.dataset.add){ editor(null,t.dataset.add); return; }
  if(t.dataset.q){ const [cap,project,env,key] = t.dataset.q.split('|'); Object.assign(S.who,{cap,project,env,key}); render(); return; }
});
document.addEventListener('change', e => { const t = e.target; if(t.dataset.who){ S.who[t.dataset.who] = t.value; render(); } });
render();
</script>
