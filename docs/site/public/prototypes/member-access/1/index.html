<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE: Hikyo member access granularity, iteration 1</title>
<!--
  THROWAWAY PROTOTYPE: member access granularity, iteration 1.

  Question: members want finer access than scope level (only some keys,
  folders or key groups inside a project, per capability) without the
  Members page drowning in permission rows. Where does the fine grain live,
  and on which page is it authored and read back?

  STATUS: exploration of an AMENDMENT. The locked permission ADR
  (docs/adr/permission-model.md) records key- and folder-scoped grants as
  "deferred (fog)" and names a resolver UI as the precondition. Nothing here
  is a locked design.

  Model constraints every variant respects:
    - Grants stay additive, no deny rules. Fine grain only ever NARROWS a
      scope grant: effective = scope grant AND key limit.
    - Folders and key groups are selectors, not scopes. A selector expands
      to per-key entries at write time, exactly like a role template expands
      to grants. Keys added to the folder later are not included.
    - read is not narrowable (key catalogue is project-wide, classification
      is the sensitivity boundary). pin is revision-wide. Narrowable atoms:
      edit, publish, reveal, reveal-history.
    - "Who can...?" gains a key picker in every variant.

  Three STRUCTURAL variants (?variant=a|b|c), each with its own pages
  (?page=...), switchable via the floating bar:
    a  inline: the Members table stays principal x scope; a narrowed grant
       carries a "db/ . 3 keys" chip; the grant dialog gains a key picker.
    b  resource side: Members stays scope-only; restrictions are authored on
       the folder / key in Definitions as allowlists over current holders.
    c  member profile: Members becomes a compact roster; each member gets a
       page with an access map (scope tree x capability) and per-key
       effective access.
-->
<style>
  :root{

    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --bg:oklch(0.19 0.012 220);
    --bg-raise:oklch(0.23 0.014 220);
    --bg-panel:oklch(0.225 0.014 220);
    --bg-hover:oklch(0.27 0.016 220);
    --line:oklch(0.5 0.016 220);
    --chrome-line:oklch(0.3488 0.01488 220);
    --panel-line:oklch(0.34 0.014 220);
    --tx:oklch(0.93 0.008 200);
    --tx-dim:oklch(0.76 0.01 210);
    --tx-faint:oklch(0.71 0.012 215);
    --accent:oklch(0.82 0.09 195);
    --on-accent:oklch(0.2 0.02 220);
    --danger:oklch(0.72 0.13 25);
    --changed:oklch(0.78 0.07 250);
    --accent-soft:color-mix(in oklch,var(--accent) 14%,transparent);
    --danger-soft:color-mix(in oklch,var(--danger) 14%,transparent);
    --changed-soft:color-mix(in oklch,var(--changed) 14%,transparent);
    --overlay-shadow:0 12px 40px oklch(0 0 0/.5);
    --control:36px;
    --fs-xs:11px;--fs-sm:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:20px;
    --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;
    --ease:cubic-bezier(0.25,1,0.5,1);--dur:180ms;
  }
  [data-theme=light]{
    --bg:oklch(0.965 0.008 200);
    --bg-raise:oklch(0.995 0.004 200);
    --bg-panel:oklch(0.935 0.01 200);
    --bg-hover:oklch(0.895 0.012 200);
    --line:oklch(0.64 0.012 210);
    --chrome-line:oklch(0.8388 0.00752 204.4);
    --panel-line:oklch(0.82 0.014 210);
    --tx:oklch(0.25 0.03 225);
    --tx-dim:oklch(0.44 0.02 220);
    --tx-faint:oklch(0.46 0.02 218);
    --accent:oklch(0.45 0.085 210);
    --on-accent:oklch(0.97 0.008 200);
    --danger:oklch(0.48 0.14 30);
    --changed:oklch(0.45 0.08 250);
    --accent-soft:color-mix(in oklch,var(--accent) 10%,transparent);
    --danger-soft:color-mix(in oklch,var(--danger) 10%,transparent);
    --changed-soft:color-mix(in oklch,var(--changed) 12%,transparent);
    --overlay-shadow:0 12px 40px oklch(0.3 0.02 220/.25);
  }
  @media (pointer:coarse){:root{--control:44px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{color:var(--tx);font-family:var(--sans);font-size:var(--fs-md);line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :is(button,select,input,a,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .mono,code{font-family:var(--mono);font-size:var(--fs-sm)}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* shell */
  #app{display:grid;grid-template-columns:232px 1fr;min-height:100dvh}
  #side{background:var(--bg-panel);border-right:1px solid var(--chrome-line);padding:var(--space-4) var(--space-3);display:flex;flex-direction:column;gap:var(--space-4)}

  .nav:hover{background:var(--bg-hover);color:var(--tx)}

  .panel{border:1px solid var(--panel-line);border-radius:6px;background:var(--bg-panel);padding:var(--space-4);margin-top:var(--space-5)}
  .panel__head{display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-3)}
  .panel__head p{font-size:var(--fs-sm);color:var(--tx-dim)}

  /* controls */

  /* badges */
  .badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:3px;font-size:var(--fs-xs);font-weight:500;border:1px solid var(--panel-line);color:var(--tx-dim);white-space:nowrap}
  .badge.mono{font-family:var(--mono)}
  .badge--danger{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
  .badge--changed{border-color:var(--changed);color:var(--changed);background:var(--changed-soft)}

  .badge--link:hover{background:var(--bg-hover)}

  /* tables */
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

  td{padding:var(--space-2);border-bottom:1px solid var(--panel-line);vertical-align:top;font-size:var(--fs-sm)}
  tr:last-child td{border-bottom:0}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover td{background:var(--bg-hover)}
  .who{display:flex;flex-direction:column}
  .who b{font-weight:500;font-size:var(--fs-md)}
  .who span{color:var(--tx-faint);font-size:var(--fs-xs);font-family:var(--mono)}
  .caps{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-2);list-style:none}
  .cap{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:var(--fs-sm);padding:1px 0}
  .cap .x{border:0;background:none;color:var(--tx-faint);width:20px;height:20px;border-radius:3px;line-height:1}
  .cap .x:hover{background:var(--bg-hover);color:var(--danger)}
  .muted{color:var(--tx-faint)}

  /* access map (c) */
  .map th,.map td{text-align:center}

  /* tree (b, picker) */
  .split{display:grid;grid-template-columns:260px 1fr;gap:var(--space-4);margin-top:var(--space-5)}

  .tree .folder:hover{background:var(--bg-hover)}

  .policy td{vertical-align:middle}
  .policy .cellbtn{font-family:var(--sans);text-align:left}

  .picker{border:1px solid var(--panel-line);border-radius:6px;padding:var(--space-2) var(--space-3);max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:2px}
  .picker .sub{padding-left:var(--space-5)}
  .summary{border-left:2px solid var(--accent);padding:var(--space-2) var(--space-3);background:var(--accent-soft);border-radius:0 4px 4px 0;font-size:var(--fs-sm)}
  .summary.warn{border-color:var(--changed);background:var(--changed-soft)}
  .summary.bad{border-color:var(--danger);background:var(--danger-soft)}

  /* who can */
  .resolver{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3)}
  .answer{list-style:none;display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-3)}

  #bar .row{gap:var(--space-1)}

  @media (max-width:800px){
    #app{grid-template-columns:minmax(0,1fr)}
    #side{flex-direction:row;overflow-x:auto;padding:var(--space-2);border-right:0;border-bottom:1px solid var(--chrome-line);gap:var(--space-2)}
    .navgroup{flex-direction:row;align-items:center}
    .navgroup .eyebrow{display:none}
    .nav{white-space:nowrap}
    main{padding:var(--space-5) var(--space-3) 200px}
    .split{grid-template-columns:minmax(0,1fr)}
    .resolver{grid-template-columns:repeat(2,minmax(0,1fr))}
    .answer li{grid-template-columns:22px 1fr}
    .answer .why{grid-column:2}
    #bar{left:8px;right:8px;bottom:8px}
  }
</style>

<body>
<div id="app">
  <nav id="side" aria-label="Prototype navigation"></nav>
  <main id="main"></main>
</div>
<div id="bar" role="region" aria-label="Prototype switcher"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>

<script>
/* ---------- fixture ---------- */
const PEOPLE = {
  marc:{name:'Marc Went',id:'usr_01marc',note:'you'},
  alice:{name:'Alice Novak',id:'usr_01alice',note:'DBA'},
  bob:{name:'Bob Tran',id:'usr_01bob',note:'app developer'},
  chen:{name:'Chen Li',id:'usr_01chen',note:'contractor, Stripe integration'},
  dana:{name:'Dana Ruiz',id:'usr_01dana',note:'SRE'},
  ci:{name:'ci-deploy',id:'mch_01cideploy',note:'automation credential'},
};
const PROJECTS = {
  payments:{envs:[{id:'dev'},{id:'staging'},{id:'prod',prot:true}]},
  web:{envs:[{id:'dev'},{id:'prod',prot:true}]},
};
const KEYS = {
  payments:[
    {k:'DB_HOST',f:'db',s:false,g:[]},
    {k:'DB_USER',f:'db',s:false,g:['db-creds']},
    {k:'DB_PASSWORD',f:'db',s:true,g:['db-creds']},
    {k:'STRIPE_PUBLISHABLE_KEY',f:'stripe',s:false,g:[]},
    {k:'STRIPE_SECRET_KEY',f:'stripe',s:true,g:[]},
    {k:'STRIPE_WEBHOOK_SECRET',f:'stripe',s:true,g:[]},
    {k:'LOG_LEVEL',f:'app',s:false,g:[]},
    {k:'SESSION_SECRET',f:'app',s:true,g:[]},
  ],
  web:[
    {k:'API_URL',f:'app',s:false,g:[]},
    {k:'SENTRY_DSN',f:'app',s:true,g:[]},
    {k:'COOKIE_SECRET',f:'app',s:true,g:[]},
  ],
};
const ENV_CAPS = ['read','edit','publish','pin','reveal','reveal-history'];
const NARROWABLE = ['edit','publish','reveal','reveal-history'];
const ADMIN_CAPS = ['read','edit','publish','pin','definitions-edit','manage-identities','manage-adapters','project-settings','manage-members','reveal','reveal-history','manage-projects'];

let nextId = 1;
const g = (p,cap,scope,sel,origin) => ({id:nextId++,p,cap,scope,sel:sel||null,origin:origin||'manual'});
/* A selector is shown by its source (folder / group / keys) and stored as the
   per-key list it expanded to at write time. */
const sel = (project,src,label) => ({src,label,keys:expand(project,src)});
function expand(project,src){
  return KEYS[project].filter(x => (src.folders||[]).includes(x.f) || (src.groups||[]).some(gr => x.g.includes(gr)) || (src.keys||[]).includes(x.k)).map(x => x.k);
}
const GRANTS = [
  ...ADMIN_CAPS.map(c => g('marc',c,'org',null,'template: admin')),
  ...['read','edit','publish','pin'].map(c => g('alice',c,'payments',null,'template: publisher')),
  g('alice','reveal','payments/staging'),
  g('alice','reveal','payments/prod',sel('payments',{folders:['db']},'db/')),
  ...['read','edit','publish','pin'].map(c => g('bob',c,'payments/dev',null,'template: publisher')),
  ...['read','edit','publish','pin'].map(c => g('bob',c,'web/dev',null,'template: publisher')),
  g('bob','reveal','payments/dev'), g('bob','reveal','web/dev'),
  g('bob','read','payments/prod',null,'template: viewer'), g('bob','read','web/prod',null,'template: viewer'),
  g('chen','read','payments/staging',null,'template: editor'),
  g('chen','edit','payments/staging',sel('payments',{folders:['stripe']},'stripe/'),'template: editor'),
  g('dana','read','org',null,'template: viewer'),
  g('dana','reveal','payments/prod'),
  g('dana','reveal-history','payments/prod',sel('payments',{groups:['db-creds']},'group db-creds')),
  ...['read','edit','publish'].map(c => g('ci',c,'payments/staging',null,'automation')),
];
/* Variant b: key limits live on the resource as allowlists that narrow the
   holders of a scope grant. Grant selectors do not exist in b. */
const POLICIES = [
  {id:1,project:'payments',env:'prod',folder:'db',cap:'reveal',allow:['alice','marc']},
];

/* ---------- state ---------- */
const PAGES = {
  a:[['members','Members'],['whocan','Who can...?']],
  b:[['members','Members'],['keys','Key access'],['whocan','Who can...?']],
  c:[['members','Members'],['member','Member: Chen Li'],['whocan','Who can...?']],
};
const VARIANT_NAMES = {a:'a · inline chips',b:'b · on the key',c:'c · member profile'};
const qs = new URLSearchParams(location.search);
const S = {
  variant: ['a','b','c'].includes(qs.get('variant')) ? qs.get('variant') : 'a',
  page: qs.get('page') || 'members',
  member: qs.get('member') || 'chen',
  folder: 'db',
  mapEnv: 'payments/staging',
  who: {project:'payments',env:'prod',key:'DB_PASSWORD',cap:'reveal'},
  theme: localStorage.getItem('proto-theme') || 'dark',
  flash: '',
};
if(!PAGES[S.variant].some(([id]) => id === S.page)) S.page = 'members';

/* ---------- model ---------- */
const scopeParts = s => { if(s==='org') return {level:'org'}; const [project,env] = s.split('/'); return env ? {level:'env',project,env} : {level:'project',project}; };
const covers = (scope,project,env) => scope === 'org' || scope === project || scope === `${project}/${env}`;
const isProt = (project,env) => PROJECTS[project].envs.some(e => e.id === env && e.prot);
const scopeLabel = s => { const p = scopeParts(s); if(p.level==='org') return 'acme (org)'; if(p.level==='project') return p.project; return `${p.project}/${p.env}${isProt(p.project,p.env)?' 🔒':''}`; };
const keyOf = (project,k) => KEYS[project].find(x => x.k === k);
const useSel = () => S.variant !== 'b';

/* Does principal p hold cap on key k in project/env? Returns {ok, why, blocked?}. */
function resolve(p,cap,project,env,k){
  const hits = GRANTS.filter(x => x.p === p && x.cap === cap && covers(x.scope,project,env));
  if(!hits.length) return {ok:false,why:`no <code>${cap}</code> grant reaches <code>${project}/${env}</code>`};
  const open = hits.find(x => !useSel() || !x.sel);
  const viaSel = hits.find(x => useSel() && x.sel && x.sel.keys.includes(k));
  const grant = open || viaSel;
  if(!grant){
    const h = hits[0];
    return {ok:false,blocked:true,why:`holds <code>${cap}</code> on <code>${scopeLabel(h.scope)}</code> limited to ${h.sel.label}, which does not include <code>${k}</code>`};
  }
  if(S.variant === 'b'){
    const key = keyOf(project,k);
    const pol = POLICIES.find(x => x.project === project && x.env === env && x.cap === cap && x.folder === key.f);
    if(pol && !pol.allow.includes(p)) return {ok:false,blocked:true,why:`holds <code>${cap}</code> on <code>${scopeLabel(grant.scope)}</code>, but the <code>${pol.folder}/</code> allowlist in ${env} names only ${pol.allow.map(n => PEOPLE[n].name.split(' ')[0]).join(', ')}`};
    if(pol) return {ok:true,why:`<code>${cap}</code> on <code>${scopeLabel(grant.scope)}</code> and named on the <code>${pol.folder}/</code> allowlist`};
  }
  const inh = grant.scope !== `${project}/${env}` ? ` (inherited from ${scopeLabel(grant.scope)})` : '';
  return {ok:true,why: grant.sel && useSel() ? `<code>${cap}</code> on <code>${scopeLabel(grant.scope)}</code>, limited to ${grant.sel.label}, which includes <code>${k}</code>` : `<code>${cap}</code> on <code>${scopeLabel(grant.scope)}</code>${inh}`};
}

function rowsByScope(){

      </fieldset>
      ${allowLimit ? `<fieldset style="border:0;display:flex;flex-direction:column;gap:var(--space-2)"><legend class="eyebrow" style="margin-bottom:var(--space-2)">Applies to</legend>
        ${sp.level==='org' ? '<p class="muted" style="font-size:var(--fs-sm)">Key limits need a project or environment scope: key catalogues are per project.</p>' : !narrowCaps.length ? '<p class="muted" style="font-size:var(--fs-sm)">Pick edit, publish, reveal or reveal-history to limit to keys.</p>' : `
        <label class="chk"><input type="radio" name="mode" value="all" ${st.mode==='all'?'checked':''}> All ${total} keys in ${scopeLabel(st.scope)}</label>
        <label class="chk"><input type="radio" name="mode" value="limit" ${st.mode==='limit'?'checked':''}> Only selected keys</label>
        ${limiting ? `<div class="picker" role="group" aria-label="Keys">
          ${folders.map(f => `<label class="chk"><input type="checkbox" name="folder" value="${f}" ${st.folders.includes(f)?'checked':''}><span class="mono">${f}/</span><span class="muted">&nbsp;folder</span></label>
            ${KEYS[project].filter(k => k.f===f).map(k => { const via = st.folders.includes(f) || k.g.some(x => st.groups.includes(x)); return `<label class="chk sub ${via?'chk--off':''}"><input type="checkbox" name="key" value="${k.k}" ${via||st.keys.includes(k.k)?'checked':''} ${via?'disabled':''}><span class="mono">${k.k}</span>${k.s?' 🔒':''}</label>`;}).join('')}`).join('')}
          ${groups.map(gr => `<label class="chk"><input type="checkbox" name="group" value="${gr}" ${st.groups.includes(gr)?'checked':''}><span class="mono">🔗 ${gr}</span><span class="muted">&nbsp;key group</span></label>`).join('')}
        </div>` : ''}`}
      </fieldset>` : `<p class="summary">Grants on this page are always whole-scope. To keep a folder to named people, set an allowlist in Definitions › Key access.</p>`}
      <p class="summary ${sp.level==='org'?'bad':limiting?'':'warn'}">
        ${PEOPLE[st.p].name} ${st.caps.length ? `gets <strong>${st.caps.join(', ')}</strong>` : 'gets nothing yet'} on ${scopeLabel(st.scope)}.
        ${narrowCaps.length ? `${narrowCaps.join(', ')} reaches <strong>${reach} of ${total} keys</strong> (${secrets} secret).` : ''}
        ${limiting && wideCaps.length ? ` ${wideCaps.join(', ')} still covers all ${total}.` : ''}
        ${limiting ? ` Stored as ${picked.length} per-key entries; keys added to the chosen folders later are <strong>not</strong> included.` : ''}
        ${sp.level==='org' ? ' Organisation scope: reaches every project, including production.' : ''}
      </p>
      <div class="dlg__foot"><button class="btn" type="button" data-close>Cancel</button><button class="btn btn--primary" type="button" data-submit ${!st.caps.length || (limiting && !picked.length)?'disabled':''}>Grant ${st.caps.length||''}</button></div>
    </form>`, d => {
      const f = d.querySelector('form');
      f.onchange = () => {
        const fd = new FormData(f);
        st.p = fd.get('p'); st.scope = fd.get('scope'); st.caps = fd.getAll('cap');
        if(fd.get('mode')) st.mode = fd.get('mode');
        st.folders = fd.getAll('folder'); st.groups = fd.getAll('group');
        st.keys = fd.getAll('key').filter(k => !expand(scopeParts(st.scope).project||'payments',{folders:st.folders,groups:st.groups}).includes(k));
        draw();
      };
      d.querySelector('[data-submit]').onclick = () => {
        const label = [...st.folders.map(x => x+'/'), ...st.groups.map(x => 'group '+x), ...(st.keys.length?[`${st.keys.length} key${st.keys.length>1?'s':''}`]:[])].join(' + ');
        if(st.replace){ const i = GRANTS.findIndex(y => y.id === st.replace); if(i >= 0) GRANTS.splice(i,1); }
        for(const c of st.caps){
          const s = limiting && NARROWABLE.includes(c) ? {src:{},label,keys:picked} : null;
          GRANTS.push(g(st.p,c,st.scope,s));
        }
        S.flash = `Granted ${st.caps.join(', ')} to ${PEOPLE[st.p].name} on ${scopeLabel(st.scope)}. Each is its own revocable line.`;
        d.close(); render();
      };
    });
  };
  draw();
}
function cellDialog(id){
  const x = GRANTS.find(y => y.id === +id);
  const sp = scopeParts(x.scope);
  const narrow = NARROWABLE.includes(x.cap) && sp.level !== 'org';
  openDialog(`<div class="dlg">
    <h2 id="dlg-title"><span class="mono">${x.cap}</span> on ${scopeLabel(x.scope)}</h2>
    <p class="dim" style="font-size:var(--fs-sm)">${PEOPLE[x.p].name} · origin ${x.origin}</p>
    ${x.sel ? `<p class="summary">Limited to ${x.sel.label}: ${x.sel.keys.map(k => `<code>${k}</code>`).join(', ')}.</p>` : narrow ? `<p class="summary warn">Reaches all ${KEYS[sp.project].length} keys in ${sp.project}.</p>` : `<p class="summary warn">${x.cap} ${x.cap==='read'?'is project-wide by design and cannot be limited to keys.':sp.level==='org'?'at organisation scope cannot be limited to keys: key catalogues are per project.':'covers a whole revision and cannot be limited to keys.'}</p>`}
    <div class="dlg__foot">
      <button class="btn" data-close>Close</button>
      ${narrow ? `<button class="btn" data-limit>${x.sel?'Change key limit…':'Limit to keys…'}</button>` : ''}
      <button class="btn" style="color:var(--danger);border-color:var(--danger)" data-rv>Revoke</button>
    </div></div>`, d => {
      d.querySelector('[data-rv]').onclick = () => { revoke(x.id); d.close(); };
      const l = d.querySelector('[data-limit]');
      if(l) l.onclick = () => { const folders = x.sel ? [...new Set(x.sel.keys.map(k => keyOf(sp.project,k).f))] : []; grantDialog({p:x.p,scope:x.scope,caps:[x.cap],mode:'limit',folders,replace:x.id}); };
    });
}
function policyDialog(cap,env){
  const project = 'payments', f = S.folder;
  const holders = Object.keys(PEOPLE).filter(p => GRANTS.some(x => x.p===p && x.cap===cap && covers(x.scope,project,env)));
  let pol = POLICIES.find(p => p.project===project && p.env===env && p.cap===cap && p.folder===f);
  const chosen = new Set(pol ? pol.allow : holders);
  const keys = KEYS[project].filter(k => k.f===f);
  const draw = () => {
    const losing = holders.filter(p => !chosen.has(p));
    openDialog(`<div class="dlg">
      <h2 id="dlg-title">Who may ${cap} <span class="mono">${f}/</span> in ${env}${isProt(project,env)?' 🔒':''}</h2>
      <p class="dim" style="font-size:var(--fs-sm)">Only people who already hold <code>${cap}</code> on ${project}/${env} are listed. An allowlist narrows; to add someone, grant them ${cap} in Members first.</p>
      <div class="picker">${holders.map(p => `<label class="chk"><input type="checkbox" value="${p}" ${chosen.has(p)?'checked':''}>${PEOPLE[p].name}<span class="muted">&nbsp;· ${PEOPLE[p].note}</span></label>`).join('')}</div>
      <p class="summary ${losing.length?'warn':''}">${losing.length ? `${losing.map(p => PEOPLE[p].name).join(', ')} will lose ${cap} on ${keys.length} keys (${keys.map(k => k.k).join(', ')}) in ${env}. Their other grants are untouched.` : 'Everyone holding the capability keeps it: no allowlist is stored.'}</p>
      <div class="dlg__foot"><button class="btn" data-close>Cancel</button><button class="btn btn--primary" data-save ${chosen.size===0?'disabled':''}>Save</button></div>
    </div>`, d => {
      d.querySelectorAll('.picker input').forEach(i => i.onchange = () => { i.checked ? chosen.add(i.value) : chosen.delete(i.value); draw(); });
      d.querySelector('[data-save]').onclick = () => {
        if(pol) POLICIES.splice(POLICIES.indexOf(pol),1);
        if(losing.length) POLICIES.push({id:Date.now(),project,env,folder:f,cap,allow:[...chosen]});
        d.close(); render();
      };
    });
  };
  draw();
}
function revoke(id){
  const i = GRANTS.findIndex(x => x.id === +id);
  if(i < 0) return;
  const [x] = GRANTS.splice(i,1);
  S.flash = `Revoked ${x.cap} on ${scopeLabel(x.scope)} for ${PEOPLE[x.p].name}.`;
  render();
}

/* ---------- render + events ---------- */
function render(){
  document.documentElement.dataset.theme = S.theme;
  renderSide(); renderBar();
  const v = S.variant, p = S.page;
  const body = p==='whocan' ? pageWhoCan()
    : p==='keys' ? pageKeysB()
    : p==='member' ? pageMemberC()
    : v==='a' ? pageMembersA() : v==='b' ? pageMembersB() : pageMembersC();
  $('#main').innerHTML = (S.flash ? `<p class="summary" role="status" style="margin-bottom:var(--space-4)">${esc(S.flash)}</p>` : '') + body;
  if(p==='member'){ const t = PAGES.c.find(x => x[0]==='member'); t[1] = `Member: ${PEOPLE[S.member].name}`; renderSide(); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-member]');
  if(!t) return;
  if(t.dataset.variant){ S.variant = t.dataset.variant; if(!PAGES[S.variant].some(([id]) => id===S.page)) S.page='members'; S.flash=''; sync(); render(); return; }
  if(t.hasAttribute('data-theme-toggle')){ S.theme = S.theme==='dark'?'light':'dark'; localStorage.setItem('proto-theme',S.theme); render(); return; }
  if(t.dataset.folder && !t.dataset.go){ S.folder = t.dataset.folder; render(); return; }
  if(t.dataset.go){ if(t.getAttribute('aria-disabled')==='true') return; go(t.dataset.go, t.dataset.folder ? {folder:t.dataset.folder} : null); return; }
  if(t.dataset.member){ go('member',{member:t.dataset.member}); return; }
  if(t.dataset.revoke){ revoke(t.dataset.revoke); return; }
  if(t.dataset.open==='grant'){ grantDialog(S.page==='member'?{p:S.member}:null); return; }
  if(t.dataset.open==='grant-b'){ grantDialog({caps:['reveal'],scope:'payments/prod',p:'bob'}); return; }
  if(t.dataset.cell){ cellDialog(t.dataset.cell); return; }
  if(t.dataset.add){ const [cap,scope] = t.dataset.add.split('|'); grantDialog({p:S.member,scope,caps:[cap],mode:'all'}); return; }
  if(t.dataset.policy){ const [cap,env] = t.dataset.policy.split('|'); policyDialog(cap,env); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.who){ S.who[t.dataset.who] = t.value; render(); return; }
  if(t.hasAttribute('data-mapenv')){ S.mapEnv = t.value; render(); }
});
document.addEventListener('keydown', e => {
  if($('#dlg').open || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const i = ['a','b','c'].indexOf(S.variant);
  if(e.key==='ArrowRight' || e.key==='ArrowLeft'){ S.variant = ['a','b','c'][(i + (e.key==='ArrowRight'?1:2)) % 3]; if(!PAGES[S.variant].some(([id]) => id===S.page)) S.page='members'; sync(); render(); }
});
sync(); render();
</script>
</body>
</html>
