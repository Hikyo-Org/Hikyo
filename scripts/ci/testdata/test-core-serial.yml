# Reviewed complete additive job; caller revision guard and Go cache disk
# preparation are normalized separately.
needs: changes
if: ${{ fromJSON(needs.changes.outputs.plan).test }}
runs-on: ubuntu-latest
timeout-minutes: 45
steps:
  - name: Check out the validated immutable revision
    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    with:
      ref: ${{ inputs.revision }}
      persist-credentials: false
  - name: Start healthy PostgreSQL with Docker Hub cache fallback
    id: ci-postgres
    run: ./scripts/ci/start-ci-postgres.sh
  - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
    with:
      go-version-file: go.mod
      cache: false
  - name: Restore shared Go module cache
    uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
    with:
      path: ~/go/pkg/mod
      key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
      restore-keys: go-mod-v2-${{ runner.os }}-
  - name: Select runner cache ABI
    id: runner-cache-abi
    run: ./scripts/ci/export-runner-cache-abi.sh
  - name: Restore test Go cache
    uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
    with:
      path: ~/.cache/go-build
      key: go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
      restore-keys: |
        go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
  - name: Populate Go module cache
    run: go mod download
  - name: Test internal/app and internal/lint serially
    env:
      HIKYO_TEST_POSTGRES_DSN: postgres://hikyo:hikyo@127.0.0.1:5432/hikyo_test
    run: ./scripts/ci/test-core-packages.sh serial
  - name: Remove CI PostgreSQL
    if: ${{ always() && steps.ci-postgres.outcome == 'success' }}
    run: docker container rm --force hikyo-ci-postgres
