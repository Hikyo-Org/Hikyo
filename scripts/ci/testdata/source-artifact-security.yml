# Reviewed complete additive job; caller revision guard is checked separately.
needs: [changes, app-build]
if: ${{ fromJSON(needs.changes.outputs.plan)['web-go'] }}
runs-on: ubuntu-latest
timeout-minutes: 35
steps:
  - name: Check out the validated immutable revision
    timeout-minutes: 2
    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    with:
      ref: ${{ inputs.revision }}
      persist-credentials: false
  - name: Download the exact app build
    timeout-minutes: 2
    uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
    with:
      name: hikyo-app-${{ github.run_id }}
  - timeout-minutes: 2
    uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
    with:
      go-version-file: go.mod
      cache: false
  - name: Restore shared Go module cache
    timeout-minutes: 2
    uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    with:
      path: ~/go/pkg/mod
      key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
      restore-keys: go-mod-v2-${{ runner.os }}-
  - name: Select runner cache ABI
    timeout-minutes: 1
    id: runner-cache-abi
    run: ./scripts/ci/export-runner-cache-abi.sh
  - name: Restore source artifact Go cache
    timeout-minutes: 2
    uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    with:
      path: ~/.cache/go-build
      key: go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
      restore-keys: |
        go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
  - name: Start disposable adversarial PostgreSQL
    timeout-minutes: 2
    id: security-postgres
    run: ./scripts/ci/start-ci-postgres.sh
  - name: Build stamped production fixture with ephemeral test trust
    timeout-minutes: 5
    env:
      HIKYO_CHART_FIXTURE_OUTPUT: ${{ runner.temp }}/security-fixture
      HIKYO_CHART_FIXTURE_COMMIT: ${{ inputs.revision }}
    run: |
      go test -count=1 -run '^TestWriteChartFixture$' ./scripts/ci/chartfixture
      go build -tags ui -ldflags "$(cat "$RUNNER_TEMP/security-fixture/ldflags")" -o ci-artifacts/hikyo-security-ui ./cmd/hikyo
      go build -o "$RUNNER_TEMP/security-artifact-harness" ./scripts/security/artifact-harness
  - name: Native artifact adversarial campaign on both datastores
    timeout-minutes: 11
    run: >-
      "$RUNNER_TEMP/security-artifact-harness"
      --binary "$GITHUB_WORKSPACE/ci-artifacts/hikyo-security-ui"
      --bundle "$RUNNER_TEMP/security-fixture/public/bundle"
      --postgres-dsn 'postgres://hikyo:hikyo@127.0.0.1:5432/hikyo_test?sslmode=disable'
      --steps 24 --timeout 10m --output "$RUNNER_TEMP/source-artifact-attacks.json"
  - name: Remove disposable adversarial PostgreSQL
    timeout-minutes: 1
    if: ${{ always() && steps.security-postgres.outcome == 'success' }}
    run: docker container rm --force hikyo-ci-postgres
  - name: Retain successful source fixture attack evidence
    timeout-minutes: 2
    uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
    with:
      name: source-fixture-attacks-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
      path: ${{ runner.temp }}/source-artifact-attacks.json
      if-no-files-found: error
      retention-days: 30
