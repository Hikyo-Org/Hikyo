# Reviewed complete additive job (#1215); the caller revision guard is
# normalized separately.
needs: changes
if: ${{ fromJSON(needs.changes.outputs.plan).desktop }}
# macOS only where the module exists; a full plan elsewhere passes on Linux.
runs-on: ${{ needs.changes.outputs.desktop_module == 'true' && 'macos-15' || 'ubuntu-latest' }}
timeout-minutes: 30
env:
  CGO_ENABLED: "1"
  CGO_CFLAGS: -mmacosx-version-min=13.0
  CGO_LDFLAGS: -mmacosx-version-min=13.0
steps:
  - name: Check out the validated immutable revision
    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    with:
      ref: ${{ inputs.revision }}
      persist-credentials: false
  - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
    with:
      go-version-file: go.mod
      cache: false
  - name: Desktop module boundary
    run: |
      ./scripts/ci/check-desktop-deps_test.sh
      ./scripts/ci/check-desktop-deps.sh
  - name: Desktop tests with the race detector
    if: ${{ needs.changes.outputs.desktop_module == 'true' }}
    working-directory: desktop
    run: go test -race -count=1 -p 2 ./...
  - name: Build the probe shell
    if: ${{ needs.changes.outputs.desktop_module == 'true' }}
    working-directory: desktop
    run: go build -p 2 -tags probe -o "$RUNNER_TEMP/hikyo-desktop-probe" .
  - name: Build the release shell
    if: ${{ needs.changes.outputs.desktop_module == 'true' }}
    working-directory: desktop
    run: go build -p 2 -o "$RUNNER_TEMP/hikyo-desktop" .
  - name: Driven WKWebView lane against a fake instance
    if: ${{ needs.changes.outputs.desktop_module == 'true' }}
    working-directory: desktop
    run: go run ./probes/driven -app "$RUNNER_TEMP/hikyo-desktop-probe" -timeout 120s
