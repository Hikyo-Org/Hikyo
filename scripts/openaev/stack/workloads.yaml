apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: openaev-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
        lab.went.io/name: openaev-hikyo
    spec:
      automountServiceAccountToken: false
      priorityClassName: openaev-lab
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch@sha256:c2a3ed5f968be6d59c960aa0c60cfdaee667b6bc8211142021a41d0e85b43237
        imagePullPolicy: IfNotPresent
        env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: 'false'
        - name: xpack.ml.enabled
          value: 'false'
        - name: ES_JAVA_OPTS
          value: -Xms256m -Xmx256m -XX:ActiveProcessorCount=2 -XX:ErrorFile=/tmp/hs_err_pid%p.log
        - name: node.store.allow_mmap
          value: 'false'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: &id002
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 1024Mi
          limits:
            cpu: 750m
            memory: 1024Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /usr/share/elasticsearch/data
        - name: config
          mountPath: /usr/share/elasticsearch/config
        - name: logs
          mountPath: /usr/share/elasticsearch/logs
        ports:
        - containerPort: 9200
          name: service
        startupProbe:
          httpGet: &id001
            path: /
            port: 9200
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          httpGet: *id001
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: config
        emptyDir:
          sizeLimit: 32Mi
      - name: logs
        emptyDir:
          sizeLimit: 32Mi
      initContainers:
      - name: prepare-config
        image: docker.elastic.co/elasticsearch/elasticsearch@sha256:c2a3ed5f968be6d59c960aa0c60cfdaee667b6bc8211142021a41d0e85b43237
        command:
        - sh
        - -ec
        - cp -R /usr/share/elasticsearch/config/. /run/es-config/; sed -i 's#^-Xlog:.*#-Xlog:gc=info:stderr:utctime,level,tags#'
          /run/es-config/jvm.options
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: *id002
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 64Mi
        volumeMounts:
        - name: config
          mountPath: /run/es-config
  serviceName: elasticsearch
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 2Gi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: openaev-lab
spec:
  type: ClusterIP
  selector:
    app: elasticsearch
  ports:
  - name: service
    port: 9200
    targetPort: 9200
