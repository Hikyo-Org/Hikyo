apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: openaev-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        lab.went.io/name: openaev-hikyo
    spec:
      automountServiceAccountToken: false
      priorityClassName: openaev-lab
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: rabbitmq
        image: rabbitmq@sha256:b848a0a78f27ab2a4528921baeade53a30b82eac9b129e80249e50fb421d2cd5
        imagePullPolicy: IfNotPresent
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: openaev
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: credentials
              key: RABBITMQ_DEFAULT_PASS
        - name: RABBITMQ_ERLANG_COOKIE
          valueFrom:
            secretKeyRef:
              name: credentials
              key: RABBITMQ_ERLANG_COOKIE
        - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
          value: +S 2:2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 400m
            memory: 384Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /var/lib/rabbitmq
        ports:
        - containerPort: 5672
          name: service
        - name: management
          containerPort: 15672
        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - rabbitmq-diagnostics -q check_running; rabbitmq-diagnostics -q check_port_connectivity
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          tcpSocket:
            port: 5672
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        command:
        - sh
        - -ec
        args:
        - umask 077; printf "%s" "$RABBITMQ_ERLANG_COOKIE" > /var/lib/rabbitmq/.erlang.cookie;
          chmod 0600 /var/lib/rabbitmq/.erlang.cookie; test "$(stat -c %a /var/lib/rabbitmq/.erlang.cookie)"
          = 600; exec docker-entrypoint.sh rabbitmq-server
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
  serviceName: rabbitmq
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: openaev-lab
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
  - name: service
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgsql
  namespace: openaev-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgsql
  template:
    metadata:
      labels:
        app: pgsql
        lab.went.io/name: openaev-hikyo
    spec:
      automountServiceAccountToken: false
      priorityClassName: openaev-lab
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pgsql
        image: postgres@sha256:0b2882c46a2b8d8e148431b333394348cf4d7f15aec6df7f17d51dc641e56cfa
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          value: openaev
        - name: POSTGRES_DB
          value: openaev
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: credentials
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 400m
            memory: 384Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: socket
          mountPath: /var/run/postgresql
        ports:
        - containerPort: 5432
          name: service
        args:
        - postgres
        - -c
        - max_connections=50
        - -c
        - shared_buffers=32MB
        - -c
        - work_mem=1MB
        - -c
        - maintenance_work_mem=16MB
        - -c
        - autovacuum_work_mem=16MB
        startupProbe:
          exec: &id001
            command:
            - pg_isready
            - -U
            - openaev
            - -d
            - openaev
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          exec: *id001
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: socket
        emptyDir:
          sizeLimit: 8Mi
  serviceName: pgsql
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 2Gi
---
