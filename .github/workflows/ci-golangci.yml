# Advisory early signal for the static-analysis findings that kept surfacing in
# review: golangci-lint with the rules in .golangci.yml, reporting only issues
# on lines this PR changes (scripts/ci/golangci-lint-new.sh). The existing
# baseline is not enforced. It is not a required context and is not part of any
# required job or fast-feedback lane; the pre-push hook runs the same script.
# It needs no secrets: it runs read-only with restored caches and no cache writer.
name: ci-advisory-golangci

on:
  # No `edited`: a base-branch edit cannot change what head-only analysis reads.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .golangci.yml
      - .golangci-strict.yml
      - scripts/ci/golangci-lint-version
      - scripts/ci/golangci-lint-new.sh
      - scripts/ci/run-go-tool.sh
      - .github/workflows/ci-golangci.yml

permissions:
  contents: read

concurrency:
  group: advisory-golangci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci-lint on new Go code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      # Full history: fetch-depth 0 also fetches every branch, so origin/${BASE_REF}
      # exists for the merge base without a separate fetch.
      - name: Check out the exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the checkout is the PR head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # exact toolchain pinned by go.mod's toolchain directive
          cache: false
      # Restore only. The trusted main-branch writers in ci.yml own both caches.
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      - name: Restore test Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: |
            go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      - name: golangci-lint, new code only
        run: ./scripts/ci/golangci-lint-new.sh "origin/${BASE_REF}"
