# Reconcile a gate whose fixed polling window expired while GitHub queued
# validation jobs. This callback only reruns the original base-controlled gate;
# it never accepts a PR result or executes PR code itself.
name: ci-gate-reconcile

on:
  workflow_run:
    workflows: [fork-ci]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-gate-reconcile-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile completed PR validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: ./scripts/ci/reconcile-fork-gate.sh
