name: ops-floor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ops-floor.yml
      - scripts/ops-floor/**
      - scripts/ci/ops-floor.sh
      - scripts/ci/ops-floor_test.sh
      - internal/isolation/ops_floor_test.go

permissions:
  contents: read

jobs:
  ops-floor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Exercise doctor and selected bounds on the native floor
        run: ./scripts/ci/ops-floor.sh '${{ matrix.architecture }}' "$RUNNER_TEMP/ops-floor"
      - name: Preserve exact-source operations evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ops-floor-${{ matrix.architecture }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ops-floor/
          if-no-files-found: error
          retention-days: 90
