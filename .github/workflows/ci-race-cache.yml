# Single writer for the shared race build cache read by the merge-gate race
# shards (ci.yml) and reliability race isolation. Twelve per-shard caches could
# not fit the 10 GB Actions budget next to go-test-v2, so most shards missed.
# One compile-only cache of every race-instrumented dependency serves them all;
# tests then compile only their generated test mains. The key intentionally
# matches reliability.yml and refreshes when go.mod or go.sum change, the same
# staleness model as go-test-v2. No PR can publish here.
name: cache-seed-race

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: read

# One group for both daily seed writers: the second run waits until the first, its prune job included, has
# finished, so two rotated generations never coexist (the race seed and the lint driver seed saving in the
# same minute peaked 1 GB higher in the eviction model, docs/development/ci.md). Never cancelling.
concurrency:
  group: ci-cache-seed-writers
  cancel-in-progress: false

jobs:
  seed:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out immutable trusted main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        env:
          GOCACHE: ${{ runner.temp }}/race-bootstrap
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        id: go-module-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod/cache/download
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      # The cache policy fixture requires restore-keys on every go-build
      # reader; lookup-only never restores, so cache-hit stays exact-key only.
      - name: Look up this race seed without restoring old entries
        id: race-seed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-race-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-race-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
          lookup-only: true
      - name: Compile a fresh race seed without running tests
        if: steps.race-seed.outputs.cache-hit != 'true'
        run: |
          cache="$HOME/.cache/go-build"
          test ! -e "$cache"
          test "$(go env GOCACHE)" = "$cache"
          go list -deps -test -export -race ./... >/dev/null
          du -sh "$cache"
      - name: Save race seed from trusted main only
        if: >-
          success() && steps.race-seed.outputs.cache-hit != 'true' &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.race-seed.outputs.cache-primary-key }}
      # Second writer for the shared module cache. ci-main saves it weekly, so a
      # Monday eviction would otherwise miss all restores for about six days.
      - name: Populate shared Go module cache
        if: steps.go-module-cache.outputs.cache-hit != 'true'
        run: ./scripts/ci/populate-go-module-cache.sh
      - name: Save shared Go module cache from trusted main only
        if: >-
          success() && steps.go-module-cache.outputs.cache-hit != 'true' &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod/cache/download
          key: ${{ steps.go-module-cache.outputs.cache-primary-key }}

  # Right after the save, in a job of its own so that actions: write never sits next to the compile:
  # the same prune as ci-cache-prune.yml, so this seed's superseded generation does not outlive the
  # save by more than the time a job takes to start.
  prune:
    needs: seed
    if: ${{ !cancelled() && needs.seed.result != 'skipped' }}
    permissions:
      actions: write
    uses: ./.github/workflows/ci-cache-prune.yml
