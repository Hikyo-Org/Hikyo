name: nightly-release

on:
  schedule:
    - cron: "0 2 * * *"
  # repository_dispatch always loads this workflow from the default branch.
  # The manual wrapper requests an ordinary release through this event, keeping
  # publication out of a branch-selected workflow definition.
  repository_dispatch:
    types: [nightly-release, nightly-chain-restart]

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  validation:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ github.sha }}
    permissions:
      actions: read
      contents: read
      pull-requests: read

  build-artifacts:
    needs: validation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      skip: ${{ steps.identity.outputs.skip }}
      tag_exists: ${{ steps.identity.outputs.tag_exists }}
      artifact_id: ${{ steps.upload-inputs.outputs.artifact-id }}
      non_darwin_sha256: ${{ steps.retained-integrity.outputs.non_darwin_sha256 }}
      compatibility_sha256: ${{ steps.compatibility.outputs.sha256 }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Start healthy PostgreSQL with Docker Hub cache fallback
        id: ci-postgres
        env:
          POSTGRES_PASSWORD: release-schema-fixture
          POSTGRES_DB: hikyo_release_schema
          POSTGRES_HEALTH_RETRIES: 12
        run: ./scripts/ci/start-ci-postgres.sh
      - name: Pin checked-out main commit
        id: source
        run: |
          commit=$(git rev-parse HEAD)
          # OIDC certifies the triggering workflow SHA, not a later main checkout.
          test "$commit" = "$GITHUB_SHA"
          printf 'commit=%s\n' "$commit" >>"$GITHUB_OUTPUT"
      - name: Require exact-head green main CI
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        # The reusable graph validates this run's exact github.sha before the
        # protected publication job starts; no earlier main run can substitute.
        run: test "$VALIDATION_RESULT" = success
      - name: Resolve stable-base nightly identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ steps.source.outputs.commit }}
          RUN_NUMBER: ${{ github.run_number }}
          INITIAL_NIGHTLY_VERSION: 0.0.1
        run: |
          set -o pipefail
          tag=$(gh api --paginate --slurp \
            "repos/$REPOSITORY/git/matching-refs/tags/v" | \
            ./scripts/release/nightly-run-tag.sh "$RUN_NUMBER")
          tag_exists=false
          if [ -n "$tag" ]; then
            tag_lookup_error="$RUNNER_TEMP/nightly-tag-lookup.err"
            if ! existing_tag_sha=$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" \
              --jq '.object.sha' 2>"$tag_lookup_error"); then
              cat "$tag_lookup_error" >&2
              exit 1
            fi
            if [ "$existing_tag_sha" != "$COMMIT" ]; then
              printf 'nightly: run %s tag %s resolves to %s, expected %s\n' \
                "$RUN_NUMBER" "$tag" "$existing_tag_sha" "$COMMIT" >&2
              exit 1
            fi
            release_lookup_error="$RUNNER_TEMP/nightly-release-lookup.err"
            if release_state=$(gh api "repos/$REPOSITORY/releases/tags/$tag" \
              --jq '"\(.draft):\(.prerelease)"' 2>"$release_lookup_error"); then
              if [ "$release_state" != 'false:true' ]; then
                printf 'nightly: existing release %s has unexpected state %s\n' \
                  "$tag" "$release_state" >&2
                exit 1
              fi
              printf 'skip=true\n' >>"$GITHUB_OUTPUT"
              printf 'tag=%s\nversion=%s\n' "$tag" "${tag#v}" >>"$GITHUB_OUTPUT"
              printf 'nightly: workflow run %s already published as %s\n' \
                "$RUN_NUMBER" "$tag"
              exit 0
            elif ! grep -F '(HTTP 404)' "$release_lookup_error" >/dev/null; then
              cat "$release_lookup_error" >&2
              exit 1
            fi
            version=${tag#v}
            tag_exists=true
          else
            latest_tag=$(gh api --paginate --slurp \
              "repos/$REPOSITORY/releases?per_page=100" | \
              ./scripts/release/latest-nightly-tag.sh)
            latest_commit=
            if [ -n "$latest_tag" ]; then
              latest_commit=$(gh api "repos/$REPOSITORY/git/ref/tags/$latest_tag" \
                --jq '.object.sha')
            fi
            if [ "$latest_commit" = "$COMMIT" ]; then
              printf 'skip=true\n' >>"$GITHUB_OUTPUT"
              printf 'tag=%s\nversion=%s\n' "$latest_tag" "${latest_tag#v}" >>"$GITHUB_OUTPUT"
              printf 'nightly: commit %s already published\n' "$COMMIT"
              exit 0
            fi
            stable_tag=$(gh api --paginate --slurp \
              "repos/$REPOSITORY/releases?per_page=100" | \
              ./scripts/release/latest-stable-version.sh)
            release_date=$(date -u +%Y%m%d)
            if [ -n "$stable_tag" ]; then
              version=$(./scripts/release/next-nightly-version.sh \
                "$stable_tag" "$release_date" "$RUN_NUMBER" "$COMMIT")
            else
              version=$(./scripts/release/nightly-version.sh "$INITIAL_NIGHTLY_VERSION" \
                "$release_date" "$RUN_NUMBER" "$COMMIT")
            fi
            tag="v$version"
            tag_lookup_error="$RUNNER_TEMP/nightly-tag-lookup.err"
            if existing_tag_sha=$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" \
              --jq '.object.sha' 2>"$tag_lookup_error"); then
              if [ "$existing_tag_sha" != "$COMMIT" ]; then
                printf 'nightly: tag %s resolves to %s, expected %s\n' \
                  "$tag" "$existing_tag_sha" "$COMMIT" >&2
                exit 1
              fi
              printf 'nightly: tag %s already resolves to %s; resuming publication\n' \
                "$tag" "$COMMIT"
              tag_exists=true
            elif ! grep -F '(HTTP 404)' "$tag_lookup_error" >/dev/null; then
              cat "$tag_lookup_error" >&2
              exit 1
            fi
          fi
          printf 'skip=false\nversion=%s\ntag=%s\ntag_exists=%s\n' \
            "$version" "$tag" "$tag_exists" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.identity.outputs.skip != 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Require recovery-authorized nightly trust before building
        if: steps.identity.outputs.skip != 'true'
        run: go run ./scripts/release/nightly preflight
      - name: Resolve and authenticate previous signed nightly
        if: steps.identity.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_MISSING_PREDECESSOR: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'nightly-chain-restart' && github.event.client_payload.allow_missing_predecessor == true }}
          PREDECESSOR_EDGES: 8
        run: |
          set -o pipefail
          # Up to PREDECESSOR_EDGES signed predecessors, newest first, each
          # becomes an exact-schema upgrade source of this nightly (#700), so a
          # route can skip one revoked or missing release without a bridge.
          # Directory 1 is the newest predecessor; the highest number the oldest.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq '
            map(map(select(any(.assets[]; .name == "release-manifest.sigstore.json"))))
          ' | ./scripts/release/latest-nightly-tag.sh --limit "$PREDECESSOR_EDGES" >"$RUNNER_TEMP/predecessor-tags"
          set --
          index=0
          while IFS= read -r previous_tag; do
            [ -n "$previous_tag" ] || continue
            index=$((index + 1))
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/previous-nightly/$index"
            set -- "$@" --directory "$RUNNER_TEMP/previous-nightly/$index"
          done <"$RUNNER_TEMP/predecessor-tags"
          if [ "$index" -gt 0 ]; then
            printf '%s\n' "$index" >"$RUNNER_TEMP/previous-nightly/count"
            go run ./scripts/release/nightly sources "$@" --out "$RUNNER_TEMP/nightly-sources.json"
          elif [ "$ALLOW_MISSING_PREDECESSOR" = true ]; then
            echo '::warning::Building without a signed predecessor by explicit request; installations below this release need a recovery bridge.'
            go run ./scripts/release/nightly sources --out "$RUNNER_TEMP/nightly-sources.json"
          else
            # Every nightly declares its signed predecessor as an upgrade source.
            # No predecessor means the chain was cut, usually by deleting a
            # release. A silent build here strands every installation below it.
            echo '::error::No signed predecessor release is available. Revoke bad nightlies instead of deleting them; to restart the chain deliberately, send the nightly-chain-restart repository dispatch with allow_missing_predecessor=true and publish a recovery bridge.'
            exit 1
          fi
      - name: Generate nightly compatibility from both migrated engines
        id: compatibility
        if: steps.identity.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
          HIKYO_RELEASE_SCHEMA_POSTGRES_DSN: postgres://hikyo:release-schema-fixture@127.0.0.1:5432/hikyo_release_schema?sslmode=disable
        run: |
          candidate="$RUNNER_TEMP/nightly-candidate.json"
          jq -n --arg version "$VERSION" --arg commit "$COMMIT" --argjson sequence "$GITHUB_RUN_NUMBER" \
            '{version:$version,commit:$commit,sequence:$sequence,key_id:"",public_key:""}' >"$candidate"
          declaration="$RUNNER_TEMP/upgrade-compatibility.json"
          go run ./scripts/release/compatibility --profile nightly/v1 --candidate "$candidate" \
            --sources "$RUNNER_TEMP/nightly-sources.json" --out "$declaration"
          {
            printf 'path=%s\n' "$declaration"
            printf 'sha256=%s\n' "$(sha256sum "$declaration" | awk '{print $1}')"
          } >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        if: steps.identity.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
      - name: Install Corepack and enable pnpm
        if: steps.identity.outputs.skip != 'true'
        run: ./scripts/ci/install-corepack.sh
      - name: Build tested embedded WebUI
        if: steps.identity.outputs.skip != 'true'
        run: ./scripts/ci/build-spa.sh
      - name: Embed mandatory production trust material
        id: update-trust
        if: steps.identity.outputs.skip != 'true'
        run: |
          test -s release/trust/root.json
          recovery=$(jq -r '.recovery.public_key' release/trust/root.json)
          {
            printf 'root='
            base64 <release/trust/root.json | tr -d '\n'
            printf '\nrecovery='
            base64 <"release/trust/$recovery" | tr -d '\n'
            printf '\n'
          } >>"$GITHUB_OUTPUT"
      - name: Build six nightly archives and eight native packages
        if: steps.identity.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          HIKYO_RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          HIKYO_RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          HIKYO_UPDATE_CHANNEL: nightly
          HIKYO_UPDATE_TRUST_ROOT: ${{ steps.update-trust.outputs.root }}
          HIKYO_UPDATE_RECOVERY_KEY: ${{ steps.update-trust.outputs.recovery }}
          HIKYO_COMPATIBILITY_PATH: ${{ steps.compatibility.outputs.path }}
          HIKYO_COMPATIBILITY_SHA256: ${{ steps.compatibility.outputs.sha256 }}
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish
      - name: Verify nightly archive and package identity
        if: steps.identity.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          jq -e --arg version "$VERSION" --arg commit "$COMMIT" '
            .version == $version and .commit == $commit
          ' dist/metadata.json >/dev/null
          ./scripts/release/snapshot-manifest_test.sh
      - name: Bind untouched nightly archive bytes
        id: retained-integrity
        if: steps.identity.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -o pipefail
          for os in Linux Windows; do
            extension=tar.gz
            if [ "$os" = Windows ]; then extension=zip; fi
            for arch in arm64 x86_64; do
              sha256sum "dist/hikyo_${VERSION}_${os}_${arch}.$extension" || exit 1
            done
          done | LC_ALL=C sort >"$RUNNER_TEMP/non-darwin-checksums.txt"
          non_darwin_sha256=$(sha256sum "$RUNNER_TEMP/non-darwin-checksums.txt" | awk '{print $1}')
          printf 'non_darwin_sha256=%s\n' "$non_darwin_sha256" >>"$GITHUB_OUTPUT"
      - name: Retain canonical nightly artifacts and authenticated predecessor identity
        if: steps.identity.outputs.skip != 'true'
        run: |
          mkdir nightly-context
          cp "$RUNNER_TEMP/upgrade-compatibility.json" "$RUNNER_TEMP/nightly-sources.json" \
            "$RUNNER_TEMP/predecessor-tags" nightly-context/
          tar -czf "$RUNNER_TEMP/nightly-inputs.tar.gz" dist nightly-context
      - id: upload-inputs
        if: steps.identity.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-inputs.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Remove CI PostgreSQL
        if: ${{ always() && steps.ci-postgres.outcome == 'success' }}
        run: docker container rm --force hikyo-ci-postgres

  apple-sign:
    environment: apple-signing
    needs: build-artifacts
    if: github.ref == 'refs/heads/main' && needs.build-artifacts.outputs.skip != 'true'
    runs-on: macos-15
    outputs:
      artifact_id: ${{ steps.upload-inputs.outputs.artifact-id }}
      darwin_sha256: ${{ steps.signed-digests.outputs.sha256 }}
    permissions:
      contents: read
    env:
      # The macOS 15 default client traps during API-key authentication.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Report selected Apple notarization client
        run: |
          xcodebuild -version
          xcrun notarytool --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-artifacts.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/nightly-inputs
      - name: Restore canonical nightly artifacts
        run: tar -xzf "$RUNNER_TEMP/nightly-inputs/nightly-inputs.tar.gz"
      - name: Sign nightly macOS binaries and disk images
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_RELEASE_CHANNEL: nightly
          APPLE_RELEASE_VERSION: ${{ needs.build-artifacts.outputs.version }}
          APPLE_RELEASE_COMMIT: ${{ needs.build-artifacts.outputs.commit }}
        run: ./scripts/release/sign-apple-artifacts.sh --sign-only dist
      - name: Bind signed macOS artifact bytes
        id: signed-digests
        env:
          VERSION: ${{ needs.build-artifacts.outputs.version }}
        run: |
          set -euo pipefail
          darwin_sha256=$(./scripts/release/apple-artifact-digest.sh dist "$VERSION")
          echo "sha256=$darwin_sha256" >>"$GITHUB_OUTPUT"
      - name: Retain signed nightly artifacts and predecessor context
        run: COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/apple-nightly-inputs.tar.gz" dist nightly-context
      - id: upload-inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-signed-nightly-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-nightly-inputs.tar.gz
          if-no-files-found: error
          retention-days: 30

  apple-notarize:
    environment: apple-signing
    needs: [build-artifacts, apple-sign]
    if: github.ref == 'refs/heads/main' && needs.build-artifacts.outputs.skip != 'true'
    runs-on: macos-15
    outputs:
      artifact_id: ${{ steps.upload-inputs.outputs.artifact-id }}
      inputs_verified: ${{ steps.notarize.outputs.inputs_verified }}
      recovery_pending: ${{ steps.defer.outputs.recovery_pending || steps.notarize.outputs.recovery_pending || (steps.notarize.outcome == 'skipped' && (steps.submit-arm64.outcome == 'success' || steps.submit-x86_64.outcome == 'success') && 'true') || 'false' }}
      fallback_authorized: ${{ steps.notarize.outputs.fallback_authorized }}
      notarize_outcome: ${{ steps.notarize.outcome }}
      diagnostics_outcome: ${{ steps.notarization-diagnostics.outcome }}
    permissions:
      actions: read
      contents: read
    env:
      # The macOS 15 default client traps during API-key authentication.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Report selected Apple notarization client
        run: |
          xcodebuild -version
          xcrun notarytool --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.apple-sign.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/apple-nightly-inputs
      - name: Restore signed nightly artifacts
        run: tar -xzf "$RUNNER_TEMP/apple-nightly-inputs/apple-nightly-inputs.tar.gz"
      - name: Verify exact signed macOS input bytes
        env:
          VERSION: ${{ needs.build-artifacts.outputs.version }}
          SIGNED_DARWIN_SHA256: ${{ needs.apple-sign.outputs.darwin_sha256 }}
        run: |
          set -euo pipefail
          darwin_sha256=$(./scripts/release/apple-artifact-digest.sh dist "$VERSION")
          test "$darwin_sha256" = "$SIGNED_DARWIN_SHA256"
      - name: Restore the original run's notarization checkpoint
        id: restore-notary
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_RELEASE_CHANNEL: nightly
        run: python3 scripts/release/apple_notary_state.py restore "$RUNNER_TEMP/apple-notarization"
      - name: Prepare bound submission intents without credentials
        id: prepare
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_EVIDENCE_DIR: ${{ runner.temp }}/apple-notarization
          APPLE_NOTARY_INPUT_ARTIFACT_ID: ${{ needs.apple-sign.outputs.artifact_id }}
          APPLE_NOTARY_INPUT_SHA256: ${{ needs.apple-sign.outputs.darwin_sha256 }}
          APPLE_RELEASE_CHANNEL: nightly
          APPLE_RELEASE_VERSION: ${{ needs.build-artifacts.outputs.version }}
          APPLE_RELEASE_COMMIT: ${{ needs.build-artifacts.outputs.commit }}
        run: ./scripts/release/sign-apple-artifacts.sh --prepare-only dist
      - name: Checkpoint submission intent before any upload to Apple
        env:
          APPLE_RECOVERY_PENDING: 'true'
          APPLE_RELEASE_CHANNEL: nightly
        run: python3 scripts/release/apple_notary_state.py snapshot "$RUNNER_TEMP/apple-notarization" "$RUNNER_TEMP/prepared/checkpoint.tar" prepared
      - name: Persist submission intent
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-notary-state-${{ github.run_id }}-${{ github.run_attempt }}-prepared
          path: ${{ runner.temp }}/prepared/checkpoint.tar
          if-no-files-found: error
          retention-days: 90
      - name: Submit arm64 once or reconcile its UUID
        id: submit-arm64
        env:
          APPLE_NOTARY_UNSTARTED_ARCHITECTURES: ${{ steps.restore-notary.outputs.unstarted_architectures }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_EVIDENCE_DIR: ${{ runner.temp }}/apple-notarization
          APPLE_NOTARY_INPUT_ARTIFACT_ID: ${{ needs.apple-sign.outputs.artifact_id }}
          APPLE_NOTARY_INPUT_SHA256: ${{ needs.apple-sign.outputs.darwin_sha256 }}
          APPLE_RELEASE_CHANNEL: nightly
          APPLE_RELEASE_VERSION: ${{ needs.build-artifacts.outputs.version }}
          APPLE_RELEASE_COMMIT: ${{ needs.build-artifacts.outputs.commit }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: ./scripts/release/sign-apple-artifacts.sh --submit-only --architecture arm64 dist
      - name: Checkpoint arm64 UUID before advancing
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.submit-arm64.outcome != 'skipped' }}
        id: snapshot-arm64
        env:
          APPLE_RECOVERY_PENDING: 'true'
          APPLE_RELEASE_CHANNEL: nightly
        run: python3 scripts/release/apple_notary_state.py snapshot "$RUNNER_TEMP/apple-notarization" "$RUNNER_TEMP/submitted-arm64/checkpoint.tar" submitted-arm64
      - name: Persist arm64 UUID before advancing
        if: ${{ always() && steps.snapshot-arm64.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-notary-state-${{ github.run_id }}-${{ github.run_attempt }}-submitted-arm64
          path: ${{ runner.temp }}/submitted-arm64/checkpoint.tar
          if-no-files-found: error
          retention-days: 90
      - name: Submit x86_64 once or reconcile its UUID
        id: submit-x86_64
        env:
          APPLE_NOTARY_UNSTARTED_ARCHITECTURES: ${{ steps.restore-notary.outputs.unstarted_architectures }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_EVIDENCE_DIR: ${{ runner.temp }}/apple-notarization
          APPLE_NOTARY_INPUT_ARTIFACT_ID: ${{ needs.apple-sign.outputs.artifact_id }}
          APPLE_NOTARY_INPUT_SHA256: ${{ needs.apple-sign.outputs.darwin_sha256 }}
          APPLE_RELEASE_CHANNEL: nightly
          APPLE_RELEASE_VERSION: ${{ needs.build-artifacts.outputs.version }}
          APPLE_RELEASE_COMMIT: ${{ needs.build-artifacts.outputs.commit }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: ./scripts/release/sign-apple-artifacts.sh --submit-only --architecture x86_64 dist
      - name: Checkpoint x86_64 UUID before advancing
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.submit-x86_64.outcome != 'skipped' }}
        id: snapshot-x86_64
        env:
          APPLE_RECOVERY_PENDING: 'true'
          APPLE_RELEASE_CHANNEL: nightly
        run: python3 scripts/release/apple_notary_state.py snapshot "$RUNNER_TEMP/apple-notarization" "$RUNNER_TEMP/submitted-x86_64/checkpoint.tar" submitted-x86_64
      - name: Persist x86_64 UUID before advancing
        if: ${{ always() && steps.snapshot-x86_64.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-notary-state-${{ github.run_id }}-${{ github.run_attempt }}-submitted-x86_64
          path: ${{ runner.temp }}/submitted-x86_64/checkpoint.tar
          if-no-files-found: error
          retention-days: 90
      # Qualification deliberately interrupts after real submissions are retained.
      # The next attempt queries the same UUIDs; it never fabricates Apple results.
      - name: Qualify automatic continuation after retained UUIDs
        id: defer
        if: github.run_attempt == 1 && github.event.client_payload.qualify_recovery == true
        run: |
          echo 'recovery_pending=true' >>"$GITHUB_OUTPUT"
          echo 'Qualification interruption after real UUID persistence; await automatic recovery.'
          exit 75
      - name: Notarize and staple nightly macOS disk images
        id: notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_EVIDENCE_DIR: ${{ runner.temp }}/apple-notarization
          APPLE_NOTARY_INPUT_ARTIFACT_ID: ${{ needs.apple-sign.outputs.artifact_id }}
          APPLE_NOTARY_INPUT_SHA256: ${{ needs.apple-sign.outputs.darwin_sha256 }}
          APPLE_RELEASE_CHANNEL: nightly
          APPLE_RELEASE_VERSION: ${{ needs.build-artifacts.outputs.version }}
          APPLE_RELEASE_COMMIT: ${{ needs.build-artifacts.outputs.commit }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: ./scripts/release/with-apple-ticket-network.sh ./scripts/release/sign-apple-artifacts.sh --notarize-only dist
      - name: Checkpoint final provider decision and exact submitted bytes
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        id: snapshot-final
        env:
          APPLE_RELEASE_CHANNEL: nightly
          APPLE_RECOVERY_PENDING: ${{ steps.defer.outputs.recovery_pending == 'true' || steps.notarize.outputs.recovery_pending == 'true' || (steps.notarize.outcome == 'skipped' && (steps.submit-arm64.outcome == 'success' || steps.submit-x86_64.outcome == 'success')) }}
        run: python3 scripts/release/apple_notary_state.py snapshot "$RUNNER_TEMP/apple-notarization" "$RUNNER_TEMP/finalized/checkpoint.tar" finalized
      - name: Persist final stage checkpoint
        if: ${{ always() && steps.snapshot-final.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-notary-state-${{ github.run_id }}-${{ github.run_attempt }}-finalized
          path: ${{ runner.temp }}/finalized/checkpoint.tar
          if-no-files-found: error
          retention-days: 90
      - name: Retain Apple notarization diagnostics
        id: notarization-diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-notarization-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-notarization/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Bind Apple evidence to the finalized candidate
        run: |
          jq -n --slurpfile arm "$RUNNER_TEMP/apple-notarization/arm64-receipt.json" \
            --slurpfile intel "$RUNNER_TEMP/apple-notarization/x86_64-receipt.json" \
            --slurpfile armlog "$RUNNER_TEMP/apple-notarization/arm64-notary-log.json" \
            --slurpfile intellog "$RUNNER_TEMP/apple-notarization/x86_64-notary-log.json" \
            '{schema:"hikyo.dev/apple-release-evidence/v1",receipts:[$arm[0],$intel[0]],logs:[$armlog[0],$intellog[0]]}' \
            >dist/apple-notarization-evidence.json
      - name: Retain finalized nightly artifacts and predecessor context
        run: COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/apple-nightly-inputs.tar.gz" dist nightly-context
      - id: upload-inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-nightly-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-nightly-inputs.tar.gz
          if-no-files-found: error
          retention-days: 30

  apple-acceptance:
    needs: [build-artifacts, apple-notarize]
    if: github.ref == 'refs/heads/main' && needs.build-artifacts.outputs.skip != 'true'
    environment: apple-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.apple-notarize.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/apple-native-inputs
      - name: Restore exact finalized candidate
        run: tar -xzf "$RUNNER_TEMP/apple-native-inputs/apple-nightly-inputs.tar.gz"
      - name: Verify native installation with quarantine retained
        env:
          VERSION: ${{ needs.build-artifacts.outputs.version }}
          ARCH: ${{ matrix.arch }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_INPUT_ARTIFACT_ID: ${{ needs.apple-notarize.outputs.artifact_id }}
        run: ./scripts/release/verify-apple-install.sh dist "$VERSION" "$ARCH" "$RUNNER_TEMP/install-$ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-install-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/install-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [validation, build-artifacts, apple-sign, apple-notarize, apple-acceptance]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      needs.validation.result == 'success' && needs.build-artifacts.result == 'success' &&
      (needs.build-artifacts.outputs.skip == 'true' || (needs.apple-sign.result == 'success' &&
      needs.apple-notarize.outputs.inputs_verified == 'true' &&
      ((needs.apple-notarize.result == 'success' && needs.apple-notarize.outputs.notarize_outcome == 'success' &&
      needs.apple-acceptance.result == 'success') ||
      (needs.apple-notarize.result == 'failure' && needs.apple-notarize.outputs.notarize_outcome == 'failure' &&
      needs.apple-notarize.outputs.recovery_pending != 'true' &&
      needs.apple-notarize.outputs.fallback_authorized == 'true' &&
      needs.apple-notarize.outputs.diagnostics_outcome == 'success'))))
    # Required operator gate: this environment must allow only main, and the
    # app private key must exist here, never as a repository-scoped secret.
    # See docs/handoff/nightly-release-custody.md before enabling publication.
    environment: nightly-release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.build-artifacts.outputs.tag }}
      version: ${{ needs.build-artifacts.outputs.version }}
      commit: ${{ needs.build-artifacts.outputs.commit }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Start healthy PostgreSQL with Docker Hub cache fallback
        id: ci-postgres
        if: needs.build-artifacts.outputs.skip != 'true'
        env:
          POSTGRES_PASSWORD: release-schema-fixture
          POSTGRES_DB: hikyo_release_schema
          POSTGRES_HEALTH_RETRIES: 12
        run: ./scripts/ci/start-ci-postgres.sh
      - name: Require exact-head green main CI
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$VALIDATION_RESULT" = success
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.build-artifacts.outputs.skip != 'true'
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build-artifacts.outputs.skip != 'true' && needs.apple-notarize.result == 'success'
        with:
          artifact-ids: ${{ needs.apple-notarize.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/apple-nightly-inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build-artifacts.outputs.skip != 'true' && needs.apple-notarize.result == 'failure' && needs.apple-notarize.outputs.inputs_verified == 'true'
        with:
          artifact-ids: ${{ needs.apple-sign.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/apple-nightly-inputs
      - name: Restore finalized nightly artifacts and recheck source identity
        if: needs.build-artifacts.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.build-artifacts.outputs.version }}
          COMMIT: ${{ needs.build-artifacts.outputs.commit }}
          APPLE_NOTARIZATION_RESULT: ${{ needs.apple-notarize.result }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test "$COMMIT" = "$GITHUB_SHA"
          tar -xzf "$RUNNER_TEMP/apple-nightly-inputs/apple-nightly-inputs.tar.gz"
          jq -e --arg version "$VERSION" --arg commit "$COMMIT" '
            .version == $version and .commit == $commit
          ' dist/metadata.json >/dev/null
          (cd dist && sha256sum --check --strict checksums.txt)
          if [ "$APPLE_NOTARIZATION_RESULT" = success ]; then
            for arch in arm64 x86_64; do
              test -s "dist/hikyo_${VERSION}_Darwin_$arch.dmg"
            done
          fi
      - name: Verify signed macOS fallback input bytes
        if: needs.build-artifacts.outputs.skip != 'true' && needs.apple-notarize.result == 'failure'
        env:
          VERSION: ${{ needs.build-artifacts.outputs.version }}
          SIGNED_DARWIN_SHA256: ${{ needs.apple-sign.outputs.darwin_sha256 }}
        run: |
          darwin_sha256=$(./scripts/release/apple-artifact-digest.sh dist "$VERSION")
          test "$darwin_sha256" = "$SIGNED_DARWIN_SHA256"
      - name: Verify untouched nightly archives and compatibility
        if: needs.build-artifacts.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.build-artifacts.outputs.version }}
          NON_DARWIN_SHA256: ${{ needs.build-artifacts.outputs.non_darwin_sha256 }}
          COMPATIBILITY_SHA256: ${{ needs.build-artifacts.outputs.compatibility_sha256 }}
        run: |
          set -o pipefail
          for os in Linux Windows; do
            extension=tar.gz
            if [ "$os" = Windows ]; then extension=zip; fi
            for arch in arm64 x86_64; do
              sha256sum "dist/hikyo_${VERSION}_${os}_${arch}.$extension" || exit 1
            done
          done | LC_ALL=C sort >"$RUNNER_TEMP/non-darwin-checksums.txt"
          non_darwin_sha256=$(sha256sum "$RUNNER_TEMP/non-darwin-checksums.txt" | awk '{print $1}')
          test "$non_darwin_sha256" = "$NON_DARWIN_SHA256"
          test "$(sha256sum nightly-context/upgrade-compatibility.json | awk '{print $1}')" = "$COMPATIBILITY_SHA256"
      - name: Prepare canonical nightly image inputs
        if: needs.build-artifacts.outputs.skip != 'true'
        env:
          COMMIT: ${{ needs.build-artifacts.outputs.commit }}
        run: |
          cp nightly-context/upgrade-compatibility.json "$RUNNER_TEMP/upgrade-compatibility.json"
          go run ./scripts/release/nightly preflight
          ./scripts/release/prepare-image-root.sh \
            dist image-root "$COMMIT" .goreleaser.yaml
      - name: Reauthenticate the exact predecessors used for this build
        if: needs.build-artifacts.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set --
          index=0
          while IFS= read -r previous_tag; do
            [ -n "$previous_tag" ] || continue
            index=$((index + 1))
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/previous-nightly/$index"
            set -- "$@" --directory "$RUNNER_TEMP/previous-nightly/$index"
          done <nightly-context/predecessor-tags
          if [ "$index" -gt 0 ]; then
            printf '%s\n' "$index" >"$RUNNER_TEMP/previous-nightly/count"
          fi
          go run ./scripts/release/nightly sources "$@" --out "$RUNNER_TEMP/nightly-sources.json"
          cmp nightly-context/nightly-sources.json "$RUNNER_TEMP/nightly-sources.json"
      - name: Download native installation evidence from this original run
        if: needs.build-artifacts.outputs.skip != 'true' && needs.apple-notarize.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apple-install-${{ github.run_id }}-*
          path: ${{ runner.temp }}/apple-installations
      - name: Stage the complete nightly payload inventory
        if: needs.build-artifacts.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.build-artifacts.outputs.version }}
          COMMIT: ${{ needs.build-artifacts.outputs.commit }}
          APPLE_NOTARIZATION_RESULT: ${{ needs.apple-notarize.result }}
          APPLE_FINAL_ARTIFACT_ID: ${{ needs.apple-notarize.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir nightly-payloads
          cp dist/hikyo_*_Darwin_*.tar.gz dist/hikyo_*_Linux_*.tar.gz dist/hikyo_*_Windows_*.zip \
            dist/hikyo_*.deb dist/hikyo-*.rpm dist/hikyo_*.apk dist/hikyo-*.pkg.tar.zst \
            dist/checksums.txt dist/binary-provenance.json nightly-payloads/
          case "$APPLE_NOTARIZATION_RESULT" in
            success)
              for arch in arm64 x86_64; do
                test -s "dist/hikyo_${VERSION}_Darwin_$arch.dmg"
              done
              cp dist/hikyo_*_Darwin_*.dmg nightly-payloads/
              apple_notes='macOS: signed and notarized; includes two stapled disk images.'
              ;;
            failure)
              apple_notes='macOS: signed tarballs; notarization was NOT verified for this release. Disk images are omitted because the notarization job failed.'
              ;;
            *) echo 'Unexpected Apple notarization result' >&2; exit 1 ;;
          esac
          cp "$RUNNER_TEMP/upgrade-compatibility.json" nightly-payloads/
          cp release/trust/nightly/policy.json nightly-payloads/nightly-policy.json
          cp release/trust/nightly/trusted-root.json nightly-payloads/sigstore-trusted-root.json
          printf '%s\n' \
            'AUTOMATED SIGNED NIGHTLY - nightly/v1 trust profile' \
            "Version: $VERSION" "Source commit: $COMMIT" \
            'Includes six archives and eight native Linux packages.' "$apple_notes" \
            'Server installation requires the authenticated offline bundle and upgrade evidence.' \
            >nightly-payloads/NIGHTLY-BUILD.txt
          if [ "$APPLE_NOTARIZATION_RESULT" = success ]; then
            python3 scripts/release/apple_notary_state.py append-evidence dist \
              "$RUNNER_TEMP/apple-installations" nightly-payloads/NIGHTLY-BUILD.txt
          fi
          cp nightly-payloads/NIGHTLY-BUILD.txt "$RUNNER_TEMP/nightly-notes.md"
          ./scripts/release/create-nightly-manifest.sh "$VERSION" "$COMMIT" "$GITHUB_RUN_NUMBER" nightly-payloads
      - name: Append changes since the previous published nightly
        if: needs.build-artifacts.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.build-artifacts.outputs.commit }}
        run: |
          set -o pipefail
          previous_tag=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
            ./scripts/release/latest-nightly-tag.sh)
          previous_commit=
          if [ -n "$previous_tag" ]; then
            previous_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$previous_tag" \
              --jq '.object.sha')
          fi
          ./scripts/release/nightly-changelog.sh "$previous_commit" "$COMMIT" \
            >>"$RUNNER_TEMP/nightly-notes.md"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: needs.build-artifacts.outputs.skip != 'true'
        with:
          cosign-release: v3.1.3
      - name: Sign complete nightly manifest with GitHub OIDC
        if: needs.build-artifacts.outputs.skip != 'true'
        run: |
          cosign sign-blob --yes --use-signing-config=false --new-bundle-format=true \
            --rekor-url=https://rekor.sigstore.dev \
            --trusted-root=release/trust/nightly/trusted-root.json \
            --bundle=nightly-payloads/release-manifest.sigstore.json \
            nightly-payloads/release-manifest.json
      - name: Verify exact signed inventory and assemble runtime evidence
        if: needs.build-artifacts.outputs.skip != 'true'
        env:
          ALLOW_MISSING_PREDECESSOR: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'nightly-chain-restart' && github.event.client_payload.allow_missing_predecessor == true }}
        run: |
          go run ./scripts/release/nightly verify --directory nightly-payloads
          if [ -d "$RUNNER_TEMP/previous-nightly" ]; then
            ./scripts/release/assemble-nightly.sh release/trust "$RUNNER_TEMP/nightly-bundle" \
              "$RUNNER_TEMP"/previous-nightly/[0-9]* nightly-payloads
          elif [ "$ALLOW_MISSING_PREDECESSOR" = true ]; then
            ./scripts/release/assemble-nightly.sh release/trust "$RUNNER_TEMP/nightly-bundle" nightly-payloads
          else
            echo '::error::Signed predecessor missing at bundle assembly'
            exit 1
          fi
      - name: Require packaged production startup and restart on both engines
        if: needs.build-artifacts.outputs.skip != 'true'
        env:
          PGPASSWORD: release-schema-fixture
          HIKYO_SMOKE_POSTGRES_DSN: postgres://hikyo:release-schema-fixture@127.0.0.1:5432/hikyo_nightly_smoke?sslmode=disable
        run: |
          psql -h 127.0.0.1 -U hikyo -d postgres -c 'CREATE DATABASE hikyo_nightly_smoke'
          ./scripts/release/smoke-release-startup.sh image-root/amd64/hikyo "$RUNNER_TEMP/nightly-bundle"
      - name: Require populated previous nightly upgrade on both engines
        if: needs.build-artifacts.outputs.skip != 'true'
        env:
          HIKYO_TEST_POSTGRES_DSN: postgres://hikyo:release-schema-fixture@127.0.0.1:5432/hikyo_release_schema?sslmode=disable
          ALLOW_MISSING_PREDECESSOR: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'nightly-chain-restart' && github.event.client_payload.allow_missing_predecessor == true }}
        run: |
          if [ ! -d "$RUNNER_TEMP/previous-nightly" ] && [ "$ALLOW_MISSING_PREDECESSOR" != true ]; then
            echo '::error::Signed predecessor missing at the populated upgrade proof'
            exit 1
          fi
          if [ -d "$RUNNER_TEMP/previous-nightly" ]; then
            # Prove the newest predecessor (the ordinary hop) and the oldest
            # declared one (the route that skips everything in between).
            count=$(cat "$RUNNER_TEMP/previous-nightly/count")
            export HIKYO_NIGHTLY_TARGET_BINARY="$GITHUB_WORKSPACE/image-root/amd64/hikyo"
            export HIKYO_NIGHTLY_TRUST="$GITHUB_WORKSPACE/release/trust"
            export HIKYO_NIGHTLY_BUNDLE="$RUNNER_TEMP/nightly-bundle"
            export HIKYO_NIGHTLY_TARGET_COMPATIBILITY="$GITHUB_WORKSPACE/nightly-payloads/upgrade-compatibility.json"
            for index in $(printf '%s\n' 1 "$count" | sort -un); do
              previous="$RUNNER_TEMP/previous-nightly/$index"
              previous_version=$(jq -r '.version' "$previous/release-manifest.json")
              rm -rf "$RUNNER_TEMP/previous-binary"
              mkdir "$RUNNER_TEMP/previous-binary"
              tar -xzf "$previous/hikyo_${previous_version}_Linux_x86_64.tar.gz" \
                -C "$RUNNER_TEMP/previous-binary" hikyo
              export HIKYO_NIGHTLY_PREVIOUS_BINARY="$RUNNER_TEMP/previous-binary/hikyo"
              export HIKYO_NIGHTLY_PREVIOUS_COMPATIBILITY="$previous/upgrade-compatibility.json"
              printf 'Populated upgrade proof from predecessor %s (%s)\n' "$index" "$previous_version"
              go test ./internal/upgradegate -run '^TestPackagedNightlyReleaseUpgrade$' -count=1 -v
            done
          else
            printf 'First signed nightly: no authenticated predecessor exists; fresh boot gates passed.\n'
          fi
      - name: Mint scoped nightly release app token
        id: release_app
        if: needs.build-artifacts.outputs.skip != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NIGHTLY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NIGHTLY_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Create immutable nightly tag
        if: needs.build-artifacts.outputs.skip != 'true' && needs.build-artifacts.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.build-artifacts.outputs.tag }}
          COMMIT: ${{ needs.build-artifacts.outputs.commit }}
        run: |
          gh api --method POST "repos/$REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$COMMIT" >/dev/null
      - name: Publish immutable GitHub prerelease
        if: needs.build-artifacts.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          TAG: ${{ needs.build-artifacts.outputs.tag }}
        run: |
          gh release create "$TAG" \
            nightly-payloads/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/nightly-notes.md" \
            --prerelease
      - name: Remove CI PostgreSQL
        if: ${{ always() && steps.ci-postgres.outcome == 'success' }}
        run: docker container rm --force hikyo-ci-postgres


  container:
    needs: publish
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TAG: ${{ needs.publish.outputs.tag }}
      VERSION: ${{ needs.publish.outputs.version }}
      COMMIT: ${{ needs.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download and authenticate canonical published binaries
        id: inputs
        run: ./scripts/release/nightly-image.sh prepare
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve immutable image or prove absence
        id: existing
        env:
          IMAGE: ${{ steps.inputs.outputs.image }}
        run: ./scripts/release/nightly-image.sh resolve
      - name: Publish immutable multi-arch nightly
        if: steps.existing.outputs.exists != 'true'
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.inputs.outputs.image }}:${{ needs.publish.outputs.version }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.publish.outputs.commit }}
            org.opencontainers.image.version=${{ needs.publish.outputs.version }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify payloads, smoke, sign and promote current nightly
        env:
          IMAGE: ${{ steps.inputs.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest || steps.existing.outputs.digest }}
          IMAGE_BUILT: ${{ steps.image.outcome == 'success' && steps.existing.outputs.exists != 'true' }}
        run: ./scripts/release/nightly-image.sh promote
