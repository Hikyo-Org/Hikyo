name: nightly-release

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/heads/main
          persist-credentials: false
      - name: Pin checked-out main commit
        id: source
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Require exact-head green main CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: ./scripts/release/require-green-main.sh "$REPOSITORY" "$COMMIT"
      - name: Resolve next-minor nightly identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ steps.source.outputs.commit }}
          RUN_NUMBER: ${{ github.run_number }}
          INITIAL_NIGHTLY_VERSION: 0.0.1
        run: |
          set -o pipefail
          latest_target=$(gh api "repos/$REPOSITORY/releases?per_page=100" --jq '
            map(select(.draft == false and .prerelease == true and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.")))) |
            .[0].target_commitish // ""
          ')
          if [ "$latest_target" = "$COMMIT" ]; then
            printf 'skip=true\n' >>"$GITHUB_OUTPUT"
            printf 'nightly: commit %s already published\n' "$COMMIT"
            exit 0
          fi
          stable_tag=$(gh api --paginate --slurp \
            "repos/$REPOSITORY/releases?per_page=100" | \
            ./scripts/release/latest-stable-version.sh)
          release_date=$(date -u +%Y%m%d)
          if [ -n "$stable_tag" ]; then
            version=$(./scripts/release/next-nightly-version.sh \
              "$stable_tag" "$release_date" "$RUN_NUMBER" "$COMMIT")
          else
            version=$(./scripts/release/nightly-version.sh "$INITIAL_NIGHTLY_VERSION" \
              "$release_date" "$RUN_NUMBER" "$COMMIT")
          fi
          tag="v$version"
          if gh api "repos/$REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            printf 'nightly: tag %s already exists\n' "$tag" >&2
            exit 1
          fi
          printf 'skip=false\nversion=%s\ntag=%s\n' "$version" "$tag" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.identity.outputs.skip != 'true'
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        if: steps.identity.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
      - name: Install Corepack and enable pnpm
        if: steps.identity.outputs.skip != 'true'
        run: ./scripts/ci/install-corepack.sh
      - name: Build tested embedded WebUI
        if: steps.identity.outputs.skip != 'true'
        run: ./scripts/ci/build-spa.sh
      - name: Build six nightly archives
        if: steps.identity.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          HIKYO_RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          HIKYO_RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish
      - name: Verify nightly archive identity
        if: steps.identity.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          jq -e --arg version "$VERSION" --arg commit "$COMMIT" '
            .version == $version and .commit == $commit
          ' dist/metadata.json >/dev/null
          ./scripts/release/prepare-image-root.sh \
            dist image-root "$COMMIT" .goreleaser.yaml
          ./scripts/release/snapshot-manifest_test.sh
      - name: Mark nightly as unsigned prerelease output
        if: steps.identity.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          printf '%s\n' \
            'UNSIGNED NIGHTLY BUILD — NOT AN OFFICIAL HIKYO RELEASE' \
            "Version: $VERSION" \
            "Source commit: $COMMIT" \
            'Built automatically from an exact main commit with successful CI.' \
            'Use the stable channel for recovery-signed production releases.' \
            >dist/NIGHTLY-BUILD.txt
          cp dist/NIGHTLY-BUILD.txt "$RUNNER_TEMP/nightly-notes.md"
      - name: Publish immutable GitHub prerelease
        if: steps.identity.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          gh release create "$TAG" \
            dist/hikyo_*_Darwin_*.tar.gz \
            dist/hikyo_*_Linux_*.tar.gz \
            dist/hikyo_*_Windows_*.zip \
            dist/checksums.txt \
            dist/binary-provenance.json \
            dist/NIGHTLY-BUILD.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/nightly-notes.md" \
            --prerelease
