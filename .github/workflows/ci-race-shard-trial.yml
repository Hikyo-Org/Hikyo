name: Temporary complete race shard trial
on:
  push:
    branches: [dunky13/race-shard-binary-trial]
    paths:
      - .github/workflows/ci-race-shard-trial.yml
      - scripts/ci/experiments/race-shard/**
permissions:
  contents: read
concurrency:
  group: temporary-complete-race-shard-trial
  cancel-in-progress: false
jobs:
  cold-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out trial handler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trial-tools
          persist-credentials: false
      - name: Check out immutable product inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 48189fff82e94b32f32637b1920464e278d9caff
          path: source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Validate the trial handler
        working-directory: trial-tools
        run: go test ./scripts/ci/experiments/race-shard
      - name: Measure one complete predetermined cold shard pair
        env:
          TRIAL_OUTPUT: ${{ runner.temp }}/race-shard-evidence
        run: trial-tools/scripts/ci/experiments/race-shard/run.sh "$GITHUB_WORKSPACE/source" "$TRIAL_OUTPUT"
      - name: Upload all successful and failed trial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: complete-race-shard-cold-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/race-shard-evidence/**
            !${{ runner.temp }}/race-shard-evidence/bootstrap-cache/**
            !${{ runner.temp }}/race-shard-evidence/**/go-cache/**
            !${{ runner.temp }}/race-shard-evidence/binaries/**
            !${{ runner.temp }}/race-shard-evidence/trial
          if-no-files-found: error
          retention-days: 7
