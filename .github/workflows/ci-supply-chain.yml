# Advisory early signal for the supply-chain-checks fixtures, which otherwise run
# only after merge: ci-dev on dev and the queue on main. ci-feedback cannot hold
# them in its four-minute budget, and ci.yml refuses pull_request events.
# A PR that changed a hook the fixtures copy (#1587) passed every PR check and
# then broke dev.
#
# Whether the fixtures run is decided by the repository's own changed-path
# classifier, run from the PR's base commit so a PR cannot narrow its own plan.
# A Go test (supply_chain_inputs_test.go) derives the fixtures' inputs from the
# job and requires the classifier to select the job for each of them.
# The steps are replayed from ci.yml, so a fixture added there runs here too.
# Not a required context; the merge queue and ci-dev still run the job. It needs
# no secrets: read-only against the exact PR head, with restored caches only.
# Cosign and Helm are fetched by the replayed steps (checksum-pinned, bounded
# retry); this advisory job does not restore their seeded cache entries.
name: ci-advisory-supply-chain

on:
  # No `edited`: a base-branch edit cannot change what head-only fixtures read.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: advisory-supply-chain-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: select supply-chain fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out history without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # The classifier needs trees and the three base files, not every old blob.
          filter: blob:none
          persist-credentials: false
      - name: Classify the PR with the base commit's classifier
        id: plan
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          classifier="$RUNNER_TEMP/classify-changed-paths.sh"
          registry="$RUNNER_TEMP/ci-job-registry.json"
          git show "$BASE_SHA:scripts/ci/classify-changed-paths.sh" >"$classifier"
          git show "$BASE_SHA:scripts/ci/ci-job-registry.json" >"$registry"
          plan=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | CI_JOB_REGISTRY="$registry" sh "$classifier" --files)
          run=$(jq -r '.["supply-chain-checks"]' <<<"$plan")
          echo "supply-chain-checks selected: $run" >>"$GITHUB_STEP_SUMMARY"
          echo "run=$run" >>"$GITHUB_OUTPUT"

  fixtures:
    name: supply-chain fixtures
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Restore only. Trusted main-branch writers own these caches.
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      - name: Reserve disk for shared Go cache restore
        timeout-minutes: 3
        run: ./scripts/ci/prepare-go-cache-disk.sh
      - name: Restore shared test Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: |
            go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      - name: Replay the supply-chain-checks job steps
        run: go run ./scripts/ci/run-job-steps .github/workflows/ci.yml supply-chain-checks
