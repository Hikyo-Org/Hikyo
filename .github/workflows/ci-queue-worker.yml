# Only trusted default-branch discovery dispatches work. Inputs remain routing
# hints: the controller rereads current metadata, authority and full group proof.
name: queue-check-worker
on:
  workflow_dispatch:
    inputs:
      work:
        description: Complete bounded batch of distinct authenticated head hints
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    name: publish-${{ matrix.work.head }}
    if: vars.QUEUE_HEAD_WORKERS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.work.kind == 'group' && 10 || 1 }}
    strategy:
      fail-fast: false
      matrix:
        work: ${{ fromJSON(inputs.work) }}
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    concurrency:
      group: queue-check-${{ github.repository_id }}-${{ matrix.work.head }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Capture the authenticated setup-inclusive admission budget
        if: matrix.work.kind != 'group'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ matrix.work.head }}
        run: |
          set -euo pipefail
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]]
          JOB_HEAD="$GITHUB_SHA"
          [[ "$JOB_HEAD" =~ ^[0-9a-f]{40}$ ]]
          # Jobs API status can lag a running step. Retry only that transient
          # queued state, retaining the first authenticated job ID and clock.
          first_identity=
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            request_seconds=5
            if [ -n "$first_identity" ]; then
              remaining=$((started + 60 - $(date +%s)))
              test "$remaining" -gt 0
              if [ "$remaining" -lt "$request_seconds" ]; then request_seconds=$remaining; fi
            fi
            body=$(timeout --kill-after=1s "${request_seconds}s" gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100")
            identity=$(printf '%s' "$body" | jq -er -s --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg head "$JOB_HEAD" --arg name "publish-$HEAD" '
              if length != 1 or (.[0] | type) != "object" then error("invalid publisher jobs response") else .[0] end |
              if (.jobs | type) != "array" or .total_count != (.jobs | length) then error("incomplete publisher jobs") else .jobs end |
              [.[] | select(.name == $name)] |
              if length != 1 then error("ambiguous publisher job") else .[0] end |
              if (.id | type) != "number" or .id != (.id | floor) or .id <= 0 or .run_id != $run or .run_attempt != $attempt or .head_sha != $head or (.status != "in_progress" and .status != "queued") or (.started_at | type) != "string" then error("invalid publisher job identity: " + ({actual: {id, run_id, run_attempt, head_sha, status, started_at}, expected: {id: "positive integer", run_id: $run, run_attempt: $attempt, head_sha: $head, status: "in_progress", started_at: "ISO 8601 timestamp"}} | tojson)) else [.id, (.started_at | fromdateiso8601), .status] | @tsv end')
            IFS=$'\t' read -r job_id started status <<<"$identity"
            now=$(date +%s)
            test "$started" -gt 0
            test "$started" -le "$now"
            test "$now" -lt "$((started + 60))"
            current_identity="$job_id:$started"
            if [ -z "$first_identity" ]; then
              first_identity=$current_identity
            else
              test "$current_identity" = "$first_identity"
            fi
            if [ "$status" = in_progress ]; then break; fi
            if [ "$attempt" -ge 5 ]; then
              echo 'Publisher job status remained queued within the original admission budget.' >&2
              exit 1
            fi
            test "$now" -lt "$((started + 59))"
            sleep 1
          done
          echo "PR_GATE_STARTED_AT=$started" >> "$GITHUB_ENV"
          echo "PR_GATE_DEADLINE=$((started + 60))" >> "$GITHUB_ENV"
      - name: Check out trusted default-branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - if: matrix.work.kind == 'group'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Compile trusted publisher inside its head budget
        env:
          KIND: ${{ matrix.work.kind }}
        run: |
          set -euo pipefail
          if [ "$KIND" = group ]; then
            go build -o "$RUNNER_TEMP/queue-publisher" ./scripts/ci/pr-gate
          else
            remaining=$((PR_GATE_DEADLINE - 15 - $(date +%s)))
            test "$remaining" -gt 0
            timeout --kill-after=1s "${remaining}s" bash scripts/ci/build-queue-publisher.sh
          fi
      - name: Reconcile one authenticated head without borrowing another lease
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_GATE_CHECK_NAME: ci-queue-required
          HEAD: ${{ matrix.work.head }}
          KIND: ${{ matrix.work.kind }}
        run: |
          test -x "$RUNNER_TEMP/queue-publisher"
          "$RUNNER_TEMP/queue-publisher" --queue --expected-head "$HEAD" --head-worker "$KIND"
