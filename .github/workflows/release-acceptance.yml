name: release-acceptance

# Reviewed release-candidate evidence remains manual. Custody secrets belong
# only to backup/restore; synthetic operator checks use a separate job.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Native arm64 release acceptance suite
        type: choice
        required: true
        default: all
        options: [all, backup-restore, operator]

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backup: ${{ steps.select.outputs.backup }}
      operator: ${{ steps.select.outputs.operator }}
    steps:
      - name: Select requested release acceptance suites
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch || { echo 'Release acceptance is manual-only.' >&2; exit 1; }
          backup=false operator=false
          case "$REQUESTED_SUITE" in
            all) backup=true operator=true ;;
            backup-restore) backup=true ;;
            operator) operator=true ;;
            *) echo 'Unknown release acceptance suite.' >&2; exit 1 ;;
          esac
          printf 'backup=%s\noperator=%s\n' "$backup" "$operator" >>"$GITHUB_OUTPUT"

  floor-backup-restore:
    needs: route
    if: needs.route.outputs.backup == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run constrained SQLite recovery from separate test custody sources
        env:
          FLOOR_BACKUP_CUSTODY: ${{ secrets.FLOOR_BACKUP_CUSTODY }}
          FLOOR_ROOT_CUSTODY: ${{ secrets.FLOOR_ROOT_CUSTODY }}
        run: ./scripts/ci/floor-acceptance.sh "$RUNNER_TEMP/floor-evidence"
      - name: Preserve exact-head floor evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floor-backup-restore-${{ github.sha }}
          path: ${{ runner.temp }}/floor-evidence/
          if-no-files-found: error
          retention-days: 90

  operator-floor:
    needs: route
    if: needs.route.outputs.operator == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install pinned native arm64 kind
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --retry 4 --retry-delay 2 --retry-all-errors \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-arm64 \
            --output "$RUNNER_TEMP/kind"
          printf '%s  %s\n' b92cd615e97585de8ddade28ed5cd7feb4248d717c233eea5b03c37298900f5d "$RUNNER_TEMP/kind" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/kind"
          sudo install "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: Exercise the production operator under its shipped limits
        env:
          HIKYO_OPERATOR_FLOOR_OUTPUT: ${{ runner.temp }}/operator-floor
        run: ./scripts/ci/operator-floor.sh
      - name: Preserve resource and reconciliation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-floor-${{ github.sha }}
          path: ${{ runner.temp }}/operator-floor/
          if-no-files-found: error
          retention-days: 90
