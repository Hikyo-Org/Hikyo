# Informational diagnostics on the originating PR head. This is never a required
# context or evidence for another base. Execute only default-branch tooling.
name: merge-queue-report
run-name: Queue diagnostics for ${{ github.event.workflow_run.head_branch }} (run ${{ github.event.workflow_run.id }}, attempt ${{ github.event.workflow_run.run_attempt }})

on:
  workflow_run:
    workflows: [trusted-merge-ci]
    types: [requested, in_progress, completed]

permissions:
  contents: read

concurrency:
  group: merge-queue-report-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false
  queue: max

jobs:
  report:
    if: github.event.workflow_run.event == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Publish merge queue diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: go run ./scripts/ci/queue-report
