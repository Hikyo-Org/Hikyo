# Advisory visibility on the source PR, separate from protected queue admission
# and full merge proof. Only trusted default-branch tooling executes here.
name: queue-report

on:
  workflow_run:
    workflows: [trusted-merge-ci]
    types: [requested, in_progress, completed]

permissions:
  contents: read

concurrency:
  # Rebuilt groups have different branches but update the same PR-head status.
  # Serialize all advisory writers so an old-base report cannot overwrite one
  # from a new base between its final freshness read and publication.
  group: queue-report-${{ github.repository_id }}
  cancel-in-progress: false
  queue: max

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out trusted default-branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Report the authenticated merge-candidate run on its source PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: go run ./scripts/ci/pr-gate --queue-report
