name: codspeed

# Continuous performance tracking of the Go benchmarks with CodSpeed. No
# production custody or secrets: CodSpeed authenticates through OIDC.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          # CodSpeed runs benchmarks only and supports -bench, not -run.
          run: >-
            go test -bench=.
            ./internal/crypto/
            ./internal/dotenv/
            ./internal/scanning/
            ./internal/server/
            ./internal/service/
