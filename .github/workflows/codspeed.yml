name: codspeed

# PRs smoke-test on hosted runners. Daily and manual main runs use the same
# budget-checked walltime lane. CodSpeed uses OIDC.
on:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      use_credit:
        description: 'Allow up to $5 of monthly overage from the confirmed CodSpeed credit'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'codspeed-walltime' || format('codspeed-{0}', github.ref) }}
  # Serialize the budget decision and measurement together. A new manual run
  # must not cancel a paid job or race its usage accounting.
  cancel-in-progress: false
  queue: max

jobs:
  matrix:
    name: Main browser performance
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/matrix-performance.yml
    with:
      ref: ${{ github.sha }}

  smoke:
    name: Benchmark smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Exercise every benchmark once
        run: >-
          go test -run '^$' -bench . -benchtime=1x
          ./internal/crypto/
          ./internal/dotenv/
          ./internal/scanning/
          ./internal/server/
          ./internal/service/

  budget:
    name: Check walltime allowance
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      allowed: ${{ steps.allowance.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Reserve a complete walltime job
        id: allowance
        env:
          GH_TOKEN: ${{ github.token }}
          CODSPEED_USE_CREDIT: ${{ inputs.use_credit || false }}
          CODSPEED_CREDIT_CONFIRMED: ${{ vars.CODSPEED_CREDIT_CONFIRMED || 'false' }}
        run: go run ./scripts/ci/codspeed-budget

  benchmarks:
    name: Track main performance
    needs: budget
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.budget.outputs.allowed == 'true'
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Recheck allowance for this attempt before measuring
        id: allowance
        env:
          GH_TOKEN: ${{ github.token }}
          CODSPEED_USE_CREDIT: ${{ inputs.use_credit || false }}
          CODSPEED_CREDIT_CONFIRMED: ${{ vars.CODSPEED_CREDIT_CONFIRMED || 'false' }}
        run: go run ./scripts/ci/codspeed-budget
      - name: Refuse an exhausted allowance
        env:
          ALLOWED: ${{ steps.allowance.outputs.allowed }}
        run: test "$ALLOWED" = true
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          # CodSpeed runs benchmarks only and supports -bench, not -run.
          run: >-
            go test -bench=.
            ./internal/crypto/
            ./internal/dotenv/
            ./internal/scanning/
            ./internal/server/
            ./internal/service/
