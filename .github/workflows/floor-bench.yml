name: floor-bench

# No production custody or secrets. Required CI calls this workflow for PR proof;
# tagged builds retain their independent measurement.
on:
  workflow_call:
    inputs:
      revision:
        description: Exact immutable commit bound to the caller's GitHub event
        required: true
        type: string
  push:
    tags: ['**']

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      # Bind the reusable input independently before executing benchmark code.
      # Direct tagged runs have no inputs and bind only to their event SHA.
      - name: Validate the immutable caller or tag revision
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_BASE_REPOSITORY_ID: ${{ github.event.pull_request.base.repo.id }}
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" = push ]]; then
            [[ "$GITHUB_REF" == refs/tags/?* ]]
            [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ -z "$SOURCE_REVISION" ]] || test "$SOURCE_REVISION" = "$GITHUB_SHA"
            SOURCE_REVISION=$GITHUB_SHA
          fi
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Floor proof requires a full immutable revision.' >&2; exit 1; }
          test "$EVENT_REPOSITORY" = "$GITHUB_REPOSITORY"
          [[ "$EVENT_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
              test "$SOURCE_REVISION" = "$PR_HEAD_SHA"
              test "$PR_BASE_REPOSITORY" = "$GITHUB_REPOSITORY"
              test "$PR_BASE_REPOSITORY_ID" = "$EVENT_REPOSITORY_ID"
              [[ "$PR_HEAD_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$PR_HEAD_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
              ;;
            merge_group)
              test "$SOURCE_REVISION" = "$GITHUB_SHA"
              test "$SOURCE_REVISION" = "$MERGE_GROUP_SHA"
              ;;
            workflow_dispatch|schedule|repository_dispatch)
              test "$GITHUB_REF" = refs/heads/main
              test "$SOURCE_REVISION" = "$GITHUB_SHA"
              ;;
            push) ;;
            *) echo 'Floor proof refuses this source context.' >&2; exit 1 ;;
          esac
      - name: Check out the validated immutable caller revision
        if: github.event_name != 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Check out the exact tagged source
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install pinned native arm64 kind
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --retry 4 --retry-delay 2 --retry-all-errors \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-arm64 \
            --output "$RUNNER_TEMP/kind"
          printf '%s  %s\n' b92cd615e97585de8ddade28ed5cd7feb4248d717c233eea5b03c37298900f5d "$RUNNER_TEMP/kind" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/kind"
          sudo install "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: Measure and enforce the declared floor
        run: ./scripts/bench/floor.sh "$RUNNER_TEMP/floor-bench"
      - name: Preserve exact-source floor measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: floor-bench-${{ inputs.revision || github.sha }}
          path: ${{ runner.temp }}/floor-bench/
          if-no-files-found: error
          retention-days: 90
