# The merge queue validates its exact merge result against the current base.
# Keep this caller separate from pull_request_target: the reusable validation
# graph executes the selected code and must never inherit that event's base
# cache scope or permissions. Pull requests use ci-candidate.yml instead.
name: trusted-merge-ci
# Keep the Actions run name stable: trusted workflow_run consumers authenticate
# it as trusted-merge-ci. PR diagnostics carry the readable run/attempt details.

on:
  merge_group:

permissions:
  actions: read
  contents: read

concurrency:
  group: trusted-merge-ci-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ github.sha }}
    permissions:
      actions: read
      contents: read
      pull-requests: read

  # This read-only marker is evidence, never the required check producer.
  # Trusted default-branch queue-gate independently verifies the current group.
  merge-group-proof:
    if: always() && !cancelled()
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require trusted validation
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$VALIDATION_RESULT" = success

  # GitHub can deliver workflow completion while the jobs endpoint still has
  # the proof marker in progress. Let the trusted publisher see coherent proof
  # metadata, including while its default-branch pending-state fix is landing.
  merge-group-metadata-ready:
    needs: merge-group-proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Wait for exact-attempt proof job metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GOTOOLCHAIN: local
        run: go run ./scripts/ci/wait-merge-group-jobs
