# Temporary, branch-scoped experiment. Remove before making the PR ready.
# Sequential jobs consume at most one existing standard hosted runner.
name: ci-throughput-trial

on:
  push:
    branches: [dunky13/speed-up-pr-merge-ci]
    paths:
      - .github/workflows/ci-throughput-trial.yml
      - scripts/ci/experiments/throughput-trial.py
      - scripts/ci/analysis-shards-go/**

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-throughput-trial
  cancel-in-progress: true

env:
  TRIAL_BASE: 5aac8053815433b2ed39e8b6a7ffddf9253803a4

jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Compare complete plans and alternating warm timings
        run: python3 scripts/ci/experiments/throughput-trial.py planner --base "$TRIAL_BASE" --output "$RUNNER_TEMP/planner"
      - name: Preserve measurements including original failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trial-planner-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/planner/*.json
            ${{ runner.temp }}/planner/*.log
            ${{ runner.temp }}/planner/*.sh
          retention-days: 7

  cache:
    needs: planner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Select the same runner ABI as feedback
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      - name: Restore existing trusted-main feedback cache without publishing
        id: seed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 1
        with:
          path: .ci-cache/go-feedback
          key: go-feedback-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('source/go.mod', 'source/go.sum', 'source/scripts/ci/go-tool-modules.txt') }}-${{ env.TRIAL_BASE }}
          restore-keys: go-feedback-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      - name: Compare restored and empty compiler caches
        env:
          TRIAL_CACHE_KEY: ${{ steps.seed.outputs.cache-primary-key }}
          TRIAL_CACHE_MATCH: ${{ steps.seed.outputs.cache-matched-key }}
          TRIAL_CACHE_HIT: ${{ steps.seed.outputs.cache-hit }}
        run: python3 scripts/ci/experiments/throughput-trial.py cache --base "$TRIAL_BASE" --output "$RUNNER_TEMP/cache" --cache "$GITHUB_WORKSPACE/.ci-cache/go-feedback"
      - name: Preserve measurements without uploading compiler caches
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trial-cache-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cache/*.json
            ${{ runner.temp }}/cache/*.log
          retention-days: 7

  race:
    needs: cache
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Compare repeated Go commands and reusable race binary
        run: python3 scripts/ci/experiments/throughput-trial.py race --base "$TRIAL_BASE" --output "$RUNNER_TEMP/race"
      - name: Upload source-bound test binary for transfer measurement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trial-race-binary-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/race/upgradegate-race.test
            ${{ runner.temp }}/race/manifest.json
          compression-level: 6
          retention-days: 1
      - name: Preserve measurements including original failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trial-race-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/race/*.json
            ${{ runner.temp }}/race/*.log
          retention-days: 7

  consume:
    needs: race
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download binary from this exact workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trial-race-binary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transferred
      - name: Verify identity and digest then execute in read-only validation
        run: python3 scripts/ci/experiments/throughput-trial.py consume --base "$TRIAL_BASE" --output "$RUNNER_TEMP/consume" --artifact "$RUNNER_TEMP/transferred"
      - name: Preserve transfer execution measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trial-consume-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/consume/*.json
            ${{ runner.temp }}/consume/*.log
          retention-days: 7
