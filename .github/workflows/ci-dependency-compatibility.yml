# Advisory early compatibility evidence, separate from the 220-second feedback
# lane and the enforced full merge-candidate validation.
# Default-tag Linux host compilation only; the protected full suite owns the
# macOS/Windows test legs and release-tag cross-builds.
name: ci-advisory-dependencies

on:
  pull_request:
    # No edited: a newer run of this workflow on the same head would hide a
    # ci-dev-required record filed in its suite. The full merge-candidate
    # validation still builds the retargeted result.
    types: [opened, synchronize, reopened]
    paths: [go.mod, go.sum]

permissions:
  contents: read

concurrency:
  # The latest PR revision replaces obsolete work.
  group: dependency-compatibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: dependency compatibility (Linux host)
    runs-on: ubuntu-latest
    # The existing full app-build job has a 20-minute budget. This graph also
    # builds the host's default-tag test archives and runs vet; it makes no
    # fast-feedback SLA claim.
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/.dependency-compatibility
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out immutable integration tooling without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: compatibility-tools
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the exact source commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false
      - name: Verify the source and immutable tooling relationship
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C compatibility-tools rev-parse HEAD^2)" = "$EXPECTED_HEAD"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Compile default-tag consumers on Linux, then vet
        working-directory: source
        run: bash ../compatibility-tools/scripts/ci/dependency-compatibility.sh
