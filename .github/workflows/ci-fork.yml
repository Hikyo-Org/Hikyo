# Pull-request validation (#813). PR code runs only under pull_request, with a
# read-only token, no secrets, and PR-scoped cache writes. This applies to
# same-repository branches too: pull_request_target's base cache scope is not a
# safe place to execute code merely because the author can push a branch.
#
# This run's result is not a merge gate by itself: the YAML comes from the PR's
# merge ref. The default-branch PR gate accepts it only when the
# PR leaves .github/ untouched, or a same-repo PR has an independent current
# maintainer's latest approval on the exact head (or the current-maintainer BDFL
# author exemption). Fork workflow edits are never
# accepted. This workflow's aggregate gate must pass on that same head
# (scripts/ci/check-fork-validation.sh). Never add a job named
# ci-required here: a skipped job would satisfy the required check.
#
# Only vouched authors get a validation run (.github/VOUCHED.td, read from the
# default branch through the API, so a PR cannot vouch for itself). pr-gate
# repeats the check; this copy only saves runners for unvouched authors.
name: pr-validation
# Keep the legacy run title for gates executing an older trusted base.
# check-fork-validation.sh binds a run to its PR by this title. The YAML is
# base-identical for accepted forks; same-repo YAML edits require the gate's
# independently checked maintainer review, so a fork cannot forge acceptance.
# Body/title edits need no validation. A base retarget does, even when the head
# SHA is unchanged. Give metadata-only runs a distinct, non-validation identity
# so neither legacy gates nor the completion controller select their skips.
run-name: "${{ github.event.action == 'edited' && github.event.changes.base.ref.from == null && 'pr-metadata' || 'fork-ci' }} #${{ github.event.pull_request.number }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event.action == 'edited' && github.event.changes.base.ref.from == null && 'pr-metadata' || 'fork-ci' }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vouch:
    # Same-repository authors need no vouch runner. Forks still require this
    # job to succeed before any PR-controlled validation can execute.
    if: github.event.pull_request.head.repo.full_name != github.repository && (github.event.action != 'edited' || github.event.changes.base.ref.from != null)
    runs-on: ubuntu-latest
    steps:
      - name: Require a vouched author
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: mitchellh/vouch/action/check-user@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        with:
          user: ${{ github.event.pull_request.user.login }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  validation:
    needs: vouch
    if: ${{ !cancelled() && (github.event.action != 'edited' || github.event.changes.base.ref.from != null) && (needs.vouch.result == 'success' || (needs.vouch.result == 'skipped' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ github.event.pull_request.head.sha }}
    permissions:
      actions: read
      contents: read
