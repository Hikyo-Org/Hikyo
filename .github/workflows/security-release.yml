name: release-security-validation

# Published stable/prerelease releases use the maintainer's ceremony. Nightly
# validation also listens for completion, so token-suppressed release events do
# not leave a published nightly without scheduling. Neither path blocks release.
on:
  release:
    types: [published]
  workflow_run:
    workflows: [nightly-release]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.resolve.outputs.available }}
      tag: ${{ steps.resolve.outputs.tag }}
      source: ${{ steps.resolve.outputs.source }}
      harness: ${{ steps.resolve.outputs.harness }}
    steps:
      # This runner executes no release/source checkout or downloaded artifacts.
      - name: Resolve canonical release and trusted harness commits
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          NIGHTLY_PATH: ${{ github.event.workflow_run.path }}
          NIGHTLY_BRANCH: ${{ github.event.workflow_run.head_branch }}
          NIGHTLY_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          NIGHTLY_SHA: ${{ github.event.workflow_run.head_sha }}
          NIGHTLY_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          NIGHTLY_EVENT: ${{ github.event.workflow_run.event }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$DEFAULT_BRANCH" = main
          case "$GITHUB_EVENT_NAME" in
            release)
              test "$RELEASE_DRAFT" = false
              tag=$RELEASE_TAG
              # Nightlies are scheduled by their authenticated publishing run.
              if [[ "$tag" = *-nightly.* ]]; then
                printf 'available=false\n' >>"$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            workflow_run)
              test "$NIGHTLY_PATH" = .github/workflows/nightly.yml
              test "$NIGHTLY_BRANCH" = main
              test "$NIGHTLY_REPOSITORY" = "$GITHUB_REPOSITORY"
              [[ "$NIGHTLY_EVENT" = schedule || "$NIGHTLY_EVENT" = repository_dispatch ]]
              [[ "$NIGHTLY_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
              [[ "$NIGHTLY_SHA" =~ ^[0-9a-f]{40}$ ]]
              tag=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" |
                jq -er --arg run "$NIGHTLY_RUN_NUMBER" '
                  [.[][] | .ref | select(test("^refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]{8}\\." + $run + "\\.g[0-9a-f]{8}$")) | sub("^refs/tags/"; "")] |
                  if length == 0 then "" elif length == 1 then .[0] else error("ambiguous nightly run tag") end')
              if [ -z "$tag" ]; then
                printf 'available=false\n' >>"$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *) exit 1 ;;
          esac
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z][0-9A-Za-z.-]*)?$ ]]
          # Authenticate availability through the exact published tag, never a
          # moving latest release or release.target_commitish.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" |
            jq -e --arg tag "$tag" '.tag_name == $tag and .draft == false and .published_at != null' >/dev/null
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
          depth=0
          while [ "$depth" -lt 4 ]; do
            depth=$((depth + 1))
            type=$(jq -r '.object.type' <<<"$object")
            source=$(jq -r '.object.sha' <<<"$object")
            [[ "$source" =~ ^[0-9a-f]{40}$ ]]
            if [ "$type" = commit ]; then break; fi
            test "$type" = tag
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$source")
          done
          test "$type" = commit
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then test "$source" = "$NIGHTLY_SHA"; fi
          harness=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]]
          printf 'available=true\ntag=%s\nsource=%s\nharness=%s\n' "$tag" "$source" "$harness" >>"$GITHUB_OUTPUT"

  validate:
    needs: resolve
    if: needs.resolve.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out the exact trusted main harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.harness }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind harness source
        env:
          HARNESS: ${{ needs.resolve.outputs.harness }}
        run: test "$(git rev-parse HEAD)" = "$HARNESS"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned verifier for published stable OCI signatures
        if: ${{ !contains(needs.resolve.outputs.tag, '-nightly.') }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Download and authenticate actual release bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE: ${{ needs.resolve.outputs.source }}
        run: ./scripts/security/verify-release.sh "$GITHUB_REPOSITORY" "$TAG" "$SOURCE" "$RUNNER_TEMP/security-release"
      - name: Vulnerability scan of authenticated actual binary
        run: |
          ./scripts/ci/run-go-tool.sh govulncheck -mode=binary -json "$RUNNER_TEMP/security-release/hikyo" >"$RUNNER_TEMP/security-release/binary-scan.json"
          date -u +%Y-%m-%dT%H:%M:%SZ >"$RUNNER_TEMP/security-release/scan-completed-at"
      - name: Start disposable PostgreSQL
        id: postgres
        run: ./scripts/ci/start-ci-postgres.sh
      # No GitHub token, signing key, repository credential or provider secret
      # is present in these runtime step environments or app subprocesses.
      - name: Native release adversarial campaign on both datastores
        run: >-
          go run ./scripts/security/artifact-harness
          --binary "$RUNNER_TEMP/security-release/hikyo"
          --bundle "$RUNNER_TEMP/security-release/runtime-bundle"
          --postgres-dsn 'postgres://hikyo:hikyo@127.0.0.1:5432/hikyo_test?sslmode=disable'
          --steps 24 --timeout 10m --output "$RUNNER_TEMP/security-release/attacks.json"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned browser dependencies
        run: |
          ./scripts/ci/install-corepack.sh
          pnpm --dir clients/ts install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
      - name: Browser attacks and oracle controls against the same actual binary
        working-directory: web
        env:
          HIKYO_E2E_BINARY: ${{ runner.temp }}/security-release/hikyo
          HIKYO_SECURITY_SOURCE_SHA: ${{ needs.resolve.outputs.source }}
          HIKYO_SECURITY_BROWSER_RECEIPT: ${{ runner.temp }}/security-release/browser.json
        run: pnpm exec playwright test --config e2e/security.config.ts
      - name: Remove disposable PostgreSQL before any PASS publication
        id: cleanup
        if: ${{ always() && steps.postgres.outcome == 'success' }}
        run: docker container rm --force hikyo-ci-postgres
      - name: Validate complete mandatory receipts and render PASS evidence
        env:
          HARNESS: ${{ needs.resolve.outputs.harness }}
        run: >-
          go run ./scripts/security/release-evidence publish
          --prepared "$RUNNER_TEMP/security-release/prepared.json"
          --result "$RUNNER_TEMP/security-release/attacks.json"
          --browser "$RUNNER_TEMP/security-release/browser.json"
          --scan "$RUNNER_TEMP/security-release/binary-scan.json"
          --scan-completed-at "$(cat "$RUNNER_TEMP/security-release/scan-completed-at")"
          --harness "$HARNESS" --datastore-cleaned
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          --out "$RUNNER_TEMP/security-pass"
      - name: Store version-bound passing JSON and self-contained HTML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-pass-${{ needs.resolve.outputs.tag }}-${{ needs.resolve.outputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pass/
          if-no-files-found: error
          retention-days: 90
      # Diagnostic receipts are not PASS evidence. Keep only the explicit
      # metadata allowlist, never release bytes, runtime bundles or credentials.
      - name: Retain version-bound failure diagnostic receipts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-failure-diagnostics-${{ needs.resolve.outputs.tag }}-${{ needs.resolve.outputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-release/prepared.json
            ${{ runner.temp }}/security-release/binary-scan.json
            ${{ runner.temp }}/security-release/scan-completed-at
            ${{ runner.temp }}/security-release/attacks.json
            ${{ runner.temp }}/security-release/browser.json
          if-no-files-found: ignore
          retention-days: 7
