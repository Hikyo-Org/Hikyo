# Posts the steps to fix a missing DCO sign-off on the pull request. The DCO
# gate itself stays in ci.yml's preflight; ci.yml runs PR code and so holds no
# PR write. This workflow holds that write and therefore never executes PR
# code: it checks out the base branch, fetches the PR's commits as git data,
# and runs the base branch's scripts over them. Works for fork pull requests
# too, which is where a missing sign-off is most likely.
name: report-dco

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dco-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Objects only, at the event's exact head: nothing is checked out or run,
      # and no credential is persisted for the fetch.
      - name: Fetch the PR commits as data
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"
      # The tip of the base repository's main, fetched from its canonical
      # origin (the checkout's remote). A failed fetch fails the job, so no
      # Dependabot commit is exempt without it.
      - name: Resolve trusted main
        id: main
        run: |
          git fetch --no-tags origin refs/heads/main
          echo "sha=$(git rev-parse --verify 'FETCH_HEAD^{commit}')" >>"$GITHUB_OUTPUT"
      - name: Report missing sign-offs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The authenticated opener, not commit metadata: see ci.yml's DCO step.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DCO_MAIN_SHA: ${{ steps.main.outputs.sha }}
        run: ./scripts/ci/report-dco.sh
