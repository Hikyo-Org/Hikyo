# Frees room in the Actions cache for the weekly ci-main writers before they save (docs/development/ci.md,
# "Headroom before the save"). The writers are jobs of ci.yml, which runs pull-request code, so none of them can
# hold actions: write; and ci-main.yml is a promotion-proof producer whose job inventory the source proof
# checks, so the step cannot live there either. This workflow is the separate trusted producer: it runs 45
# minutes before ci-main's cron (13:23 on Sunday), holds actions: write, checks out only the immutable main
# commit and runs only the runner ABI selector and scripts/ci/cache-prune.sh, never repository dependencies or Go
# code. Best effort: ci-main
# does not wait for it, and a failure here changes nothing for it.
# A manual ci-main run is covered by the workflow_run trigger on its request (type requested: it fires when the
# run is queued, before any job, which is the earliest event GitHub offers). The trigger runs this file as it is
# on main, with the default branch's latest commit as github.sha and a write-capable token, so the job guard
# below is the one of ci-cache-prune.yml: the event's branch and repository are read, nothing else of the event
# is. GitHub's documentation does not say whether `requested` fires for a run started by workflow_dispatch; the
# completed type is observed to (fuzz-report ran two seconds after five dispatched ci-main runs on 2026-10-31).
# Until a manual run has been seen to start this workflow, dispatching it first stays the fallback.
name: ci-main-headroom

on:
  workflow_dispatch:
  schedule:
    - cron: '38 12 * * 0'
  workflow_run:
    workflows: [ci-main]
    types: [requested]
    branches: [main]

permissions:
  contents: read

jobs:
  headroom:
    # Job level, not workflow level: the group is taken only after the guard below passes, so a run the guard
    # skips (a workflow_run of another head, say) can never replace a pending trusted one.
    concurrency:
      group: ci-main-headroom
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)) &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out immutable trusted main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      # Nothing to do unless go.mod or go.sum changed since the last save (no go-test-v2 entry for the current
      # files yet): that is what makes the weekly writers save the 3 GB of rotated entries.
      - name: Make room in the Actions cache for the weekly writers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEADROOM_PREFIXES: go-mod-v2- go-test-v2- go-lint-v2- go-generated-v2- go-k8s-e2e-v2- go-fuzz-v2-
          HEADROOM_SKIP_KEY: go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
        run: ./scripts/ci/cache-prune.sh
      # The pnpm stores (host and Playwright, 0.2 GB each) are saved by the same weekly run when a lockfile or the
      # Node pin changed, which go.mod and go.sum do not show. Their keys carry the Node ABI, which this job cannot
      # compute (no Node, no repository code), so the skip keys stand for it with a star.
      - name: Make room in the Actions cache for the weekly pnpm stores
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEADROOM_PREFIXES: pnpm-store-v2-
          HEADROOM_SKIP_KEY: pnpm-store-v2-host-${{ runner.os }}-${{ runner.arch }}-*-${{ hashFiles('.nvmrc', 'web/package.json', 'web/pnpm-lock.yaml', 'web/pnpm-workspace.yaml', 'clients/ts/package.json', 'clients/ts/pnpm-lock.yaml', 'clients/ts/pnpm-workspace.yaml') }} pnpm-store-v2-playwright-${{ runner.os }}-${{ runner.arch }}-*-${{ hashFiles('.nvmrc', 'web/package.json', 'web/pnpm-lock.yaml', 'web/pnpm-workspace.yaml', 'clients/ts/package.json', 'clients/ts/pnpm-lock.yaml', 'clients/ts/pnpm-workspace.yaml') }}
        run: ./scripts/ci/cache-prune.sh
