# Closes a fork pull request whose author is not vouched, on open and on reopen
# (#813), as Ghostty does. VOUCHED.td is read from the default branch through
# the API, so a pull request cannot vouch for itself.
#
# This is what keeps an unvouched fork from reaching a mergeable state at all.
# GitHub runs any pull_request workflow a fork adds, and a job it names
# ci-required would publish a same-name check; on a closed pull request that
# check gates nothing, and reopening closes it again.
#
# Runs from the base branch and never checks out PR code. Same-repository pull
# requests are skipped: their authors already have write access.
name: vouch-check-pr

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  check:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: mitchellh/vouch/action/check-pr@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        with:
          pr-number: ${{ github.event.pull_request.number }}
          auto-close: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
