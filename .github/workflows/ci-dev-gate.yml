# Only trusted main tooling publishes fast admission for dev. Main's full queue
# has a separate context and writer lease. Neither can substitute for the other.
name: gate-dev

on:
  # No edited: GitHub files ci-dev-required in the head's oldest Actions suite,
  # and a newer gate-dev run on the same head hides it from the required check.
  # A base retarget reruns ci-feedback, whose workflow_run callback reassesses.
  pull_request_target:
    branches: [dev]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main, dev]
  workflow_run:
    workflows: [ci-feedback]
    # GitHub does not send requested when a workflow is re-run, so a first attempt is covered by requested
    # and a rerun by in_progress (attempt > 1, enforced by each job's if); completed settles both.
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Dev PR to reassess, or leave empty to reassess all open dev PRs
        required: false
        type: string
  schedule:
    - cron: '19 * * * *'

permissions:
  contents: read

jobs:
  discover:
    # GitHub still starts pull_request_target runs for stacked PRs whose base is
    # another branch. They have no dev admission to publish, so skip them.
    if: (github.event_name != 'pull_request_target' || github.event.pull_request.base.ref == 'dev') && (github.event.action != 'in_progress' || github.event.workflow_run.run_attempt > 1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # actions: read only for the sweep's cursor, the schedule-run count of this workflow.
      actions: read
      contents: read
      pull-requests: read
    outputs:
      work: ${{ steps.targets.outputs.work }}
    steps:
      - name: Check out trusted default-branch discovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Discover routing hints without check-write permission
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work=$(bash scripts/ci/discover-dev-prs.sh)
          printf 'work=%s\n' "$work" >> "$GITHUB_OUTPUT"

  # First pass of a fan-out event: a blocking pending record on every routed head, before and outside the throttled publishers. A stale success must not wait behind max-parallel on the publish matrix (#1553). One job, one create per head, never deferred by the reserve.
  revoke:
    name: dev-revoke
    needs: discover
    if: needs.discover.outputs.work != '[]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number == '')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch admission tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      # The name starts with Reconcile: ci-queue-retry reruns a failed job only when a step so named failed.
      - name: Reconcile the first pass, blocking every routed head until its reconciliation finishes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEV_REVOKE_WORK: ${{ needs.discover.outputs.work }}
        run: |
          set -euo pipefail
          bash scripts/ci/build-queue-publisher.sh
          "$RUNNER_TEMP/queue-publisher" --dev --dev-revoke

  publish:
    name: dev-publish-${{ matrix.work.head }}
    # The reconcile follows the first pass but never depends on it succeeding.
    needs: [discover, revoke]
    if: ${{ !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.work != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      # At most two heads past the reserve check at once: the check reads rate_limit before any job spends, so an unbounded fan-out (a publisher change reassesses every open PR) could all pass it together (#1553, #1598).
      max-parallel: 2
      matrix:
        work: ${{ fromJSON(needs.discover.outputs.work) }}
    concurrency:
      # No queue: max. One running and the newest pending reconcile per head: every reconcile rereads live GitHub state, so a replaced pending one loses nothing when one open PR has this head, and duplicates stop spending the shared token budget (#1553). A replaced pull_request_target reassesses only its own PR: another open PR on the same head waits for a later callback or worker, which can be replaced too (accepted residual).
      group: dev-check-${{ github.repository_id }}-${{ matrix.work.head }}
      cancel-in-progress: false
    steps:
      - name: Capture the setup-inclusive publisher budget
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ matrix.work.head }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request_target) JOB_HEAD="$PR_HEAD" ;;
            *) JOB_HEAD="$GITHUB_SHA" ;;
          esac
          [[ "$JOB_HEAD" =~ ^[0-9a-f]{40}$ ]]
          # One retry: without this clock the job fails before it can publish anything.
          read_jobs() { timeout --kill-after=1s 5s gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"; }
          body=$(read_jobs) || body=$(read_jobs)
          started=$(jq -ser --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg head "$JOB_HEAD" --arg name "dev-publish-$HEAD" '
            if length != 1 or (.[0] | type) != "array" then error("invalid publisher pages") else .[0] end |
            if length == 0 or any(.[]; (.jobs | type) != "array") then error("invalid publisher jobs") else . end |
            .[0].total_count as $total | [.[].jobs[]] |
            if length != $total then error("incomplete publisher jobs") else . end |
            [.[] | select(.name == $name)] |
            if length != 1 then error("ambiguous publisher job") else .[0] end |
            if (.id | type) != "number" or .id <= 0 or .id != (.id | floor) or
               .run_id != $run or .run_attempt != $attempt or .head_sha != $head or
               (.status != "in_progress" and .status != "queued" and .status != "pending") or
               (.started_at | type) != "string"
            then error("invalid publisher identity") else .started_at | fromdateiso8601 end' <<<"$body")
          now=$(date +%s)
          test "$started" -gt 0
          test "$started" -le "$now"
          test "$now" -lt "$((started + 60))"
          echo "PR_GATE_STARTED_AT=$started" >> "$GITHUB_ENV"
          echo "PR_GATE_DEADLINE=$((started + 60))" >> "$GITHUB_ENV"
      - name: Check out trusted default-branch admission tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # The publisher builds and runs from go.mod and scripts/ci alone. A full tree costs 8 to 30 s of its budget.
          sparse-checkout: scripts/ci
      - name: Compile trusted publisher inside the remaining work budget
        run: |
          set -euo pipefail
          remaining=$((PR_GATE_DEADLINE - 15 - $(date +%s)))
          test "$remaining" -gt 0
          timeout --kill-after=1s "${remaining}s" bash scripts/ci/build-queue-publisher.sh
      - name: Reconcile exact-head dev admission with a terminal publication reserve
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ matrix.work.head }}
          PR_NUMBER: ${{ matrix.work.pr }}
        run: |
          test -x "$RUNNER_TEMP/queue-publisher"
          "$RUNNER_TEMP/queue-publisher" --dev --dev-pr "$PR_NUMBER" --expected-head "$HEAD"
