name: nightly-desktop

# The native macOS shell (#1215) is its own Go module in desktop/: Wails, cgo and
# WebKit never reach the root module. Owner decision 2026-11-25 (docs/development/ci.md,
# "Desktop shell (macOS)"): its validation left the dev and merge-queue critical
# paths, because a macOS runner was not acquired for 5 of 21 ci-dev attempts, and runs
# here against the dev and main heads instead. This workflow is advisory: nothing
# requires it and nightly-promote and nightly-release read none of its results.
# A failure turns this run red and keeps one tracking issue open until a green night.
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-desktop
  cancel-in-progress: false

jobs:
  # Pins both heads once, so every leg and the report name the commits they tested,
  # and picks each leg's runner: macOS only where the module exists at that commit
  # (main before promotion has none, so its boundary-only leg runs on Linux and cannot
  # fail on macOS capacity).
  heads:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dev: ${{ steps.resolve.outputs.dev }}
      main: ${{ steps.resolve.outputs.main }}
      dev_runner: ${{ steps.resolve.outputs.dev_runner }}
      main_runner: ${{ steps.resolve.outputs.main_runner }}
    steps:
      - name: Resolve the dev and main heads
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runner_for() {
            if gh api "repos/$GH_REPO/contents/desktop/go.mod?ref=$1" --silent 2>"$RUNNER_TEMP/module.err"; then
              echo macos-15
            elif grep -F 'HTTP 404' "$RUNNER_TEMP/module.err" >/dev/null; then
              echo ubuntu-latest
            else
              cat "$RUNNER_TEMP/module.err" >&2
              return 1
            fi
          }
          for branch in dev main; do
            sha=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid $branch head." >&2; exit 1; }
            runner=$(runner_for "$sha")
            echo "$branch=$sha" >>"$GITHUB_OUTPUT"
            echo "${branch}_runner=$runner" >>"$GITHUB_OUTPUT"
          done

  desktop-dev:
    needs: heads
    runs-on: ${{ needs.heads.outputs.dev_runner }}
    timeout-minutes: 30
    env:
      HEAD_SHA: ${{ needs.heads.outputs.dev }}
      CGO_ENABLED: "1"
      # The shell supports macOS 13 and later (ADR D2); without this the linker warns
      # per object that the runner's newer SDK default is higher than the target.
      CGO_CFLAGS: -mmacosx-version-min=13.0
      CGO_LDFLAGS: -mmacosx-version-min=13.0
    steps: &desktop-steps
      - name: Check out the pinned head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      # Defense in depth for the runner choice in heads: the shell cannot be tested on Linux.
      - name: Require macOS where the shell exists
        if: ${{ hashFiles('desktop/go.mod') != '' && runner.os != 'macOS' }}
        run: |
          echo "desktop/go.mod exists at this commit but the runner is $RUNNER_OS, not macOS." >&2
          exit 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # exact toolchain pinned by go.mod's toolchain directive
          cache: false
      - name: Desktop module boundary
        run: |
          ./scripts/ci/check-desktop-deps_test.sh
          ./scripts/ci/check-desktop-deps.sh
      # Where the shell has not landed (main before promotion) only the boundary runs.
      - name: Desktop tests with the race detector
        if: ${{ hashFiles('desktop/go.mod') != '' }}
        working-directory: desktop
        run: go test -race -count=1 -p 2 ./...
      - name: Build the probe shell
        if: ${{ hashFiles('desktop/go.mod') != '' }}
        working-directory: desktop
        run: go build -p 2 -tags probe -o "$RUNNER_TEMP/hikyo-desktop-probe" .
      - name: Build the release shell
        if: ${{ hashFiles('desktop/go.mod') != '' }}
        working-directory: desktop
        run: go build -p 2 -o "$RUNNER_TEMP/hikyo-desktop" .
      - name: Driven WKWebView lane against a fake instance
        if: ${{ hashFiles('desktop/go.mod') != '' }}
        working-directory: desktop
        run: go run ./probes/driven -app "$RUNNER_TEMP/hikyo-desktop-probe" -timeout 120s

  desktop-main:
    needs: heads
    runs-on: ${{ needs.heads.outputs.main_runner }}
    timeout-minutes: 30
    env:
      HEAD_SHA: ${{ needs.heads.outputs.main }}
      CGO_ENABLED: "1"
      CGO_CFLAGS: -mmacosx-version-min=13.0
      CGO_LDFLAGS: -mmacosx-version-min=13.0
    steps: *desktop-steps

  # Fails the night when the desktop-removal shim in ci.yml is dead code: it is needed
  # only while a long-lived branch still registers desktop. Removal is tracked in #1595.
  # Reads both heads through the API; no checkout and no repository code runs.
  shim:
    needs: heads
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      state: ${{ steps.check.outputs.state }}
    steps:
      - name: Check whether the desktop-removal shim is still needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEV_SHA: ${{ needs.heads.outputs.dev }}
          MAIN_SHA: ${{ needs.heads.outputs.main }}
        run: |
          set -euo pipefail
          fetch() { gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/$1?ref=$2"; }
          # A registry without a jobs object is unreadable policy, not "desktop is gone".
          has_desktop() { jq 'if (.jobs | type) == "object" then .jobs | has("desktop") else error("the registry has no jobs") end' <<<"$1"; }
          state=gone
          ci=$(fetch .github/workflows/ci.yml "$MAIN_SHA")
          if grep -qF ci-job-registry.without-desktop.json <<<"$ci"; then
            main_registry=$(fetch scripts/ci/ci-job-registry.json "$MAIN_SHA")
            dev_registry=$(fetch scripts/ci/ci-job-registry.json "$DEV_SHA")
            main_has=$(has_desktop "$main_registry")
            dev_has=$(has_desktop "$dev_registry")
            if [ "$main_has" = true ] || [ "$dev_has" = true ]; then state=needed; else state=dead; fi
          fi
          echo "state=$state" >>"$GITHUB_OUTPUT"

  # Holds the only write permission and runs no repository code: no checkout, and
  # every value reaches the script through env. GitHub reports a runner that was
  # never acquired as cancelled, so anything but success counts as failing. It keeps
  # two independent tracking issues, so a dead shim can never hide a desktop failure:
  # the desktop one follows only the legs, the shim one only the shim check. It fails
  # the run itself so the run stays red, even when a leg was cancelled.
  report:
    needs: [heads, desktop-dev, desktop-main, shim]
    # A manual run from another ref skips the heads job and both legs; that is not a failure.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEV_SHA: ${{ needs.heads.outputs.dev }}
          MAIN_SHA: ${{ needs.heads.outputs.main }}
          DEV_RESULT: ${{ needs.desktop-dev.result }}
          MAIN_RESULT: ${{ needs.desktop-main.result }}
          SHIM_RESULT: ${{ needs.shim.result }}
          SHIM_STATE: ${{ needs.shim.outputs.state }}
        run: |
          set -euo pipefail
          # sync_issue TITLE MARKER LABEL FAILING DETAIL CLOSING_COMMENT: keeps one open
          # issue per title while FAILING is true and closes it once it is false.
          sync_issue() {
            local title=$1 marker=$2 label=$3 failing=$4 detail=$5 closing=$6 issue_number
            export TITLE=$title MARKER=$marker
            # The label narrows the list on the server; the exact match below stays the check.
            issue_number=$(gh issue list --state open --label "$label" --limit 100 \
              --json number,title,author,body \
              --jq '.[] | select(.title == env.TITLE and (.author.login == "github-actions[bot]" or .author.login == "app/github-actions") and (.body | contains(env.MARKER))) | .number' | head -n 1)
            if [ "$failing" = false ]; then
              if [ -n "$issue_number" ]; then
                gh issue close "$issue_number" --comment "$closing"
              fi
            elif [ -n "$issue_number" ]; then
              gh issue comment "$issue_number" --body "$detail"
            else
              gh label create "$label" --force --color B60205 \
                --description 'Automation-owned nightly desktop validation failure'
              gh issue create --title "$title" --label "$label" --body "$(printf '%s\n\n%s' "$marker" "$detail")"
            fi
          }
          desktop_failing=true
          if [ "$DEV_RESULT" = success ] && [ "$MAIN_RESULT" = success ]; then desktop_failing=false; fi
          shim_failing=true
          if [ "$SHIM_RESULT" = success ] && [ "$SHIM_STATE" != dead ]; then shim_failing=false; fi
          sync_issue 'ci: nightly desktop validation failing' '<!-- hikyo-nightly-desktop -->' ci-nightly-desktop "$desktop_failing" \
            "$(printf '%s\n' \
              "Nightly desktop validation did not pass: $RUN_URL" \
              "" \
              "- branch dev, head \`$DEV_SHA\`: ${DEV_RESULT:-not run}" \
              "- branch main, head \`$MAIN_SHA\`: ${MAIN_RESULT:-not run}")" \
            "Nightly desktop validation passed on dev (\`$DEV_SHA\`) and main (\`$MAIN_SHA\`): $RUN_URL"
          if [ "$SHIM_STATE" = dead ]; then
            shim_detail="The desktop-removal shim in ci.yml is dead: neither head registers desktop any more. Remove the shim and its migration tests (#1595). Seen: $RUN_URL"
          else
            shim_detail="The desktop-removal shim check did not complete (${SHIM_RESULT:-not run}): $RUN_URL"
          fi
          sync_issue 'ci: remove the dead desktop-removal shim (#1595)' '<!-- hikyo-nightly-desktop-shim -->' ci-desktop-removal-shim "$shim_failing" \
            "$shim_detail" "The desktop-removal shim check is healthy again: $RUN_URL"
          [ "$desktop_failing$shim_failing" = falsefalse ] && exit 0
          exit 1
