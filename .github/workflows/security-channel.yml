name: security-channel

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fallback-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Require a recent end-to-end fallback notification test
        run: >-
          ./scripts/ci/check-fallback-channel-test.sh
          release/repository/fallback-channel-test.json
          security@developwent.io
      - name: Surface fallback-channel degradation
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Fallback security channel health check failed'
          label='security-channel-alert'
          marker='<!-- hikyo-security-channel-alert -->'
          gh label create "$label" --force --color B60205 \
            --description 'Automation-owned fallback security channel alert'
          issue_number=$(gh issue list --state open --label "$label" --limit 100 \
            --json number,title,author,body \
            --jq ".[] | select(.title == \"$title\" and .author.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .number" | head -n 1)
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "The scheduled fallback-channel gate failed again: $RUN_URL"
            exit 0
          fi
          gh issue create --title "$title" \
            --label "$label" \
            --body "$marker

          The scheduled fallback-channel gate failed: $RUN_URL"
      - name: Close resolved fallback-channel alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title='Fallback security channel health check failed'
          label='security-channel-alert'
          marker='<!-- hikyo-security-channel-alert -->'
          issue_number=$(gh issue list --state open --label "$label" --limit 100 \
            --json number,title,author,body \
            --jq ".[] | select(.title == \"$title\" and .author.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .number" | head -n 1)
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" \
              --comment 'The scheduled fallback-channel gate is healthy again.'
          fi
