# Builds nightly artifacts in a run on dev, because a build runs dev's tooling, and
# in a run on main that tooling could write main-scoped Actions caches that queue
# and release builds restore. The one-time main bridge is the only build on main.
# The publisher in nightly.yml starts this run, authenticates it and pins its
# artifact; signing and publishing stay there. Source proof requires these bytes to
# match approved main.
name: nightly-build

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Source commit selected by the publisher
        required: true
        type: string
      publisher_run_id:
        description: The nightly-release run that requested this build
        required: true
        type: string
      publisher_run_attempt:
        description: The attempt of that run
        required: true
        type: string
      publisher_run_number:
        description: The run number that identifies this nightly
        required: true
        type: string
      receipt_artifact_id:
        description: That run's source validation receipt
        required: true
        type: string
      allow_missing_predecessor:
        description: Restart the signed chain without a predecessor
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Require a commit on this branch
        env:
          SOURCE: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          case "$GITHUB_REF" in
            refs/heads/main)
              # Only the main bridge builds here, and its source is main's tip at this
              # dispatch. An ancestor would let a writer rebuild an older main commit,
              # and a main that moved since the request fails closed.
              [[ "$SOURCE" = "$GITHUB_SHA" ]]
              ;;
            refs/heads/dev)
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE...$GITHUB_SHA" --jq .status)
              [[ "$status" = ahead || "$status" = identical ]]
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Start healthy PostgreSQL with Docker Hub cache fallback
        id: ci-postgres
        env:
          POSTGRES_PASSWORD: release-schema-fixture
          POSTGRES_DB: hikyo_release_schema
          POSTGRES_HEALTH_RETRIES: 12
        run: ./scripts/ci/start-ci-postgres.sh
      - name: Pin the validated development source
        id: source
        env:
          EXPECTED_SOURCE: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$commit" = "$EXPECTED_SOURCE"
          printf 'commit=%s\n' "$commit" >>"$GITHUB_OUTPUT"
      - name: Download the pinned source validation receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.receipt_artifact_id }}
          run-id: ${{ inputs.publisher_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/validated-source
      - name: Resolve stable-base nightly identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ steps.source.outputs.commit }}
          RUN_NUMBER: ${{ inputs.publisher_run_number }}
          INITIAL_NIGHTLY_VERSION: 0.0.1
        run: |
          set -o pipefail
          tag=$(gh api --paginate --slurp \
            "repos/$REPOSITORY/git/matching-refs/tags/v" | \
            ./scripts/release/nightly-run-tag.sh "$RUN_NUMBER")
          tag_exists=false
          if [ -n "$tag" ]; then
            tag_lookup_error="$RUNNER_TEMP/nightly-tag-lookup.err"
            if ! existing_tag_sha=$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" \
              --jq '.object.sha' 2>"$tag_lookup_error"); then
              cat "$tag_lookup_error" >&2
              exit 1
            fi
            if [ "$existing_tag_sha" != "$COMMIT" ]; then
              printf 'nightly: run %s tag %s resolves to %s, expected %s\n' \
                "$RUN_NUMBER" "$tag" "$existing_tag_sha" "$COMMIT" >&2
              exit 1
            fi
            release_lookup_error="$RUNNER_TEMP/nightly-release-lookup.err"
            if release_state=$(gh api "repos/$REPOSITORY/releases/tags/$tag" \
              --jq '"\(.draft):\(.prerelease)"' 2>"$release_lookup_error"); then
              if [ "$release_state" != 'false:true' ]; then
                printf 'nightly: existing release %s has unexpected state %s\n' \
                  "$tag" "$release_state" >&2
                exit 1
              fi
              printf 'skip=true\n' >>"$GITHUB_OUTPUT"
              printf 'tag=%s\nversion=%s\n' "$tag" "${tag#v}" >>"$GITHUB_OUTPUT"
              printf 'nightly: workflow run %s already published as %s\n' \
                "$RUN_NUMBER" "$tag"
              exit 0
            elif ! grep -F '(HTTP 404)' "$release_lookup_error" >/dev/null; then
              cat "$release_lookup_error" >&2
              exit 1
            fi
            version=${tag#v}
            tag_exists=true
          else
            latest_tag=$(gh api --paginate --slurp \
              "repos/$REPOSITORY/releases?per_page=100" | \
              ./scripts/release/latest-nightly-tag.sh)
            latest_commit=
            if [ -n "$latest_tag" ]; then
              latest_commit=$(gh api "repos/$REPOSITORY/git/ref/tags/$latest_tag" \
                --jq '.object.sha')
            fi
            if [ "$latest_commit" = "$COMMIT" ]; then
              printf 'skip=true\n' >>"$GITHUB_OUTPUT"
              printf 'tag=%s\nversion=%s\n' "$latest_tag" "${latest_tag#v}" >>"$GITHUB_OUTPUT"
              printf 'nightly: commit %s already published\n' "$COMMIT"
              exit 0
            fi
            stable_tag=$(gh api --paginate --slurp \
              "repos/$REPOSITORY/releases?per_page=100" | \
              ./scripts/release/latest-stable-version.sh)
            release_date=$(date -u +%Y%m%d)
            if [ -n "$stable_tag" ]; then
              version=$(./scripts/release/next-nightly-version.sh \
                "$stable_tag" "$release_date" "$RUN_NUMBER" "$COMMIT")
            else
              version=$(./scripts/release/nightly-version.sh "$INITIAL_NIGHTLY_VERSION" \
                "$release_date" "$RUN_NUMBER" "$COMMIT")
            fi
            tag="v$version"
            tag_lookup_error="$RUNNER_TEMP/nightly-tag-lookup.err"
            if existing_tag_sha=$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" \
              --jq '.object.sha' 2>"$tag_lookup_error"); then
              if [ "$existing_tag_sha" != "$COMMIT" ]; then
                printf 'nightly: tag %s resolves to %s, expected %s\n' \
                  "$tag" "$existing_tag_sha" "$COMMIT" >&2
                exit 1
              fi
              printf 'nightly: tag %s already resolves to %s; resuming publication\n' \
                "$tag" "$COMMIT"
              tag_exists=true
            elif ! grep -F '(HTTP 404)' "$tag_lookup_error" >/dev/null; then
              cat "$tag_lookup_error" >&2
              exit 1
            fi
          fi
          printf 'skip=false\nversion=%s\ntag=%s\ntag_exists=%s\n' \
            "$version" "$tag" "$tag_exists" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.identity.outputs.skip != 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Require recovery-authorized nightly trust before building
        if: steps.identity.outputs.skip != 'true'
        run: go run ./scripts/release/nightly preflight
      - name: Resolve and authenticate previous signed nightly
        if: steps.identity.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_MISSING_PREDECESSOR: ${{ inputs.allow_missing_predecessor }}
          PREDECESSOR_EDGES: 8
        run: |
          set -o pipefail
          # Up to PREDECESSOR_EDGES signed predecessors, newest first, each
          # becomes an exact-schema upgrade source of this nightly (#700), so a
          # route can skip one revoked or missing release without a bridge.
          # Directory 1 is the newest predecessor; the highest number the oldest.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq '
            map(map(select(any(.assets[]; .name == "release-manifest.sigstore.json"))))
          ' | ./scripts/release/latest-nightly-tag.sh --limit "$PREDECESSOR_EDGES" >"$RUNNER_TEMP/predecessor-tags"
          set --
          index=0
          while IFS= read -r previous_tag; do
            [ -n "$previous_tag" ] || continue
            index=$((index + 1))
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/previous-nightly/$index"
            set -- "$@" --directory "$RUNNER_TEMP/previous-nightly/$index"
          done <"$RUNNER_TEMP/predecessor-tags"
          if [ "$index" -gt 0 ]; then
            printf '%s\n' "$index" >"$RUNNER_TEMP/previous-nightly/count"
            go run ./scripts/release/nightly sources "$@" --out "$RUNNER_TEMP/nightly-sources.json"
          elif [ "$ALLOW_MISSING_PREDECESSOR" = true ]; then
            echo '::warning::Building without a signed predecessor by explicit request; installations below this release need a recovery bridge.'
            go run ./scripts/release/nightly sources --out "$RUNNER_TEMP/nightly-sources.json"
          else
            # Every nightly declares its signed predecessor as an upgrade source.
            # No predecessor means the chain was cut, usually by deleting a
            # release. A silent build here strands every installation below it.
            echo '::error::No signed predecessor release is available. Revoke bad nightlies instead of deleting them; to restart the chain deliberately, send the nightly-chain-restart repository dispatch with allow_missing_predecessor=true and publish a recovery bridge.'
            exit 1
          fi
      - name: Generate nightly compatibility from both migrated engines
        id: compatibility
        if: steps.identity.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
          RUN_NUMBER: ${{ inputs.publisher_run_number }}
          HIKYO_RELEASE_SCHEMA_POSTGRES_DSN: postgres://hikyo:release-schema-fixture@127.0.0.1:5432/hikyo_release_schema?sslmode=disable
        run: |
          candidate="$RUNNER_TEMP/nightly-candidate.json"
          jq -n --arg version "$VERSION" --arg commit "$COMMIT" --argjson sequence "$RUN_NUMBER" \
            '{version:$version,commit:$commit,sequence:$sequence,key_id:"",public_key:""}' >"$candidate"
          declaration="$RUNNER_TEMP/upgrade-compatibility.json"
          go run ./scripts/release/compatibility --profile nightly/v1 --candidate "$candidate" \
            --sources "$RUNNER_TEMP/nightly-sources.json" --out "$declaration"
          {
            printf 'path=%s\n' "$declaration"
            printf 'sha256=%s\n' "$(sha256sum "$declaration" | awk '{print $1}')"
          } >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        if: steps.identity.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
      - name: Install Corepack and enable pnpm
        if: steps.identity.outputs.skip != 'true'
        run: ./scripts/ci/install-corepack.sh
      - name: Build tested embedded WebUI
        if: steps.identity.outputs.skip != 'true'
        run: ./scripts/ci/build-spa.sh
      - name: Embed mandatory production trust material
        id: update-trust
        if: steps.identity.outputs.skip != 'true'
        run: |
          test -s release/trust/root.json
          recovery=$(jq -r '.recovery.public_key' release/trust/root.json)
          {
            printf 'root='
            base64 <release/trust/root.json | tr -d '\n'
            printf '\nrecovery='
            base64 <"release/trust/$recovery" | tr -d '\n'
            printf '\n'
          } >>"$GITHUB_OUTPUT"
      - name: Build six nightly archives and eight native packages
        if: steps.identity.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          HIKYO_RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          HIKYO_RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          HIKYO_UPDATE_CHANNEL: nightly
          HIKYO_UPDATE_TRUST_ROOT: ${{ steps.update-trust.outputs.root }}
          HIKYO_UPDATE_RECOVERY_KEY: ${{ steps.update-trust.outputs.recovery }}
          HIKYO_COMPATIBILITY_PATH: ${{ steps.compatibility.outputs.path }}
          HIKYO_COMPATIBILITY_SHA256: ${{ steps.compatibility.outputs.sha256 }}
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish
      - name: Verify nightly archive and package identity
        if: steps.identity.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          jq -e --arg version "$VERSION" --arg commit "$COMMIT" '
            .version == $version and .commit == $commit
          ' dist/metadata.json >/dev/null
          ./scripts/release/snapshot-manifest_test.sh
      - name: Bind untouched nightly archive bytes
        id: retained-integrity
        if: steps.identity.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -o pipefail
          for os in Linux Windows; do
            extension=tar.gz
            if [ "$os" = Windows ]; then extension=zip; fi
            for arch in arm64 x86_64; do
              sha256sum "dist/hikyo_${VERSION}_${os}_${arch}.$extension" || exit 1
            done
          done | LC_ALL=C sort >"$RUNNER_TEMP/non-darwin-checksums.txt"
          non_darwin_sha256=$(sha256sum "$RUNNER_TEMP/non-darwin-checksums.txt" | awk '{print $1}')
          printf 'non_darwin_sha256=%s\n' "$non_darwin_sha256" >>"$GITHUB_OUTPUT"
      - name: Retain canonical nightly artifacts and authenticated predecessor identity
        if: steps.identity.outputs.skip != 'true'
        run: |
          mkdir nightly-context
          cp "$RUNNER_TEMP/upgrade-compatibility.json" "$RUNNER_TEMP/nightly-sources.json" \
            "$RUNNER_TEMP/predecessor-tags" nightly-context/
          cp "$RUNNER_TEMP/validated-source/source-validation.json" nightly-context/
          tar -czf "$RUNNER_TEMP/nightly-inputs.tar.gz" dist nightly-context
      - id: upload-inputs
        if: steps.identity.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-inputs-${{ inputs.commit }}-${{ inputs.publisher_run_id }}-${{ inputs.publisher_run_attempt }}
          path: ${{ runner.temp }}/nightly-inputs.tar.gz
          if-no-files-found: error
          retention-days: 1
      # Job outputs cannot cross runs, so the publisher reads this identity instead.
      - name: Record the build identity for the publisher
        env:
          SKIP: ${{ steps.identity.outputs.skip }}
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
          TAG_EXISTS: ${{ steps.identity.outputs.tag_exists }}
          COMMIT: ${{ steps.source.outputs.commit }}
          ARTIFACT_ID: ${{ steps.upload-inputs.outputs.artifact-id }}
          NON_DARWIN_SHA256: ${{ steps.retained-integrity.outputs.non_darwin_sha256 }}
          COMPATIBILITY_SHA256: ${{ steps.compatibility.outputs.sha256 }}
        run: |
          jq -n --arg skip "$SKIP" --arg tag "$TAG" --arg version "$VERSION" --arg tag_exists "$TAG_EXISTS" \
            --arg commit "$COMMIT" --arg artifact_id "$ARTIFACT_ID" \
            --arg non_darwin_sha256 "$NON_DARWIN_SHA256" --arg compatibility_sha256 "$COMPATIBILITY_SHA256" \
            '$ARGS.named' >"$RUNNER_TEMP/nightly-build-identity.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-build-identity
          path: ${{ runner.temp }}/nightly-build-identity.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove CI PostgreSQL
        if: ${{ always() && steps.ci-postgres.outcome == 'success' }}
        run: docker container rm --force hikyo-ci-postgres
