name: notarytool-client-probe

on:
  push:
    branches:
      - dunky13/diagnose-notarytool-sigtrap

permissions: {}

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Compare hosted clients with an unregistered test key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          openssl ecparam -name prime256v1 -genkey -noout |
            openssl pkcs8 -topk8 -nocrypt -out "$scratch/original.p8"
          issuer=$(uuidgen)
          mkdir "$scratch/payload"
          printf 'Unregistered-client authentication probe.\n' >"$scratch/payload/README.txt"
          hdiutil create -srcfolder "$scratch/payload" -fs HFS+ -format UDZO "$scratch/probe.dmg"
          crashes=0
          for toolchain in 16.4 26.3; do
            export DEVELOPER_DIR="/Applications/Xcode_$toolchain.app/Contents/Developer"
            xcodebuild -version
            xcrun notarytool --version
            for command in history submit; do
              status=0
              set -- "$command"
              if [ "$command" = submit ]; then set -- "$@" "$scratch/probe.dmg"; fi
              xcrun notarytool "$@" --key "$scratch/original.p8" \
                --key-id DUMMY00001 --issuer "$issuer" \
                --output-format json >"$scratch/result" 2>"$scratch/error" || status=$?
              printf 'toolchain=%s command=%s exit=%s\n' "$toolchain" "$command" "$status"
              sed '/-----BEGIN .*PRIVATE KEY-----/,/-----END .*PRIVATE KEY-----/d' "$scratch/error" |
                sed -E 's/[A-Za-z0-9+\/=]{48,}/[redacted]/g' | sed -n '1,60p'
              if [ "$status" -ge 128 ]; then crashes=$((crashes + 1)); fi
              [ "$status" -ne 0 ] || { printf 'unexpected test-key authentication\n' >&2; exit 1; }
            done
          done
          [ "$crashes" -eq 0 ]
