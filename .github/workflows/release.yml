name: release-build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "!v*-nightly.*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ github.sha }}
    permissions:
      actions: read
      contents: read
      pull-requests: read

  floor-bench:
    uses: ./.github/workflows/floor-bench.yml
    with:
      revision: ${{ github.sha }}
    permissions:
      contents: read

  docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      # Exact @playwright/test release from docs/site/package.json.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Assert O4-O6 docs and governance release gates
        env:
          POSTHOG_REQUIRED: true
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
        run: ./scripts/ci/verify-docs.sh

  build-artifacts:
    needs: [validation, docs, floor-bench]
    outputs:
      artifact_id: ${{ steps.upload-inputs.outputs.artifact-id }}
      candidate_sha256: ${{ steps.candidate.outputs.sha256 }}
      version: ${{ steps.candidate.outputs.version }}
      commit: ${{ steps.candidate.outputs.commit }}
      image: ${{ steps.identity.outputs.image }}
      compatibility_sha256: ${{ steps.compatibility.outputs.sha256 }}
      non_darwin_sha256: ${{ steps.input-digests.outputs.non_darwin_sha256 }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start healthy PostgreSQL with Docker Hub cache fallback
        id: ci-postgres
        env:
          POSTGRES_PASSWORD: release-schema-fixture
          POSTGRES_DB: hikyo_release_schema
          POSTGRES_HEALTH_RETRIES: 12
        run: ./scripts/ci/start-ci-postgres.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Install Corepack and enable pnpm
        run: ./scripts/ci/install-corepack.sh
      # working-directory matters: corepack resolves the packageManager pin
      # from the CWD's package.json — from the repo root (which has none) it
      # falls back to its default pnpm and the pinned project refuses it.
      - name: Build the SPA (the `ui` build tag embeds it)
        working-directory: web
        run: |
          pnpm --dir ../clients/ts install --frozen-lockfile
          pnpm install --frozen-lockfile
          pnpm build
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Resolve immutable release identity
        id: identity
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release/check-tag.sh "$REPOSITORY" "$TAG" "$TAG_SHA"
          ./scripts/release/require-signed-tag.sh "$REPOSITORY" "$TAG" "$TAG_SHA"
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
          HIKYO_ALLOW_IMMUTABLE_TAG_PROBE=YES \
            ./scripts/release/probe-tag-move.sh "$REPOSITORY" v-ruleset-probe "$TAG_SHA"
          image=$(printf 'ghcr.io/%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          printf 'image=%s\n' "$image" >>"$GITHUB_OUTPUT"

      - name: Verify production trust bootstrap
        id: candidate
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          go run ./scripts/release/stable preflight --trust release/trust
          ./scripts/release/require-synced-trust.sh "$REPOSITORY" release/trust/metadata.json
          version=${TAG#v}
          candidate="$RUNNER_TEMP/release-candidate.json"
          go run ./scripts/release/stable candidate --trust release/trust \
            --version "$version" --commit "$COMMIT" --out "$candidate"
          candidate_sha256=$(sha256sum "$candidate" | awk '{print $1}')
          resolved_version=$(jq -r '.version' "$candidate")
          resolved_commit=$(jq -r '.commit' "$candidate")
          printf 'path=%s\nsha256=%s\nversion=%s\ncommit=%s\n' \
            "$candidate" "$candidate_sha256" "$resolved_version" "$resolved_commit" >>"$GITHUB_OUTPUT"

      - name: Test release source
        env:
          RELEASE_SCHEMA_CONTAINER: hikyo-ci-postgres
          HIKYO_TEST_POSTGRES_DSN: postgres://hikyo:release-schema-fixture@127.0.0.1:5432/hikyo_release_tests?sslmode=disable
        run: |
          # Preserve the separate empty database used by artifact generation.
          docker exec "$RELEASE_SCHEMA_CONTAINER" createdb -U hikyo hikyo_release_tests
          go test ./...
          ./scripts/release/test-fixtures.sh

      - name: Assert fallback channel and live docs release gates
        run: |
          ./scripts/ci/check-fallback-channel-test.sh \
            release/repository/fallback-channel-test.json \
            security@developwent.io
          ./scripts/ci/check-docs-live.sh \
            https://hikyo.app security@developwent.io

      - name: Validate candidate for GoReleaser
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          CANDIDATE_SHA256: ${{ steps.candidate.outputs.sha256 }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
        run: |
          ./scripts/release/check-candidate.sh "$CANDIDATE" "$CANDIDATE_SHA256"
          jq -e --arg version "$RELEASE_VERSION" --arg commit "$RELEASE_COMMIT" '
            .version == $version and .commit == $commit
          ' "$CANDIDATE" >/dev/null

      - name: Encode stable updater trust material
        id: update-trust
        run: |
          recovery=$(jq -r '.recovery.public_key' release/trust/root.json)
          {
            printf 'root='
            base64 <release/trust/root.json | tr -d '\n'
            printf '\nrecovery='
            base64 <"release/trust/$recovery" | tr -d '\n'
            printf '\n'
          } >>"$GITHUB_OUTPUT"

      - name: Generate exact compatibility from both migrated engines
        id: compatibility
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          HIKYO_RELEASE_SCHEMA_POSTGRES_DSN: postgres://hikyo:release-schema-fixture@127.0.0.1:5432/hikyo_release_schema?sslmode=disable
        run: |
          declaration="$RUNNER_TEMP/upgrade-compatibility.json"
          go run ./scripts/release/compatibility --candidate "$CANDIDATE" --out "$declaration"
          {
            printf 'path=%s\n' "$declaration"
            printf 'sha256=%s\n' "$(sha256sum "$declaration" | awk '{print $1}')"
          } >>"$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          HIKYO_RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          HIKYO_RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
          HIKYO_UPDATE_CHANNEL: stable
          HIKYO_UPDATE_TRUST_ROOT: ${{ steps.update-trust.outputs.root }}
          HIKYO_UPDATE_RECOVERY_KEY: ${{ steps.update-trust.outputs.recovery }}
          HIKYO_COMPATIBILITY_PATH: ${{ steps.compatibility.outputs.path }}
          HIKYO_COMPATIBILITY_SHA256: ${{ steps.compatibility.outputs.sha256 }}
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish

      - name: Verify GoReleaser candidate identity
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          CANDIDATE_SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: |
          ./scripts/release/check-candidate.sh "$CANDIDATE" "$CANDIDATE_SHA256"
          jq -e --slurpfile candidate "$CANDIDATE" '
            .version == $candidate[0].version and
            .commit == $candidate[0].commit
          ' dist/metadata.json >/dev/null

      - name: Bind unchanged Linux and Windows archive bytes
        id: input-digests
        run: |
          digest=$( (cd dist && sha256sum hikyo_*_Linux_*.tar.gz hikyo_*_Windows_*.zip | LC_ALL=C sort) | sha256sum | awk '{print $1}')
          printf 'non_darwin_sha256=%s\n' "$digest" >>"$GITHUB_OUTPUT"

      - name: Source dependency SBOM (Go and frontend)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/hikyo-source.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Retain canonical artifacts for Apple signing
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          COMPATIBILITY: ${{ steps.compatibility.outputs.path }}
        run: |
          cp "$CANDIDATE" dist/release-candidate.json
          cp "$COMPATIBILITY" dist/upgrade-compatibility.json
          tar -czf "$RUNNER_TEMP/release-inputs.tar.gz" dist
      - id: upload-inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-inputs.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Remove CI PostgreSQL
        if: ${{ always() && steps.ci-postgres.outcome == 'success' }}
        run: docker container rm --force hikyo-ci-postgres

  apple-sign:
    outputs:
      artifact_id: ${{ steps.upload-inputs.outputs.artifact-id }}
    needs: build-artifacts
    environment: apple-signing
    runs-on: macos-15
    permissions:
      contents: read
    env:
      # The macOS 15 default client traps during API-key authentication.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Report selected Apple notarization client
        run: |
          xcodebuild -version
          xcrun notarytool --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build-artifacts.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-inputs
      - name: Restore canonical release artifacts
        run: tar -xzf "$RUNNER_TEMP/release-inputs/release-inputs.tar.gz"
      - name: Sign and notarize macOS binaries and disk images
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_EVIDENCE_DIR: ${{ runner.temp }}/apple-notarization
          CANDIDATE_SHA256: ${{ needs.build-artifacts.outputs.candidate_sha256 }}
        run: ./scripts/release/sign-apple-artifacts.sh dist
      - name: Retain Apple notarization diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-notarization-stable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-notarization/*.json
          if-no-files-found: warn
      - name: Retain finalized Apple artifacts
        run: COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/apple-release-inputs.tar.gz" dist
      - id: upload-inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-release-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-release-inputs.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-signed-draft:
    needs: [validation, docs, floor-bench, build-artifacts, apple-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.apple-sign.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/apple-release-inputs
      - name: Restore finalized release artifacts and recheck identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
          CANDIDATE_SHA256: ${{ needs.build-artifacts.outputs.candidate_sha256 }}
        run: |
          tar -xzf "$RUNNER_TEMP/apple-release-inputs/apple-release-inputs.tar.gz"
          ./scripts/release/check-candidate.sh dist/release-candidate.json "$CANDIDATE_SHA256"
          ./scripts/release/require-signed-tag.sh "$REPOSITORY" "$TAG" "$TAG_SHA"
          go run ./scripts/release/stable preflight --trust release/trust
          (cd dist && sha256sum --check --strict checksums.txt)
          for arch in arm64 x86_64; do
            test -s "dist/hikyo_${TAG#v}_Darwin_$arch.dmg"
          done

      - name: Verify unchanged Linux and Windows archive bytes
        env:
          NON_DARWIN_SHA256: ${{ needs.build-artifacts.outputs.non_darwin_sha256 }}
        run: |
          digest=$( (cd dist && sha256sum hikyo_*_Linux_*.tar.gz hikyo_*_Windows_*.zip | LC_ALL=C sort) | sha256sum | awk '{print $1}')
          test "$digest" = "$NON_DARWIN_SHA256"

      - name: Verify every native package payload
        run: go run ./scripts/release/verify-native-packages.go dist "${{ needs.build-artifacts.outputs.version }}"

      - name: Prepare canonical image inputs
        env:
          CANDIDATE: dist/release-candidate.json
          CANDIDATE_SHA256: ${{ needs.build-artifacts.outputs.candidate_sha256 }}
        run: |
          ./scripts/release/check-candidate.sh "$CANDIDATE" "$CANDIDATE_SHA256"
          commit=$(jq -r '.commit' "$CANDIDATE")
          ./scripts/release/prepare-image-root.sh \
            dist image-root "$commit" .goreleaser.yaml

      - name: Remove GoReleaser internal metadata
        run: rm -f dist/artifacts.json dist/config.yaml dist/metadata.json

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an already-used image version
        env:
          IMAGE: ${{ needs.build-artifacts.outputs.image }}
          VERSION: ${{ needs.build-artifacts.outputs.version }}
        run: ./scripts/release/check-oci-unused.sh "$IMAGE:$VERSION"
      - name: Publish unsigned multi-arch image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.build-artifacts.outputs.image }}:${{ needs.build-artifacts.outputs.version }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.build-artifacts.outputs.commit }}
            org.opencontainers.image.version=${{ needs.build-artifacts.outputs.version }}

      - name: Smoke the published candidate image
        env:
          IMAGE: ${{ needs.build-artifacts.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: ./scripts/release/smoke-image-ui.sh "$IMAGE@$IMAGE_DIGEST"

      - name: Published image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ needs.build-artifacts.outputs.image }}@${{ steps.image.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/hikyo-image.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Package and publish digest-pinned Helm chart
        id: chart
        env:
          CANDIDATE: dist/release-candidate.json
          CANDIDATE_SHA256: ${{ needs.build-artifacts.outputs.candidate_sha256 }}
          IMAGE: ${{ needs.build-artifacts.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          ./scripts/release/check-candidate.sh "$CANDIDATE" "$CANDIDATE_SHA256"
          version=$(jq -r '.version' "$CANDIDATE")
          chart_dir="$RUNNER_TEMP/hikyo-chart"
          cp -R chart/hikyo "$chart_dir"
          cp release/trust/root.json "$chart_dir/files/release/trust/root.json"
          cp release/trust/stable-policy.json release/trust/stable-policy.sigstore.json \
            "$chart_dir/files/release/trust/"
          sed -i 's/mode: keyed/mode: keyless/' "$chart_dir/values.yaml"
          sed -i "s|repository: ghcr.io/hikyo-org/hikyo|repository: $IMAGE|" "$chart_dir/values.yaml"
          sed -i "s|sha256:RELEASE_IMAGE_DIGEST|$IMAGE_DIGEST|" "$chart_dir/values.yaml"
          grep -Fx "  repository: $IMAGE" "$chart_dir/values.yaml"
          grep -Fx "  digest: $IMAGE_DIGEST" "$chart_dir/values.yaml"
          helm lint "$chart_dir" --set database.existingSecret=hikyo-database \
            --set rootKey.existingSecret=hikyo-root-key \
            --set upgrade.existingClaim=hikyo-upgrade-bundle \
            --set upgrade.stateExistingClaim=hikyo-upgrade-state \
            --set externalOrigin=https://hikyo.example.com \
            --set 'network.trustedProxyCIDRs={10.42.0.0/16}'
          helm template fixture "$chart_dir" --set database.existingSecret=hikyo-database \
            --set rootKey.existingSecret=hikyo-root-key \
            --set upgrade.existingClaim=hikyo-upgrade-bundle \
            --set upgrade.stateExistingClaim=hikyo-upgrade-state \
            --set externalOrigin=https://hikyo.example.com \
            --set 'network.trustedProxyCIDRs={10.42.0.0/16}' >/dev/null
          helm package "$chart_dir" --version "$version" --app-version "$version" --destination dist
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          chart=$(printf 'ghcr.io/%s/charts/hikyo' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          ./scripts/release/check-oci-unused.sh "$chart:$version"
          push_output=$(helm push "dist/hikyo-$version.tgz" "oci://$(dirname "$chart")")
          chart_digest=$(printf '%s\n' "$push_output" | awk '$1 == "Digest:" {print $2}' | tail -n 1)
          printf '%s\n' "$chart_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf 'chart=%s\nchart_digest=%s\n' "$chart" "$chart_digest" >>"$GITHUB_OUTPUT"

      - name: Prepare OCI signing payloads
        env:
          IMAGE: ${{ needs.build-artifacts.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART: ${{ steps.chart.outputs.chart }}
          CHART_DIGEST: ${{ steps.chart.outputs.chart_digest }}
        run: |
          cosign generate "$IMAGE@$IMAGE_DIGEST" >dist/image-index.oci-payload.json
          cosign generate "$CHART@$CHART_DIGEST" >dist/chart-index.oci-payload.json

      - name: Build installer verifiers from the same source
        run: |
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              case "$goos" in linux) platform=Linux ;; darwin) platform=Darwin ;; windows) platform=Windows ;; esac
              arch=$goarch
              if [ "$goarch" = amd64 ]; then arch=x86_64; fi
              suffix=
              if [ "$goos" = windows ]; then suffix=.exe; fi
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
                -o "dist/hikyo-release-verifier_${platform}_${arch}${suffix}" ./scripts/release/stable
            done
          done

      - name: Render installer with pinned trust root
        env:
          CANDIDATE: dist/release-candidate.json
          CANDIDATE_SHA256: ${{ needs.build-artifacts.outputs.candidate_sha256 }}
        run: |
          ./scripts/release/check-candidate.sh "$CANDIDATE" "$CANDIDATE_SHA256"
          version=$(jq -r '.version' "$CANDIDATE")
          ./scripts/release/render-installer.sh "$version" \
            release/trust/root.json scripts/release/verify-bundle.sh dist/install.sh dist

      - name: Build release manifest
        env:
          COMPATIBILITY: dist/upgrade-compatibility.json
          COMPATIBILITY_SHA256: ${{ needs.build-artifacts.outputs.compatibility_sha256 }}
          CANDIDATE: dist/release-candidate.json
          CANDIDATE_SHA256: ${{ needs.build-artifacts.outputs.candidate_sha256 }}
          IMAGE: ${{ needs.build-artifacts.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART: ${{ steps.chart.outputs.chart }}
          CHART_DIGEST: ${{ steps.chart.outputs.chart_digest }}
        run: |
          ./scripts/release/check-candidate.sh "$CANDIDATE" "$CANDIDATE_SHA256"
          test "$(sha256sum "$COMPATIBILITY" | awk '{print $1}')" = "$COMPATIBILITY_SHA256"
          cp release/trust/stable-policy.json release/trust/stable-policy.sigstore.json \
            release/trust/stable-trusted-root.json dist/
          printf '%s\n' "$IMAGE_DIGEST" >dist/image-index.digest
          printf '%s\n' "$CHART_DIGEST" >dist/chart-index.digest
          ./scripts/release/create-build-provenance.sh dist dist/release-candidate.json
          ./scripts/release/create-manifest.sh dist/release-candidate.json \
            "$IMAGE" "$IMAGE_DIGEST" "$CHART" "$CHART_DIGEST" \
            dist

      - name: Sign draft and provenance with the tag workflow identity
        run: |
          draft="$RUNNER_TEMP/stable-draft"
          mkdir "$draft"
          cp dist/release-manifest.json "$draft/"
          while IFS= read -r name; do
            cp "dist/$name" "$draft/$name"
          done < <(jq -r '.artifacts[].name' dist/release-manifest.json)
          ./scripts/release/sign-stable-draft.sh release/trust "$draft"

      - name: Stage signed draft for human review
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [ "$(./scripts/release/release-channel.sh "$TAG")" = prerelease ]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --draft "${prerelease[@]}" \
            --title "$TAG" --notes "Signed draft. Review version, source commit, provenance and manifest SHA-256 before publishing from the local online ceremony."
          gh release upload "$TAG" "$RUNNER_TEMP/stable-draft/"*
          downloaded="$RUNNER_TEMP/staged-release"
          mkdir "$downloaded"
          gh release download "$TAG" --dir "$downloaded"
          go run ./scripts/release/stable verify --trust release/trust --directory "$downloaded" \
            --version "${TAG#v}" --commit "$GITHUB_SHA" --published
          {
            printf '### Signed draft awaiting publication\n\n'
            printf 'Tag: %s\n\nCommit: %s\n\n' "$TAG" "$GITHUB_SHA"
            printf 'Review manifest SHA-256: %s\n' "$(sha256sum "$downloaded/release-manifest.json" | awk '{print $1}')"
            printf 'Use the local online ceremony publish command from current clean main with this version and digest after review.\n'
          } >>"$GITHUB_STEP_SUMMARY"
