# CI for the walking skeleton (#42): trusted base-branch orchestration runs
# every validation domain affected by PR paths; main runs the complete suite.
# Validation checks out exact PR heads with read-only permissions and no cache
# writes. Actions and toolchains remain pinned.
name: ci

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  actions: read
  contents: read

concurrency:
  # PR updates supersede the same PR; every main push stays independently
  # queued so a burst cannot discard the middle commit's CI/cache seed.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Keep the required workflow present on every PR, then select jobs inside it.
  # Unknown paths and changes to this classifier fail closed to the full plan.
  changes:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.classify.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = push ]; then
            plan=$(./scripts/ci/classify-changed-paths.sh --all)
          elif git cat-file -e "$BASE_SHA:scripts/ci/classify-changed-paths.sh" 2>/dev/null &&
            git cat-file -e "$BASE_SHA:scripts/ci/ci-job-registry.json" 2>/dev/null; then
            trusted_classifier="$RUNNER_TEMP/classify-changed-paths.sh"
            trusted_registry="$RUNNER_TEMP/ci-job-registry.json"
            git show "$BASE_SHA:scripts/ci/classify-changed-paths.sh" >"$trusted_classifier"
            git show "$BASE_SHA:scripts/ci/ci-job-registry.json" >"$trusted_registry"
            chmod +x "$trusted_classifier"
            plan=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" |
              CI_JOB_REGISTRY="$trusted_registry" "$trusted_classifier" --files)
          else
            echo "trusted CI classifier or job registry is missing at $BASE_SHA" >&2
            exit 1
          fi
          printf 'plan=%s\n' "$plan" >>"$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).lint }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      - name: Restore lint Go cache
        id: lint-go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-lint-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: |
            go-lint-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      - name: Shellcheck (pinned archive)
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --retry 4 --retry-delay 2 --retry-all-errors \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          shellcheck_dir="$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION"
          "$shellcheck_dir/shellcheck" \
            .githooks/* scripts/git/*.sh scripts/lib/*.sh scripts/ci/*.sh \
            scripts/release/*.sh scripts/bench/*.sh scripts/compose-demo.sh install/install.sh.in
          echo "$shellcheck_dir" >>"$GITHUB_PATH"
      - name: Actionlint
        run: ./scripts/ci/run-go-tool.sh actionlint
      - name: Save lint Go cache
        if: >-
          success() && steps.lint-go-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.lint-go-cache.outputs.cache-primary-key }}

  dco:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require DCO sign-off on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trusted_dco="$RUNNER_TEMP/check-dco.sh"
          git show "$BASE_SHA:scripts/ci/check-dco.sh" >"$trusted_dco"
          chmod +x "$trusted_dco"
          "$trusted_dco" "$BASE_SHA" "$HEAD_SHA"

  supply-chain-checks:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan)['supply-chain-checks'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Chart renders and carries release substitution anchors
        run: |
          module_path="$(awk '$1 == "module" { print $2 }' go.mod)"
          if [[ "$module_path" =~ ^github\.com/([^/]+)/hikyo$ ]]; then
            module_owner="${BASH_REMATCH[1],,}"
          else
            echo "unexpected Go module path: $module_path" >&2
            exit 1
          fi
          grep -Fx "  repository: ghcr.io/${module_owner}/hikyo" chart/hikyo/values.yaml
          grep -Fx "  digest: sha256:RELEASE_IMAGE_DIGEST" chart/hikyo/values.yaml
      - name: Chart renders across modes with hardening and refusal assertions
        run: ./scripts/ci/check-chart.sh
      - name: MCP Compose and reverse-proxy deployment contract
        run: ./scripts/ci/check-mcp-deployment.sh
      - name: Release trust and refusal fixtures
        run: ./scripts/release/test-fixtures.sh
      - name: Interactive release ceremony fixture
        run: ./scripts/release/ceremony_test.sh
      - name: Release candidate resolver fixture
        run: ./scripts/release/resolve-candidate_test.sh
      - name: Manifest binding fixture
        run: ./scripts/release/bind-manifest_test.sh
      - name: Upgrade catalog inventory fixture
        run: ./scripts/release/create-upgrade-catalog_test.sh
      - name: Release manifest fixture
        run: ./scripts/release/create-manifest_test.sh
      - name: Homebrew cask renderer fixture
        run: ./scripts/release/render-homebrew-cask_test.sh
      - name: Protected Homebrew tap publisher fixture
        run: ./scripts/release/publish-homebrew-cask_test.sh
      - name: Native package identity fixture
        run: ./scripts/release/package-identity_test.sh
      - name: Native package verifier refusal tests
        run: go test ./scripts/release
      - name: In-process verifier accepts actual offline Cosign bundles
        env:
          COSIGN_BIN: cosign
        run: go test -count=1 ./internal/releasetrust -run '^TestCosignLegacyBundleInProcessInterop$'
      - name: Readable restore drill signs and verifies with actual offline Cosign
        env:
          HIKYO_TEST_COSIGN: cosign
          HIKYO_REQUIRE_COSIGN_TEST: "1"
        run: go test -count=1 ./internal/app -run '^TestUpgradeCLISignsActualDrill$'
      - name: Canonical release binary fixture
        run: ./scripts/release/prepare-image-root_test.sh
      - name: Release binary workflow fixture
        run: ./scripts/ci/check-release-binary-reuse_test.sh
      - name: DCO fixture
        run: ./scripts/ci/check-dco_test.sh
      - name: Commit signature fixture
        run: ./scripts/ci/check-commit-signatures_test.sh
      - name: Required-jobs fixture
        run: ./scripts/ci/check-required-jobs_test.sh
      - name: API freeze guard fixture
        run: ./scripts/ci/check-api-freeze_test.sh
      - name: Parity registry issue liveness fixture
        run: ./scripts/ci/check-parity-issues_test.sh
      - name: Changed-path classifier fixture
        run: ./scripts/ci/classify-changed-paths_test.sh
      - name: CI job registry and workflow bijection fixture
        run: go test -count=1 ./scripts/ci -run '^(TestCIJobRegistry|TestReleaseFloorBench)'
      - name: Chart check fixture
        run: ./scripts/ci/check-chart_test.sh
      - name: Trusted CI scripts fixture
        run: ./scripts/ci/check-trusted-ci-scripts_test.sh
      - name: CodeQL default-setup fixture
        run: ./scripts/ci/check-codeql-default-setup_test.sh
      - name: Build artifact reuse fixture
        run: ./scripts/ci/check-build-artifact-reuse_test.sh
      - name: Cache policy fixture
        run: ./scripts/ci/check-cache-policy_test.sh
      - name: Verify floor measurement preflight refusals
        run: ./scripts/bench/floor_test.sh
      - name: Fuzz finding classifier fixture
        run: ./scripts/ci/classify-fuzz-findings_test.sh
      - name: Fuzz finding reporter fixture
        run: ./scripts/ci/report-fuzz-finding_test.sh
      - name: Immutable-tag probe fixture
        run: ./scripts/release/probe-tag-move_test.sh
      - name: Release-tag guard fixture
        run: ./scripts/release/check-tag_test.sh
      - name: Nightly release fixture
        run: ./scripts/ci/check-nightly-release_test.sh
      - name: OCI version guard fixture
        run: ./scripts/release/check-oci-unused_test.sh
      - name: Release channel fixture
        run: ./scripts/release/release-channel_test.sh
      - name: Pinned installer fixture
        run: ./scripts/release/render-installer_test.sh

  # Build the release-shaped app once for browser legs plus ui-tagged/no-egress
  # checks. Go/API/client changes select these app checks without selecting the
  # browser matrix. Release snapshot stays parallel because waiting for this
  # native build before its six-target GoReleaser build would lengthen the
  # critical path. This run-scoped artifact is internal build plumbing, not a
  # release.
  app-build:
    needs: changes
    if: >-
      ${{ fromJSON(needs.changes.outputs.plan).web ||
      fromJSON(needs.changes.outputs.plan)['web-go'] }}
    runs-on: ubuntu-latest
    # On the critical path that web / web-go / no-egress all need; cap it so a
    # hung Go build or artifact transfer cannot stall the gate at the default 360.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      - name: Restore app-build Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-web-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: |
            go-web-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Install Corepack and enable pnpm
        run: ./scripts/ci/install-corepack.sh
      # pnpm's content-addressed store, shared by both lockfiles (web and
      # clients/ts). app-build is the SINGLE WRITER: it runs before the browser
      # legs (which `needs` it) and warms the store they restore. A warm store
      # turns every later `pnpm install --frozen-lockfile` from a network fetch
      # into a local hardlink.
      - name: Restore pnpm store
        id: pnpm-store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-v1-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml', 'clients/ts/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-v1-${{ runner.os }}-
      - name: Verify and build the SPA
        run: ./scripts/ci/build-spa.sh --verify
      - name: Build the release-shaped app
        run: |
          mkdir -p ci-artifacts
          go build -tags ui -o ci-artifacts/hikyo-ui ./cmd/hikyo
          go build -o ci-artifacts/oidctest-idp ./internal/oidctest/cmd
      - name: Upload app build for downstream validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # A failed-job rerun reuses successful dependencies from the prior
          # attempt, so consumers must keep using that run's stable name. A
          # full rerun rebuilds first and replaces the run-scoped artifact.
          name: hikyo-app-${{ github.run_id }}
          path: |
            internal/webui/dist/
            ci-artifacts/hikyo-ui
            ci-artifacts/oidctest-idp
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      # Single writer, same rule as the Go and Playwright caches: only a trusted
      # main push publishes the store every later PR run restores.
      - name: Save pnpm store
        if: >-
          success() && steps.pnpm-store.outputs.cache-hit != 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ steps.pnpm-store.outputs.cache-primary-key }}

  # Probe the exact release-shaped binary already built for app validation.
  # Keeping this in the same run removes the standalone workflow's duplicate
  # cold compile while preserving exact-head, read-only pull-request execution.
  no-egress:
    needs: [changes, app-build]
    if: ${{ fromJSON(needs.changes.outputs.plan)['web-go'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download the exact app build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hikyo-app-${{ github.run_id }}
      - name: Prepare the prebuilt app
        run: chmod +x ci-artifacts/hikyo-ui
      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Boot+idle originates zero outbound connections
        env:
          HIKYO_NO_EGRESS_BIN: ${{ github.workspace }}/ci-artifacts/hikyo-ui
        run: ./scripts/ci/no-egress.sh

  release-snapshot:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan)['release-snapshot'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      - name: Restore release-snapshot Go cache
        id: release-snapshot-go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-release-snapshot-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum', '.goreleaser.yaml') }}
          restore-keys: |
            go-release-snapshot-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Install Corepack and enable pnpm
        run: ./scripts/ci/install-corepack.sh
      # Keep this small build parallel with app-build. Serial reuse saves one
      # sub-second Vite build but delays all six GoReleaser targets behind the
      # native browser binary and frontend validation.
      - name: Build the SPA for the release snapshot
        run: ./scripts/ci/build-spa.sh
      - name: GoReleaser configuration and snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish
      - name: Verify every native package payload
        run: go run ./scripts/release/verify-native-packages.go dist "$(jq -r '.version' dist/metadata.json)"
      - name: Prepare canonical image inputs
        run: >-
          ./scripts/release/prepare-image-root.sh
          dist image-root "$(git rev-parse HEAD)" .goreleaser.yaml
      - name: Smoke the exact candidate image
        run: |
          image=hikyo-release-snapshot:${{ github.sha }}
          docker build --build-arg TARGETARCH=amd64 \
            --tag "$image" \
            --file Dockerfile.release .
          image_id=$(docker image inspect --format '{{.Id}}' "$image")
          expected=$(jq -r '.version' dist/metadata.json)
          actual=$(docker run --rm "$image_id" --version)
          if [ "$actual" != "$expected" ]; then
            printf 'candidate image: version mismatch: %s\n' "$actual" >&2
            exit 1
          fi
          ./scripts/release/smoke-image-ui.sh "$image_id"
      # This fixture works on a temporary copy of dist. Keep it before upload:
      # failed archive/version/manifest checks must not leave a download behind.
      - name: Classify complete snapshot manifest
        run: ./scripts/release/snapshot-manifest_test.sh
      - name: Mark the snapshot as unsigned development output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '%s\n' \
            'UNSIGNED DEVELOPMENT SNAPSHOT — NOT AN OFFICIAL HIKYO RELEASE' \
            "Source commit: $GITHUB_SHA" \
            'This artifact has checksums but no release manifest or signature.' \
            'Do not use it for production or the offline release ceremony.' \
            >dist/DEVELOPMENT-SNAPSHOT.txt
      - name: Upload unsigned development snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hikyo-development-${{ github.sha }}
          path: |
            dist/hikyo_*_Darwin_*.tar.gz
            dist/hikyo_*_Linux_*.tar.gz
            dist/hikyo_*_Windows_*.zip
            dist/checksums.txt
            dist/binary-provenance.json
            dist/DEVELOPMENT-SNAPSHOT.txt
          if-no-files-found: error
          retention-days: 14
      - name: Save release-snapshot Go cache
        if: >-
          success() && steps.release-snapshot-go-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.release-snapshot-go-cache.outputs.cache-primary-key }}

  generated:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).generated }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      - name: Restore generated-code Go cache
        id: generated-go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-generated-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-generated-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      - name: Format
        run: test -z "$("$(go env GOROOT)/bin/gofmt" -l .)" || { "$(go env GOROOT)/bin/gofmt" -l .; exit 1; }
      - name: Generated code is fresh
        run: |
          go tool sqlc generate
          go tool oapi-codegen --config api/oapi-codegen.yaml api/openapi.yaml
          go run ./internal/scanning/gen
          git diff --exit-code -- internal/store/sqlitegen internal/store/pggen api/apigen internal/scanning/rules_gen.go
          # git diff misses newly generated untracked files
          test -z "$(git status --porcelain --untracked-files=all -- internal/store/sqlitegen internal/store/pggen api/apigen internal/scanning/rules_gen.go)"
      - name: Operator CRDs and deepcopy are fresh
        run: |
          ./scripts/gen-crds.sh
          git diff --exit-code -- chart/hikyo/crds internal/operator/api
          # git diff misses newly generated untracked files
          test -z "$(git status --porcelain --untracked-files=all -- chart/hikyo/crds internal/operator/api)"
      - name: Save generated-code Go cache
        if: >-
          success() && steps.generated-go-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.generated-go-cache.outputs.cache-primary-key }}

  # Dormant until the first stable release tag exists. After v1.0.0, every
  # OpenAPI revision is checked against that immutable contract baseline.
  freeze-guard:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan)['freeze-guard'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Enforce frozen API surface
        run: ./scripts/ci/check-api-freeze.sh
      # WebUI parity (#490): every `issue:` row in api/parity.yaml must still be
      # open. Public-repo issue reads need only the workflow token; the script
      # fails loud on a denied read rather than guessing.
      - name: Parity registry references only open issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/ci/check-parity-issues.sh

  # The TypeScript half of the contract chain. It is a separate job because it
  # needs a different toolchain, and because a Go-only change must not be able
  # to leave the generated client stale without anyone noticing.
  client:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).client }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_USER: hikyo
          POSTGRES_PASSWORD: hikyo
          POSTGRES_DB: hikyo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hikyo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Install Corepack and enable pnpm
        run: ./scripts/ci/install-corepack.sh
      - name: Install (frozen lockfile)
        working-directory: clients/ts
        run: pnpm install --frozen-lockfile
      - name: Regenerate from the contract
        working-directory: clients/ts
        run: pnpm run generate
      - name: Generated client is fresh
        run: |
          git diff --exit-code -- clients/ts/src/generated
          test -z "$(git status --porcelain --untracked-files=all -- clients/ts/src/generated)"
      - name: Typecheck
        working-directory: clients/ts
        run: pnpm run typecheck
      - name: Contract round-trip fixtures (3.1 profile, Zod half)
        working-directory: clients/ts
        run: pnpm run test

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Frozen generated client against current server, both engines
        env:
          HIKYO_TEST_POSTGRES_DSN: postgres://hikyo:hikyo@127.0.0.1:5432/hikyo_test
        run: ./scripts/ci/check-client-skew.sh

  docs:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).docs }}
    runs-on: ubuntu-latest
    container:
      # Exact Playwright release from docs/site/package.json. Browser and OS
      # dependencies are part of this digest-pinned multi-architecture image.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Typecheck, build, and assert O4-O6 policy content
        env:
          POSTHOG_REQUIRED: true
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
        run: ./scripts/ci/verify-docs.sh

  compose-demo:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan)['compose-demo'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install terminal automation
        run: sudo apt-get update && sudo apt-get install --yes expect
      - name: Require Docker Compose 2.30.0 or newer
        run: |
          version=$(docker compose version --short)
          normalized=${version#v}
          if [ "$(printf '%s\n' 2.30.0 "$normalized" | sort -V | head -n1)" != 2.30.0 ]; then
            echo "Docker Compose $version is below required 2.30.0" >&2
            exit 1
          fi
          echo "Docker Compose $version satisfies the 2.30.0 floor"
      - name: Real Compose delivery round-trip
        run: ./scripts/compose-demo.sh

  # The SPA and its flow suite (#56). The flows run against the GO BINARY
  # app-build already produced, so this job no longer builds anything — it boots
  # instances and drives a browser.
  #
  # PARALLELISED ON TWO AXES: viewport project (desktop / mobile) AND a flow
  # GROUP. The harness holds one administrator per run — a TOTP ledger where a
  # code is single-use per step, a passkey whose signature counter must advance,
  # a shared browser session flows re-mint — so two workers inside one process
  # would race all three (see playwright.config.ts). But each MATRIX LEG is its
  # own runner with its own pair of instances, its own seeded tenant and its own
  # passkey, so splitting the FLOWS across legs races nothing: a leg runs a
  # subset of the specs, positionally (which the teardown's filter path skips its
  # per-run execution-closure check for), and the `web-closure` aggregator below
  # merges every leg's run log and enforces the closure ONCE over the whole set.
  # A flow that only passes at 1280px has not passed, so every group runs on both
  # viewports; `fail-fast: false` keeps the broken viewport named.
  #
  # Adding a flow to e2e/registry.ts REQUIRES adding its spec to one group here —
  # a flow in no group never runs, and the aggregator fails the build by name.
  web:
    needs: [changes, app-build]
    if: ${{ fromJSON(needs.changes.outputs.plan).web }}
    runs-on: ubuntu-latest
    container:
      # Exact @playwright/test release from web/package.json. Browser and OS
      # dependencies are part of this digest-pinned multi-architecture image.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    # A leg runs ~4 flows serially (~3–4 min); the cap is headroom over that, not
    # the runner default of 360. A browser/MFA-ceremony hang here would otherwise
    # stall web-closure and the whole gate for up to 8×360 runner-minutes.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
        group: [1, 2, 3, 4]
        # Weight-balanced by test count + MFA-ceremony cost. Every flow in
        # e2e/registry.ts appears in exactly one group; the aggregator proves it.
        include:
          - group: 1
            specs: e2e/flows/reveal.spec.ts e2e/flows/members.spec.ts e2e/flows/login.spec.ts e2e/flows/scanning.spec.ts
          - group: 2
            specs: e2e/flows/settings.spec.ts e2e/flows/history.spec.ts e2e/flows/workspace.spec.ts
          - group: 3
            specs: e2e/flows/shell.spec.ts e2e/flows/instance-admin.spec.ts e2e/flows/machine-access.spec.ts e2e/flows/account.spec.ts
          - group: 4
            specs: e2e/flows/matrix.spec.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download the exact app build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hikyo-app-${{ github.run_id }}
      # Actions artifacts intentionally normalize file modes. Restore execute
      # permission before the browser harness starts the downloaded binary.
      - name: Prepare prebuilt browser binaries
        run: chmod +x ci-artifacts/hikyo-ui ci-artifacts/oidctest-idp
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Install Corepack and enable pnpm
        run: ./scripts/ci/install-corepack.sh

      # Restore the store app-build warmed. Restore only: app-build is the
      # writer, so both viewport legs hardlink from it and never race a save.
      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-v1-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml', 'clients/ts/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-v1-${{ runner.os }}-

      # The SPA consumes clients/ts generated sources through aliases, so the
      # generated Zod schemas resolve `zod` from clients/ts's own node_modules
      # — without this install, typecheck and build fail on TS2307.
      - name: Install client package (generated sources' own deps)
        working-directory: clients/ts
        run: pnpm install --frozen-lockfile

      - name: Install (frozen lockfile)
        working-directory: web
        run: pnpm install --frozen-lockfile

      # `playwright test` directly, not `pnpm run e2e`: the script rebuilds the
      # SPA so a developer cannot run the flows against a stale bundle, and
      # app-build already supplied this run's exact bundle and binary.
      # Positional specs, one group per leg. A positional spec filter makes the
      # teardown SKIP its per-run execution-closure check (it is a partial run by
      # design); the `web-closure` job re-checks closure over the merged log.
      - name: Cross-tab session ownership regression
        if: matrix.project == 'desktop' && matrix.group == 1
        working-directory: web
        run: pnpm exec playwright test --config e2e/session-epoch.config.ts

      - name: Flow suite (${{ matrix.project }} group ${{ matrix.group }})
        working-directory: web
        env:
          HIKYO_E2E_BINARY: ${{ github.workspace }}/ci-artifacts/hikyo-ui
          HIKYO_E2E_OIDC_BINARY: ${{ github.workspace }}/ci-artifacts/oidctest-idp
        run: pnpm exec playwright test --project=${{ matrix.project }} ${{ matrix.specs }}

      # Each leg's pinned-assertion run log, for the aggregator to merge. Named
      # per (project, group) so the eight logs never collide on download.
      - name: Upload flow run log
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flow-log-${{ matrix.project }}-${{ matrix.group }}
          path: web/e2e/.runs/pinned.log
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces-${{ matrix.project }}-${{ matrix.group }}
          path: web/test-results/
          retention-days: 7
  # Flow-registry EXECUTION closure, enforced once over every leg. Splitting the
  # flows across legs means no single leg runs them all, so the per-leg teardown
  # check is skipped (positional-spec filter); this job restores its force. It
  # merges the eight legs' run logs and asserts every flow×surface×theme claim ran
  # for BOTH viewports. `needs: web` so it runs only when all legs passed — a
  # failed leg already fails the gate, and a partial log here would be a false
  # negative. No pnpm install: the checker imports only registry.ts and the pure
  # surface list, so Node's native type stripping runs it with zero deps.
  web-closure:
    needs: [changes, web]
    if: ${{ fromJSON(needs.changes.outputs.plan).web }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Download every leg's flow run log
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: flow-log-*
          path: flow-logs
      # Each artifact lands in its own flow-logs/<name>/ dir, so pinned.log names
      # never collide; concatenation order does not matter to the checker.
      - name: Merge run logs
        run: cat flow-logs/flow-log-*/pinned.log > "$GITHUB_WORKSPACE/merged-pinned.log"
      - name: Enforce flow-registry closure over the merged log
        working-directory: web
        run: node e2e/check-closure.ts "$GITHUB_WORKSPACE/merged-pinned.log"

  # The ui-tagged Go coverage the browser suite used to carry inline: the
  # release-shaped binary's govulncheck pass and the ui-tagged server/webui
  # tests. Split into its own job so it runs CONCURRENTLY with the two browser
  # legs instead of serially inside each of them — both legs paid it before, and
  # neither is browser work. Keep it on its own `web-go` plan so Go/API/client
  # changes still validate the release-shaped app while skipping browser legs;
  # web changes select both plans.
  web-go:
    needs: [changes, app-build]
    if: ${{ fromJSON(needs.changes.outputs.plan)['web-go'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download the exact app build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hikyo-app-${{ github.run_id }}
      - name: Prepare the prebuilt app
        run: chmod +x ci-artifacts/hikyo-ui
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      - name: Restore web Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-web-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: |
            go-web-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      # The release ships the `ui`-tagged binary, so the shipped shape gets its
      # own govulncheck pass here; `test` scans the untagged build that every
      # Go-only change exercises. The binary is app-build's exact artifact.
      - name: govulncheck (vulnerabilities reachable from the release-shaped binary)
        run: ./scripts/ci/run-go-tool.sh govulncheck -mode=binary ci-artifacts/hikyo-ui
      - name: Go tests (transport, serving rules, browser session)
        # Restored GOCACHE may contain passing test results. Compile from cache,
        # but always execute against a fresh build.
        # `./api` rides here too: its parity registry tests read web/src, so a
        # web-only change that drops an operation import must fail on this
        # plan, not on the next Go change.
        run: go test -count=1 -tags ui ./api/... ./internal/server/... ./internal/webui/...

  # Fast package/build checks stay together; the historically dominant
  # internal/isolation package runs on three independent PostgreSQL runners.
  test_core:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).test }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_USER: hikyo
          POSTGRES_PASSWORD: hikyo
          POSTGRES_DB: hikyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hikyo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # exact toolchain pinned by go.mod's toolchain directive
          cache: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned Corepack
        run: ./scripts/ci/install-corepack.sh
      - name: Install locked MCP conformance tools
        working-directory: scripts/mcp-conformance
        run: pnpm install --frozen-lockfile
      - name: Restore shared Go module cache
        id: go-module-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      - name: Restore test Go cache
        id: test-go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: |
            go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-

      - name: Populate shared Go module cache
        run: |
          go mod download
          tool_module_dir="$RUNNER_TEMP/go-tool-modules"
          mkdir -p "$tool_module_dir"
          cd "$tool_module_dir"
          go mod init ci-tools
          while IFS= read -r module; do
            go mod edit -require="$module"
          done < "$GITHUB_WORKSPACE/scripts/ci/go-tool-modules.txt"
          go mod download all

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Binary mode scans the artifact that ships: what the linker kept is what
      # can be reached, and it finishes in seconds where source mode over the
      # ~1000-package import graph takes minutes and gigabytes. Standard-library
      # findings gate the toolchain pin in go.mod; module findings gate go.sum.
      - name: govulncheck (vulnerabilities reachable from the shipped binary)
        run: |
          go build -o "$RUNNER_TEMP/hikyo" ./cmd/hikyo
          ./scripts/ci/run-go-tool.sh govulncheck -mode=binary "$RUNNER_TEMP/hikyo"

      - name: Test all packages except the sharded isolation suite
        env:
          HIKYO_TEST_POSTGRES_DSN: postgres://hikyo:hikyo@127.0.0.1:5432/hikyo_test
        # Compile from restored GOCACHE, but never replay results: PostgreSQL
        # conformance must exercise this run's fresh service container.
        run: |
          ./scripts/ci/test-core-packages_test.sh
          ./scripts/ci/test-core-packages.sh
      - name: MCP 2026-07-28 upstream conformance
        run: ./scripts/ci/check-mcp-conformance.sh
      - name: Verify dynamic-secret target port discovery refusals
        run: ./scripts/ci/start-dynamic-pg_test.sh
      - name: Start TLS PostgreSQL dynamic-secret target
        run: ./scripts/ci/start-dynamic-pg.sh
      - name: Prove dynamic-secret PostgreSQL lifecycle over verified TLS
        run: go test -count=1 -v ./internal/dynamic/postgres
      - name: Verify analysis shard planner fixtures
        run: ./scripts/ci/analysis-shards_test.sh
      - name: Verify operations floor preflight refusals
        run: ./scripts/ci/ops-floor_test.sh
      # The secret-scanning benchmark regression guard (#74, SS1). Relative, not
      # absolute-ms — CI runners are not the Pi-class calibration floor, so this
      # only proves BenchmarkScan compiles and runs to completion; the absolute
      # p99/boot envelope is asserted by the committed Pi artifact under `go test`.
      - name: Secret-scanning benchmark runs (relative regression guard)
        run: go test ./internal/scanning/ -run '^$' -bench BenchmarkScan -benchtime 3x
      - name: Save test Go cache
        if: >-
          success() && steps.test-go-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.test-go-cache.outputs.cache-primary-key }}
      # One trusted writer avoids the setup-go race where the first, smallest
      # job permanently won the shared module key for this dependency graph.
      - name: Save shared Go module cache
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.go-module-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.go-module-cache.outputs.cache-primary-key }}

  # The operator's kind end-to-end suite (#64, mvp-boundary M3): the Hikyo
  # server runs in-process over TLS, the operator reconciler in-process against a
  # real kind API server, and the CRDs are applied from chart/hikyo/crds. The
  # runner script (scripts/ci/k8s-e2e.sh) owns the cluster lifecycle — it creates
  # a fresh `hikyo-e2e` cluster and deletes it in a trap.
  k8s-e2e:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan)['k8s-e2e'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      - name: Restore k8s-e2e Go cache
        id: k8s-e2e-go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-k8s-e2e-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-k8s-e2e-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      # A pinned, checksummed binary download (the shellcheck pattern above):
      # the repository's Actions allowlist is deliberately narrow, and kind is
      # a single static binary — no third-party action needed.
      - name: Install kind (pinned archive)
        env:
          KIND_VERSION: v0.32.0
          KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
        run: |
          binary="$RUNNER_TEMP/kind"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --retry 4 --retry-delay 2 --retry-all-errors \
            "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64" \
            --output "$binary"
          printf '%s  %s\n' "$KIND_SHA256" "$binary" | sha256sum --check --strict
          chmod +x "$binary"
          mv "$binary" /usr/local/bin/kind
          kind version
      - name: Operator kind e2e
        run: ./scripts/ci/k8s-e2e.sh
      - name: Save k8s-e2e Go cache
        if: >-
          success() && steps.k8s-e2e-go-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.k8s-e2e-go-cache.outputs.cache-primary-key }}

  # The workflow graph is trusted base-branch code, but every validation job
  # checks out the untrusted PR head. Build every shard plan once from a copy of
  # the planner at BASE_SHA so a PR cannot omit its own package, fuzz target, or
  # top-level isolation test.
  analysis_shards:
    needs: changes
    if: >-
      ${{ fromJSON(needs.changes.outputs.plan).test ||
      fromJSON(needs.changes.outputs.plan).race ||
      fromJSON(needs.changes.outputs.plan).fuzz }}
    runs-on: ubuntu-latest
    outputs:
      fuzz_plan: ${{ steps.plan.outputs.fuzz_plan }}
      isolation_plan: ${{ steps.plan.outputs.isolation_plan }}
      race_plan: ${{ steps.plan.outputs.race_plan }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Plan complete test, race, and fuzz shards
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          trusted_planner="$RUNNER_TEMP/analysis-shards.go"
          if [ "$EVENT_NAME" = push ]; then
            cp ./scripts/ci/analysis-shards-go/main.go "$trusted_planner"
          else
            git show "$BASE_SHA:scripts/ci/analysis-shards-go/main.go" >"$trusted_planner"
          fi

          race_plan='[]'
          fuzz_plan='[]'
          isolation_plan='[]'
          shard_count=3
          shard=0
          while [ "$shard" -lt "$shard_count" ]; do
            race_shard=$(go run "$trusted_planner" race --root . \
              --shard "$shard" --shards "$shard_count" | jq -Rsc 'split("\n") | map(select(length > 0))')
            fuzz_shard=$(go run "$trusted_planner" fuzz --root . \
              --shard "$shard" --shards "$shard_count" | jq -Rsc 'split("\n") | map(select(length > 0))')
            isolation_shard=$(go run "$trusted_planner" isolation --root . \
              --shard "$shard" --shards "$shard_count" | jq -Rsc 'split("\n") | map(select(length > 0))')
            race_plan=$(jq -cn --argjson plan "$race_plan" --argjson shard "$race_shard" \
              '$plan + [$shard]')
            fuzz_plan=$(jq -cn --argjson plan "$fuzz_plan" --argjson shard "$fuzz_shard" \
              '$plan + [$shard]')
            isolation_plan=$(jq -cn --argjson plan "$isolation_plan" --argjson shard "$isolation_shard" \
              '$plan + [$shard]')
            shard=$((shard + 1))
          done

          if [ "$(printf '%s' "$race_plan" | jq 'flatten | length')" -eq 0 ] ||
            [ "$(printf '%s' "$fuzz_plan" | jq 'flatten | length')" -eq 0 ] ||
            [ "$(printf '%s' "$isolation_plan" | jq 'flatten | length')" -eq 0 ]; then
            echo 'analysis shards: test, race, or fuzz plan was empty' >&2
            exit 1
          fi
          {
            echo "race_plan=$race_plan"
            echo "fuzz_plan=$fuzz_plan"
            echo "isolation_plan=$isolation_plan"
            echo "shards=$(printf '%s' "$race_plan" | jq -c 'keys')"
          } >>"$GITHUB_OUTPUT"

  isolation_shard:
    name: isolation shard (${{ matrix.shard }})
    needs:
      - analysis_shards
      - changes
    if: ${{ fromJSON(needs.changes.outputs.plan).test }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.analysis_shards.outputs.shards) }}
    services:
      postgres:
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_USER: hikyo
          POSTGRES_PASSWORD: hikyo
          POSTGRES_DB: hikyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hikyo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      - name: Restore test Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: |
            go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      - name: Test assigned isolation cases on SQLite and PostgreSQL
        env:
          HIKYO_TEST_POSTGRES_DSN: postgres://hikyo:hikyo@127.0.0.1:5432/hikyo_test
          ISOLATION_PLAN: ${{ needs.analysis_shards.outputs.isolation_plan }}
          ISOLATION_SHARD: ${{ matrix.shard }}
        run: |
          tests=$(printf '%s\n' "$ISOLATION_PLAN" |
            jq -r --argjson shard "$ISOLATION_SHARD" '.[$shard] | join("|")')
          if [ -z "$tests" ]; then
            echo "isolation: shard $ISOLATION_SHARD has no tests" >&2
            exit 1
          fi
          go test -count=1 ./internal/isolation/ -run "^(${tests})$"

  test:
    needs:
      - changes
      - isolation_shard
      - test_core
    if: ${{ always() && !cancelled() && fromJSON(needs.changes.outputs.plan).test }}
    runs-on: ubuntu-latest
    steps:
      - name: Require core checks and every isolation shard
        env:
          ISOLATION_SHARD_RESULT: ${{ needs.isolation_shard.result }}
          TEST_CORE_RESULT: ${{ needs.test_core.result }}
        run: |
          test "$TEST_CORE_RESULT" = success
          test "$ISOLATION_SHARD_RESULT" = success

  # Race detector as its own context: a concurrent server with transaction
  # retry and a single-writer SQLite pool gets its data races found here, not
  # in production. The probe-based isolation E2E suite exceeds the per-package
  # timeout under the detector, so its race-instrumented run lives in the
  # scheduled race-isolation workflow instead of on the PR wall-clock.
  race_shard:
    name: race shard (${{ matrix.shard }})
    needs:
      - analysis_shards
      - changes
    if: ${{ fromJSON(needs.changes.outputs.plan).race }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.analysis_shards.outputs.shards) }}
    services:
      postgres:
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_USER: hikyo
          POSTGRES_PASSWORD: hikyo
          POSTGRES_DB: hikyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hikyo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      - name: Restore race Go cache
        id: race-go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-race-v2-shard-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-race-v2-shard-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      - name: Race detector (all packages except the isolation suite)
        env:
          HIKYO_TEST_POSTGRES_DSN: postgres://hikyo:hikyo@127.0.0.1:5432/hikyo_test
          RACE_PLAN: ${{ needs.analysis_shards.outputs.race_plan }}
          RACE_SHARD: ${{ matrix.shard }}
        run: |
          packages="$RUNNER_TEMP/race-packages"
          printf '%s\n' "$RACE_PLAN" |
            jq -r --argjson shard "$RACE_SHARD" '.[$shard][]' >"$packages"
          if [ ! -s "$packages" ]; then
            echo "race: shard $RACE_SHARD has no packages" >&2
            exit 1
          fi
          # Authenticated boot fixtures repeat real, durable migrations. The
          # 10-minute Go default limits the whole package, not each test.
          # Bound package contention and cumulative race runtime separately.
          xargs go test -race -p 2 -timeout=20m -vet=off -count=1 <"$packages"
      - name: Save race Go cache (main push only)
        if: >-
          success() && steps.race-go-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.race-go-cache.outputs.cache-primary-key }}

  race:
    needs:
      - changes
      - race_shard
    if: ${{ always() && !cancelled() && fromJSON(needs.changes.outputs.plan).race }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every race shard
        env:
          RACE_SHARD_RESULT: ${{ needs.race_shard.result }}
        run: test "$RACE_SHARD_RESULT" = success

  # Seed corpora already run in `test`; this bounded exploration pass discovers
  # targets dynamically so a new fuzz target cannot be forgotten.
  fuzz_shard:
    name: fuzz shard (${{ matrix.shard }})
    needs:
      - analysis_shards
      - changes
    if: ${{ fromJSON(needs.changes.outputs.plan).fuzz }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.analysis_shards.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      # Unlike compile artifacts, fuzz coverage discoveries are added to
      # GOCACHE over time. Rotate weekly so main can publish those discoveries
      # without returning to one immutable multi-gigabyte cache per run.
      - name: Select weekly fuzz cache generation
        id: fuzz-cache-generation
        run: echo "value=$(date -u +%G-W%V)" >>"$GITHUB_OUTPUT"
      - name: Restore fuzz Go cache
        id: fuzz-go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-fuzz-v2-shard-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ steps.fuzz-cache-generation.outputs.value }}
          restore-keys: |
            go-fuzz-v2-shard-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-fuzz-v2-shard-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      - name: Fuzz every target for bounded work
        env:
          FUZZ_PLAN: ${{ needs.analysis_shards.outputs.fuzz_plan }}
          FUZZ_SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          failed=0
          ran=0
          targets="$RUNNER_TEMP/fuzz-targets"
          printf '%s\n' "$FUZZ_PLAN" |
            jq -r --argjson shard "$FUZZ_SHARD" '.[$shard][]' >"$targets"
          while IFS=$'\t' read -r pkg target; do
            if [ -z "$pkg" ] || [ -z "$target" ]; then
              continue
            fi
            echo "::group::$pkg $target"
            # An iteration budget avoids Go's wall-clock fuzz cutoff racing an
            # otherwise healthy worker shutdown under hosted-runner load.
            if ! go test -run='^$' -fuzz="^${target}\$" -fuzztime=100000x -timeout=2m "$pkg"; then
              failed=1
            fi
            echo "::endgroup::"
            ran=$((ran + 1))
          done <"$targets"
          if [ "$ran" -eq 0 ]; then
            echo "fuzz: shard $FUZZ_SHARD has no target — the pass cannot be vacuous" >&2
            exit 1
          fi
          echo "fuzz: shard $FUZZ_SHARD ran $ran targets"
          exit "$failed"
      # Go writes a newly discovered failing input into the package's
      # testdata/fuzz tree. Preserve only regular, bounded, hash-named corpus
      # files; PR code remains unable to access an issue-write token.
      - name: Collect minimized fuzz reproducers
        id: fuzz-reproducers
        if: failure()
        run: |
          artifact_root="$RUNNER_TEMP/fuzz-reproducers"
          mkdir -p "$artifact_root"
          found=false
          count=0
          while IFS= read -r -d '' source_path; do
            path=${source_path#./}
            # Existing committed seeds are already reproducible from checkout;
            # only Go's newly written failure files belong in this artifact.
            if git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              continue
            fi
            if [[ ! "$path" =~ ^([A-Za-z0-9_][A-Za-z0-9._-]*/)*testdata/fuzz/Fuzz[A-Za-z0-9_]+/[0-9a-f]{64}$ ]]; then
              echo "fuzz: refusing unexpected reproducer path: $path" >&2
              continue
            fi
            if [ ! -f "$path" ] || [ -L "$path" ]; then
              echo "fuzz: refusing non-regular reproducer: $path" >&2
              continue
            fi
            size=$(stat --format=%s "$path")
            if [ "$size" -gt 2097152 ]; then
              echo "fuzz: refusing reproducer larger than 2 MiB: $path" >&2
              continue
            fi
            count=$((count + 1))
            if [ "$count" -gt 100 ]; then
              echo "fuzz: refusing more than 100 reproducers" >&2
              exit 1
            fi
            destination="$artifact_root/$path"
            mkdir -p "$(dirname "$destination")"
            cp -- "$path" "$destination"
            found=true
          done < <(find . -type f -path '*/testdata/fuzz/Fuzz*/*' -print0)
          echo "found=$found" >>"$GITHUB_OUTPUT"
      - name: Upload shard fuzz reproducers
        if: failure() && steps.fuzz-reproducers.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-reproducers-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/fuzz-reproducers/
          if-no-files-found: error
          retention-days: 30
      - name: Save fuzz Go cache (main push only)
        if: >-
          success() && steps.fuzz-go-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.fuzz-go-cache.outputs.cache-primary-key }}

  # Preserve the reporter's single canonical artifact contract while allowing
  # all shard failures to finish and contribute minimized reproducers.
  fuzz:
    needs:
      - changes
      - fuzz_shard
    if: ${{ always() && !cancelled() && fromJSON(needs.changes.outputs.plan).fuzz }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download shard fuzz reproducers
        if: ${{ needs.fuzz_shard.result != 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fuzz-reproducers-${{ github.run_id }}-${{ github.run_attempt }}-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/fuzz-shard-artifacts
      - name: Find merged fuzz reproducers
        id: merged-reproducers
        if: ${{ needs.fuzz_shard.result != 'success' }}
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/fuzz-shard-artifacts
        run: |
          found=false
          if [ -d "$ARTIFACT_ROOT" ] &&
            find "$ARTIFACT_ROOT" -type f -print -quit | grep -q .; then
            found=true
          fi
          echo "found=$found" >>"$GITHUB_OUTPUT"
      - name: Upload minimized fuzz reproducers
        if: ${{ steps.merged-reproducers.outputs.found == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-reproducers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fuzz-shard-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Require every fuzz shard
        env:
          FUZZ_SHARD_RESULT: ${{ needs.fuzz_shard.result }}
        run: test "$FUZZ_SHARD_RESULT" = success

  # Fuzz findings are reported out-of-band by fuzz-report.yml (workflow_run), so
  # no job here requests issue/PR write. That keeps this reusable workflow's
  # permission surface read-only (contents/actions), which is all its caller
  # (trusted-ci) grants — a write request here would startup-fail every PR's
  # trusted-ci run.

  # The headline guarantee, as its own named context (#76, mvp-boundary K3):
  # a stolen database and a stolen backup, without the root key, yield no
  # values and no replayable credentials. It runs the backup drill on both
  # engines, which is where the planted-plaintext scan of the dump AND of the
  # age artifact lives, together with the replay of every credential artifact
  # an attacker can lift out of the dump.
  #
  # It is a separate job rather than a step inside `test` so the guarantee has
  # a context of its own: a green `test` that skipped these because someone
  # narrowed a -run pattern would still look green, and this is the one row
  # the project's positioning rests on.
  headline-guarantee:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan)['headline-guarantee'] }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_USER: hikyo
          POSTGRES_PASSWORD: hikyo
          POSTGRES_DB: hikyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hikyo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Select runner cache ABI
        id: runner-cache-abi
        run: ./scripts/ci/export-runner-cache-abi.sh
      - name: Restore test Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/ci/go-tool-modules.txt') }}
          restore-keys: |
            go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      - name: Container round-trip, stanza exclusivity and truncation refusal
        run: go test -count=1 ./internal/crypto/backup/
      - name: Planted-plaintext scan of dump and backup, and credential replay refusal
        env:
          HIKYO_TEST_POSTGRES_DSN: postgres://hikyo:hikyo@127.0.0.1:5432/hikyo_test
        run: >-
          go test -count=1 -v ./internal/isolation/
          -run 'TestBackupRestoreDrill|TestNoBulkAcceptInTheAPISurface'
      - name: Automatic pre-migration export, with recipients and without
        run: go test -count=1 ./internal/app/ -run '^(TestMigrationRefusesUnverifiedExistingSchemaBeforeWrites|TestVerifiedMigrateSkipsBackupOnHealthyRestart|TestRestoreRequiredRestartExposesOnlyOperationalHealth)$'

  floor-bench:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan)['floor-bench'] }}
    uses: ./.github/workflows/floor-bench.yml
    permissions:
      contents: read

  # The permanent required context. Every validation job is named here so a
  # future job split cannot accidentally weaken branch protection.
  ci-required:
    # Keep failure aggregation, but do not queue an obsolete aggregate job for
    # a workflow GitHub already cancelled in favor of a newer PR head.
    if: always() && !cancelled()
    needs:
      - changes
      - client
      - compose-demo
      - dco
      - docs
      - floor-bench
      - freeze-guard
      - fuzz
      - generated
      - headline-guarantee
      - k8s-e2e
      - lint
      - no-egress
      - race
      - release-snapshot
      - supply-chain-checks
      - test
      - web
      - web-closure
      - web-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every validation job
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          PLAN_JSON: ${{ needs.changes.outputs.plan }}
        run: |
          trusted_checker="$RUNNER_TEMP/check-required-jobs.sh"
          trusted_registry="$RUNNER_TEMP/ci-job-registry.json"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            cp ./scripts/ci/check-required-jobs.sh "$trusted_checker"
            cp ./scripts/ci/ci-job-registry.json "$trusted_registry"
          else
            git show "$BASE_SHA:scripts/ci/check-required-jobs.sh" >"$trusted_checker"
            git show "$BASE_SHA:scripts/ci/ci-job-registry.json" >"$trusted_registry"
          fi
          chmod +x "$trusted_checker"

          if ! CI_JOB_REGISTRY="$trusted_registry" "$trusted_checker" --supports-plan-v2; then
            echo "trusted required-job checker does not support CI plan v2" >&2
            exit 1
          fi
          CI_JOB_REGISTRY="$trusted_registry" "$trusted_checker" "$GITHUB_EVENT_NAME" "$NEEDS_JSON" "$PLAN_JSON"
