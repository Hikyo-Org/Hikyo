# Per-commit feedback is separate from the mandatory full merge-queue gate.
# The four-minute runner deadline includes setup; queue time is measured
# separately and is not guaranteed by GitHub's shared hosted runner pool.
# Exception (2026-11-26, #1587): the supply-chain fixtures run for minutes, not
# seconds (runtime pending measurement from this workflow's own hosted run), so
# they run as their own job beside the lanes, only when the PR changes one of
# their inputs. The gate requires that job and its selection job by name
# (scripts/ci/pr-gate) and recomputes the selection itself.
name: ci-feedback

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  # The newest useful head/base revision supersedes this PR's older work.
  # A skipped metadata edit must not cancel a running verdict or evict a queued
  # one. Unique per-run groups isolate these events before the job-level guard.
  # Empty-string comparison also preserves legitimate numeric branch names;
  # GitHub's loose equality would consider the previous ref "0" equal to null.
  group: ci-feedback-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && github.event.changes.base.ref.from == '' && github.run_id || 'admitted' }}
  cancel-in-progress: true

jobs:
  feedback:
    name: ${{ github.event.action == 'edited' && github.event.changes.base.ref.from == '' && 'metadata (ignored)' || 'feedback' }} (${{ matrix.lane }})
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != ''
    runs-on: ubuntu-latest
    timeout-minutes: 4
    # All three complete lanes are required for a successful workflow conclusion.
    # Application and tooling compilation have independent runner budgets;
    # neither can starve frontend workers or consume the other's link budget.
    strategy:
      fail-fast: false
      matrix:
        lane: [go, tooling, frontend]
    defaults:
      run:
        working-directory: source
    env:
      FAST_FEEDBACK_TOOLS_DIR: ${{ github.workspace }}/feedback-tools/scripts/ci
      GOFLAGS: '-gcflags=all=-dwarf=false'
      GOCACHE: ${{ github.workspace }}/.ci-cache/go-feedback-compact
      FAST_FEEDBACK_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Start the cumulative feedback budget
        working-directory: ${{ github.workspace }}
        run: echo "FAST_FEEDBACK_DEADLINE=$(($(date +%s) + 220))" >> "$GITHUB_ENV"
      - name: Check out immutable feedback tooling without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          path: feedback-tools
          fetch-depth: 2
          persist-credentials: false
      - name: Check budget before source checkout
        working-directory: ${{ github.workspace }}
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" --reserve 60
      - name: Check out the exact commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          # The planner needs history for its merge base, not every old blob. A full fetch takes up to this step's limit.
          filter: blob:none
          persist-credentials: false
      - name: Select fast feedback domains
        id: plan
        env:
          PROMOTION: ${{ github.event.pull_request.head.repo.full_name == github.repository && ((github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/')) || (github.event.pull_request.base.ref == 'dev' && github.event.pull_request.head.ref == 'main')) }}
        run: |
          base=$(git -C ../feedback-tools rev-parse HEAD^1)
          test "$(git -C ../feedback-tools rev-parse HEAD^2)" = "$FAST_FEEDBACK_HEAD"
          # A promotion or backmerge diff cannot fit this budget. The queue runs
          # the full graph on one, and the other already passed it on main. An
          # empty range selects nothing.
          if [ "$PROMOTION" = true ]; then base=$FAST_FEEDBACK_HEAD; fi
          export FAST_FEEDBACK_BASE="$base"
          echo "FAST_FEEDBACK_BASE=$base" >> "$GITHUB_ENV"
          plan=$(bash "$FAST_FEEDBACK_TOOLS_DIR/fast-feedback.sh" --plan)
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
      - name: Check budget before runtime setup
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.go
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" --reserve 60
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 1
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.go
        with:
          go-version-file: feedback-tools/go.mod
          cache: false
      # Dedicated, size-bounded compiler entries are seeded from trusted main.
      # Never fall back to the multi-gigabyte full-test archive. Go still checks
      # toolchain, source and dependency identities for every selected package.
      - name: Select Go build cache runner ABI
        id: runner-cache-abi
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.go
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" "$FAST_FEEDBACK_TOOLS_DIR/export-runner-cache-abi.sh"
      - name: Check budget before Go build cache restore
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.go
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" --reserve 60
      - name: Restore bounded feedback Go cache
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.go
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 1
        with:
          path: .ci-cache/go-feedback-compact
          key: go-feedback-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('feedback-tools/go.mod', 'feedback-tools/go.sum', 'feedback-tools/scripts/ci/go-tool-modules.txt') }}-${{ env.FAST_FEEDBACK_BASE }}
          restore-keys: go-feedback-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      - name: Check budget before runtime setup
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.node
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" --reserve 60
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 1
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.node
        with:
          node-version-file: source/.nvmrc
      - name: Install pinned Corepack
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.pnpm
        run: |
          bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" "$FAST_FEEDBACK_TOOLS_DIR/install-corepack.sh"
      - name: Select explicit pnpm cache path and ABI
        id: pnpm-cache
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.pnpm
        run: |
          bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" "$FAST_FEEDBACK_TOOLS_DIR/export-pnpm-cache.sh"
      - name: Check budget before cache restore
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.pnpm
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" --reserve 60
      - name: Restore frontend dependencies
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.pnpm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 1
        with:
          path: .ci-cache/pnpm/store
          key: pnpm-store-v2-host-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-cache.outputs.abi }}-${{ hashFiles('source/.nvmrc', 'source/web/package.json', 'source/web/pnpm-lock.yaml', 'source/web/pnpm-workspace.yaml', 'source/clients/ts/package.json', 'source/clients/ts/pnpm-lock.yaml', 'source/clients/ts/pnpm-workspace.yaml') }}
          restore-keys: pnpm-store-v2-host-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-cache.outputs.abi }}-
      - name: Install locked client dependencies
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.clientDependencies
        working-directory: source/clients/ts
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" pnpm install --frozen-lockfile
      - name: Install locked web dependencies
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.webDependencies
        working-directory: source/web
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" pnpm install --frozen-lockfile
      - name: Check budget before ShellCheck restore
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.shellcheck
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" --reserve 60
      - name: Restore pinned ShellCheck
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.shellcheck
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 1
        with:
          path: ~/.cache/hikyo-pinned-tools/shellcheck-linux-x86_64
          key: pinned-tool-v1-${{ runner.os }}-shellcheck-linux-x86_64-${{ hashFiles('feedback-tools/scripts/ci/pinned-tools/shellcheck-linux-x86_64.pin') }}
      - name: Install verified pinned ShellCheck
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.shellcheck
        run: |
          bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" bash -euo pipefail <<'INSTALL_SHELLCHECK'
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          bash "$FAST_FEEDBACK_TOOLS_DIR/fetch-pinned-tool.sh" shellcheck-linux-x86_64 "$archive"
          mkdir "$RUNNER_TEMP/shellcheck"
          tar -xJf "$archive" -C "$RUNNER_TEMP/shellcheck" --strip-components=1
          echo "$RUNNER_TEMP/shellcheck" >> "$GITHUB_PATH"
          INSTALL_SHELLCHECK
      - name: Prepare trusted release contract dependencies
        if: fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].prerequisites.releaseDependencies
        run: |
          bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" --reserve 60
          bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" python3 -m venv "$RUNNER_TEMP/release-admission-checks"
          bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" "$RUNNER_TEMP/release-admission-checks/bin/python" -m pip install -r scripts/ci/release-admission/requirements.txt
          echo "$RUNNER_TEMP/release-admission-checks/bin" >> "$GITHUB_PATH"
      - name: Run fast feedback
        env:
          FEEDBACK_LANE: ${{ fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].lane }}
          FEEDBACK_GO_SCOPE: ${{ fromJSON(steps.plan.outputs.plan).lanes[matrix.lane].goScope }}
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/fast-feedback.sh" --lane="$FEEDBACK_LANE" --go-scope="$FEEDBACK_GO_SCOPE"

  # Whether the fixtures run is decided by the BASE commit's selector and input
  # list (scripts/ci/supply-chain-fixture-inputs.txt) over the PR's diff: an exact
  # fixture input, or a change to the steps of ci.yml's supply-chain-checks job.
  # The PR cannot rewrite the rule that judges it. Scheduling only: scripts/ci/pr-gate
  # recomputes the selection from trusted inputs before accepting a skipped
  # fixtures job. TestSupplyChainInputListCoversEveryInput
  # (scripts/ci/supply_chain_guards_test.go) derives the inputs from the job and
  # fails when the list misses one.
  select-supply-chain:
    name: select supply-chain fixtures
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.select.outputs.run }}
    env:
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the merge commit and its parents without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select the supply-chain fixtures
        id: select
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
          git show HEAD^1:scripts/ci/select-supply-chain-fixtures.sh > "$RUNNER_TEMP/select-supply-chain-fixtures.sh"
          sh "$RUNNER_TEMP/select-supply-chain-fixtures.sh" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

  supply-chain-fixtures:
    name: supply-chain fixtures
    needs: select-supply-chain
    if: (github.event.action != 'edited' || github.event.changes.base.ref.from != '') && needs.select-supply-chain.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The module cache follows the feedback cache policy: restore only, keyed
      # over the immutable feedback-tools checkout like the lanes. No Go build
      # cache is restored. Cosign and Helm are fetched by the replayed steps
      # (checksum-pinned, bounded retry).
      - name: Check out immutable feedback tooling without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          path: feedback-tools
          fetch-depth: 1
          persist-credentials: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        with:
          path: ~/go/pkg/mod
          key: go-mod-v2-${{ runner.os }}-${{ hashFiles('feedback-tools/go.mod', 'feedback-tools/go.sum', 'feedback-tools/scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-mod-v2-${{ runner.os }}-
      - name: Replay the supply-chain-checks job steps
        run: go run ./scripts/ci/run-job-steps .github/workflows/ci.yml supply-chain-checks
