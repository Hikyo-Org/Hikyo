# Per-commit feedback is separate from the mandatory full-candidate merge gate.
# The four-minute runner deadline includes setup; queue time is measured
# separately and is not guaranteed by GitHub's shared hosted runner pool.
name: ci-feedback

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  # A skipped metadata edit must not cancel a running verdict or evict a queued
  # one. Unique per-run groups isolate these events before the job-level guard.
  # Empty-string comparison also preserves legitimate numeric branch names;
  # GitHub's loose equality would consider the previous ref "0" equal to null.
  group: ci-feedback-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.base.sha }}-${{ github.event.action == 'edited' && github.event.changes.base.ref.from == '' && github.run_id || 'admitted' }}
  cancel-in-progress: true

jobs:
  feedback:
    name: ${{ github.event.action == 'edited' && github.event.changes.base.ref.from == '' && 'metadata (ignored)' || 'feedback' }} (${{ matrix.lane }})
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != ''
    runs-on: ubuntu-latest
    timeout-minutes: 4
    # Both complete lanes are required for a successful workflow conclusion.
    # Separate runners avoid cold Go compilation starving frontend workers.
    strategy:
      fail-fast: false
      matrix:
        lane: [go, frontend]
    defaults:
      run:
        working-directory: source
    env:
      FAST_FEEDBACK_TOOLS_DIR: ${{ github.workspace }}/feedback-tools/scripts/ci
      FAST_FEEDBACK_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Start the cumulative feedback budget
        working-directory: ${{ github.workspace }}
        run: echo "FAST_FEEDBACK_DEADLINE=$(($(date +%s) + 220))" >> "$GITHUB_ENV"
      - name: Check out immutable feedback tooling without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          path: feedback-tools
          fetch-depth: 2
          persist-credentials: false
      - name: Check budget before source checkout
        working-directory: ${{ github.workspace }}
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" --reserve 60
      - name: Check out the exact commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Select fast feedback domains
        id: plan
        run: |
          base=$(git -C ../feedback-tools rev-parse HEAD^1)
          test "$(git -C ../feedback-tools rev-parse HEAD^2)" = "$FAST_FEEDBACK_HEAD"
          export FAST_FEEDBACK_BASE="$base"
          echo "FAST_FEEDBACK_BASE=$base" >> "$GITHUB_ENV"
          plan=$(bash "$FAST_FEEDBACK_TOOLS_DIR/fast-feedback.sh" --plan)
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
      - name: Check budget before runtime setup
        if: matrix.lane == 'go' && (fromJSON(steps.plan.outputs.plan).workflows || fromJSON(steps.plan.outputs.plan).go)
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" --reserve 60
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 1
        if: matrix.lane == 'go' && (fromJSON(steps.plan.outputs.plan).workflows || fromJSON(steps.plan.outputs.plan).go)
        with:
          go-version-file: feedback-tools/go.mod
          cache: false
      # The isolated Go lane exceeded 201 seconds cold in run 38153567123.
      # Restore compiled entries only (43 seconds in run 38150465028); module
      # download announcements span 15 seconds; skip the 22-second module archive.
      # Every selected package is still compiled: Go validates each cached
      # action against its toolchain, sources, flags and dependency identities.
      - name: Select Go build cache runner ABI
        id: runner-cache-abi
        if: matrix.lane == 'go' && (fromJSON(steps.plan.outputs.plan).go || fromJSON(steps.plan.outputs.plan).workflows)
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" "$FAST_FEEDBACK_TOOLS_DIR/export-runner-cache-abi.sh"
      - name: Check budget before Go build cache restore
        if: matrix.lane == 'go' && (fromJSON(steps.plan.outputs.plan).go || fromJSON(steps.plan.outputs.plan).workflows)
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" --reserve 60
      - name: Restore existing Go build cache
        if: matrix.lane == 'go' && (fromJSON(steps.plan.outputs.plan).go || fromJSON(steps.plan.outputs.plan).workflows)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 1
        with:
          path: ~/.cache/go-build
          key: go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-${{ hashFiles('feedback-tools/go.mod', 'feedback-tools/go.sum', 'feedback-tools/scripts/ci/go-tool-modules.txt') }}
          restore-keys: go-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-cache-abi.outputs.value }}-
      - name: Check budget before runtime setup
        if: (matrix.lane == 'frontend' && (fromJSON(steps.plan.outputs.plan).web || fromJSON(steps.plan.outputs.plan).client)) || (matrix.lane == 'go' && fromJSON(steps.plan.outputs.plan).docs)
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" --reserve 60
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        timeout-minutes: 1
        if: (matrix.lane == 'frontend' && (fromJSON(steps.plan.outputs.plan).web || fromJSON(steps.plan.outputs.plan).client)) || (matrix.lane == 'go' && fromJSON(steps.plan.outputs.plan).docs)
        with:
          node-version-file: source/.nvmrc
      - name: Install pinned Corepack
        if: matrix.lane == 'frontend' && (fromJSON(steps.plan.outputs.plan).web || fromJSON(steps.plan.outputs.plan).client)
        run: |
          bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" "$FAST_FEEDBACK_TOOLS_DIR/install-corepack.sh"
      - name: Select explicit pnpm cache path and ABI
        id: pnpm-cache
        if: matrix.lane == 'frontend' && (fromJSON(steps.plan.outputs.plan).web || fromJSON(steps.plan.outputs.plan).client)
        run: |
          bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" "$FAST_FEEDBACK_TOOLS_DIR/export-pnpm-cache.sh"
      - name: Check budget before cache restore
        if: matrix.lane == 'frontend' && (fromJSON(steps.plan.outputs.plan).web || fromJSON(steps.plan.outputs.plan).client)
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" --reserve 60
      - name: Restore frontend dependencies
        if: matrix.lane == 'frontend' && (fromJSON(steps.plan.outputs.plan).web || fromJSON(steps.plan.outputs.plan).client)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 1
        with:
          path: .ci-cache/pnpm/store
          key: pnpm-store-v2-host-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-cache.outputs.abi }}-${{ hashFiles('source/.nvmrc', 'source/web/package.json', 'source/web/pnpm-lock.yaml', 'source/web/pnpm-workspace.yaml', 'source/clients/ts/package.json', 'source/clients/ts/pnpm-lock.yaml', 'source/clients/ts/pnpm-workspace.yaml') }}
          restore-keys: pnpm-store-v2-host-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-cache.outputs.abi }}-
      - name: Install locked client dependencies
        if: matrix.lane == 'frontend' && (fromJSON(steps.plan.outputs.plan).web || fromJSON(steps.plan.outputs.plan).client)
        working-directory: source/clients/ts
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" pnpm install --frozen-lockfile
      - name: Install locked web dependencies
        if: matrix.lane == 'frontend' && fromJSON(steps.plan.outputs.plan).web
        working-directory: source/web
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" pnpm install --frozen-lockfile
      - name: Install verified pinned ShellCheck
        if: matrix.lane == 'go' && fromJSON(steps.plan.outputs.plan).shell
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          bash "$FAST_FEEDBACK_TOOLS_DIR/feedback-budget.sh" bash -euo pipefail <<'INSTALL_SHELLCHECK'
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" --output "$archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
          INSTALL_SHELLCHECK
      - name: Run fast feedback
        run: bash "$FAST_FEEDBACK_TOOLS_DIR/fast-feedback.sh" --lane=${{ matrix.lane }}
