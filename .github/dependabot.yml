version: 2
updates:
  # Compiler patch proposals come from the read-only go-security lane.
  # Dependabot proposes module updates, including indirect networking fixes.
  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    schedule:
      interval: daily
    open-pull-requests-limit: 2
    commit-message:
      prefix: fix(deps)
    groups:
      go-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      go-major:
        patterns:
          - '*'
        update-types:
          - major
    ignore:
      # Moving this generator requires an architecture ADR amendment.
      - dependency-name: github.com/oapi-codegen/oapi-codegen/v2
        versions: ['*']
      # v1.35 suppresses past-sunset removals the API freeze must reject (#1125).
      - dependency-name: github.com/oasdiff/oasdiff
        versions: ['>=1.35.0']
