events {}

http {
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream hikyo_backend {
        zone hikyo_backend 64k;
        server hikyo:8080 resolve;
    }

    server {
        listen 443 ssl;
        server_name hikyo.example.com;
        ssl_certificate /run/secrets/tls-cert;
        ssl_certificate_key /run/secrets/tls-key;

        location = /mcp {
            client_max_body_size 256k;
            proxy_pass http://hikyo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Mcp-Protocol-Version $http_mcp_protocol_version;
            proxy_set_header Mcp-Method $http_mcp_method;
            proxy_set_header Mcp-Name $http_mcp_name;
        }

        location / {
            return 404;
        }
    }
}
