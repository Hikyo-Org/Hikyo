name: hikyo-mcp

services:
  root-key-stage:
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    restart: "no"
    command:
      - sh
      - -ceu
      - install -m 0400 -o 65532 -g 65532 /run/secrets/hikyo-root-key /staged/root-key
    secrets:
      - hikyo-root-key
    volumes:
      - root-key-staged:/staged
    read_only: true
    security_opt:
      - no-new-privileges:true

  proxy:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    restart: unless-stopped
    depends_on:
      hikyo:
        condition: service_started
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    secrets:
      - tls-cert
      - tls-key
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  hikyo:
    image: ${HIKYO_IMAGE:?set a released Hikyo image with an immutable digest}
    restart: unless-stopped
    depends_on:
      root-key-stage:
        condition: service_completed_successfully
    command:
      - server
      - --listen=0.0.0.0:8080
      - --operational-listen=0.0.0.0:8081
      - --root-key-file=/run/hikyo-root-key/root-key
    environment:
      HIKYO_DB: ${HIKYO_DB:?set through the deployment secret store}
      HIKYO_EXTERNAL_ORIGIN: ${HIKYO_EXTERNAL_ORIGIN:?set the canonical HTTPS origin}
      HIKYO_MCP_ENABLED: "true"
      HIKYO_MCP_ALLOWED_ORIGINS: ""
      HIKYO_TRUSTED_PROXY_CIDRS: ${HIKYO_COMPOSE_SUBNET:?set a dedicated Compose network CIDR}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - root-key-staged:/run/hikyo-root-key:ro
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

secrets:
  hikyo-root-key:
    file: ${HIKYO_ROOT_KEY_FILE:?set an owner-only root-key file}
  tls-cert:
    file: ${HIKYO_TLS_CERT_FILE:?set the public TLS certificate file}
  tls-key:
    file: ${HIKYO_TLS_KEY_FILE:?set the owner-only TLS key file}

networks:
  default:
    ipam:
      config:
        - subnet: ${HIKYO_COMPOSE_SUBNET:?set a dedicated Compose network CIDR}

volumes:
  root-key-staged:
