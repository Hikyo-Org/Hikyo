virtualStoreType: global
# pnpm 11 hard-errors (ERR_PNPM_IGNORED_BUILDS) on any transitive install script
# that is not decided here, so every entry below is a deliberate yes/no. This is
# the file `pnpm approve-builds` writes to; it does not touch the lockfile, so
# `--frozen-lockfile` is unaffected.
allowBuilds:
  # core-js arrives via @open-pencil/core -> jspdf -> canvg; its postinstall only
  # prints a funding banner, so there is nothing to build. `false` is the decision,
  # not a placeholder: deleting this line brings ERR_PNPM_IGNORED_BUILDS back and
  # breaks `pnpm install`.
  core-js: false
  # Storybook/Vite pull esbuild transitively and it genuinely needs its install
  # script to fetch the platform binary.
  esbuild: true
# Guard the CI Playwright image pin (v1.62.1-noble). A second playwright-core
# in the graph once moved @axe-core/playwright's peer off the 1.62.1 that
# @playwright/test uses, producing a two-Page-type clash in
# e2e/fixtures/assertions.ts. Nothing pulls a second copy today; the pin keeps
# a future dependency from doing it silently. Bump it with the CI image.
overrides:
  playwright-core: 1.62.1
  # pptxgenjs (via @open-pencil/core) declares image-size ^1 but never loads it:
  # its builds require('sizeof') instead. Every 1.x release carries the
  # ICNS/JXL/HEIF infinite-loop advisories, so the major bump is inert.
  image-size@<2.0.3: 2.0.4
  # GHSA-rmxm-3fg6-px4f has no patched 1.x release. This development MCP
  # consumer uses getRequestListener on pinned Node 26, not the removed Vercel
  # adapter. Keep the compatibility override scoped to its current owner and version:
  # the key names @open-pencil/mcp@0.16.0 (which still declares ^1.19.17), so a
  # bump of that package stops matching it and must be re-scoped here.
  # 2.1.7 also carries the GHSA-jpvv-r467-5p4w fix (patched in 2.1.6).
  '@open-pencil/mcp@0.16.0>@hono/node-server': 2.1.7
  # GHSA-g3hv-75wg-m249 has no patched 10.x release. glob 13 (Storybook docgen)
  # still matches correctly with minimatch 11; drop this once the Storybook
  # docgen plugin no longer pulls glob 13.
  minimatch@>=10 <11.0.1: 11.0.8
