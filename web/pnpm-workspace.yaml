virtualStoreType: global
# pnpm 11 hard-errors (ERR_PNPM_IGNORED_BUILDS) on any transitive install script
# that is not decided here, so every entry below is a deliberate yes/no. This is
# the file `pnpm approve-builds` writes to; it does not touch the lockfile, so
# `--frozen-lockfile` is unaffected.
allowBuilds:
  # core-js arrives via @open-pencil/core -> jspdf -> canvg; its postinstall only
  # prints a funding banner, so there is nothing to build. `false` is the decision,
  # not a placeholder: deleting this line brings ERR_PNPM_IGNORED_BUILDS back and
  # breaks `pnpm install`.
  core-js: false
  # Storybook/Vite pull esbuild transitively and it genuinely needs its install
  # script to fetch the platform binary.
  esbuild: true
# Storybook's @vitest/browser-playwright pulled a second playwright-core (1.63.0)
# into the graph, which flipped @axe-core/playwright's peer off the 1.62.1 that
# @playwright/test and the CI Playwright image (v1.62.1-noble) are pinned to,
# producing a two-Page-type clash in e2e/fixtures/assertions.ts. Pin the whole
# tree to the one version everything else already uses.
overrides:
  playwright-core: 1.62.1
  # @open-pencil/core's `calc` tool (dev-only design CLI/MCP) evaluates caller
  # text with expr-eval, which is unmaintained with no patched release for its
  # code execution and prototype pollution advisories. The fork keeps the same
  # default export ({ Parser, Expression }) and carries the fixes.
  expr-eval: npm:expr-eval-fork@3.0.3
  # pptxgenjs (via @open-pencil/core) declares image-size ^1 but never loads it:
  # its builds require('sizeof') instead. Every 1.x release carries the
  # ICNS/JXL/HEIF infinite-loop advisories, so the major bump is inert.
  image-size@<2.0.3: 2.0.4
# pnpm 11 refuses versions younger than its default minimum release age, and the
# lockfile is re-verified against that policy on every install, so a same-day
# release has to be named here or `pnpm install --frozen-lockfile` fails in CI.
# `pnpm add` writes these entries; they can be dropped once the versions age out.
minimumReleaseAgeExclude:
  - '@open-pencil/cli@0.15.0'
  - '@open-pencil/core@0.15.0'
  - '@open-pencil/dom-css@0.15.0'
  - '@open-pencil/fig@0.15.0'
  - '@open-pencil/kiwi@0.15.0'
  - '@open-pencil/mcp@0.15.0'
  - '@open-pencil/pen@0.15.0'
  - '@open-pencil/scene-graph@0.15.0'
