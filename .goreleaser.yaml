# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.17.1/www/docs/static/schema.json
version: 2

project_name: hikyo

builds:
  - id: hikyo
    main: ./cmd/hikyo
    binary: hikyo
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    flags:
      - -trimpath
      # The `ui` tag embeds internal/webui/dist, which `pnpm --dir web build`
      # must have produced first. Released binaries serve the SPA; a build
      # without the tag would silently ship an API-only server, so the tag is
      # here rather than optional, and the pipelines that invoke GoReleaser
      # (release.yml, ci.yml's snapshot) build the frontend ahead of it.
      - -tags=ui
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X main.version={{ with index .Env "HIKYO_RELEASE_VERSION" }}{{ . }}{{ else }}{{ .Version }}{{ end }}
        -X main.commit={{ with index .Env "HIKYO_RELEASE_COMMIT" }}{{ . }}{{ else }}{{ .Commit }}{{ end }}
        -X main.buildDate={{ .CommitDate }}
        -X main.updateChannel={{ with index .Env "HIKYO_UPDATE_CHANNEL" }}{{ . }}{{ else }}off{{ end }}
        -X main.updateTrustRoot={{ with index .Env "HIKYO_UPDATE_TRUST_ROOT" }}{{ . }}{{ end }}
        -X main.updateRecoveryKey={{ with index .Env "HIKYO_UPDATE_RECOVERY_KEY" }}{{ . }}{{ end }}

archives:
  - id: hikyo-archives
    ids: [hikyo]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE

nfpms:
  - id: hikyo-packages
    ids: [hikyo]
    package_name: hikyo
    # GitHub rewrites '~' in asset names. Keep nFPM's format-native identity,
    # but use '_' in the transport filename so signed manifest names stay exact.
    file_name_template: '{{ replace .ConventionalFileName "~" "_" }}'
    vendor: Hikyo
    homepage: https://hikyo.app/
    maintainer: Marc Went <marc@went.io>
    description: Self-hosted control plane for secrets and configuration.
    license: MPL-2.0
    # nFPM's Arch packager includes prerelease identity in .PKGINFO only when an
    # epoch is present. Epoch zero is ordering-neutral and keeps all formats
    # release-bound, including prereleases.
    epoch: 0
    bindir: /usr/bin
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    contents:
      - src: LICENSE
        dst: /usr/share/doc/hikyo/LICENSE

checksum:
  name_template: checksums.txt
  # The release ceremony intentionally treats this as the exact six bare
  # archives. Native packages are independently hashed and signed through the
  # release manifest, so adding them must not widen this legacy checksum set.
  ids: [hikyo-archives]

snapshot:
  # Do not derive this from the permanent non-release v-ruleset-probe tag.
  version_template: >-
    {{ with index .Env "HIKYO_RELEASE_VERSION" }}{{ . }}
    {{- else }}0.0.0-snapshot-{{ .ShortCommit }}{{ end }}

changelog:
  disable: true

release:
  disable: true
