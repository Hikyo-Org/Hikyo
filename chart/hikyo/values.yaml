replicaCount: 1

image:
  repository: ghcr.io/hikyo-org/hikyo
  # Release packaging replaces this value with the signed image index digest.
  digest: sha256:RELEASE_IMAGE_DIGEST

database:
  # Name of an existing Secret whose HIKYO_DB key contains the production DSN.
  existingSecret: ""

tls:
  # Optional Secret containing tls.crt and tls.key. Configure this or trusted
  # proxy CIDRs. A rootless same-image helper stages and watches an owner-mode
  # 0400 key because Kubernetes Secret volumes are root-owned.
  existingSecret: ""
  reloaderResources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

service:
  port: 8080

network:
  # Required only for proxy mode. Native TLS may leave this empty.
  trustedProxyCIDRs: []

updates:
  # Release notifications only; Hikyo never downloads or installs an update.
  channel: stable

releaseTrust:
  admissionPolicy:
    # Requires Kyverno. The policy verifies the exact Hikyo image repository
    # with the offline primary key packaged into the release chart.
    enabled: false

resources: {}

operator:
  enabled: true
  # Empty watches cluster-wide; otherwise this same list creates namespace RBAC.
  namespaces: []
  triggerRollouts: true
  # Namespace -> ServiceAccount names allowed for TokenRequest creation.
  designatedServiceAccounts: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  replicaCount: 1
  leaderElection: true
