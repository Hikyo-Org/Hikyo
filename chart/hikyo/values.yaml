replicaCount: 1

# Multi-node application-tier high availability (#146). Requires an externally
# highly available PostgreSQL datastore (HIKYO_DB) and the shared root key
# (rootKey.existingSecret) every replica mounts. When enabled the server runs
# ha.replicaCount stateless replicas behind the Service, coordinated through
# PostgreSQL: singleton work runs under a datastore lease, admission counters
# are shared, and because sessions are datastore-backed the Service needs no
# session stickiness. Upgrades require an operator-enforced full stop, one
# verified migrator, then exact-target boot. Rolling replacement is not an
# upgrade procedure. HA is refused on sqlite at boot.
ha:
  enabled: false
  # Number of server replicas when ha.enabled. Ignored otherwise (replicaCount
  # governs the single-node deployment).
  replicaCount: 3
  # minAvailable for the PodDisruptionBudget, so a voluntary disruption (node
  # drain, rolling upgrade) never takes the installation below this many
  # serving replicas.
  minAvailable: 2

# Graceful shutdown budget. The server drains in-flight requests and cuts SSE
# streams within its 5s shutdown; keep this at or above that so the kubelet does
# not SIGKILL mid-drain.
terminationGracePeriodSeconds: 30

image:
  repository: ghcr.io/hikyo-org/hikyo
  # Release packaging replaces this value with the signed image index digest.
  digest: sha256:RELEASE_IMAGE_DIGEST

database:
  # Name of an existing Secret whose HIKYO_DB key contains the production DSN.
  existingSecret: ""
  # Optional CA certificate for a private PostgreSQL endpoint. The HIKYO_DB DSN
  # must use sslmode=verify-full or verify-ca and name this mounted path with
  # sslrootcert=/run/hikyo-database-ca/ca.crt.
  tls:
    existingSecret: ""
    key: ca.crt

rootKey:
  # Existing Secret containing the 64-hex-character root key. Hikyo stages the
  # projected file into an owner-only runtime volume; key bytes never use env.
  existingSecret: ""
  key: root-key

# Manual, verified deployment inputs. Populate these PVCs before installation.
# Neither the server nor the secrets delivery operator prepares or applies an
# upgrade. Read docs/operations/manual-upgrades.md for the exact directory layout.
upgrade:
  # Read-only public bundle, operator.pub and optional evidence/backup.age.
  # Use regular files; projected ConfigMap/Secret symlinks are refused by readers.
  existingClaim: ""
  # Separate persistent installation pin/journal, never restored from DB backup.
  # Provision volume root gid 65532 mode 2770 (including setgid), with child
  # operator-custody owned by UID 65532 mode 0700. OnRootMismatch must skip
  # recursive permission changes; drivers must preserve private child modes.
  # Must support shared POSIX locks/durability when used by multiple HA replicas.
  stateExistingClaim: ""
  # Present only during a populated upgrade or current-incarnation recovery.
  evidence: false
  # Exact final manifest digest for a multi-hop route; empty selects this binary.
  targetManifestSHA256: ""
  # Explicit operator assertion AFTER every pre-gate writer has stopped.
  legacyWritersStopped: false

# Canonical browser-visible origin. Paths, query strings, fragments, userinfo,
# and trailing slashes are refused.
#
# Its scheme and browser-visible host decide HSTS: with an https origin whose
# host is not loopback, Hikyo emits `Strict-Transport-Security: max-age=31536000` itself,
# including behind an Ingress or other TLS-terminating proxy. Pass that header
# through rather than adding a second one from the Ingress controller. If
# you want includeSubDomains or preload, own the header at the proxy and strip
# Hikyo's, because Hikyo deliberately sends neither directive.
externalOrigin: ""

# Controlled-bearer MCP endpoint. Disabled unless explicitly enabled. Tokens
# stay in MCP client secret stores and never belong in chart values.
mcp:
  enabled: false
  # Exact browser origins accepted by the request-origin guard. Non-browser
  # clients omit Origin and do not need an entry.
  allowedOrigins: []

tls:
  # Optional Secret containing tls.crt and tls.key. Configure this or trusted
  # proxy CIDRs. A rootless same-image helper stages and watches an owner-mode
  # 0400 key because Kubernetes Secret volumes are root-owned.
  existingSecret: ""
  reloaderResources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

service:
  port: 8080

network:
  # Required only for proxy mode. Native TLS may leave this empty.
  trustedProxyCIDRs: []
  # Test/development escape hatch for an explicit http:// externalOrigin.
  allowPlaintextOrigin: false

updates:
  # Release notifications only; Hikyo never downloads or installs an update.
  channel: stable

releaseTrust:
  admissionPolicy:
    # Requires Kyverno. The policy verifies the exact Hikyo image repository
    # with the offline primary key packaged into the release chart.
    enabled: false

resources: {}

operator:
  enabled: true
  # Empty watches cluster-wide; otherwise this same list creates namespace RBAC.
  namespaces: []
  triggerRollouts: true
  # Namespace -> ServiceAccount names allowed for TokenRequest creation.
  designatedServiceAccounts: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  replicaCount: 1
  leaderElection: true

# Fixed-target self-configuration executor. First enable creates empty custody
# objects; enroll with their UIDs after setup. No automatic UID discovery.
rollout:
  enabled: false
  enrolled: false
  enrollmentID: ""
  ownerInstanceID: ""
  incarnation: ""
  deploymentUID: ""
  commandSecretUID: ""
  responseSecretUID: ""
  journalSecretUID: ""
  leaseUID: ""
  authorityPublicKey: ""
  # Existing separate Ed25519 PKCS#8 signer key; never use the Hikyo root key.
  authorityExistingSecret: ""
  authorityKey: authority.key
  # All source Secrets must be immutable. Alias -> {name: Secret name, key: key}.
  initialDatabaseSource: ""
  initialRootSource: ""
  # Optional immutable upgrade-custody tuples using the existing public/state PVCs.
  # Every descriptor declares all seven fields, including empty/false values.
  # A nonempty map requires an initial alias matching the installed upgrade inputs.
  initialUpgradeSource: ""
  upgradeSources: {}
  # Optional alternate mounts of the SAME operator-custody directory.
  # Each listed source uses /var/lib/hikyo-upgrade/aliases/<alias>; mounts are
  # installed before enrollment and cannot change through configuration Apply.
  upgradeStateAliases: []
  databaseSources: {}
  rootSources: {}
  # Deployment-safe file aliases already mounted by the installation.
  fileSources: {}
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
