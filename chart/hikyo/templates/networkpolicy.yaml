{{- $ingress := .Values.networkPolicy.ingress -}}
{{- $egress := .Values.networkPolicy.egress -}}
{{- $peers := list -}}
{{- if $ingress.restricted -}}
{{- $peers = concat $peers $ingress.from -}}
{{- if and $ingress.allowOperator .Values.operator.enabled -}}
{{- $peers = append $peers (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" (printf "%s-operator" (include "hikyo.name" .)) "app.kubernetes.io/instance" .Release.Name))) -}}
{{- end -}}
{{- if not $peers -}}
{{- fail "networkPolicy.ingress.restricted requires at least one peer in networkPolicy.ingress.from or the chart operator" -}}
{{- end -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hikyo.fullname" . }}-server
  labels:
    {{- include "hikyo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hikyo.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    {{- if $egress.restricted }}
    - Egress
    {{- end }}
  ingress:
    # Port 8081 is intentionally absent: Kubernetes node-originated probes
    # remain permitted, while workload pods cannot read unauthenticated
    # readiness or metrics directly from the pod IP. Without
    # networkPolicy.ingress.restricted, any source may reach port 8080.
    - ports:
        - protocol: TCP
          port: 8080
      {{- with $peers }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $egress.restricted }}
  egress:
    {{- range $name := list "dns" "datastore" "identityProviders" "adapters" "collector" }}
    {{- $destination := index $egress $name }}
    {{- if $destination.to }}
    - to:
        {{- toYaml $destination.to | nindent 8 }}
      {{- with $destination.ports }}
      ports:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- with $egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
