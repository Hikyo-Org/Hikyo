{{- if .Values.rollout.enabled }}
{{- $name := include "hikyo.rollout.name" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-server
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "%s-command" $name | quote }}]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "%s-response" $name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-server
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-server
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "hikyo.fullname" . | quote }}]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range $suffix := list "config" "rollback" "plan" "receipt" "response" "journal" }}
      - {{ printf "%s-%s" $name $suffix | quote }}
      {{- end }}
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "%s-command" $name | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: [{{ printf "%s-0" $name | quote }}]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
