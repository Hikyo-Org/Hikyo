{{- include "hikyo.server.validate" . -}}
{{- include "hikyo.rollout.validate" . -}}
{{- $trustedProxyCIDRs := join "," .Values.network.trustedProxyCIDRs }}
{{- if and (empty $trustedProxyCIDRs) (empty .Values.tls.existingSecret) }}
{{- fail "configure tls.existingSecret or network.trustedProxyCIDRs for the non-loopback listener" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hikyo.fullname" . }}
  labels:
    {{- include "hikyo.labels" . | nindent 4 }}
spec:
  # Release changes require explicit full-stop maintenance. This prevents a
  # default Kubernetes rolling replacement from retaining old server writers.
  strategy:
    type: Recreate
  replicas: {{ if .Values.ha.enabled }}{{ .Values.ha.replicaCount }}{{ else }}{{ .Values.replicaCount }}{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hikyo.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- if and .Values.rollout.enabled .Values.rollout.enrolled }}
      annotations:
        {{- if .Values.rollout.initialDatabaseSource }}
        hikyo.dev/configuration-database-source: {{ .Values.rollout.initialDatabaseSource | quote }}
        {{- end }}
        {{- if .Values.rollout.initialUpgradeSource }}
        hikyo.dev/configuration-upgrade-source: {{ .Values.rollout.initialUpgradeSource | quote }}
        hikyo.dev/configuration-upgrade-proof: ""
        {{- end }}
        {{- if .Values.rollout.initialRootSource }}
        hikyo.dev/configuration-root-source: {{ .Values.rollout.initialRootSource | quote }}
        {{- end }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "hikyo.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if and .Values.rollout.enabled .Values.rollout.enrolled }}
      serviceAccountName: {{ include "hikyo.rollout.name" . }}-server
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.ha.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "hikyo.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- if and .Values.rollout.enabled .Values.rollout.enrolled }}
        - name: rollout-authority-stage
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          args: ["__hikyo-stage-rollout-authority"]
          volumeMounts:
            - name: rollout-authority-source
              mountPath: /run/hikyo/rollout/authority-source
              readOnly: true
            - name: rollout-authority
              mountPath: /run/hikyo/rollout/authority
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
        {{- range $alias, $source := .Values.rollout.rootSources }}
        - name: rollout-root-{{ $alias }}
          image: "{{ $.Values.image.repository }}@{{ required "image.digest is required" $.Values.image.digest }}"
          args: ["__hikyo-stage-root-key"]
          volumeMounts:
            - name: rollout-root-source-{{ $alias }}
              mountPath: /run/hikyo-root-key-source
              readOnly: true
            - name: rollout-root-{{ $alias }}
              mountPath: /run/hikyo-root-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
        {{- end }}
        {{- end }}
        - name: root-key-stage
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          args: ["__hikyo-stage-root-key"]
          volumeMounts:
            - name: root-key-source
              mountPath: /run/hikyo-root-key-source
              readOnly: true
            - name: root-key
              mountPath: /run/hikyo-root-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      {{- if .Values.tls.existingSecret }}
        - name: tls-stage
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          args: ["__hikyo-stage-tls", "--once"]
          volumeMounts:
            - name: tls-source
              mountPath: /run/hikyo-tls-source
              readOnly: true
            - name: tls
              mountPath: /run/hikyo-tls
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.tls.reloaderResources | nindent 12 }}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          args:
            - server
            - --listen=0.0.0.0:8080
            - --operational-listen=0.0.0.0:8081
            - --root-key-file=/run/hikyo-root-key/root-key
            {{- if and .Values.rollout.enabled .Values.rollout.enrolled }}
            - --config-rollout-enrollment=/run/hikyo/rollout/enrollment/enrollment.json
            - --config-rollout-signing-key=/run/hikyo/rollout/authority/authority.key
            {{- end }}
            {{- if .Values.tls.existingSecret }}
            - --tls-cert-file=/run/hikyo-tls/tls.crt
            - --tls-key-file=/run/hikyo-tls/tls.key
            {{- end }}
          env:
            {{- if and .Values.rollout.enabled .Values.rollout.enrolled .Values.rollout.upgradeSources }}
            {{- $initial := index .Values.rollout.upgradeSources .Values.rollout.initialUpgradeSource }}
            {{- range $key, $value := (include "hikyo.rollout.upgradeEnvironment" $initial | fromJson) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- else }}
            - name: HIKYO_UPGRADE_BUNDLE
              value: /run/hikyo-upgrade/bundle
            - name: HIKYO_UPGRADE_OPERATOR_PUBLIC_KEY
              value: /run/hikyo-upgrade/operator.pub
            - name: HIKYO_UPGRADE_STATE_DIR
              value: /var/lib/hikyo-upgrade/operator-custody
            {{- if .Values.upgrade.evidence }}
            - name: HIKYO_UPGRADE_EVIDENCE
              value: /run/hikyo-upgrade/evidence
            - name: HIKYO_UPGRADE_BACKUP
              value: /run/hikyo-upgrade/backup.age
            {{- end }}
            {{- if .Values.upgrade.targetManifestSHA256 }}
            - name: HIKYO_UPGRADE_TARGET_MANIFEST
              value: {{ .Values.upgrade.targetManifestSHA256 | quote }}
            {{- end }}
            {{- if .Values.upgrade.legacyWritersStopped }}
            - name: HIKYO_UPGRADE_LEGACY_WRITERS_STOPPED
              value: "true"
            {{- end }}
            {{- end }}
            - name: HIKYO_DB
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: HIKYO_DB
            {{- if .Values.rollout.enabled }}
            - name: HIKYO_NODE_ID
              value: {{ printf "%s-server" (include "hikyo.fullname" .) | quote }}
            {{- end }}
            {{- if .Values.ha.enabled }}
            - name: HIKYO_HA
              value: "true"
            - name: HIKYO_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            - name: HIKYO_UPDATE_CHANNEL
              value: {{ .Values.updates.channel | quote }}
            - name: HIKYO_EXTERNAL_ORIGIN
              value: {{ .Values.externalOrigin | quote }}
            {{- if .Values.mcp.enabled }}
            - name: HIKYO_MCP_ENABLED
              value: "true"
            {{- if .Values.mcp.allowedOrigins }}
            - name: HIKYO_MCP_ALLOWED_ORIGINS
              value: {{ join "," .Values.mcp.allowedOrigins | quote }}
            {{- end }}
            {{- end }}
            {{- if $trustedProxyCIDRs }}
            - name: HIKYO_TRUSTED_PROXY_CIDRS
              value: {{ $trustedProxyCIDRs | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: ops
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: upgrade-public
              mountPath: /run/hikyo-upgrade
              readOnly: true
            - name: upgrade-state
              mountPath: /var/lib/hikyo-upgrade
            {{- if and .Values.rollout.enabled .Values.rollout.enrolled }}
            {{- range $alias := .Values.rollout.upgradeStateAliases }}
            - name: upgrade-state
              mountPath: {{ printf "/var/lib/hikyo-upgrade/aliases/%s" $alias }}
              subPath: operator-custody
            {{- end }}
            {{- end }}
            - name: root-key
              mountPath: /run/hikyo-root-key
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.rollout.enabled .Values.rollout.enrolled }}
            - name: rollout-enrollment
              mountPath: /run/hikyo/rollout/enrollment
              readOnly: true
            - name: rollout-authority
              mountPath: /run/hikyo/rollout/authority
              readOnly: true
            - name: rollout-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: rollout-selection
              mountPath: /run/hikyo/rollout/selection
              readOnly: true
            {{- range $alias, $source := .Values.rollout.databaseSources }}
            - name: rollout-database-{{ $alias }}
              mountPath: /run/hikyo/rollout/sources/database/{{ $alias }}
              readOnly: true
            {{- end }}
            {{- range $alias, $source := .Values.rollout.rootSources }}
            - name: rollout-root-{{ $alias }}
              mountPath: /run/hikyo/rollout/sources/root/{{ $alias }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.database.tls.existingSecret }}
            - name: database-ca
              mountPath: /run/hikyo-database-ca
              readOnly: true
            {{- end }}
            {{- if .Values.tls.existingSecret }}
            - name: tls
              mountPath: /run/hikyo-tls
              readOnly: true
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.tls.existingSecret }}
        - name: tls-stage-watch
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          args: ["__hikyo-stage-tls"]
          volumeMounts:
            - name: tls-source
              mountPath: /run/hikyo-tls-source
              readOnly: true
            - name: tls
              mountPath: /run/hikyo-tls
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.tls.reloaderResources | nindent 12 }}
        {{- end }}
      volumes:
        - name: upgrade-public
          persistentVolumeClaim:
            claimName: {{ .Values.upgrade.existingClaim }}
            readOnly: true
        - name: upgrade-state
          persistentVolumeClaim:
            claimName: {{ .Values.upgrade.stateExistingClaim }}
        - name: root-key-source
          secret:
            secretName: {{ .Values.rootKey.existingSecret }}
            defaultMode: 0400
            items:
              - key: {{ .Values.rootKey.key }}
                path: root-key
        - name: root-key
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if and .Values.rollout.enabled .Values.rollout.enrolled }}
        - name: rollout-enrollment
          configMap:
            name: {{ include "hikyo.rollout.name" . }}-enrollment
        - name: rollout-authority-source
          secret:
            secretName: {{ .Values.rollout.authorityExistingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.rollout.authorityKey }}
                path: authority.key
        - name: rollout-authority
          emptyDir: {}
        - name: rollout-selection
          downwardAPI:
            items:
              - path: stamp
                fieldRef:
                  fieldPath: metadata.annotations['hikyo.dev/configuration-rollout']
              - path: database-alias
                fieldRef:
                  fieldPath: metadata.annotations['hikyo.dev/configuration-database-source']
              - path: upgrade-proof
                fieldRef:
                  fieldPath: metadata.annotations['hikyo.dev/configuration-upgrade-proof']
              - path: upgrade-alias
                fieldRef:
                  fieldPath: metadata.annotations['hikyo.dev/configuration-upgrade-source']
              - path: root-alias
                fieldRef:
                  fieldPath: metadata.annotations['hikyo.dev/configuration-root-source']
        - name: rollout-api-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- range $alias, $source := .Values.rollout.databaseSources }}
        - name: rollout-database-{{ $alias }}
          secret:
            secretName: {{ $source.name }}
            defaultMode: 0440
            items:
              - key: {{ $source.key }}
                path: dsn
        {{- end }}
        {{- range $alias, $source := .Values.rollout.rootSources }}
        - name: rollout-root-source-{{ $alias }}
          secret:
            secretName: {{ $source.name }}
            defaultMode: 0400
            items:
              - key: {{ $source.key }}
                path: root-key
        - name: rollout-root-{{ $alias }}
          emptyDir: {}
        {{- end }}
        {{- end }}
        {{- if .Values.database.tls.existingSecret }}
        - name: database-ca
          secret:
            secretName: {{ .Values.database.tls.existingSecret }}
            defaultMode: 0444
            items:
              - key: {{ .Values.database.tls.key }}
                path: ca.crt
        {{- end }}
        {{- if .Values.tls.existingSecret }}
        - name: tls-source
          secret:
            secretName: {{ .Values.tls.existingSecret }}
            defaultMode: 0400
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: tls
          emptyDir: {}
      {{- end }}
