{{- include "hikyo.server.validate" . -}}
{{- $trustedProxyCIDRs := join "," .Values.network.trustedProxyCIDRs }}
{{- if and (empty $trustedProxyCIDRs) (empty .Values.tls.existingSecret) }}
{{- fail "configure tls.existingSecret or network.trustedProxyCIDRs for the non-loopback listener" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hikyo.fullname" . }}
  labels:
    {{- include "hikyo.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.ha.enabled }}{{ .Values.ha.replicaCount }}{{ else }}{{ .Values.replicaCount }}{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hikyo.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hikyo.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.ha.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "hikyo.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: root-key-stage
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          args: ["__hikyo-stage-root-key"]
          volumeMounts:
            - name: root-key-source
              mountPath: /run/hikyo-root-key-source
              readOnly: true
            - name: root-key
              mountPath: /run/hikyo-root-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      {{- if .Values.tls.existingSecret }}
        - name: tls-stage
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          args: ["__hikyo-stage-tls", "--once"]
          volumeMounts:
            - name: tls-source
              mountPath: /run/hikyo-tls-source
              readOnly: true
            - name: tls
              mountPath: /run/hikyo-tls
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.tls.reloaderResources | nindent 12 }}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          args:
            - server
            - --listen=0.0.0.0:8080
            - --operational-listen=0.0.0.0:8081
            - --root-key-file=/run/hikyo-root-key/root-key
            {{- if .Values.tls.existingSecret }}
            - --tls-cert-file=/run/hikyo-tls/tls.crt
            - --tls-key-file=/run/hikyo-tls/tls.key
            {{- end }}
          env:
            - name: HIKYO_DB
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: HIKYO_DB
            {{- if .Values.ha.enabled }}
            - name: HIKYO_HA
              value: "true"
            - name: HIKYO_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            - name: HIKYO_UPDATE_CHANNEL
              value: {{ .Values.updates.channel | quote }}
            - name: HIKYO_EXTERNAL_ORIGIN
              value: {{ .Values.externalOrigin | quote }}
            {{- if .Values.mcp.enabled }}
            - name: HIKYO_MCP_ENABLED
              value: "true"
            {{- if .Values.mcp.allowedOrigins }}
            - name: HIKYO_MCP_ALLOWED_ORIGINS
              value: {{ join "," .Values.mcp.allowedOrigins | quote }}
            {{- end }}
            {{- end }}
            {{- if $trustedProxyCIDRs }}
            - name: HIKYO_TRUSTED_PROXY_CIDRS
              value: {{ $trustedProxyCIDRs | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: ops
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: root-key
              mountPath: /run/hikyo-root-key
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.database.tls.existingSecret }}
            - name: database-ca
              mountPath: /run/hikyo-database-ca
              readOnly: true
            {{- end }}
            {{- if .Values.tls.existingSecret }}
            - name: tls
              mountPath: /run/hikyo-tls
              readOnly: true
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.tls.existingSecret }}
        - name: tls-stage-watch
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          args: ["__hikyo-stage-tls"]
          volumeMounts:
            - name: tls-source
              mountPath: /run/hikyo-tls-source
              readOnly: true
            - name: tls
              mountPath: /run/hikyo-tls
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.tls.reloaderResources | nindent 12 }}
        {{- end }}
      volumes:
        - name: root-key-source
          secret:
            secretName: {{ .Values.rootKey.existingSecret }}
            defaultMode: 0400
            items:
              - key: {{ .Values.rootKey.key }}
                path: root-key
        - name: root-key
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.database.tls.existingSecret }}
        - name: database-ca
          secret:
            secretName: {{ .Values.database.tls.existingSecret }}
            defaultMode: 0444
            items:
              - key: {{ .Values.database.tls.key }}
                path: ca.crt
        {{- end }}
        {{- if .Values.tls.existingSecret }}
        - name: tls-source
          secret:
            secretName: {{ .Values.tls.existingSecret }}
            defaultMode: 0400
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: tls
          emptyDir: {}
      {{- end }}
